/* ---------- Mehrseitige PDF-Tabellen (Notenliste, Stundenliste) ---------- */
function pdfTabellenDokument(titel, untertitel, spalten, zeilen, fussnote){
  const doc = pdfNeu();
  const L=48, Rr=547, yStart=110, yMax=790;
  let p = null, y = 0;
  const kopf = ()=>{
    p = pdfSeite(doc);
    pdfText(p, L, 56, titel, 16, true, "#14210f");
    pdfText(p, Rr-pdfTextBreite("merkr · "+fmtDatum(todayISO()),9), 56, "merkr · "+fmtDatum(todayISO()), 9, false, "#777777");
    pdfText(p, L, 74, untertitel, 10, false, "#555555");
    pdfLinie(p, L, 84, Rr, 84, "#3d7a4e", 1.2);
    let x=L;
    for (const sp of spalten){ pdfText(p, x, 100, sp.titel, 9, true, "#777777"); x += sp.breite; }
    pdfLinie(p, L, 105, Rr, 105);
    y = yStart + 8;
  };
  kopf();
  for (const zeile of zeilen){
    if (y > yMax){ kopf(); }
    let x=L;
    zeile.forEach((zelle,i)=>{
      const sp = spalten[i];
      const txt = String(zelle==null?"–":zelle).slice(0, sp.maxZeichen||40);
      pdfText(p, x, y, txt, 9.5, !!sp.fett);
      x += sp.breite;
    });
    y += 15;
  }
  if (fussnote){
    if (y > yMax) kopf();
    pdfText(p, L, y+8, fussnote, 8, false, "#999999");
  }
  return pdfFertig(doc);
}

    return [s.name+", "+s.vorname, fmtZahl(ns.arb), fmtZahl(ns.son), fmtZahl(ns.m), fmtZahl(ns.gesamt), vs?String(vs.wert):"–",
      fz.fehltGesamt+" ("+fz.unentschuldigt+" u.)"];

    [{titel:"Schüler", breite:138, fett:true, maxZeichen:28},{titel:"Klassenarb.", breite:66},{titel:"sonstige", breite:60},
     {titel:"davon mdl.", breite:62},{titel:"Gesamt", breite:58, fett:true},{titel:"Vorschl. mdl.", breite:62},{titel:"Fehlz.", breite:52}],

function stundenlistePdf(kursId){
  const kurs = kursVon(kursId);
  const stunden = S.stunden.filter(x=>x.kursId===kursId).sort((a,b)=>a.datum.localeCompare(b.datum));
  const zeilen = stunden.map(st=>{
    const fehl = S.anwesenheit.filter(a=>a.stundeId===st.id && a.status==="fehlt").length;
    return [fmtDatum(st.datum)+(st.ausfall?" (Ausfall)":""), st.geplant||"–", st.thema||"–", st.hausaufgabe||"–", fehl||"–"];
  });
  return pdfTabellenDokument(
    "Stundendokumentation "+kurs.name,
    (kurs.fach||"")+" · "+stunden.length+" Stunden",
    [{titel:"Datum", breite:80},{titel:"Geplant (Soll)", breite:130, maxZeichen:26},{titel:"Thema (Ist)", breite:150, maxZeichen:30},
     {titel:"Hausaufgabe", breite:90, maxZeichen:18},{titel:"Fehlend", breite:50}],
    zeilen,
    "Nachweis der Unterrichtsinhalte. Nur für den dienstlichen Gebrauch.");
}

/* ---------- Was-wäre-wenn (Schülerprofil) ---------- */
function wasWaereWenn(schuelerId, kursId, wert, bereich, gewicht){
  const alle = schuelerNoten(schuelerId, kursId).concat([{wert, bereich, gewicht}]);
  return notenstandAus(alle, kursVon(kursId)).gesamt;
}

document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;

  if (a==="wwRechnen"){
    document.querySelectorAll('[data-a="wwRechnen"]').forEach(b=>b.classList.remove("gewaehlt"));
    el.classList.add("gewaehlt");
    const wert = Number(el.dataset.wert);
    const bereich = document.getElementById("wwBereich").value;
    const gewicht = Number(document.getElementById("wwGewicht").value);
    const neu = wasWaereWenn(id, R.kursId, wert, bereich, gewicht);
    const alt = notenstand(id, R.kursId).gesamt;
    const erg = document.getElementById("wwErgebnis");
    erg.innerHTML = 'Eine <b>'+wert+'</b> ('+bereichLang(bereich)+', Gewicht '+gewicht+') ergäbe: '+
      '<b>'+fmtZahl(neu)+'</b> statt '+fmtZahl(alt)+
      ' <span class="hinweis">('+(neu<alt?"−":"+")+fmtZahl(Math.abs(neu-alt),2)+')</span>';
  }
  else if (a==="notenlistePdf"){
    try{
      const kurs = kursVon(R.kursId);
      dateiExportieren("Notenliste-"+kurs.name.replace(/\s+/g,"-")+"-"+todayISO()+".pdf", notenlistePdf(R.kursId), "application/pdf");
      toast("Notenliste wird exportiert …");
    }catch(e){ alertBox("PDF fehlgeschlagen: "+e.message); }
  }
  else if (a==="stundenlistePdf"){
    try{
      const kurs = kursVon(R.kursId);
      dateiExportieren("Stundendoku-"+kurs.name.replace(/\s+/g,"-")+"-"+todayISO()+".pdf", stundenlistePdf(R.kursId), "application/pdf");
      toast("Stundendokumentation wird exportiert …");
    }catch(e){ alertBox("PDF fehlgeschlagen: "+e.message); }
  }
  else if (a==="csvWaehlen"){
    const inp = document.getElementById("csvDatei");
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        const text = String(r.result).replace(/\r/g,"");
        const zeilen = text.split("\n").map(z=>{
          const teile = z.split(/[;\t]/).map(t=>t.trim().replace(/^"|"$/g,""));
          return teile.length>=2 ? teile[0]+", "+teile[1] : z.trim();
        }).filter(Boolean);
        document.getElementById("schuelerImport").value = zeilen.join("\n");
        toast(zeilen.length+" Zeilen aus CSV übernommen – bitte prüfen, dann Hinzufügen antippen");
      };
      r.readAsText(f);
    };
    inp.click();
  }
});

/* ================= Kürzel für checkr =================
   merkr hält die Namen, checkr bekommt nur Codes. Alles hier drin geht in eine
   Richtung: Kürzel hinaus, Namen bleiben. Gerechnet wird in kern/kuerzel.js. */

function kuerzelKarte(k){
  const schueler = kursSchueler(k.id).slice()
    .sort((a,b)=>((a.name||"")+" "+(a.vorname||"")).localeCompare((b.name||"")+" "+(b.vorname||""),"de"));
  const doppelt = MerkrKuerzel.doppelte(schueler);
  const ohne = schueler.filter(s=>!MerkrKuerzel.normalisiert(s.kuerzel)).length;

  let html = '<div class="karte"><h2>Kürzel für checkr</h2>'+
    '<p class="hinweis">Der Code, unter dem dieser Kurs in checkr geführt wird. Er steht auf dem '+
    'Deckblatt der Arbeit; checkr sieht nur ihn und nie den Namen.</p>';

  if (!schueler.length) return html + '<p class="hinweis">Noch keine Schüler in diesem Kurs.</p></div>';

  if (doppelt.length)
    html += '<p class="hinweis" style="color:var(--rot)"><b>Doppelt vergeben: '+esc(doppelt.join(", "))+'.</b> '+
      'Zwei gleiche Codes sind in checkr ein einziger Schüler - die Arbeit des einen landet beim anderen.</p>';

  html += '<table class="tab">';
  for (const s of schueler)
    html += '<tr><td><b>'+esc(s.name)+', '+esc(s.vorname)+'</b></td>'+
      '<td style="width:130px"><input id="ku-'+s.id+'" value="'+esc(s.kuerzel||"")+'" placeholder="'+esc(k.name)+'-01"></td></tr>';
  html += '</table><div class="abstand"></div>'+
    '<div class="zeile"><button class="primar" data-a="kuerzelSpeichern" data-id="'+k.id+'">Kürzel speichern</button>'+
    '<button data-a="kuerzelVergeben" data-id="'+k.id+'">Fehlende vergeben'+(ohne?' ('+ohne+')':'')+'</button>'+
    '<button data-a="kuerzelExport" data-id="'+k.id+'">Für checkr ausgeben</button>'+
    '<button data-a="kuerzelPdf" data-id="'+k.id+'">Kürzelliste als PDF</button></div>'+
    '<p class="hinweis">In checkr: Klasse öffnen, Schülerliste ersetzen, Datei einspielen. '+
    'Die Zuordnung läuft dort über den Code, deshalb muss er auf beiden Seiten gleich geschrieben sein.</p></div>';
  return html;
}

/* ================= selbr-Codes =================
   Der Zugangscode, mit dem sich ein Kind in selbr anmeldet. Eigenes Feld und
   nicht das Kürzel mitbenutzt: selbr kennt kein Passwort, der Code IST die
   Anmeldung - und das Kürzel steht auf dem Deckblatt jeder Arbeit. Gerechnet
   wird in kern/selbr.js. */

function selbrKarte(k){
  const schueler = kursSchueler(k.id).slice()
    .sort((a,b)=>((a.name||"")+" "+(a.vorname||"")).localeCompare((b.name||"")+" "+(b.vorname||""),"de"));
  const doppelt = MerkrSelbr.doppelte(schueler);
  const ohne = schueler.filter(s=>!MerkrSelbr.normalisiert(s.selbrCode)).length;

  let html = '<div class="karte"><h2>selbr-Zugangscodes</h2>'+
    '<p class="hinweis">Womit sich dieses Kind in selbr anmeldet. Damit sieht merkr, wer die '+
    'Hausaufgaben gemacht hat. Der Code ist die vollständige Anmeldung - er gehört nicht auf '+
    'eine Arbeit und nicht in eine Liste, die herumliegt.</p>';

  if (!schueler.length) return html + '<p class="hinweis">Noch keine Schüler in diesem Kurs.</p></div>';

  if (doppelt.length)
    html += '<p class="hinweis" style="color:var(--rot)"><b>Doppelt vergeben: '+esc(doppelt.join(", "))+'.</b> '+
      'Zwei gleiche Codes heißen ein geteiltes Konto: der eine sieht den Lernstand des anderen.</p>';

  html += '<table class="tab">';
  for (const s of schueler)
    html += '<tr><td><b>'+esc(s.name)+', '+esc(s.vorname)+'</b></td>'+
      '<td style="width:130px"><input id="sc-'+s.id+'" value="'+esc(s.selbrCode||"")+'" placeholder="ABC12"></td></tr>';
  html += '</table><div class="abstand"></div>'+
    '<div class="zeile"><button class="primar" data-a="selbrSpeichern" data-id="'+k.id+'">Codes speichern</button>'+
    '<button data-a="selbrEinfuegen" data-id="'+k.id+'">Liste einfügen'+(ohne?' ('+ohne+' offen)':'')+'</button></div>'+
    '<p class="hinweis">Beim Einfügen eine Zeile je Kind: Name, dann Tabulator, Semikolon oder Pfeil, dann der Code.</p></div>';
  return html;
}

document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a!=="kuerzelSpeichern" && a!=="kuerzelVergeben" && a!=="kuerzelExport" && a!=="kuerzelPdf") return;

  const kurs = kursVon(id);
  if (!kurs) return;
  const schueler = kursSchueler(kurs.id);

  if (a==="selbrSpeichern"){
    for (const s of schueler){
      const feld = document.getElementById("sc-"+s.id);
      if (feld) s.selbrCode = MerkrSelbr.normalisiert(feld.value);
    }
    speichern(); zeichne();
    const doppelt = MerkrSelbr.doppelte(schueler);
    toast(doppelt.length ? "Gespeichert, aber doppelt: "+doppelt.join(", ") : "selbr-Codes gespeichert");
  }
  else if (a==="selbrEinfuegen"){
    const text = prompt("Eine Zeile je Kind: Name, Trenner (Tab, Semikolon oder Pfeil), Code.");
    if (text == null) return;
    const { treffer, unbekannt } = MerkrSelbr.ausListe(schueler, text);
    for (const t of treffer){
      const s = schueler.find(x=>x.id===t.id);
      if (s) s.selbrCode = t.code;
    }
    speichern(); zeichne();
    toast(treffer.length+" zugeordnet"+(unbekannt.length ? ", "+unbekannt.length+" nicht erkannt" : ""));
  }
  else if (a==="kuerzelSpeichern"){
    for (const s of schueler){
      const feld = document.getElementById("ku-"+s.id);
      if (feld) s.kuerzel = feld.value.trim();
    }
    speichern(); zeichne();
    const doppelt = MerkrKuerzel.doppelte(schueler);
    toast(doppelt.length ? "Gespeichert, aber doppelt: "+doppelt.join(", ") : "Kürzel gespeichert");
  }
  else if (a==="kuerzelVergeben"){
    /* Belegt sind auch die Kürzel aller anderen Kurse: ein Code darf im ganzen
       Bestand nur einmal vorkommen, sonst trifft der Rückweg den Falschen. */
    const fremd = S.schueler.filter(x=>!schueler.some(s=>s.id===x.id)).map(x=>x.kuerzel);
    const neu = MerkrKuerzel.vergeben(schueler, kurs.name, fremd);
    if (!neu.length) return toast("Alle haben schon ein Kürzel");
    for (const n of neu){
      const s = schuelerVon(n.id);
      if (s) s.kuerzel = n.kuerzel;
    }
    speichern(); zeichne(); toast(neu.length===1 ? "Ein Kürzel vergeben" : neu.length+" Kürzel vergeben");
  }
  else if (a==="kuerzelExport"){
    const liste = MerkrKuerzel.checkrListe(schueler);
    if (!liste.length) return alertBox("Noch kein Kürzel vergeben.");
    textExportieren("checkr-"+kurs.name.replace(/\s+/g,"-")+"-"+todayISO()+".json",
      JSON.stringify({students: liste}, null, 2), "application/json");
    toast(liste.length+" Kürzel werden ausgegeben");
  }
  else if (a==="kuerzelPdf"){
    try{
      dateiExportieren("Kuerzel-"+kurs.name.replace(/\s+/g,"-")+"-"+todayISO()+".pdf",
        kuerzellistePdf(kurs.id), "application/pdf");
      toast("Kürzelliste wird exportiert …");
    }catch(e){ alertBox("PDF fehlgeschlagen: "+e.message); }
  }
});

/* Die Verwaltung des Anthropic-Schlüssels ist mit der Claude-Anbindung entfallen.
   Der Schlüsselbund trägt weiterhin die Wörter für planr und checkr. */

/* ================= Stoffverteilung aus planr =================
   planr plant, merkr hält fest, was war. Hierher kommt nur das Soll: Datum,
   Thema, Einheit. Es landet in st.geplant und lässt st.thema unberührt - was
   im Unterricht wirklich lief, schreibt niemand von außen.

   Diese Fassung von planImportieren ersetzt die frühere; sie ordnet zusätzlich
   über das Feld planrKlasse zu und übernimmt die Halbjahresgrenze. */

function planrBasis(){ return String(S.einstellungen.planrUrl || "").trim(); }
/* Steht die Verbindung, ist planr die Quelle des Solls - dann ist das Feld im
   Stundendialog nur noch zum Ansehen da. */
function planrGekoppelt(){ return KB_MODE==="scriptable" && planrDa && !!planrBasis(); }

function planrKarte(k){
  return '<div class="karte"><h2>Verbindung zu planr</h2>'+
    '<p class="hinweis">Der Name dieses Kurses in planr, z. B. „Mathematik 9d". '+
    'Eigenes Feld, weil Kursnamen hier und dort auseinanderlaufen dürfen.</p>'+
    '<div class="zeile"><div class="feld" style="flex:1"><label>planr-Kurs</label>'+
    '<input id="planrKlasse" value="'+esc(k.planrKlasse||"")+'" placeholder="'+esc((k.fach?k.fach+" ":"")+k.name)+'"></div>'+
    '<button class="primar" data-a="planrKlasseSpeichern" data-id="'+k.id+'">Speichern</button></div></div>';
}

function planImportieren(text){
  let plan;
  try { plan = JSON.parse(text); }
  catch(e){ return {fehler:"Diese Datei lässt sich nicht lesen."}; }

  const fv = plan && plan.formatVersion;
  if (fv!=="kursbuch-plan-1" && fv!=="kursbuch-plan-2")
    return {fehler:"Das ist keine Stoffverteilung aus planr. Erwartet wird die Datei, die planr unter Freigaben ausgibt."};

  const sj = aktivesSchuljahr();
  if (!sj) return {fehler:"Es ist kein Schuljahr angelegt - ohne das gibt es keinen Kalender, in den die Stunden passen."};

  let ferienNeu=0, themen=0, mitReihe=0, grenzeNeu=false, rasterNeu=0;
  /* Wie viel sich wirklich bewegt hat. Der stille Abruf beim Start soll nur
     dann die Ansicht neu bauen und melden, wenn planr etwas anderes sagt als
     beim letzten Mal - sonst zuckt die Oberfläche mehrmals täglich ohne Grund. */
  let geaendert=0;
  const unbekannt=[];

  /* planr führt den Beginn des zweiten Halbjahres ohnehin. Ihn hier zu
     übernehmen erspart das Nachtragen von Hand - und ohne ihn greift die harte
     Grenze im Notenvorschlag nie. */
  if (plan.schuljahr && plan.schuljahr.halbjahrGrenze && sj.halbjahrGrenze !== plan.schuljahr.halbjahrGrenze){
    sj.halbjahrGrenze = String(plan.schuljahr.halbjahrGrenze);
    grenzeNeu = true; geaendert++;
  }

  /* Welche Woche A ist und welche B, Montag für Montag. Ohne das bleiben alle
     Stunden unsichtbar, die nur in einer der beiden Wochen liegen - und genau
     die kommen jetzt mit dem Raster herein. Eine leere Liste heißt "Schule ohne
     A/B" und wird nicht übernommen: dann bliebe der eigene Anker ungenutzt. */
  if (plan.schuljahr && plan.schuljahr.abWochen && Object.keys(plan.schuljahr.abWochen).length){
    const neuAb = plan.schuljahr.abWochen;
    if (JSON.stringify(sj.abWochen||null) !== JSON.stringify(neuAb)){ sj.abWochen = neuAb; geaendert++; }
  }

  if (Array.isArray(plan.ferien)){
    sj.ferien = sj.ferien || [];
    for (const f of plan.ferien){
      if (f && f.von && f.bis && !sj.ferien.some(x=>x.von===f.von && x.bis===f.bis)){
        sj.ferien.push({name:String(f.name||"Ferien"), von:f.von, bis:f.bis});
        ferienNeu++; geaendert++;
      }
    }
  }

  /* Der Schultag, wie er wirklich liegt. Er ersetzt merkrs Wochenraster nur an
     den Tagen, über die der Vertretungsplan der Schule etwas sagt - drei, vier.
     Kommt er nicht mit (ältere planr-Fassung), bleibt der letzte Stand stehen,
     bis seine Tage vorbei sind; er verfällt von selbst. */
  if (plan.tagesplan && Array.isArray(plan.tagesplan.tage)){
    const alt = S.tagesplan ? JSON.stringify(S.tagesplan.tage_stunden||{}) : "";
    S.tagesplan = {
      tage: plan.tagesplan.tage.map(x=>String(x)),
      geholtAm: plan.tagesplan.geholtAm || null,
      tage_stunden: plan.tagesplan.tage_stunden || {}
    };
    if (JSON.stringify(S.tagesplan.tage_stunden) !== alt) geaendert++;
  }

  if (Array.isArray(plan.plaene)){
    for (const p of plan.plaene){
      const kurs = MerkrPlanr.kursFuer(S.kurse, p, sj.id);
      if (!kurs){ unbekannt.push(String(p.kurs||"?")); continue; }
      if (!kurs.reihenFarben || typeof kurs.reihenFarben!=="object") kurs.reihenFarben = {};

      /* Wie der Kurs drüben heißt. Die Rückmeldung nach der Stunde braucht
         planrs Namen, nicht merkrs - und ohne ihn bleibt sie ganz aus
         (MerkrRueckmeldung.brief gibt dann null zurück). Beim Umbau des
         Importers war die Übernahme verlorengegangen, derselbe stille Ausfall
         wie damals bei tuThemen. */
      if (p.name && kurs.planrName !== String(p.name)){ kurs.planrName = String(p.name); geaendert++; }
      if (p.fach && kurs.planrFach !== String(p.fach)){ kurs.planrFach = String(p.fach); geaendert++; }

      /* Das Wochenraster, wie planr es führt: Wochentyp, Tag, Doppelstunde.
         Es füllt merkrs Stundenplan nur, solange der Kurs keinen hat - ein
         Abruf, der eine Eintragung von Hand überschreibt, wäre die
         Überraschung, die niemand sucht. Weicht er später ab, steht in der
         Kurskarte ein Knopf, und die Entscheidung bleibt hier. */
      if (Array.isArray(p.raster)){
        const rasterPlanr = MerkrRaster.ausPlanr(p.raster);
        if (rasterPlanr.length){
          if (!MerkrRaster.gleich(kurs.planrSlots||[], rasterPlanr)){
            kurs.planrSlots = rasterPlanr; geaendert++;
          }
          if (!(kurs.slots||[]).length){
            kurs.slots = rasterPlanr.map(x=>({tag:x.tag, stunde:x.stunde, woche:x.woche}));
            rasterNeu++; geaendert++;
          }
        }
      }

      for (const th of p.themen||[]){
        if (!th || !th.datum || !/^\d{4}-\d{2}-\d{2}$/.test(th.datum)) continue;
        const vorher = S.stunden.length;
        const st = ensureStunde(kurs.id, th.datum);
        if (S.stunden.length !== vorher) geaendert++;

        const neuesThema = String(th.thema||"");
        if (st.geplant !== neuesThema){ st.geplant = neuesThema; geaendert++; }

        if (th.reihe!=null && String(th.reihe).trim()){
          const neueReihe = String(th.reihe).trim();
          if (st.reihe !== neueReihe){ st.reihe = neueReihe; geaendert++; }
          jahrFarbe(kurs, st.reihe);
          mitReihe++;
        } else if (st.reihe==null) st.reihe = "";

        /* Woraus die TÜ gebaut ist - Grundlage der Rückmeldung, was gewackelt
           hat. Fehlt das Feld, bleibt die alte Liste stehen: ein Abruf ohne
           TÜ-Angabe soll die Auswahl nach der Stunde nicht löschen.

           Diese Übernahme war beim Umbau des Importers verlorengegangen. Der
           Rückweg stand seither vollständig da und bekam nie etwas zu zeigen -
           ein Fehler, den man nicht sieht, weil der leere Block einfach fehlt. */
        if (Array.isArray(th.tuThemen)){
          const neuTu = th.tuThemen.map(x=>String(x));
          if (String(st.tuThemen||"") !== String(neuTu)){ st.tuThemen = neuTu; geaendert++; }
        }

        /* Was zum Ankreuzen angeboten wird, seit dem 27.08.2026.
           
           `tuThemen` steht nur da, wenn die TÜ über planrs Knopf in drillr
           entstanden ist. In der Praxis baut Johannes sie direkt in drillr und
           trägt den Link von Hand ein - dann blieb das Feld leer, der
           Wackelblock erschien gar nicht (`if (!themen.length) return ""`), und
           in planr standen am 27.08.2026 null Wiederholungssignale. planr
           schickt jetzt zusätzlich die Themen des laufenden Blocks. */
        if (Array.isArray(th.wackelThemen)){
          const neuW = th.wackelThemen.map(x=>String(x));
          if (String(st.wackelThemen||"") !== String(neuW)){ st.wackelThemen = neuW; geaendert++; }
        }

        /* Stundenziel und Verlauf. Sie stehen hier nicht zum Planen - geplant
           wird drüben -, sondern zum Abhaken: am Stundenende sieht man, was
           liegen blieb, und meldet es zurück. */
        /* Ein Termin, der nicht aus dem Stundenplan kommt: von Hand ergänzt,
           mit eigenem Block und Raum. Ohne diese Zeilen stand er in planr im
           ersten Block und in merkr nirgends - das Raster kennt nur die Regel.
           Fehlt das Feld, fällt der Block weg: er ist eine Aussage über diesen
           einen Tag, und die gilt nur, solange planr sie macht. */
        if (th.block != null && Number(th.block) > 0){
          const neuBlock = Number(th.block);
          const neuRaum = th.raum != null ? String(th.raum) : null;
          if (st.block !== neuBlock){ st.block = neuBlock; geaendert++; }
          if ((st.raum||null) !== neuRaum){ st.raum = neuRaum; geaendert++; }
        } else if (st.block != null){
          delete st.block; delete st.raum; geaendert++;
        }

        if (th.ziel != null){
          const neuZiel = String(th.ziel).trim();
          if (st.ziel !== neuZiel){ st.ziel = neuZiel; geaendert++; }
        }
        /* Die Regie: was während der Stunde am Lehrertisch liegen muss. Sie
           kommt nur beim Betreiber mit - fehlt das Feld, bleibt der letzte
           Stand stehen, statt eine Notiz beim Abruf zu verlieren. */
        if (th.regie != null){
          const neuRegie = String(th.regie).trim();
          if (st.regie !== neuRegie){ st.regie = neuRegie; geaendert++; }
        }
        /* Die Lösungen zur TÜ, aus drillr über planr. planr schickt sie nur
           für die Stunden der nächsten Tage; fehlt das Feld, bleibt der
           letzte Stand stehen - eine Stunde von letzter Woche behält ihre
           Lösungen, ohne dass planr sie jedes Mal neu holen muss. */
        if (th.tuLoesungen && Array.isArray(th.tuLoesungen.aufgaben)){
          const neuL = MerkrPlanr.loesungenAusPlanr(th.tuLoesungen);
          if (neuL && JSON.stringify(st.tuLoesungen||null) !== JSON.stringify(neuL)){ st.tuLoesungen = neuL; geaendert++; }
        }
        if (Array.isArray(th.phasen)){
          const neuPh = th.phasen.filter(x=>x).map((x,i)=>({
            schluessel: String(x.schluessel || x.seq || (i+1)),
            name: String(x.phase || x.name || "").trim(),
            inhalt: String(x.inhalt || "").trim(),
            dauer: Number(x.dauerMin || x.dauer) || null
          })).filter(x=>x.name || x.inhalt);
          if (JSON.stringify(st.phasen||[]) !== JSON.stringify(neuPh)){ st.phasen = neuPh; geaendert++; }
        }
        themen++;
      }
    }
  }

  speichern();
  return {ferienNeu, themen, unbekannt, mitReihe, grenzeNeu, rasterNeu, geaendert};
}

/* Abruf anstoßen. Das Wort liegt im Schlüsselbund, der Rahmen holt die Daten. */
function planrHolen(still){
  if (KB_MODE!=="scriptable") return alertBox("Der Abruf läuft nur in Scriptable.");
  if (!planrDa) { if (!still) alertBox("Bitte zuerst das planr-Wort in den Schlüsselbund legen."); return; }
  if (!planrBasis()) { if (!still) alertBox("Bitte zuerst die planr-Adresse eintragen."); return; }
  planrStill = !!still;
  if (!still) toast("Stoffverteilung wird geholt …");
  sendeAnBridge({typ:"planrAbruf", url: planrBasis()});
  /* Der Stand der Hausaufgaben kommt gleich mit: er gehoert zur selben Planung,
     und ein zweiter Knopf waere ein zweites Ding, an das man denken muss. */
  sendeAnBridge({typ:"hausaufgabenAbruf", url: planrBasis()});
}
let planrStill = false;

/* Wer hat die Hausaufgaben gemacht - Antwort aus planr, Codes ohne Namen.
   Aufgeloest wird erst beim Anzeigen, hier liegt sie nur. */
window.__KB_hausaufgabenAntwort = function(text){
  let daten = null;
  try { daten = JSON.parse(text); } catch(e){ daten = null; }
  if (!daten || daten.fehler || !Array.isArray(daten.kurse)){
    /* Still bleiben: der Stand ist eine Zugabe zum Stoffplan. Wer ihn braucht,
       sieht im Stundendialog, wie alt er ist. */
    return "fehler";
  }
  S.hausaufgabenStand = { geholtAm: new Date().toISOString(), kurse: daten.kurse };

  /* Was faellig geworden ist, wird jetzt festgehalten - einmal und nie wieder.
     Wer die Aufgabe nachmittags nachholt, steht im Stundendialog als fertig, in
     der Bilanz aber weiter mit dem Stand vom Stundenbeginn. Genau das ist die
     Frage, die die Bilanz beantwortet. */
  const heute = new Date().toLocaleDateString("sv-SE");
  S.hausaufgabenBilanz = S.hausaufgabenBilanz || {};
  for (const kurs of S.kurse){
    const kursStand = MerkrHausaufgaben.kursStandVon(S.hausaufgabenStand, kurs);
    if (!kursStand) continue;
    const bestand = S.hausaufgabenBilanz[kurs.id] || {};
    const neuEintraege = MerkrHaBilanz.festschreiben(bestand, kursStand, kursSchueler(kurs.id), heute);
    if (Object.keys(neuEintraege).length){
      S.hausaufgabenBilanz[kurs.id] = Object.assign({}, bestand, neuEintraege);
    }
  }
  speichern();
  return "ok";
};

window.__KB_planrAntwort = function(text){
  let plan = null;
  try { plan = JSON.parse(text); } catch(e){ plan = null; }
  if (plan && plan.fehler){
    if (!planrStill) alertBox("Abruf aus planr fehlgeschlagen: "+plan.fehler);
    return "fehler";
  }
  const erg = planImportieren(text);
  if (erg.fehler){
    if (!planrStill) alertBox("Abruf aus planr fehlgeschlagen: "+erg.fehler);
    return "fehler";
  }
  S.einstellungen.planrZuletzt = new Date().toISOString();
  speichern();

  /* Hat sich nichts bewegt, bleibt der stille Abruf auch still: kein
     Neuzeichnen, keine Meldung. Wer selbst auf "Jetzt holen" getippt hat,
     bekommt trotzdem eine Antwort - sonst wirkt der Knopf kaputt. */
  if (!erg.geaendert){
    if (planrStill) return "ok";
    toast("Aus planr: nichts Neues");
    return "ok";
  }

  zeichneWennFrei();
  const teile = [erg.themen+" Stunden"];
  if (erg.ferienNeu) teile.push(erg.ferienNeu+" Ferienzeiträume");
  if (erg.grenzeNeu) teile.push("Halbjahresgrenze");
  if (erg.rasterNeu) teile.push("Stundenplan für "+erg.rasterNeu+(erg.rasterNeu===1?" Kurs":" Kurse"));
  if (erg.unbekannt.length) teile.push("ohne Zuordnung: "+erg.unbekannt.join(", "));
  toast("Aus planr: "+teile.join(" · "));
  return "ok";
};

document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;

  if (a==="planrKlasseSpeichern"){
    const kurs = kursVon(el.dataset.id);
    const feld = document.getElementById("planrKlasse");
    if (!kurs || !feld) return;
    kurs.planrKlasse = feld.value.trim();
    speichern(); zeichne(); toast(kurs.planrKlasse ? "planr-Kurs gesetzt" : "Zuordnung entfernt");
  }
  else if (a==="planrUrlSpeichern"){
    const feld = document.getElementById("planrUrl");
    if (!feld) return;
    S.einstellungen.planrUrl = feld.value.trim().replace(/\/+$/,"");
    speichern(); zeichne(); toast("Adresse gespeichert");
  }
  else if (a==="planrWortSetzen"){
    const feld = document.getElementById("planrKey");
    const key = feld ? feld.value.trim() : "";
    if (!key) return alertBox("Bitte das Wort eintragen.");
    /* Die Adresse mitspeichern, sonst geht sie beim Neuzeichnen verloren. */
    const urlFeld = document.getElementById("planrUrl");
    if (urlFeld) S.einstellungen.planrUrl = urlFeld.value.trim().replace(/\/+$/,"");
    sendeAnBridge({typ:"schluesselSetzen", name:"planr", key});
    planrDa = true;

  }

/* Automatik: beim Start holen, höchstens alle dreißig Minuten. Zwölf Stunden
   waren zu lang - in planr wird auch am Unterrichtstag noch umgestellt, und
   dann stand hier bis zum Abend das Soll von gestern. Dreißig Minuten heißt:
   jedes Aufschlagen nach einer Pause holt frisch, mehrfaches Öffnen in
   derselben Freistunde nicht. Still - wer das Klassenbuch aufschlägt, will
   keine Meldung über einen Abruf, der nichts geändert hat. Ohne Netz passiert
   nichts und der Zeitstempel bleibt stehen, der nächste Start versucht es
   wieder. */
const PLANR_PAUSE_MINUTEN = 30;
(function planrAutomatik(){
  if (KB_MODE!=="scriptable" || !planrDa || !planrBasis()) return;
  const zuletzt = S.einstellungen.planrZuletzt;
  if (zuletzt){
    const minuten = (Date.now() - new Date(zuletzt).getTime()) / 60000;
    if (!(minuten >= PLANR_PAUSE_MINUTEN)) return;
  }
  planrHolen(true);
})();

/* ================= merkr aktualisiert sich selbst =================
   Seit merkr nicht mehr nur auf einem Gerät läuft, ist "die neue Fassung liegt
   in einem Ordner" kein Weg mehr. Also sieht merkr selbst nach - beim Start,
   höchstens einmal am Tag, und über die kleine Fassungsdatei statt der halben
   Megabyte des Skripts (siehe bau.mjs).

   Gefragt wird trotzdem. Ein Skript, das sich unbemerkt ändert, ist im
   Unterricht der falsche Moment für eine Überraschung: wer um 7:38 Uhr das
   Klassenbuch aufschlägt, will die Stunde halten und nicht herausfinden, was
   sich über Nacht bewegt hat. */

function fassungNeuer(dort, hier){
  const a = String(dort||"").trim(), b = String(hier||"").trim();
  /* Beide sind "YYYY-MM-TT HH:MM" - da genügt der Textvergleich. Ist die
     eigene Fassung unbekannt ("ungebaut"), wird nichts angeboten: das ist ein
     Stand aus der Werkstatt, und der soll sich nicht selbst überschreiben. */
  if (!a || !b || b === "ungebaut") return false;
  return a > b;
}

function fassungPruefen(still){
  if (KB_MODE!=="scriptable") return;
  R.fassungStill = !!still;
  sendeAnBridge({typ:"fassungPruefen"});
}

window.__KB_fassungAntwort = function(a){
  const still = R.fassungStill;
  R.fassungStill = false;
  if (!a || a.fehler){
    if (!still) alertBox("Der Stand lässt sich gerade nicht abrufen - ohne Netz geht das nicht.");
    return;
  }
  S.einstellungen.fassungGeprueft = todayISO();
  S.einstellungen.fassungDort = a.version || "";
  speichern();

  if (!fassungNeuer(a.version, a.hier)){
    if (!still) alertBox("merkr ist auf dem neuesten Stand (Fassung "+(a.hier||"?")+").");
    return;
  }
  zeigeModal('<h2>Neue Fassung</h2>'+
    '<p>Es gibt eine neuere Fassung von merkr.</p>'+
    '<p class="hinweis">Hier: '+esc(a.hier||"?")+'<br>Neu: '+esc(a.version)+'</p>'+
    '<p class="hinweis">Die Daten bleiben, wo sie sind - ausgetauscht wird nur das Skript. '+
    'Nach dem Laden merkr einmal schließen und neu öffnen.</p>'+
    '<div class="zeile" style="margin-top:12px">'+

};

/* ================= Ergebnisse aus checkr =================
   checkr korrigiert und kennt nur den Code vom Deckblatt. Hier wird er wieder
   zum Menschen - das ist die einzige Stelle, an der beides zusammenkommt.
   Gerechnet und zugeordnet wird in kern/ergebnisse.js. */

function checkrBasis(){ return String(S.einstellungen.checkrUrl || "").trim(); }

/* Eingefügt werden darf die ganze Adresse aus dem Browser. Eine Kennung von Hand
   abzutippen ist eine Fehlerquelle, die man sich sparen kann. */
function checkrKennung(eingabe){
  const text = String(eingabe||"").trim();
  if (!text) return "";
  const treffer = text.match(/[?&]job=([A-Za-z0-9_-]{6,64})/);
  if (treffer) return treffer[1];
  if (/^[A-Za-z0-9_-]{6,64}$/.test(text)) return text;
  const letzter = text.split("/").filter(Boolean).pop() || "";
  return /^[A-Za-z0-9_-]{6,64}$/.test(letzter) ? letzter : "";
}

    html += '<p class="hinweis">Ohne Ergebnis: '+esc(erg.ohneArbeit.join(", "))+'.</p>';

  html += '<table class="tab"><tr><th>Schüler</th><th>Kürzel</th><th>Punkte</th><th>%</th><th>'+(sys.typ==="punkte"?"Punkte":"Note")+'</th></tr>';

    '<button data-a="modalZu">Abbrechen</button></div>';
  return html;
}

window.__KB_checkrAntwort = function(text){
  const status = document.getElementById("checkrStatus");

  if (!daten || daten.fehler || !Array.isArray(daten.schueler)){

  return "ok";
};

/* ================= Anwesenheit, Profil und Arbeiten im neuen Design =================

/* --- Anwesenheit: alle sind da, angetippt wird die Abweichung --- */
anwesenheitDialogHtml = function(k, alsTab){
  const st = ensureStunde(k.id, R.datum);
  const schueler = kursSchueler(k.id).slice()
    .sort((a,b)=>((a.name||"")+" "+(a.vorname||"")).localeCompare((b.name||"")+" "+(b.vorname||""),"de"));

  const zustaende = [["fehlt","fehlt","var(--rot)"],["verspaetet","verspätet","var(--sm1)"],["beurlaubt","beurlaubt","var(--text2)"]];
  let html = '<h2>Anwesenheit</h2>'+
    '<p class="hinweis">'+fmtDatum(R.datum)+' · '+esc(k.name)+' · alle sind da, angetippt wird die Abweichung.</p>';

  if (!schueler.length) return html + leer("Noch keine Schüler in diesem Kurs.", "Schüler hinzufügen", "tab", "kurscfg");

  const zaehler = {fehlt:0, verspaetet:0, beurlaubt:0};
  for (const s of schueler){
    const a = anwesenheitVon(s.id, st.id);
    if (a && zaehler[a.status]!=null) zaehler[a.status]++;
  }
  html += '<div class="karte" style="padding:10px 14px;margin-bottom:12px;display:flex;gap:22px">'+
    '<div><b style="font-size:20px">'+(schueler.length - zaehler.fehlt - zaehler.beurlaubt)+'</b> <span class="hinweis">da</span></div>'+
    '<div><b style="font-size:20px;color:var(--rot)">'+zaehler.fehlt+'</b> <span class="hinweis">fehlt</span></div>'+
    '<div><b style="font-size:20px;color:var(--sm1)">'+zaehler.verspaetet+'</b> <span class="hinweis">verspätet</span></div>'+
    '<div><b style="font-size:20px">'+zaehler.beurlaubt+'</b> <span class="hinweis">beurlaubt</span></div></div>';

  for (const s of schueler){
    const a = anwesenheitVon(s.id, st.id);
    const stat = a ? a.status : "anwesend";
    html += '<div class="karte" style="display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:7px">'+
      '<div style="flex:1"><b>'+esc(s.name)+', '+esc(s.vorname)+'</b>'+
      /* Nur die Minuten sind eine Zusatzangabe. "fehlt" unter einem Knopf, der
         schon "fehlt" heißt und hervorgehoben ist, sagt nichts Neues. */
      (stat==="verspaetet" ? '<div class="hinweis">'+(a.minuten||5)+' Minuten</div>' : '')+'</div>';
    for (const [wert, label, farbe] of zustaende){
      const an = stat===wert;
      html += '<button class="klein" style="border-radius:999px;padding:7px 14px;font-weight:800;'+
        (an ? 'background:'+farbe+';color:#fff' : '')+'" data-a="anwSetzen" data-id="'+s.id+'" data-stunde="'+st.id+
        '" data-status="'+(an?"anwesend":wert)+'">'+label+'</button>';
    }
    if (stat==="verspaetet")
      html += '<button class="klein" data-a="anwMinuten" data-id="'+s.id+'" data-stunde="'+st.id+'">+5 min</button>';
    html += '</div>';
  }
  /* Als Tab braucht es keinen Schlussknopf - man bleibt einfach. */
  return html + (alsTab ? '' : '<div class="abstand"></div><button class="primar" data-a="modalZu">Fertig</button>');
};

  const k = kursVon(R.kursId); if(!k){ R.view="home"; return viewHome(); }
  const sys = notensystem(k);
  const ns = notenstand(s.id, k.id);
  const vs = notenvorschlag(s.id, k.id);
  const mz = mitarbeitZusammenfassung(s.id, k.id);
  const fz = fehlzeiten(s.id, k.id);
  const evs = S.ereignisse.filter(e=>e.schuelerId===s.id && e.kursId===k.id).sort((a,b)=>b.ts.localeCompare(a.ts));
  const initialen = ((s.vorname||"?")[0]+(s.name||"?")[0]).toUpperCase();

  let html = '<div style="display:flex;align-items:center;gap:16px;margin-bottom:18px">'+
    '<div style="width:56px;height:56px;border-radius:16px;background:var(--akzent);color:#fff;'+
    'display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900">'+esc(initialen)+'</div>'+
    '<div style="flex:1"><h1 style="font-size:26px;font-weight:900;margin:0">'+esc(s.vorname)+' '+esc(s.name)+'</h1>'+
    '<div class="hinweis">'+esc(k.name)+' · '+(vs?vs.anzahl:0)+((vs?vs.anzahl:0)===1?" Notiz":" Notizen")+
    ' in diesem Halbjahr</div></div>'+
    '<button data-a="profilPdf" data-id="'+s.id+'">Als PDF</button>'+
    '<button class="primar" data-a="tab" data-id="sitzplan">Zurück zum Sitzplan</button></div>';

  /* Der Vorschlag - groß, mit seiner Grundlage darunter. */
  html += '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">'+
    'Notenvorschlag Halbjahr</div>';
  if (vs){
    html += '<div style="display:flex;align-items:baseline;gap:12px;margin:6px 0 4px">'+
      '<div style="font-size:46px;font-weight:900;line-height:1">'+fmtZahl(vs.genau,1)+'</div>'+
      '<div class="hinweis" style="font-size:15px">Vorschlag — du entscheidest</div></div>'+
      herkunftHtml(vs)+
      '<p class="hinweis">Eingetragen würde '+(sys.typ==="punkte"? vs.wert+" Punkte" : "eine "+vs.wert)+
      '. Frische Notizen wiegen schwerer: nach acht Wochen zählt eine halb.</p>'+
      '<div class="zeile"><button class="primar" data-a="noteDialog" data-id="'+s.id+'">Als Halbjahresnote übernehmen</button>'+
      '<button data-a="noteDialog" data-id="'+s.id+'">Abweichen und begründen</button></div>';
  } else {
    html += '<p class="hinweis" style="margin-top:8px">In diesem Halbjahr hat noch keine Stunde stattgefunden. '+
      'Der Vorschlag entsteht aus dem Verhältnis von Notizen zu gehaltenen Stunden - ohne Stunden gibt es keins.</p>';
  }
  html += '</div>';

  /* Der Verlauf steht direkt unter der Zahl. Eine Halbjahresnote ist ein
     Standbild; ob jemand sich gefangen hat oder abgerutscht ist, sieht man erst
     an der Bewegung - und genau danach wird im Elterngespräch gefragt. */
  const vl = notenverlauf(s.id, k.id);
  if (vl && vl.length > 1){
    const erste = vl[0], letzte = vl[vl.length-1];
    const diff = Math.round((erste.note - letzte.note) * 10) / 10;
    html += '<div class="karte"><div class="zeile raum">'+
      '<div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Verlauf über das Schuljahr</div>'+
      '<div class="hinweis">'+(Math.abs(diff) < 0.15 ? "gleichbleibend"
        : diff > 0 ? "um "+fmtZahl(Math.abs(diff),1)+" verbessert"
                   : "um "+fmtZahl(Math.abs(diff),1)+" abgefallen")+'</div></div>'+
      '<div style="margin:14px 0 2px;color:var(--text2)">'+mitarbeitVerlaufSvg(vl)+'</div>'+
      '<p class="hinweis" style="margin:2px 0 0">Die Linie ist der Stand nach jeder Stunde, '+
      'die Balken sind der Beitrag der einzelnen Stunde. Berechnet wie der Vorschlag oben, '+
      'nur bis zum jeweiligen Tag.</p></div>';
  }

  /* Notenstand und Mitarbeit nebeneinander */
  html += '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Mitarbeit nach Kategorie</div>';
  for (const kat of MITARBEIT_KATEGORIEN){
    const z = mz[kat.id];
    html += '<div style="margin-top:12px"><div class="zeile raum"><b>'+esc(kat.name)+'</b>'+
      '<span class="hinweis">'+z.anzahl+(z.anzahl===1?" Notiz":" Notizen")+'</span></div>'+
      '<div style="display:flex;gap:3px;margin-top:5px">';
    for (const stufe of STUFEN){
      const n = z.counts[stufe.v] || 0;
      const breite = z.anzahl ? Math.round(n / z.anzahl * 100) : 0;
      if (n) html += '<div style="flex:'+n+';height:14px;border-radius:5px;background:'+stufe.hex+'" title="'+
        n+"x "+stufe.label+' ('+breite+' %)"></div>';
    }
    if (!z.anzahl) html += '<div style="flex:1;height:14px;border-radius:5px;background:var(--akzent-hell)"></div>';
    html += '</div></div>';
  }
  /* Verweigerungen stehen sonst nirgends. Ohne sie zählt die Kopfzeile Notizen,
     die in dieser Karte fehlen - und der Vorschlag sähe aus, als käme er aus
     dem Nichts. */
  const ohneLeistung = MerkrMitarbeit.VERWEIGERT.concat(MerkrMitarbeit.UNERLEDIGT)
    .map(function(typ){
      return {typ: typ, n: S.ereignisse.filter(function(e){
        return e.schuelerId===s.id && e.kursId===k.id && e.typ===typ; }).length};
    }).filter(function(x){ return x.n; });
  if (ohneLeistung.length){
    html += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--linie)">';
    for (const x of ohneLeistung)
      html += '<div class="zeile raum" style="padding:2px 0"><span>'+esc(ereignisNameVonTyp(x.typ))+'</span>'+
        '<b>'+x.n+'</b></div>';
    html += '<p class="hinweis" style="margin:6px 0 0">Zählt als fehlende Leistung der Stunde, nicht als Abzug daneben.</p></div>';
  }
  html += '</div>';

  /* Fehlzeiten */
  html += '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Fehlzeiten</div>'+
    '<div style="display:flex;gap:26px;margin-top:10px">'+
    '<div><div style="font-size:26px;font-weight:900">'+(fz.fehltGesamt - fz.unentschuldigt - fz.offen)+'</div><div class="hinweis">entschuldigt</div></div>'+
    '<div><div style="font-size:26px;font-weight:900;color:'+(fz.unentschuldigt?'var(--rot)':'inherit')+'">'+fz.unentschuldigt+'</div><div class="hinweis">unentschuldigt</div></div>'+
    '<div><div style="font-size:26px;font-weight:900;color:'+(fz.offen?'var(--rot)':'inherit')+'">'+fz.offen+'</div><div class="hinweis">offen</div></div>'+
    '<div><div style="font-size:26px;font-weight:900">'+fz.verspaetungen+'</div><div class="hinweis">verspätet, '+fz.minuten+' min</div></div></div>';
  if (fz.offen) html += '<div class="abstand"></div><button data-a="fehlzeitenKlaeren">'+fz.offen+
    (fz.offen===1?' offene Fehlzeit klären':' offene Fehlzeiten klären')+'</button>';
  html += '</div>';

  /* Notenstand */
  html += '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Stand</div>'+
    '<div style="display:flex;gap:26px;margin-top:10px">'+
    '<div><div style="font-size:26px;font-weight:900">'+fmtZahl(ns.gesamt)+'</div><div class="hinweis">gesamt</div></div>'+
    '<div><div style="font-size:22px;font-weight:800">'+fmtZahl(ns.arb)+'</div><div class="hinweis">Klassenarbeiten</div></div>'+
    '<div><div style="font-size:22px;font-weight:800">'+fmtZahl(ns.son)+'</div><div class="hinweis">sonstige</div></div>'+
    '<div><div style="font-size:22px;font-weight:800">'+fmtZahl(ns.m)+'</div><div class="hinweis">davon mündlich</div></div></div>'+
    '<p class="hinweis" style="margin-top:10px">'+esc(gewichtungsText(k))+'</p></div>';

  /* Die Notizen, aus denen die Zahlen kommen */
  html += '<div class="karte"><div class="zeile raum">'+
    '<div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Letzte Notizen</div>'+
    '<span class="hinweis">jede Zahl oben stammt aus dieser Liste</span></div>';
  if (!evs.length) html += '<p class="hinweis" style="margin-top:8px">Noch keine Notiz.</p>';
  else {
    for (const e of evs.slice(0,12)){
      const st = stundeVon(e.stundeId);
      const si = e.stufe==null ? null : stufeInfo(e.stufe);
      html += '<div style="display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--linie)">'+
        (si ? '<span style="width:26px;height:22px;border-radius:6px;background:'+si.hex+';color:#fff;display:flex;'+
          'align-items:center;justify-content:center;font-size:11px;font-weight:900">'+si.label+'</span>'
            : '<span style="width:26px"></span>')+
        '<b style="min-width:150px">'+esc(ereignisName(e))+'</b>'+
        '<span style="flex:1" class="hinweis">'+esc(e.text || (st && st.thema ? st.thema : ""))+'</span>'+
        '<span class="hinweis">'+(st?fmtDatumKurz(st.datum):"")+'</span></div>';
    }
    if (evs.length>12) html += '<p class="hinweis" style="margin-top:8px">'+(evs.length-12)+' weitere.</p>';
  }
  html += '</div>';

  if (s.notizen) html += '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Notiz zum Schüler</div><p>'+esc(s.notizen)+'</p></div>';
  return html;
};

/* --- Arbeiten: Kennzahlen als Kacheln, Verteilung wie gehabt --- */
const arbeitenVorher = viewArbeiten;
viewArbeiten = function(k){
  const arbeiten = S.arbeiten.filter(a=>a.kursId===k.id).sort((a,b)=>b.datum.localeCompare(a.datum));
  const sys = notensystem(k);

  let html = '<div class="zeile raum" style="margin-bottom:14px">'+
    '<div><h2 style="margin:0">Arbeiten und Tests</h2>'+
    '<div class="hinweis">'+esc(k.name)+' · '+(sys.typ==="punkte"?"0 bis 15 Punkte":"Noten 1 bis 6")+'</div></div>'+
    '<div class="zeile"><button data-a="checkrDialog">Aus checkr holen</button>'+
    '<button class="primar" data-a="arbeitNeuDialog">Arbeit anlegen</button></div></div>';

  if (!arbeiten.length)
    return html + leer("Noch keine Arbeit oder LEK erfasst. Ergebnisse kommen von Hand oder aus checkr.", "Arbeit anlegen", "arbeitNeuDialog");

  for (const a of arbeiten){
    const stat = arbeitStatistik(a, k);
    const ab = bereichNorm(a.bereich||artBereich(a.art));
    html += '<div class="karte"><div class="zeile raum">'+
      '<div><b style="font-size:17px">'+esc(a.titel)+'</b>'+
      '<div class="hinweis">'+esc(a.art)+' · '+fmtDatum(a.datum)+' · '+
      (ab==="arbeit"?"zählt zu den Klassenarbeiten":"zählt zu den sonstigen Leistungen")+
      (gew(a.gewicht)===0?' · Zwischenstand, zählt nicht':' · Gewicht '+gew(a.gewicht))+
      (a.checkrJob?' · aus checkr':'')+'</div></div>'+
      '<div class="zeile"><button class="klein" data-a="arbeitEingabe" data-id="'+a.id+'">Punkte eintragen</button>'+
      '<button class="klein" data-a="arbeitBereichWechseln" data-id="'+a.id+'">Bereich</button>'+
      '<button class="klein gefahr" data-a="arbeitLoeschen" data-id="'+a.id+'">Löschen</button></div></div>';

    if (stat.n){
      html += '<div style="display:flex;gap:26px;margin:14px 0 4px">'+
        '<div><div style="font-size:26px;font-weight:900">'+fmtZahl(stat.mittel,2)+'</div>'+
        '<div class="hinweis">Mittel aus '+stat.n+(stat.n===1?" Wert":" Werten")+'</div></div>'+
        '<div><div style="font-size:22px;font-weight:800">'+fmtZahl(stat.median,1)+'</div><div class="hinweis">Median</div></div>'+
        '<div><div style="font-size:22px;font-weight:800">'+fmtZahl(stat.q1,1)+' / '+fmtZahl(stat.q3,1)+'</div>'+
        '<div class="hinweis">Quartile</div></div></div>'+
        svgBoxplot(stat, sys) + svgVerteilung(stat, sys) +
        '<p class="hinweis">Box: die mittleren 50 Prozent, Linie: Median, Antennen: bester und schlechtester Wert.</p>';
    } else {
      html += '<p class="hinweis" style="margin-top:10px">Noch kein Ergebnis eingetragen.</p>';
    }
    html += '</div>';
  }
  return html;
};

/* ================= Seitenleiste =================
   Nach dem Entwurf von Claude Design: 92 px, Marke oben, sechs Ziele als
   Kacheln mit Symbol und Wort. Vier davon brauchen einen offenen Kurs - ohne
   ihn stehen sie blass da und führen zur Kursliste, statt ins Leere zu tippen. */

const LEISTE = [
  {id:"heute", label:"Heute", view:"home", tab:null, icon:"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"4\"/><path d=\"M8 3v4M16 3v4M3 11h18\"/></svg>"},
  {id:"sitzplan", label:"Sitzplan", view:"kurs", tab:"sitzplan", icon:"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"/></svg>"},
  {id:"anwesend", label:"Anwesend", view:"kurs", tab:"anwesenheit", icon:"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12.5l2.8 2.8L16 9.5\"/></svg>"},
  {id:"schueler", label:"Sch\u00fcler", view:"kurs", tab:"liste", icon:"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4.5 20c1.4-3.6 4.1-5.2 7.5-5.2s6.1 1.6 7.5 5.2\"/></svg>"},
  {id:"arbeiten", label:"Arbeiten", view:"kurs", tab:"arbeiten", icon:"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M4 20V11M10 20V5M16 20v-7M22 20H2\"/></svg>"},
  {id:"einricht", label:"Einrichten", view:"einstellungen", tab:null, icon:"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M4 7h16M4 17h16\"/><circle cx=\"9\" cy=\"7\" r=\"2.5\"/><circle cx=\"15\" cy=\"17\" r=\"2.5\"/></svg>"}
];

function zeichneSeitenleiste(){ return ""; }   /* ersetzt - die geltende Fassung steht weiter unten */

document.addEventListener("click", ev=>{
  const el = ev.target.closest('[data-a="leiste"]');
  if (!el) return;
  const eintrag = LEISTE.find(x=>x.id===el.dataset.id);
  if (!eintrag) return;

  if (eintrag.view==="kurs" && !kursVon(R.kursId)){
    /* Ohne offenen Kurs führt der Weg zur Übersicht - dort steht, was es gibt. */
    R.view = "home"; zeichne(); toast("Zuerst einen Kurs öffnen");
    return;
  }
  if (eintrag.id==="schueler" && R.view==="profil"){ zeichne(); return; }
  R.view = eintrag.view;
  if (eintrag.tab) R.tab = eintrag.tab;
  zeichne();
});

/* Die Leiste wird bei jedem Zeichnen mitgeführt. */
const zeichneVorher = zeichne;
zeichne = function(){
  zeichneVorher();
  zeichneSeitenleiste();
};

/* Anwesenheit gibt es jetzt auch als Tab, weil die Seitenleiste sie als
   eigenes Ziel führt. Der Dialog über die Kopfzeile bleibt daneben bestehen. */
/* Der Tab-Streifen zeigt nur, was die Seitenleiste nicht führt. Sitzplan,
   Anwesend, Schüler und Arbeiten stehen links - zweimal derselbe Weg macht die
   Oberfläche nicht bedienbarer, sondern unentschlossen. */
const KURS_TABS_MIT_ANWESENHEIT = [["stunden","Stunden"],["jahr","Jahr"],
  ["kurscfg","Kurs"]];

viewKurs = function(){
  const k = kursVon(R.kursId);
  if (!k){ R.view="home"; return viewHome(); }
  let html = '<div class="tabs">';
  for (const [id, name] of KURS_TABS_MIT_ANWESENHEIT)
    html += '<button class="'+(R.tab===id?"aktiv":"")+'" data-a="tab" data-id="'+id+'">'+name+'</button>';
  html += '</div>';
  if (R.tab==="sitzplan" || R.tab==="liste") html += kursKopfzeile(k);
  if (R.tab==="sitzplan") html += viewSitzplan(k);
  else if (R.tab==="anwesenheit") html += anwesenheitDialogHtml(k, true);
  else if (R.tab==="liste") html += viewListe(k);
  else if (R.tab==="stunden") html += viewStunden(k);
  else if (R.tab==="jahr") html += viewJahr(k);
  else if (R.tab==="arbeiten") html += viewArbeiten(k);
  else if (R.tab==="kurscfg") html += viewKursCfg(k);
  return html;
};

/* ================= Einrichten, nach dem Entwurf =================
   Sieben nummerierte Schritte, darunter die Entscheidungen, die merkr getroffen
   hat. Steht alles, schrumpft der Bereich auf eine Zeile.

   Abweichung vom Entwurf, mit Absicht: dort trägt jede Entscheidung einen
   Knopf. Hier bekommt nur die einen, die sich wirklich ändern lässt. Ein Knopf,
   der nichts tut, ist schlimmer als eine Zahl ohne Knopf. */

function einrichtenAufgeklappt(){
  /* localStorage steht in Scriptable nicht sicher zur Verfügung, deshalb am
     Zustand: eine Sitzung lang gemerkt reicht für diesen Schalter. */
  return R.einrichtenOffen !== false;
}

function einrichtenEntscheidungen(){
  const sj = aktivesSchuljahr();
  const kurse = sj ? S.kurse.filter(k=>k.schuljahrId===sj.id) : [];
  const anteile = [...new Set(kurse.map(k=>100 - gewSonstige(k)))];
  const anteil = !kurse.length ? "noch kein Kurs"
    : anteile.length === 1 ? anteile[0]+" %" : "je Kurs verschieden";

  return [
    { frage: "Wie viel zählen Klassenarbeiten?",
      hinweis: "Der Rest sind die sonstigen Leistungen, darin die mündliche Note",
      wert: anteil,
      knopf: kurse.length ? ["Im Kurs ändern", "kursOeffnen", kurse[0].id] : null },
    { frage: "Wie lange wiegt eine Mitarbeitsnotiz voll?",
      hinweis: "Nach "+MerkrNoten.HALBWERTSZEIT_WOCHEN+" Wochen zählt sie halb, sie verschwindet aber nie ganz",
      wert: MerkrNoten.HALBWERTSZEIT_WOCHEN+" Wochen", knopf: null },
    { frage: "Notenschlüssel",
      hinweis: "Vorgabe des Landes, gilt für jede Arbeit: 96 / 80 / 60 / 40 / 20 Prozent",
      wert: "MV", knopf: null },
    { frage: "Ab wann erinnert merkr an die Sicherung?",
      hinweis: "Die laufende Ablage liegt in iCloud, der Export ist die zweite Sicherung",
      wert: "nach 7 Tagen", knopf: null },
  ];
}

function viewEinrichten(){
  const schritte = einrichtenSchritte();
  const offen = schritte.filter(s=>!s.fertig);
  const auf = einrichtenAufgeklappt();

  let html = '<div class="zeile raum" style="margin-bottom:16px">'+
    '<div><h1 style="font-size:26px;font-weight:900;margin:0">Einrichten</h1>'+
    '<p class="hinweis" style="margin:4px 0 0">Sieben Schritte, in dieser Reihenfolge. Einmal im Schuljahr.</p></div>'+
    (offen.length || !auf ? '' : '<button data-a="einrichtenKlappen">Zusammenklappen</button>')+'</div>';

  /* Steht alles und ist zugeklappt: eine Zeile. */
  if (!offen.length && !auf){
    const planr = schritte[5].fertig, checkr = schritte[6].fertig;
    return html + '<div class="karte" style="display:flex;align-items:center;gap:14px">'+
      '<span style="background:var(--s2);color:#fff;border-radius:12px;padding:7px 11px;font-weight:900;font-size:12px">OK</span>'+
      '<div style="flex:1"><b>Einrichtung steht · '+schritte.length+' von '+schritte.length+'</b>'+
      '<div class="hinweis">'+(planr&&checkr ? "planr und checkr verbunden"
        : planr ? "planr verbunden, checkr offen" : "die Verbindungen stehen noch aus")+'</div></div>'+
      '<button data-a="einrichtenKlappen">Aufklappen</button></div>';
  }

  html += '<div class="karte" style="padding:6px 16px">';
  schritte.forEach((s, i)=>{
    const letzte = i === schritte.length - 1;
    html += '<div style="display:flex;align-items:center;gap:14px;padding:13px 0'+
      (letzte?'':';border-bottom:1px solid var(--linie)')+'">'+
      '<span style="width:28px;height:28px;border-radius:9px;flex:0 0 28px;display:flex;align-items:center;'+
      'justify-content:center;font-size:13px;font-weight:900;'+
      (s.fertig ? 'background:var(--s2);color:#fff' : 'background:var(--akzent-hell);color:var(--akzent)')+'">'+
      (s.fertig ? "✓" : (i+1))+'</span>'+
      '<div style="flex:1;min-width:0"><b>'+esc(s.titel)+'</b>'+
      '<div class="hinweis">'+esc(s.fertig ? s.steht : s.offen)+'</div></div>'+
      (!s.fertig && s.knopf
        ? '<button class="klein primar" data-a="'+s.knopf[1]+'"'+(s.knopf[2]?' data-id="'+s.knopf[2]+'"':'')+'>'+s.knopf[0]+'</button>'
        : '')+
      '</div>';
  });
  html += '</div>';

  /* Die Entscheidungen */
  html += '<h2 style="font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);margin:24px 0 8px">Entscheidungen</h2>'+

/* ================= Wochenplan auf der Startseite =================
   Die Startseite zeigt die laufende Woche, nicht mehr die Kursliste. Die Kurse
   stehen jetzt hinter einem eigenen Ziel in der Seitenleiste - auf der
   Startseite beantwortet merkr die Frage "was ist wann", nicht "was habe ich". */

function kurseAmTag(iso){
  const sj = aktivesSchuljahr(); if(!sj) return [];
  const wt = new Date(iso+"T12:00:00").getDay();
  const wb = wochenBuchstabe(sj, iso);
  const liste = [];
  for (const k of S.kurse.filter(x=>x.schuljahrId===sj.id))
    for (const slot of (k.slots||[]))
      if (slot.tag===wt && (slot.woche==="AB" || slot.woche===wb))
        liste.push({kurs:k, stunde:slot.stunde, woche:slot.woche});
  /* Termine mit eigenem Block, aus planr: von Hand ergänzt, nicht aus dem
     Stundenplan. Sie stehen an der Stunde (st.block), nicht am Kurs - und
     liegen nur dort, wo das Raster an dem Tag nichts hat. */
  for (const st of S.stunden){
    if (st.datum !== iso || st.block == null) continue;
    const k = S.kurse.find(x=>x.id===st.kursId && x.schuljahrId===sj.id);
    if (!k) continue;
    const stunde = Number(st.block)*2-1;
    if (liste.some(e=>e.kurs.id===k.id && Number(e.stunde)===stunde)) continue;
    liste.push({kurs:k, stunde:stunde, stunden:[stunde, stunde+1], block:Number(st.block),
      raum:st.raum||null, art:"termin", name:k.name});
  }
  return liste.sort((a,b)=>a.stunde-b.stunde);
}

function wochenTage(iso){
  const mo = mondayOf(iso);
  const tage = [];
  for (let i=0; i<5; i++){
    const d = new Date(mo.getTime() + i*86400000);
    tage.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
  }
  return tage;
}

  const notizen = st ? S.ereignisse.filter(x=>x.stundeId===st.id && x.stufe!=null).length : 0;

    '<div class="hinweis" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">'+
    (thema ? esc(thema) : "kein Thema") + '</div></div>'+

    (notizen ? "var(--s2)" : gehalten ? "var(--s0)" : "var(--linie)")+'" title="'+

/* ================= Stundenzeiten =================
   merkr braucht sie für den Schnellzugriff: welche Stunde läuft gerade. planr
   führt nur Blocknummern, also stehen sie hier. Die Vorgabe ist ein übliches
   Raster und ausdrücklich zu prüfen - eine falsche Uhrzeit zeigt die falsche
   Klasse. Zu ändern in den Einstellungen. */

/* Das EBG unterrichtet in Doppelstunden: vier Blöcke zu je 90 Minuten, Beginn
   7:40, 9:40, 11:40 und 13:40. Deshalb steht hier der Block und nicht die
   Einzelstunde - sonst gälte eine Stunde als "läuft" und die zweite Hälfte
   desselben Blocks als Pause. */
const BLOCKZEITEN_VORGABE = [
  {block:1, stunden:[1,2], von:"07:40", bis:"09:10"},
  {block:2, stunden:[3,4], von:"09:40", bis:"11:10"},
  {block:3, stunden:[5,6], von:"11:40", bis:"13:10"},
  {block:4, stunden:[7,8], von:"13:40", bis:"15:10"},
];

function stundenzeiten(){
  const eigene = S.einstellungen.blockzeiten;
  return Array.isArray(eigene) && eigene.length ? eigene : BLOCKZEITEN_VORGABE;
}
/** Der Block, in dem diese Stundennummer liegt. */
function zeitVon(nr){ return stundenzeiten().find(z=>(z.stunden||[]).includes(Number(nr))) || null; }
/** Wie der Block heißt: "1./2." statt "1." */
function blockLabel(nr){
  const z = zeitVon(nr);
  return z ? z.stunden.join("./")+"." : nr+".";
}
function jetztHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

/**
 * Was läuft gerade, und was kommt als Nächstes?
 *
 * "läuft" gilt zwischen Beginn und Ende der Stunde, "gleich" bis 20 Minuten
 * davor - in der Pause will man schon sehen, wohin man gleich geht.
 */
function aktuelleStunde(){
  const heute = todayISO();
  const jetzt = jetztHHMM();
  const liste = kurseAmTag(heute);
  let laeuft = null, naechste = null;
  for (const e of liste){
    if (e.art === "ausfall") continue;
    const z = zeitVon(e.stunde);
    if (!z) continue;
    if (jetzt >= z.von && jetzt < z.bis){ if (!laeuft) laeuft = {e, z}; }
    else if (jetzt < z.von && !naechste) naechste = {e, z};
  }
  if (laeuft) return {art:"laeuft", ...laeuft};
  if (naechste){
    const minuten = (Number(naechste.z.von.slice(0,2))*60 + Number(naechste.z.von.slice(3,5)))
      - (Number(jetzt.slice(0,2))*60 + Number(jetzt.slice(3,5)));
    return {art: minuten <= 20 ? "gleich" : "spaeter", minuten, ...naechste};
  }
  return null;
}

function schnellzugriff(){
  const a = aktuelleStunde();
  if (!a) return "";
  const kurs = a.e.kurs;
  const st = kurs ? S.stunden.find(x=>x.kursId===kurs.id && x.datum===todayISO()) : null;
  const thema = st && st.thema ? st.thema : (st && st.geplant ? st.geplant : "");
  const kopf = a.art==="laeuft" ? "Läuft gerade"
    : a.art==="gleich" ? "Gleich, in "+a.minuten+" Minuten" : "Als Nächstes heute";

  /* Die ganze Karte trifft, nicht nur der Knopf am Rand. Sie steht oben auf der
     Startseite und beantwortet genau eine Frage - "wo muss ich jetzt hin" -,
     und darauf zielt man im Gehen mit dem Daumen. Ein Kurs, den merkr nicht
     führt (Vertretung in einer fremden Klasse, Aufsicht), bleibt unberührbar:
     dahinter liegt keine Stunde, die sich öffnen ließe. */
  const klick = kurs
    ? ' data-a="stundeOeffnen" data-id="'+kurs.id+'" data-datum="'+todayISO()+'"'
    : '';

  return '<div class="karte"'+klick+' style="display:flex;align-items:center;gap:16px;padding:16px 18px;margin-bottom:20px;'+
    (kurs ? 'cursor:pointer;' : '')+
    'border:1px solid var(--akzent)">'+
    '<div style="background:var(--akzent);color:#fff;border-radius:14px;padding:10px 14px;text-align:center;min-width:74px">'+
    '<div style="font-size:19px;font-weight:900;line-height:1">'+esc(blockLabel(a.e.stunde))+'</div>'+
    '<div style="font-size:11px;font-weight:700;opacity:.85">'+esc(a.z.von)+'</div></div>'+
    '<div style="flex:1;min-width:0">'+
    '<div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800">'+kopf+'</div>'+
    '<div><b style="font-size:19px">'+esc(a.e.name || (kurs ? kurs.name : "?"))+'</b></div>'+
    '<div class="hinweis" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
    esc(a.e.hinweis || (a.e.raum ? "Raum "+a.e.raum : "") || thema || "kein Thema")+'</div></div>'+
    (kurs ? '<div style="color:var(--text2);font-size:22px;flex:0 0 auto">›</div>' : '')+
    '</div>';
}

/* ================= Wochenplan als Raster =================
   Wochentage in den Spalten, Stunden in den Zeilen - so hängt jeder
   Stundenplan an jeder Schule. */

function viewWochenraster(){
  const sj = aktivesSchuljahr();
  const heute = todayISO();
  const anker = R.wochenAnker || heute;
  const tage = wochenTage(anker);
  const belegung = tage.map(iso=>({iso, liste: kurseAmTag(iso)}));

  const benutzte = [...new Set(belegung.flatMap(t=>t.liste.map(e=>e.stunde)))].sort((a,b)=>a-b);
  if (!benutzte.length)
    return leer("In dieser Woche steht kein Unterricht im Stundenplan.", "Kurse ansehen", "go", "kurse");

  /* Lücken dazwischen bleiben stehen, sonst rutscht die 7. neben die 3. und der
     Plan sieht dichter aus, als der Tag ist. */
  const zeilen = [];
  const gesehen = new Set();
  for (let n = benutzte[0]; n <= benutzte[benutzte.length-1]; n++){
    const z = zeitVon(n);
    const schluessel = z ? "b"+z.block : "s"+n;
    if (gesehen.has(schluessel)) continue;
    gesehen.add(schluessel);
    zeilen.push(n);
  }

  /* Feste Spaltenbreiten: sonst bekommt der Tag mit dem längsten Thema die
     halbe Woche und der Plan sieht schief aus. */
  let html = '<div style="overflow-x:auto"><table style="width:100%;table-layout:fixed;border-collapse:separate;'+
    'border-spacing:6px;min-width:640px"><colgroup><col style="width:54px">'+
    '<col style="width:19.2%"><col style="width:19.2%"><col style="width:19.2%"><col style="width:19.2%"><col style="width:19.2%">'+
    '</colgroup><tr><td></td>';
  for (const t of belegung){
    const istHeute = t.iso === heute;
    const wt = ["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(t.iso+"T12:00:00").getDay()];
    html += '<td style="text-align:center;padding-bottom:2px">'+
      '<div style="font-weight:800;font-size:13px;'+(istHeute?'color:var(--akzent)':'color:var(--text2)')+'">'+wt+'</div>'+
      '<div class="hinweis" style="font-size:11px">'+Number(t.iso.slice(8,10))+'.'+Number(t.iso.slice(5,7))+'.</div></td>';
  }
  html += '</tr>';

  /* Passt dieser Eintrag in die Zeile? Einmal hier, weil die Aufsichtszeile
     dieselbe Frage stellt wie die Blockzeile darunter. */
  const inZeile = (e, nr) => {
    const z = zeitVon(nr);
    return z ? (z.stunden||[]).includes(Number(e.stunde)) : e.stunde===nr;
  };

  for (const nr of zeilen){
    const z = zeitVon(nr);

    /* Eine Aufsicht ist keine Stunde - sie liegt davor, in der Pause. Als
       Kachel im Block stünde sie da, wo Unterricht steht, und behauptete eine
       Klasse, die es nicht gibt. Deshalb eine schmale Zeile darüber: ein roter
       Balken am Tag, an dem eine ansteht. Wo genau, sagt der Vertretungsplan
       der Schule - hier zählt nur, dass man vor dieser Stunde nicht in Ruhe
       sitzen bleibt. */
    const aufsichten = belegung.map(t => t.liste.some(e => e.art==="aufsicht" && inZeile(e, nr)));
    if (aufsichten.some(Boolean)){
      html += '<tr><td></td>';
      for (const [i, hat] of aufsichten.entries())
        html += '<td style="padding:0"><div title="'+(hat?'Aufsicht':'')+'" style="height:5px;border-radius:3px;background:'+
          (hat ? 'var(--rot)' : 'transparent')+'"></div></td>';
      html += '</tr>';
    }

    html += '<tr><td style="text-align:right;vertical-align:middle">'+
      '<div style="font-weight:800;font-size:13px">'+esc(blockLabel(nr))+'</div>'+
      (z?'<div class="hinweis" style="font-size:10px">'+esc(z.von)+'</div>':'')+'</td>';

    for (const t of belegung){
      const treffer = t.liste.filter(e=>e.art!=="aufsicht" && inZeile(e, nr));
      const istHeute = t.iso === heute;
      if (!treffer.length){
        html += '<td><div style="min-height:52px;border-radius:12px;background:'+
          (istHeute?'var(--akzent-hell)':'transparent')+'"></div></td>';
        continue;
      }
      html += '<td>';
      for (const e of treffer){
        const st = e.kurs ? S.stunden.find(x=>x.kursId===e.kurs.id && x.datum===t.iso) : null;
        const thema = st && st.thema ? st.thema : (st && st.geplant ? st.geplant : "");
        const notizen = st ? S.ereignisse.filter(x=>x.stundeId===st.id && x.stufe!=null).length : 0;
        const gehalten = st && st.thema;
        /* Was heute anders ist als im Plan - kommt aus planr, dort steht der
           Vertretungsplan der Schule. Ohne diese Zeilen sähe eine ausgefallene
           Stunde aus wie jede andere. */
        const ausfall = e.art === "ausfall";
        const anders = e.art && e.art !== "regulaer" ? e.art : "";
        const klickbar = e.kurs && !ausfall;
        const zusatz = [];
        if (anders === "verlegt") zusatz.push("verlegt");
        if (anders === "zusatz") zusatz.push("Vertretung");
        if (anders === "termin") zusatz.push("zusätzlich");
        /* Der Raum steht nur da, wo er die Nachricht ist. Im Regelfall gehört
           die Zeile dem Thema - den Raum weiß man. */
        if (anders && e.raum) zusatz.push("Raum "+e.raum);
        const unterzeile = ausfall ? (e.hinweis || "fällt aus")
          : (zusatz.length ? zusatz.join(" · ") : thema);
        html += '<div '+(klickbar ? 'data-a="stundeOeffnen" data-id="'+e.kurs.id+'" data-datum="'+t.iso+'" ' : '')+
          'style="'+(klickbar?'cursor:pointer;':'')+'min-height:52px;border-radius:12px;padding:7px 9px;background:var(--karte);'+
          (ausfall?'opacity:.55;':'')+
          'border-left:5px solid '+esc((e.kurs && e.kurs.farbe) || (anders ? "var(--s2)" : "var(--akzent)"))+';'+
          (istHeute?'box-shadow:0 0 0 1px var(--akzent)':'box-shadow:var(--schatten)')+'">'+
          '<div class="zeile raum" style="gap:6px;align-items:flex-start">'+
          '<b style="font-size:13px;line-height:1.2'+(ausfall?';text-decoration:line-through':'')+'">'+
          esc(e.name || (e.kurs ? e.kurs.name : "?"))+'</b>'+
          (e.kurs ? '<span style="width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:3px;background:'+
            (notizen ? "var(--s2)" : gehalten ? "var(--s0)" : "var(--linie)")+'"></span>' : '')+'</div>'+
          (unterzeile ? '<div class="hinweis" style="font-size:11px;line-height:1.25;overflow:hidden;'+
            'display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(unterzeile)+'</div>' : '')+
          '</div>';
      }
      html += '</td>';
    }
    html += '</tr>';
  }
  return html + '</table></div>';
}

/* Die Startseite: Schnellzugriff, dann das Raster, dann die offenen Punkte. */
const homeVorRaster = viewHome;
viewHome = function(){
  const sj = aktivesSchuljahr();
  if (!sj) return viewSchuljahrAnlegen();

  const heute = todayISO();
  const anker = R.wochenAnker || heute;
  const tage = wochenTage(anker);
  const wb = wochenBuchstabe(sj, tage[0]);
  const imZweiten = sj.halbjahrGrenze && heute >= sj.halbjahrGrenze;
  const dieseWoche = wochenTage(heute)[0] === tage[0];
  const monat = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][Number(tage[0].slice(5,7))-1];

  let html = dieseWoche ? schnellzugriff() : "";

  html += '<div class="zeile raum" style="align-items:flex-end;margin-bottom:14px">'+
    '<div><h1 style="font-size:26px;font-weight:900;letter-spacing:-.4px;margin:0">'+

  html += viewWochenraster();

  /* Offene Punkte wie gehabt */
  const of = offeneFehlzeiten(), bt = backupAlterTage();
  const gibtEsDaten = S.schueler.length > 0 || S.noten.length > 0 || S.ereignisse.length > 0;

    "entschuldigt oder unentschuldigt ist noch offen", "Klären", "fehlzeitenKlaeren", null]);
  if (gibtEsDaten && bt===null) punkte.push(["gelb", "Noch keine Sicherung exportiert",
    "die Daten liegen bisher nur in iCloud", "Jetzt sichern", "backupDialog", null]);
  else if (bt!==null && bt>7) punkte.push(["gelb", "Sicherung überfällig",
    "letzte Sicherung vor "+bt+" Tagen", "Jetzt sichern", "backupDialog", null]);

  if (punkte.length){
    html += '<h2 style="font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);margin:24px 0 8px">Offene Punkte</h2>';

        '<button data-a="'+aktion+'"'+(id?' data-id="'+id+'"':'')+'>'+knopf+'</button></div>';
  }
  return html;
};

/* ================= Unterrichtsfreie Tage =================
   Der Wochenplan rechnete allein aus dem Stundenraster: Wochentag stimmt,
   A/B-Woche stimmt, also Unterricht. Damit zeigte merkr auch in den
   Sommerferien und vor dem ersten Schultag einen vollen Plan.

   Das Raster weiß nichts über das Kalenderjahr - dafür sind Beginn, Ende und
   die Ferien des Schuljahres da, und die kommen aus planr. */

function unterrichtsfrei(iso){
  const sj = aktivesSchuljahr();
  if (!sj) return null;
  if (sj.beginn && iso < sj.beginn) return "vor Schuljahresbeginn";
  if (sj.ende && iso > sj.ende) return "nach Schuljahresende";
  for (const f of (sj.ferien || []))
    if (f && f.von && f.bis && iso >= f.von && iso <= f.bis) return f.name || "Ferien";
  return null;
}

/* Der Tag aus planr, in die Form gebracht, die der Wochenplan erwartet. */
function tagesplanAmTag(iso){
  const sj = aktivesSchuljahr(); if (!sj) return [];
  return MerkrTagesplan.amTag(S.tagesplan, iso, function(e){
    return MerkrPlanr.kursFuer(S.kurse, e, sj.id);
  });
}

const kurseAmTagRoh = kurseAmTag;
kurseAmTag = function(iso){
  /* Sagt planr über diesen Tag etwas, gilt das. merkrs eigenes Raster rechnet
     aus Wochentag und A/B-Woche und kann von einem Ausfall oder einer
     Vertretung nichts wissen - und der Vertretungsplan der Schule ist an dem
     Tag, an dem er gilt, die genauere Auskunft, auch über Ferien und Beginn. */
  if (MerkrTagesplan.gilt(S.tagesplan, iso)) return tagesplanAmTag(iso);
  if (unterrichtsfrei(iso)) return [];
  return kurseAmTagRoh(iso);
};

const rasterOhneFreie = viewWochenraster;
viewWochenraster = function(){

      ? ["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(iso+"T12:00:00").getDay()]+": "+gruende[i] : null)
      .filter(Boolean);
    html += '<p class="hinweis" style="margin-top:8px">'+esc(namen.join(" · "))+'</p>';

/* ================= Anwesenheit hängt am Stundenplan =================
   Die Anwesenheit hing schon immer an einer Stunde, nicht an einem Tag - aber
   die Stunde entstand aus dem freien Datumsfeld. Damit ließ sich sonntags,
   in den Ferien und an Tagen ohne diesen Kurs eine Anwesenheit erfassen, und
   ensureStunde legte dafür eine Stunde an, die es im Plan nie gab.

   Jetzt kommt der Tag aus dem Plan: hat der Kurs an diesem Datum Unterricht?
   Wenn nicht, wird nichts angelegt, sondern der Weg zur nächsten oder letzten
   Stunde angeboten. */

function hatUnterricht(kursId, iso){
  /* Ein Ausfall bleibt in der Liste, damit der Wochenplan ihn zeigen kann - als
     Unterricht zählt er nicht: an einer Stunde, die nicht war, hängt nichts. */
  return kurseAmTag(iso).some(e=>e.kurs && e.kurs.id===kursId && e.art!=="ausfall");
}

/** Der nächste Unterrichtstag dieses Kurses ab iso, in Richtung schritt. */
function naechsterUnterrichtstag(kursId, iso, schritt){
  const sj = aktivesSchuljahr();
  if (!sj) return null;
  const d = new Date(iso+"T12:00:00");
  for (let i=0; i<200; i++){
    d.setDate(d.getDate() + schritt);
    const tag = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if (sj.beginn && tag < sj.beginn) return null;
    if (sj.ende && tag > sj.ende) return null;
    if (hatUnterricht(kursId, tag)) return tag;
  }
  return null;
}

/* ================= Auch der Sitzplan folgt dem Stundenplan =================
   Eine Mitarbeitsnotiz gehört an eine Unterrichtsstunde. Über addEreignis lief
   sie bisher an ensureThe(R.datum) - und das Datumsfeld nahm jeden Tag an, auch
   einen Sonntag. Jetzt gilt für den Sitzplan dieselbe Regel wie für die
   Anwesenheit: kein Unterricht, keine Erfassung.

   Das freie Datumsfeld weicht dem Blätterer über die Stunden des Kurses. Für
   weite Sprünge gibt es den Reiter "Stunden" mit allen Terminen. */

function tagKopf(k){
  const zurueck = naechsterUnterrichtstag(k.id, R.datum, -1);
  const vor = naechsterUnterrichtstag(k.id, R.datum, +1);
  const wt = wochentagName(new Date(R.datum+"T12:00:00").getDay());
  return '<div class="zeile">'+
    (zurueck ? '<button class="klein" data-a="anwTag" data-datum="'+zurueck+'">‹</button>'
             : '<button class="klein" disabled style="opacity:.35">‹</button>')+
    '<b>'+wt+', '+esc(fmtDatum(R.datum))+'</b>'+
    (vor ? '<button class="klein" data-a="anwTag" data-datum="'+vor+'">›</button>'
         : '<button class="klein" disabled style="opacity:.35">›</button>')+
    (R.datum !== todayISO() && hatUnterricht(k.id, todayISO())
      ? '<button class="klein" data-a="anwTag" data-datum="'+todayISO()+'">Heute</button>' : '')+
    '</div>';
}

/** Der Hinweis, wenn an diesem Tag kein Unterricht ist - für Sitzplan wie Anwesenheit. */
function keinUnterrichtHinweis(k, was){
  const grund = unterrichtsfrei(R.datum);
  const zurueck = naechsterUnterrichtstag(k.id, R.datum, -1);
  const vor = naechsterUnterrichtstag(k.id, R.datum, +1);
  const wt = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][new Date(R.datum+"T12:00:00").getDay()];

  let html = '<div class="karte" style="text-align:center;padding:30px 18px">'+
    '<div style="font-size:17px;font-weight:900">'+esc(fmtDatum(R.datum))+' · '+wt+'</div>'+
    '<p class="hinweis" style="margin:6px 0 14px">'+
    (grund ? esc(grund)+" - kein Unterricht." : esc(k.name)+" hat an diesem Tag laut Stundenplan keinen Unterricht.")+
    '<br>'+esc(was)+'</p><div class="zeile" style="justify-content:center">';
  if (zurueck) html += '<button data-a="anwTag" data-datum="'+zurueck+'">‹ '+fmtDatum(zurueck)+'</button>';
  if (vor) html += '<button class="primar" data-a="anwTag" data-datum="'+vor+'">'+fmtDatum(vor)+' ›</button>';
  if (!zurueck && !vor) html += '<span class="hinweis">Für diesen Kurs steht kein Stundenplan.</span>';
  return html + '</div></div>';
}

kursKopfzeile = function(k){

};

/* ================= Freiraum oben, gemessen statt geraten =================
   Zweimal einen festen Abstand gesetzt, zweimal lag Scriptables Schliessen-
   Knopf trotzdem auf dem ersten Eintrag. Feste Pixel helfen nur, wenn man die
   Geometrie der WebView kennt - und die kennt nur das Geraet.

   Deshalb: der Freiraum richtet sich nach der Anzeigehoehe, und eine Zeile in
   den Einstellungen sagt, womit merkr gerade rechnet. */

function anzeigeMasse(){
  const leiste = document.getElementById("seitenleiste");
  const erster = leiste ? leiste.querySelector("button") : null;
  return {
    breite: Math.round(window.innerWidth),
    hoehe: Math.round(window.innerHeight),
    dpr: window.devicePixelRatio || 1,
    sicherOben: getComputedStyle(document.documentElement).getPropertyValue("--sicher-oben").trim() || "0px",
    leisteOben: erster ? Math.round(erster.getBoundingClientRect().top) : null,
  };
}

/* Eine Zeile in den Einstellungen, die die Geometrie nennt. */
const einstellungenOhneMass = viewEinstellungen;
viewEinstellungen = function(){
  const m = anzeigeMasse();
  return einstellungenOhneMass() +
    '<div class="karte"><h2>Anzeige</h2>'+
    '<p class="hinweis">Womit merkr gerade rechnet - hilfreich, wenn etwas verdeckt aussieht.</p>'+
    '<table class="tab">'+
    '<tr><td>Fläche</td><td><b>'+m.breite+' × '+m.hoehe+'</b> Punkte</td></tr>'+
    '<tr><td>Bildpunkte je Punkt</td><td><b>'+m.dpr+'</b></td></tr>'+
    '<tr><td>Leiste beginnt bei</td><td><b>'+(m.leisteOben==null?"–":m.leisteOben+" px")+'</b></td></tr>'+
    '</table></div>';
};

/* ================= Klassenliste aus einer Datei =================
   Namen abzutippen ist die laengste und fehleranfaelligste Arbeit beim
   Einrichten. iDoceo gibt sie als CSV aus, eine Zeile je Name - genau das
   Format, das nameParsen ohnehin liest.

   Der Inhalt landet im Eingabefeld, nicht direkt in den Daten: erst sehen, dann
   uebernehmen. */

window.__KB_namenDatei = function(text){
  const feld = document.getElementById("schuelerImport");
  if (!feld){ alertBox("Bitte zuerst den Kurs oeffnen, in den die Namen sollen."); return "fehler"; }
  const zeilen = String(text||"").split("\n").map(z=>z.trim()).filter(Boolean);
  if (!zeilen.length){ alertBox("In der Datei steht kein Name."); return "leer"; }
  feld.value = zeilen.join("\n");
  toast(zeilen.length+(zeilen.length===1?" Name gelesen":" Namen gelesen")+" - jetzt pruefen und hinzufuegen");
  return "ok";
};

document.addEventListener("click", ev=>{
  const el = ev.target.closest('[data-a="namenDatei"]');
  if (!el) return;
  if (KB_MODE !== "scriptable") return alertBox("Der Dateiweg laeuft nur in Scriptable.");
  sendeAnBridge({typ:"namenDatei"});
});

/* Der Knopf neben das Eingabefeld. */
const kurscfgOhneDatei = viewKursCfg;
viewKursCfg = function(k){
  const html = kurscfgOhneDatei(k);
  const marke = 'data-a="schuelerHinzufuegen"';
  const stelle = html.indexOf(marke);
  if (stelle < 0) return html;
  const ende = html.indexOf("</button>", stelle);
  if (ende < 0) return html;
  return html.slice(0, ende+9) +
    ' <button data-a="namenDatei">Aus Datei einlesen</button>' +
    html.slice(ende+9);
};
