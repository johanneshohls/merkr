/* ================= Dieselbe Klasse in zwei Fächern =================
   Die 9a hat Mathematik und Physik bei derselben Lehrkraft. Beide Kurse noch
   einmal aus der Datei zu füllen, hieße dieselben Kinder zweimal anzulegen -
   mit eigenen Kürzeln, eigenen Notizen und einem doppelten Eintrag in jeder
   Liste. Ein Schüler traegt in merkr aber mehrere kursIds; er gehoert also in
   beide Kurse, nicht zweimal in die Datei.

   Deshalb hier der zweite Weg: aus einem anderen Kurs uebernehmen. */

function uebernahmeKarte(k){
  const sj = aktivesSchuljahr();
  const andere = (sj ? S.kurse.filter(x=>x.schuljahrId===sj.id && x.id!==k.id) : [])
    .map(x=>({kurs:x, anzahl: kursSchueler(x.id).length}))
    .filter(x=>x.anzahl > 0);
  if (!andere.length) return "";

  let html = '<div class="karte"><h2>Schüler aus einem anderen Kurs</h2>'+
    '<p class="hinweis">Für dieselbe Klasse in einem zweiten Fach. Die Schüler werden nicht kopiert, '+
    'sondern diesem Kurs zusätzlich zugeordnet - ein Kürzel, ein Profil, zwei Kurse.</p>'+
    '<div class="zeile"><select id="uebernahmeKurs">';
  for (const a of andere)
    html += '<option value="'+a.kurs.id+'">'+esc(a.kurs.name)+' ('+a.anzahl+')</option>';
  html += '</select><button class="primar" data-a="schuelerUebernehmen" data-id="'+k.id+'">Übernehmen</button></div></div>';
  return html;
}

const kurscfgOhneUebernahme = viewKursCfg;
viewKursCfg = function(k){
  return kurscfgOhneUebernahme(k) + uebernahmeKarte(k);
};

document.addEventListener("click", ev=>{
  const el = ev.target.closest('[data-a="schuelerUebernehmen"]');
  if (!el) return;
  const ziel = kursVon(el.dataset.id);
  const wahl = document.getElementById("uebernahmeKurs");
  const quelle = wahl ? kursVon(wahl.value) : null;
  if (!ziel || !quelle) return;

  let neu = 0, schon = 0;
  for (const s of kursSchueler(quelle.id)){
    if (!Array.isArray(s.kursIds)) s.kursIds = [];
    if (s.kursIds.includes(ziel.id)){ schon++; continue; }
    s.kursIds.push(ziel.id);
    neu++;
  }
  speichern(); zeichne();
  toast(neu ? neu+(neu===1?" Schüler übernommen":" Schüler übernommen")+(schon?", "+schon+" waren schon da":"")
            : "Alle waren schon in diesem Kurs");
});

/* ================= Der Raum: 15 Zweiertische =================
   Drei nebeneinander, fünf Reihen hintereinander, vorne die Tafel. Die Plätze
   ergeben sich daraus - Platz 1 und 2 sitzen am ersten Tisch, 3 und 4 am
   zweiten. Wer umsetzt, zieht die Kachel trotzdem frei; gespeichert wird die
   Position wie bisher am Schüler. */

const RAUM = {
  spalten: 3, reihen: 5,
  tischBreite: 250, tischHoehe: 82,
  luecke: 26, reihenLuecke: 22,
  randOben: 62, randLinks: 24,
};

function platzPosition(nr){
  const tisch = Math.floor(nr / 2);
  const seite = nr % 2;
  const spalte = tisch % RAUM.spalten;
  const reihe = Math.floor(tisch / RAUM.spalten);
  return {
    x: RAUM.randLinks + spalte * (RAUM.tischBreite + RAUM.luecke) + seite * (RAUM.tischBreite / 2) + 6,
    y: RAUM.randOben + reihe * (RAUM.tischHoehe + RAUM.reihenLuecke) + 5,
  };
}

function raumHintergrund(){ return ""; }   /* ersetzt - die geltende Fassung steht weiter unten */

const sitzplanOhneRaum = viewSitzplan;
viewSitzplan = function(k){
  const html = sitzplanOhneRaum(k);
  const marke = '<div id="sitzflaeche">';
  if (!html.includes(marke)) return html;

  /* Die Kacheln ohne eigene Position auf die Plätze setzen. */
  const schueler = kursSchueler(k.id);
  let nr = 0;
  for (const s of schueler){
    if (s.sitz && s.sitz[sitzSchluessel(k)]) continue;
    const pos = platzPosition(nr++);
    if (!s.sitz || typeof s.sitz !== "object") s.sitz = {};
    s.sitz[sitzSchluessel(k)] = pos;
  }
  /* Erst nach dem Setzen neu bauen, sonst stehen die alten Koordinaten drin. */
  const neu = sitzplanOhneRaum(k);
  return neu.replace(marke, marke + raumHintergrund());
};

zeichne();

/* ================= Aufrufen =================
   Zufällig, aber gerecht: erst wenn alle einmal dran waren, beginnt eine neue
   Runde. Wer heute fehlt, wird nicht gezogen - ein Name, der nicht antworten
   kann, kostet im Unterricht mehr Zeit als der ganze Griff spart.

   Gerechnet wird in kern/aufrufen.js, der Topf liegt am Kurs. */

function aufrufTopf(k){
  if (!Array.isArray(k.aufrufTopf)) k.aufrufTopf = [];
  return k.aufrufTopf;
}

/** Wer heute in Frage kommt: im Kurs und nicht als fehlend eingetragen. */
function aufrufbare(k){
  const st = S.stunden.find(x=>x.kursId===k.id && x.datum===R.datum);
  return kursSchueler(k.id).filter(s=>{
    if (!st) return true;
    const a = anwesenheitVon(s.id, st.id);
    return !a || a.status !== "fehlt";
  });
}

function aufrufDialog(k, gezogenId, neueRunde){
  const s = gezogenId ? schuelerVon(gezogenId) : null;
  const kandidaten = aufrufbare(k);
  const topf = aufrufTopf(k);
  const offen = topf.length ? MerkrAufrufen.offen(topf, kandidaten.map(x=>x.id)) : kandidaten.length;

  if (!s)
    return '<h2>Aufrufen</h2>'+
      '<p class="hinweis">Niemand, der aufgerufen werden könnte - alle sind als fehlend eingetragen oder der Kurs ist leer.</p>'+
      '<div class="zeile"><button class="primar" data-a="modalZu">Schließen</button></div>';

  let html = '<div style="text-align:center;padding:6px 0 2px">'+
    (neueRunde ? '<div class="hinweis" style="margin-bottom:8px">Neue Runde - alle waren einmal dran.</div>' : '')+
    '<div style="font-size:34px;font-weight:900;line-height:1.1">'+esc(s.vorname)+'</div>'+
    '<div style="font-size:20px;font-weight:700;color:var(--text2)">'+esc(s.name)+'</div>'+
    '<p class="hinweis" style="margin:10px 0 0">noch '+offen+(offen===1?' Schüler':' Schüler')+' bis zur nächsten Runde</p></div>';

  /* Direkt bewerten, ohne den Dialog zu verlassen - dafür wird aufgerufen.
     Die Kategorie steht in R und nicht im Dialog: er wird bei jedem Ziehen neu
     gebaut, und wer eine Runde lang die Menge notiert, will nicht bei jedem
     Schüler neu umschalten. */
  const kategorie = R.aufrufKategorie === "quant_m" ? "quant_m" : "qual_m";
  html += '<div class="abstand"></div><div class="zeile" style="justify-content:center;gap:0;margin-bottom:8px">';
  for (const kat of [["qual_m","Qualität"],["quant_m","Menge"]]){
    const an = kategorie === kat[0];
    html += '<button data-a="aufrufKategorie" data-id="'+kat[0]+'" style="'+
      'border-radius:'+(kat[0]==="qual_m"?"999px 0 0 999px":"0 999px 999px 0")+';'+
      (an ? 'background:var(--akzent);color:#fff;font-weight:800' : 'opacity:.6')+
      ';min-width:100px">'+kat[1]+'</button>';
  }
  html += '</div><div class="zeile" style="justify-content:center">';
  for (const stufe of STUFEN)
    html += '<button data-a="aufrufStufe" data-id="'+s.id+'" data-stufe="'+stufe.v+'" data-kat="'+kategorie+'" '+
      'style="background:'+stufe.hex+';color:#fff;font-weight:900;min-width:56px">'+stufe.label+'</button>';
  html += '</div>';

  /* Der Weg für den, der nichts sagt. Ohne ihn bleibt jede stille Stunde
     unbeobachtet, und die Rechnung kommt über die Basis nie hinunter - eine
     Fünf wäre unerreichbar, obwohl die Beschlussvorlage sie kennt. */
  html += '<div class="zeile" style="justify-content:center;margin-top:6px">'+
    '<button data-a="aufrufKeineAntwort" data-id="'+s.id+'" style="min-width:180px">'+
    'Keine Antwort</button></div>';

  html += '<div class="abstand"></div><div class="zeile" style="justify-content:center">'+
    '<button class="primar" data-a="aufrufNaechster" data-id="'+k.id+'">Nächster</button>'+
    '<button data-a="modalZu">Fertig</button></div>';
  return html;
}

function aufrufZiehen(){ return ""; }   /* ersetzt - die geltende Fassung steht weiter unten */

document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;

  if (a==="aufrufen" || a==="aufrufNaechster"){
    const k = kursVon(a==="aufrufen" ? el.dataset.id : el.dataset.id);
    if (k) aufrufZiehen(k);
  }
  else if (a==="aufrufKategorie"){
    R.aufrufKategorie = el.dataset.id;
    const k = kursVon(R.kursId);
    /* Nicht neu ziehen - es ist derselbe Schüler, nur eine andere Frage an ihn. */
    if (k && R.aufrufAktuell) zeigeModal(aufrufDialog(k, R.aufrufAktuell, false));
  }
  else if (a==="aufrufKeineAntwort"){
    const k = kursVon(R.kursId);
    if (!k) return;
    addEreignis(el.dataset.id, k.id, "keine_antwort", null, "");
    const s = schuelerVon(el.dataset.id);
    toast((s?s.vorname+": ":"")+"keine Antwort notiert");
    aufrufZiehen(k);
  }
  else if (a==="aufrufStufe"){
    const k = kursVon(R.kursId);
    if (!k) return;
    addEreignis(el.dataset.id, k.id, el.dataset.kat || "qual_m", Number(el.dataset.stufe), "");
    const s = schuelerVon(el.dataset.id);
    toast((s?s.vorname+": ":"")+stufeInfo(Number(el.dataset.stufe)).label+" notiert");
    aufrufZiehen(k);
  }
  else if (a==="aufrufZuruecksetzen"){
    const k = kursVon(el.dataset.id);
    if (!k) return;
    k.aufrufTopf = []; k.aufrufZuletzt = null;
    speichern(); zeichne(); toast("Runde zurückgesetzt");
  }
});

/* Die Wahl des Sitzplans - drei Knöpfe, der aktive hervorgehoben. Eine Auswahl
   statt eines Klapplists: bei drei Möglichkeiten ist der eine Tipp kürzer als
   aufklappen, lesen, tippen. */
function sitzplanWahlHtml(k){
  let html = '<div class="splwahl">';
  for (let n = 1; n <= SITZPLAENE; n++)
    html += '<button class="'+(sitzNummer(k)===n ? "aktiv" : "")+'" data-a="sitzplanWahl" data-id="'+k.id+
      '" data-nr="'+n+'" title="Sitzplan '+n+'">'+n+'</button>';
  return html + '</div>';
}

(function sitzplanWahlStil(){
  if (document.getElementById("splwahlStil")) return;
  const el = document.createElement("style");
  el.id = "splwahlStil";
  el.textContent =
    ".splwahl{display:inline-flex; border:1px solid var(--linie); border-radius:10px; overflow:hidden;}"+
    ".splwahl button{border:none; border-radius:0; background:var(--karte); color:var(--text2);"+
      "font-weight:800; font-size:14px; padding:8px 13px; min-width:38px; box-shadow:none;}"+
    ".splwahl button + button{border-left:1px solid var(--linie);}"+
    ".splwahl button.aktiv{background:var(--akzent); color:#fff;}";
  document.head.appendChild(el);
})();

document.addEventListener("click", ev=>{
  const el = ev.target.closest('[data-a="sitzplanWahl"]');
  if (!el) return;
  const k = kursVon(el.dataset.id);
  if (!k) return;
  const neu = Number(el.dataset.nr);
  if (sitzNummer(k) === neu) return;

  /* Ein leerer Plan übernimmt, was gerade auf dem Schirm steht. Wer auf
     "2" tippt, will meist eine Abwandlung der jetzigen Ordnung und nicht das
     Raster von vorn - zwei Tische verschieben statt dreissig. */
  const von = sitzSchluessel(k);
  const nach = sitzSchluessel(k, neu);
  const schueler = kursSchueler(k.id);
  if (!schueler.some(s=>s.sitz && s.sitz[nach])){
    for (const s of schueler){
      const pos = s.sitz && s.sitz[von];
      if (!pos) continue;
      if (!s.sitz || typeof s.sitz !== "object") s.sitz = {};
      s.sitz[nach] = {x: pos.x, y: pos.y};
    }
  }
  k.sitzplan = neu;
  speichern(); zeichne();
  toast("Sitzplan "+neu);
});

/* Der Knopf über dem Sitzplan. */
const sitzplanOhneAufruf = viewSitzplan;
viewSitzplan = function(k){
  const html = sitzplanOhneAufruf(k);
  if (!html.includes('<div id="sitzflaeche">')) return html;
  const kandidaten = aufrufbare(k);
  const topf = aufrufTopf(k);
  const begonnen = topf.length > 0 || !!k.aufrufZuletzt;
  const offen = topf.length ? MerkrAufrufen.offen(topf, kandidaten.map(x=>x.id)) : kandidaten.length;
  const kopf = '<div class="zeile raum" style="margin-bottom:10px">'+
    '<div class="zeile" style="gap:8px">'+
    '<button class="primar" data-a="aufrufen" data-id="'+k.id+'">Aufrufen</button>'+
    sitzplanWahlHtml(k)+
    '</div>'+
    '<span class="hinweis">'+
    (kandidaten.length
      ? (!begonnen ? kandidaten.length+' Schüler anwesend'
        : !topf.length ? 'alle waren dran, der nächste Aufruf beginnt neu'
        : offen+' von '+kandidaten.length+' noch nicht dran')
      : 'niemand anwesend')+
    (begonnen ? ' · <button class="klein" data-a="aufrufZuruecksetzen" data-id="'+k.id+'">Runde neu</button>' : '')+
    '</span></div>';
  return kopf + html;
};

/* ================= Sitzplan auch ohne Unterricht =================
   Die Bindung an den Stundenplan war zu streng: an Tagen ohne Unterricht
   verschwand der ganze Sitzplan. Zum Notieren ist das richtig, zum Einrichten
   der Sitzordnung nicht - in den Ferien und vor dem ersten Schultag will man
   die Plätze sortieren, ohne dass merkr behauptet, es sei nichts zu tun.

   Jetzt: sehen immer, notieren nur an Unterrichtstagen. */

const sitzplanStreng = viewSitzplan;
viewSitzplan = function(k){
  if (hatUnterricht(k.id, R.datum)) return sitzplanStreng(k);

  /* Ohne Unterricht: dieselben Kacheln, aber ein Band darüber und kein Aufruf. */
  const grund = unterrichtsfrei(R.datum);
  const vor = naechsterUnterrichtstag(k.id, R.datum, +1);
  const band = '<div class="karte" style="display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:10px">'+
    '<span style="width:9px;height:9px;border-radius:50%;background:var(--s0);flex:0 0 9px"></span>'+
    '<div style="flex:1"><b>'+esc(fmtDatum(R.datum))+' · kein Unterricht</b>'+
    '<div class="hinweis">'+(grund ? esc(grund)+" - " : "")+
    'Plätze lassen sich einrichten. Notieren geht auch - die Notiz legt dann eine Stunde an diesem Tag an.</div></div>'+
    /* Gerade hier gehört die Wahl hin: Sitzordnungen richtet man ein, wenn kein
       Unterricht ist. */
    sitzplanWahlHtml(k)+
    (vor ? '<button data-a="anwTag" data-datum="'+vor+'">Zur nächsten Stunde</button>' : '')+
    '</div>';

  /* sitzplanOhnePlan ist die Fassung VOR der Stundenplan-Bindung - sie zeichnet
     die Kacheln ohne zu fragen, ob heute Unterricht ist. sitzplanOhneRaum wäre
     falsch: die prüft selbst schon und gäbe wieder nur den Hinweis zurück. */
  const schueler = kursSchueler(k.id);
  if (!schueler.length)
    return band + leer("Noch keine Schüler in diesem Kurs.", "Schüler hinzufügen", "tab", "kurscfg");

  let nr = 0;
  for (const s of schueler){
    if (s.sitz && s.sitz[sitzSchluessel(k)]) continue;
    if (!s.sitz || typeof s.sitz !== "object") s.sitz = {};
    s.sitz[sitzSchluessel(k)] = platzPosition(nr++);
  }
  const marke = '<div id="sitzflaeche">';
  const roh = sitzplanOhnePlan(k);
  return band + (roh.includes(marke) ? roh.replace(marke, marke + raumHintergrund()) : roh);
};

/* An Tagen ohne Unterricht führt ein Tippen aufs Profil statt in die Erfassung -
   notiert wird dort ohnehin nichts. */
const popupStreng = oeffnePopupSchueler;
/* Im Sitzplan führt der Klick immer in die Erfassung - dafür ist er da: man hat
   den Platz vor Augen und will notieren, nicht lesen. Eine frühere Fassung leitete
   an Tagen ohne Unterricht ins Profil um; das war als Schutz vor dem Anlegen von
   Ferienstunden gedacht, machte den Sitzplan aber in der Woche vor Schuljahresbeginn
   unbrauchbar. Jetzt steht der Hinweis im Popup, und die Entscheidung bleibt beim
   Menschen. Zum Datensatz führt der Knopf "Profil ›" im Popup und die Namensliste. */
oeffnePopupSchueler = function(schuelerId, ankerRect){
  return popupStreng(schuelerId, ankerRect);
};

/* ================= Liste führt ins Profil =================
   Aus einer Namensliste heraus will man den Menschen sehen, nicht die
   Schnellerfassung: dafür ist der Sitzplan da, wo man den Platz vor Augen hat. */

const listeMitPopup = viewListe;
viewListe = function(k){
  return listeMitPopup(k).replace(/data-a="popupSchueler"/g, 'data-a="profilOeffnen"');
};

zeichne();

/* ================= Tafel unten, Kacheln rasten auf Plätze =================
   Die Tafel steht jetzt unten - Gewohnheitssache, und der Raum liest sich für
   den, der ihn benutzt, nicht für den, der ihn zeichnet.

   Und das Einrasten: es lief auf ein 28-Pixel-Raster, das mit den Tischen
   nichts zu tun hatte. Deshalb landete jede Kachel "leicht daneben". Jetzt
   rastet sie auf einen der dreißig Plätze; ist der besetzt, tauschen die
   beiden. */

RAUM.randOben = 20;
RAUM.tafelOben = RAUM.randOben + RAUM.reihen * (RAUM.tischHoehe + RAUM.reihenLuecke) + 6;

raumHintergrund = function(){
  let html = "";
  for (let r = 0; r < RAUM.reihen; r++)
    for (let s = 0; s < RAUM.spalten; s++)
      html += '<div class="tisch" style="left:'+
        (RAUM.randLinks + s * (RAUM.tischBreite + RAUM.luecke))+'px;top:'+
        (RAUM.randOben + r * (RAUM.tischHoehe + RAUM.reihenLuecke))+'px;width:'+
        RAUM.tischBreite+'px;height:'+RAUM.tischHoehe+'px"></div>';
  html += '<div class="tafel" style="left:'+RAUM.randLinks+'px;top:'+RAUM.tafelOben+'px;width:'+
    (RAUM.spalten * RAUM.tischBreite + (RAUM.spalten-1) * RAUM.luecke)+'px;height:30px">TAFEL</div>';
  return html;
};

/** Der Platz, dessen Mitte einem Punkt am nächsten liegt. */
function naechsterPlatz(x, y){
  let beste = 0, abstand = Infinity;
  for (let i = 0; i < RAUM.spalten * RAUM.reihen * 2; i++){
    const p = platzPosition(i);
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < abstand){ abstand = d; beste = i; }
  }
  return beste;
}

/** Wer sitzt auf diesem Platz - verglichen wird über die Position. */
function werSitztAuf(kursId, index, ausser){
  const ziel = platzPosition(index);
  return kursSchueler(kursId).find(s=>{
    if (s.id === ausser) return false;
    const pos = s.sitz && s.sitz[sitzSchluessel(kursId)];
    return pos && Math.abs(pos.x - ziel.x) < 6 && Math.abs(pos.y - ziel.y) < 6;
  }) || null;
}

initSitzplanDrag = function(){
  const flaeche = document.getElementById("sitzflaeche");
  if (!flaeche) return;
  let aktiv = null, startX = 0, startY = 0, ox = 0, oy = 0, bewegt = false;

  flaeche.addEventListener("pointerdown", ev=>{
    const kachel = ev.target.closest(".stile"); if (!kachel) return;
    aktiv = kachel; bewegt = false;
    startX = ev.clientX; startY = ev.clientY;
    ox = kachel.offsetLeft; oy = kachel.offsetTop;
    try { kachel.setPointerCapture(ev.pointerId); } catch(e) { /* synthetische Ereignisse */ }
  });

  flaeche.addEventListener("pointermove", ev=>{
    if (!aktiv) return;
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!bewegt && Math.hypot(dx, dy) < 8) return;
    bewegt = true;
    /* Beim Ziehen folgt die Kachel frei - eingerastet wird erst beim Loslassen,
       sonst springt sie unter dem Finger. */
    const nx = Math.max(0, Math.min(ox + dx, flaeche.clientWidth - aktiv.offsetWidth));
    const ny = Math.max(0, Math.min(oy + dy, flaeche.clientHeight - aktiv.offsetHeight));
    aktiv.style.left = nx + "px"; aktiv.style.top = ny + "px";
    aktiv.style.opacity = ".85";
  });

  flaeche.addEventListener("pointerup", ()=>{
    if (!aktiv) return;
    const kachel = aktiv; aktiv = null;
    kachel.style.opacity = "";
    if (!bewegt){ oeffnePopupSchueler(kachel.dataset.sid, kachel.getBoundingClientRect()); return; }

    const s = schuelerVon(kachel.dataset.sid);
    const k = kursVon(R.kursId);
    if (!s || !k) return;
    if (!s.sitz || typeof s.sitz !== "object") s.sitz = {};

    const index = naechsterPlatz(kachel.offsetLeft, kachel.offsetTop);
    const ziel = platzPosition(index);
    const nachbar = werSitztAuf(k.id, index, s.id);
    if (nachbar){
      /* Platztausch: der andere bekommt den, den dieser gerade verlässt. */
      const vorher = s.sitz[sitzSchluessel(k)] || ziel;
      if (!nachbar.sitz || typeof nachbar.sitz !== "object") nachbar.sitz = {};
      nachbar.sitz[sitzSchluessel(k)] = {x: vorher.x, y: vorher.y};
    }
    s.sitz[sitzSchluessel(k)] = ziel;
    speichern(); zeichne();
  });

  flaeche.addEventListener("pointercancel", ()=>{
    if (aktiv) aktiv.style.opacity = "";
    aktiv = null;
  });
};

/* ================= Wer gerät aus dem Blick =================
   Drei Stellen, eine Rechnung (kern/beteiligung.js): der Sitzplan zeigt es, das
   Aufrufen berücksichtigt es, die Auswertung führt es auf.

   Der Gedanke dahinter: erfasst wird weiter nur, was auffällt. merkr sorgt
   dafür, dass am Ende niemand ohne Grundlage dasteht. */

function beteiligungVon(k){
  const sj = aktivesSchuljahr();
  const ab = sj ? MerkrNoten.halbjahrBeginn(sj, todayISO()) : null;
  const stunden = S.stunden.filter(x=>x.kursId===k.id);
  const ereignisse = S.ereignisse.filter(e=>e.kursId===k.id);
  const bis = todayISO();
  const liste = MerkrBeteiligung.uebersicht(kursSchueler(k.id), stunden, ereignisse, {ab, bis});
  const nach = new Map(liste.map(x=>[x.id, x]));
  return {liste, nach, stunden: stunden.filter(x=>!x.ausfall && (!ab || x.datum >= ab) && x.datum <= bis).length};
}

/* --- 1. Der Sitzplan zeigt es --- */
const sitzplanOhneBlick = viewSitzplan;
viewSitzplan = function(k){
  const html = sitzplanOhneBlick(k);
  if (!html.includes('class="stile')) return html;

  const b = beteiligungVon(k);
  /* Ab wann "lange nicht dran"? Drei Stunden sind gut zwei Wochen bei zwei
     Wochenstunden - lange genug, dass es auffällt, kurz genug, um zu handeln. */
  const schwelle = 3;
  let markiert = 0;
  let neu = html;
  for (const [id, e] of b.nach){
    if (e.stundenOhne < schwelle || !b.stunden) continue;
    markiert++;
    neu = neu.replace('data-sid="'+id+'"', 'data-sid="'+id+'" class-blick="1"');
  }
  /* Der Rand wird über ein Attribut gesetzt, damit die Kachel-Erzeugung
     unangetastet bleibt. */
  neu = neu.replace(/class="stile([^"]*)"([^>]*?)class-blick="1"/g,
    'class="stile$1 lange-nicht"$2');

  if (markiert)
    neu = '<p class="hinweis" style="margin:0 0 8px">'+
      markiert+(markiert===1?' Schüler hat':' Schüler haben')+' seit mindestens '+schwelle+
      ' Stunden keine Notiz - im Plan gestrichelt umrandet.</p>' + neu;
  return neu;
};

/* --- 2. Das Aufrufen bevorzugt sie --- */
aufrufZiehen = function(k){
  const kandidaten = aufrufbare(k).map(s=>s.id);
  const topf = aufrufTopf(k);
  const b = beteiligungVon(k);
  const gewichte = {};
  for (const id of kandidaten)
    gewichte[id] = MerkrBeteiligung.gewicht(b.nach.get(id) ? b.nach.get(id).stundenOhne : 0);

  /* Erst die Runde regeln (wer ist noch dran?), dann innerhalb der Runde
     gewichten - so bleibt jeder einmal an der Reihe. */
  const e = MerkrAufrufen.ziehen(kandidaten, topf, k.aufrufZuletzt || null,
    () => 0); // gleich ersetzt: wir ziehen selbst
  if (!e){ zeigeModal(aufrufDialog(k, null)); return; }

  const rest = e.neueRunde
    ? kandidaten.filter(id => kandidaten.length === 1 || id !== (k.aufrufZuletzt || null))
    : MerkrAufrufen.topfPruefen(topf, kandidaten);
  const gezogen = MerkrBeteiligung.zieheGewichtet(rest, gewichte) || e.gezogen;

  k.aufrufTopf = (e.neueRunde ? kandidaten : rest).filter(id => id !== gezogen);
  k.aufrufZuletzt = gezogen;
  R.aufrufAktuell = gezogen;
  speichern();
  zeigeModal(aufrufDialog(k, gezogen, e.neueRunde));
};

/* --- 3. Die Auswertung führt es auf --- */

    '<div style="display:flex;gap:26px;margin-bottom:14px">'+

    '<div><div style="font-size:24px;font-weight:900'+(mit<schueler.length?';color:var(--sm1)':'')+'">'+
    mit+' / '+schueler.length+'</div><div class="hinweis">mit mindestens einer</div></div>'+
    '<div><div style="font-size:24px;font-weight:900">'+
    (b.stunden ? fmtZahl(gesamt / b.stunden, 1) : "–")+'</div><div class="hinweis">je Stunde</div></div></div>';

  html += '<table class="tab"><tr><th>Schüler</th><th>Notizen</th><th>Ø Stufe</th><th>zuletzt</th><th></th></tr>';
  for (const e of sortiert){
    const s = schuelerVon(e.id);
    if (!s) continue;
    const lang = b.stunden && e.stundenOhne >= 3;
    html += '<tr><td><b>'+esc(s.name)+', '+esc(s.vorname)+'</b></td>'+
      '<td>'+(e.anzahl || '<span class="hinweis">keine</span>')+'</td>'+

      '<td'+(lang?' style="color:var(--sm1);font-weight:800"':'')+'>'+

      '<td><button class="klein" data-a="profilOeffnen" data-id="'+s.id+'">Profil</button></td></tr>';

  return html;
}

/* ================= Die Stunden als Reihe unter den Reitern =================
   Mitarbeit und Anwesenheit hängen an einer Unterrichtsstunde, nicht am

   Pfeile entfallen dort, wo die Reihe steht - zweimal derselbe Weg war schon

const STUNDENREIHE_TABS = ["sitzplan", "anwesenheit", "regie"];
const MONATSKURZ = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

/** Alle Unterrichtstage dieses Kurses im laufenden Schuljahr, aufsteigend. */
function unterrichtstage(k){
  const sj = aktivesSchuljahr();
  if (!sj || !sj.beginn || !sj.ende) return [];
  const tage = [];
  const d = new Date(sj.beginn+"T12:00:00");
  const ende = new Date(sj.ende+"T12:00:00");
  for (let i = 0; i < 400 && d <= ende; i++){
    const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if (hatUnterricht(k.id, iso)) tage.push(iso);
    d.setDate(d.getDate()+1);
  }
  return tage;
}

/** Was an einem Termin schon steht - dieselben Zeichen wie im Wochenplan. */
function stundenStand(k, iso){
  const st = S.stunden.find(x=>x.kursId===k.id && x.datum===iso);
  if (st && st.ausfall) return {farbe:"var(--rot)", wort:"Ausfall", ausfall:true};
  const notizen = st ? S.ereignisse.filter(x=>x.stundeId===st.id && x.stufe!=null).length : 0;
  if (notizen) return {farbe:"var(--s2)", wort:notizen+(notizen===1?" Notiz":" Notizen")};
  if (st && String(st.thema||"").trim()) return {farbe:"var(--s0)", wort:"gehalten, nichts notiert"};
  return {farbe:"var(--linie)", wort:(st && String(st.geplant||"").trim()) ? String(st.geplant) : "steht noch aus"};
}

function stundenReihe(k){
  const tage = unterrichtstage(k);
  if (!tage.length) return "";
  const heute = todayISO();
  let html = '<div class="stundenreihe" id="stundenreihe">';
  let letzterMonat = "";
  for (const iso of tage){
    const monat = iso.slice(0,7);
    if (monat !== letzterMonat){
      letzterMonat = monat;
      html += '<span class="smonat">'+MONATSKURZ[Number(iso.slice(5,7))-1]+'</span>';
    }
    const stand = stundenStand(k, iso);
    const klassen = "stag"+(iso===R.datum?" aktiv":"")+(iso===heute?" heute":"")+(stand.ausfall?" ausfall":"");
    html += '<button class="'+klassen+'" data-a="stundenTag" data-datum="'+iso+'" '+
      'title="'+esc(fmtDatum(iso)+" · "+stand.wort)+'">'+
      '<span class="swt">'+wochentagName(new Date(iso+"T12:00:00").getDay())+'</span>'+
      '<span class="sdat">'+iso.slice(8,10)+'.'+iso.slice(5,7)+'.</span>'+
      '<i style="background:'+stand.farbe+'"></i></button>';
  }
  return html + '</div>';
}

/* Unter die Reiter, aber nur dort, wo der Tag etwas bedeutet. */

kursLeiste = function(k){

/* Nach dem Zeichnen den offenen Tag in die Mitte schieben. Ohne das steht die
   Reihe im August, während man im Februar notiert. */
const zeichneOhneStundenreihe = zeichne;
zeichne = function(){
  zeichneOhneStundenreihe();
  const reihe = document.getElementById("stundenreihe");
  if (!reihe) return;
  let ziel = reihe.querySelector(".stag.aktiv");
  if (!ziel){
    /* Der offene Tag ist keine Unterrichtsstunde: dann zum nächsten Termin. */
    const alle = reihe.querySelectorAll(".stag");
    for (const b of alle){ if (b.dataset.datum >= R.datum){ ziel = b; break; } }
    if (!ziel && alle.length) ziel = alle[alle.length-1];
  }
  if (!ziel) return;
  reihe.scrollLeft = ziel.offsetLeft - reihe.clientWidth/2 + ziel.offsetWidth/2;
};

/* ================= Die Stunde abschließen =================
   Vier Kategorien mal fünfundzwanzig Kinder sind hundert Felder je Stunde. Das
   füllt niemand, und was niemand füllt, ist keine Grundlage für eine Note.

   Deshalb der umgekehrte Weg: merkr schlägt am Stundenende für jeden eine Note
   vor - aus den Notizen, die während der Stunde entstanden sind, und für alle
   anderen die Drei. Eine Runde drüber, korrigieren was nicht stimmt,
   bestätigen. Die Notizen bleiben das, was sie sein sollten: die Begründung für
   die Ausschläge, nicht die Pflichtübung für den Normalfall.

   Gespeichert wird an der Stunde (st.mitarbeit), nicht am Schüler: eine Note
   gehört zu dem Tag, an dem sie entstanden ist. */

function halbjahrNr(iso){
  const sj = aktivesSchuljahr();
  if (!sj || !sj.halbjahrGrenze) return 1;
  return iso >= sj.halbjahrGrenze ? 2 : 1;
}
function halbjahrSpanne(nr){
  const sj = aktivesSchuljahr();
  if (!sj) return {nr:1, ab:null, bis:null};
  const g = sj.halbjahrGrenze || null;
  if (!g) return {nr:1, ab:sj.beginn||null, bis:sj.ende||null};
  return nr === 2 ? {nr:2, ab:g, bis:sj.ende||null} : {nr:1, ab:sj.beginn||null, bis:g};
}
function aktuellesHalbjahr(){ return halbjahrNr(todayISO()); }
function imHalbjahr(iso, nr){
  const s = halbjahrSpanne(nr);
  if (s.ab && iso < s.ab) return false;
  if (nr === 1 && s.bis && iso >= s.bis) return false;
  if (nr === 2 && s.bis && iso > s.bis) return false;
  return true;
}

function notizenDerStunde(schuelerId, stundeId){
  return S.ereignisse.filter(e=>e.schuelerId===schuelerId && e.stundeId===stundeId);
}

/** Was merkr für diese Stunde vorschlägt - ohne Notiz die Basis. */
function stundennoteVorschlag(schuelerId, st, k){
  return MerkrMitarbeit.stundennote(notizenDerStunde(schuelerId, st.id), {typ: notensystem(k).typ});
}
/** Die bestätigte Note dieser Stunde, oder undefined. */
function stundennoteVon(st, schuelerId){
  return st && st.mitarbeit ? st.mitarbeit[schuelerId] : undefined;
}
/** Alle bestätigten Stundennoten eines Schülers im Halbjahr, neueste zuerst. */
function stundennotenListe(schuelerId, kursId, hjNr){
  const liste = [];
  for (const st of S.stunden){
    if (st.kursId !== kursId || st.ausfall) continue;
    if (hjNr && !imHalbjahr(st.datum, hjNr)) continue;
    const w = stundennoteVon(st, schuelerId);
    if (w === undefined || w === null || w === "") continue;
    liste.push({datum: st.datum, wert: Number(w), stundeId: st.id, thema: st.thema || st.geplant || ""});
  }
  return liste.sort((a,b)=>b.datum.localeCompare(a.datum));
}
/** Die Mitarbeitsnote des Halbjahres: das Mittel der bestätigten Stunden. */
function mitarbeitHalbjahr(schuelerId, kursId, hjNr){
  const liste = stundennotenListe(schuelerId, kursId, hjNr);
  const k = kursVon(kursId);
  const r = MerkrMitarbeit.halbjahresnote(liste.map(x=>x.wert), k ? notensystem(k).typ : "noten");
  r.liste = liste;
  return r;
}

/** Wie viele Stunden des Halbjahres schon abgeschlossen sind. */
function abgeschlosseneStunden(kursId, hjNr){
  return S.stunden.filter(st=>st.kursId===kursId && !st.ausfall &&
    (!hjNr || imHalbjahr(st.datum, hjNr)) && st.mitarbeitBestaetigt).length;
}

/* ---------- Der Dialog ---------- */

function abschlussWerte(k, st){
  if (!R.abschluss || R.abschluss.stundeId !== st.id){
    const werte = {};
    for (const s of kursSchueler(k.id)){
      const gesetzt = stundennoteVon(st, s.id);
      werte[s.id] = gesetzt !== undefined && gesetzt !== null && gesetzt !== ""
        ? Number(gesetzt)
        : stundennoteVorschlag(s.id, st, k).wert;
    }
    R.abschluss = {stundeId: st.id, werte: werte};
  }
  return R.abschluss.werte;
}

function stundeAbschliessenDialog(k, st){
  const sys = notensystem(k);
  const werte = abschlussWerte(k, st);
  const schueler = kursSchueler(k.id);
  const wt = wochentagName(new Date(st.datum+"T12:00:00").getDay());

  /* Der Regelfall ist "passt so". Deshalb steht der Knopf oben und wandert
     mit - wer nichts ändern will, soll nicht an fünfundzwanzig Zeilen
     vorbeiscrollen, um das zu sagen. */
  let h = '<div style="position:sticky;top:-20px;background:#fff;padding:2px 0 10px;margin:-2px 0 0;z-index:2">'+
    '<div class="zeile raum">'+
    '<h2 style="margin:0">Mitarbeit '+wt+', '+esc(fmtDatum(st.datum))+'</h2>'+
    '<div class="zeile"><button class="klein" data-a="modalZu">Abbrechen</button>'+
    '<button class="primar" data-a="abschlussSpeichern" data-id="'+st.id+'">'+
    (st.mitarbeitBestaetigt ? 'Erneut bestätigen' : 'Bestätigen')+'</button></div></div>'+
    '<p class="hinweis" style="margin:6px 0 0">Vorgeschlagen ist, was die Notizen dieser Stunde ergeben - '+
    'ohne Notiz '+(sys.typ==="punkte" ? "acht Punkte" : "eine Drei")+'. Ändern, wo es nicht stimmt.</p></div>';

  for (const s of schueler){
    const anw = anwesenheitVon(s.id, st.id);
    const fehlt = anw && anw.status === "fehlt";
    const notizen = notizenDerStunde(s.id, st.id).filter(e=>e.stufe!=null || EINFACH_EREIGNISSE.some(x=>x.id===e.typ));
    const vs = stundennoteVorschlag(s.id, st, k);

    h += '<div class="zeile raum" style="padding:7px 0;border-bottom:1px solid var(--linie);gap:8px'+(fehlt?';opacity:.5':'')+'">'+
      '<div style="min-width:120px;flex:1"><b>'+esc(s.name)+', '+esc(s.vorname)+'</b>'+
      '<div class="hinweis" style="font-size:12px">'+
      (fehlt ? 'fehlt heute'
        : notizen.length
          ? notizen.map(e=>esc(ereignisNameVonTyp(e.typ))+(e.stufe!=null?' '+stufeInfo(e.stufe).label:'')).join(' · ')
          : 'ohne Notiz')+
      '</div></div>';

    if (fehlt){
      h += '<span class="hinweis">keine Note</span>';
    } else {
      h += '<div class="wertknoepfe" style="flex:0 0 auto">';
      for (const w of sys.werte)
        h += '<button data-a="abschlussWert" data-id="'+s.id+'" data-wert="'+w+'"'+
          (Number(werte[s.id])===w ? ' style="background:var(--akzent);color:#fff;border-color:var(--akzent);font-weight:800"' : '')+
          '>'+w+'</button>';
      h += '<button data-a="abschlussLeer" data-id="'+s.id+'"'+
        (werte[s.id]==null ? ' style="background:var(--akzent-hell);border-color:var(--akzent-hell)"' : '')+
        ' title="Diese Stunde für '+esc(s.vorname)+' nicht bewerten">–</button>';
      h += '</div>';
    }
    h += '</div>';
  }

  const gezaehlt = Object.keys(werte).filter(id=>werte[id]!=null).length;
  h += '<div class="zeile raum" style="margin-top:14px">'+
    '<span class="hinweis">'+gezaehlt+' von '+schueler.length+' bekommen eine Note</span>'+
    '<button class="primar" data-a="abschlussSpeichern" data-id="'+st.id+'">'+
    (st.mitarbeitBestaetigt ? 'Erneut bestätigen' : 'Bestätigen')+'</button></div>';

  zeigeModal(h);
}

/* ---------- TÜ-Punkte ---------- */

function tueTopf(k, hj){
  if (!k.tue || typeof k.tue !== "object") k.tue = {};
  const schluessel = "hj"+hj;
  if (!k.tue[schluessel] || typeof k.tue[schluessel] !== "object")
    k.tue[schluessel] = {punkte:{}, rechte:{}};
  const t = k.tue[schluessel];
  if (!t.punkte || typeof t.punkte !== "object") t.punkte = {};
  if (!t.rechte || typeof t.rechte !== "object") t.rechte = {};
  return t;
}
function tuePunkteVon(k, hj, schuelerId){
  const t = tueTopf(k, hj);
  const a = t.punkte[schuelerId];
  return Array.isArray(a) ? a.slice(0, MerkrTue.ANZAHL) : [];
}
function tueRechteVon(k, hj, schuelerId){
  return Number(tueTopf(k, hj).rechte[schuelerId]) || 0;
}
/** Punkte, Streichungen und die Note daraus. */
function tueStand(k, hj, schuelerId){
  const a = MerkrTue.auswertung(tuePunkteVon(k, hj, schuelerId), tueRechteVon(k, hj, schuelerId));
  const sys = notensystem(k);
  a.wert = a.summe > 0 || a.zaehlend.length ? MerkrErgebnisse.wertAusProzent(a.prozent, sys.typ) : null;
  return a;
}

document.addEventListener("change", ev=>{
  const el = ev.target.closest('[data-a-change="tuePunkt"]');
  if (!el) return;
  const k = kursVon(R.kursId); if (!k) return;
  const t = tueTopf(k, notenHalbjahr());
  const id = el.dataset.id, nr = Number(el.dataset.nr) - 1;
  const liste = Array.isArray(t.punkte[id]) ? t.punkte[id].slice() : [];
  while (liste.length < MerkrTue.ANZAHL) liste.push(null);
  const roh = String(el.value).trim().replace(",", ".");
  liste[nr] = roh === "" ? null : Math.max(0, Math.min(MerkrTue.MAX_JE, Number(roh)));
  t.punkte[id] = liste;
  speichern(); zeichne();
});

/* ---------- Mitarbeit und TÜ zählen mit ---------- */

/* Beide erscheinen als Note in der gewohnten Rechnung, statt daneben zu stehen.
   Die Mitarbeit ist die mündliche Note, die TÜ eine sonstige Leistung mit
   einfachem Gewicht - so wie eine LEK. */
const schuelerNotenOhneStunden = schuelerNoten;
schuelerNoten = function(schuelerId, kursId){
  const k = kursVon(kursId);
  if (!k) return schuelerNotenOhneStunden(schuelerId, kursId);
  const hj = notenHalbjahr();

  /* Nur das gewählte Halbjahr. Vorher zählten Arbeiten aus dem ersten Halbjahr
     im zweiten weiter, während die Mitarbeit dort neu ansetzte - eine Zahl aus
     zwei Zeiträumen. In die Halbjahresnote gehört, was im Halbjahr passiert
     ist; welches gemeint ist, sagt der Umschalter oben. */
  const liste = schuelerNotenOhneStunden(schuelerId, kursId)
    .filter(n => !n.datum || imHalbjahr(n.datum, hj));

  const m = mitarbeitHalbjahr(schuelerId, kursId, hj);
  if (m.wert != null)
    liste.push({wert:m.wert, bereich:"muendlich", label:"Mitarbeit", gewicht:1,
      datum:todayISO(), ausMitarbeit:true});

  const t = tueStand(k, hj, schuelerId);
  if (t.wert != null && t.vollstaendig)
    liste.push({wert:t.wert, bereich:"sonstige", label:"TÜ", gewicht:1,
      datum:todayISO(), ausTue:true});

  return liste;
};

/* ---------- Das Notenbuch: eine Tabelle ----------
   Erst standen hier drei Tabellen übereinander - Mitarbeit, Noten, TÜ - mit
   denselben Namen in denselben Zeilen. Wer wissen wollte, wie ein Kind steht,
   las dreimal dieselbe Spalte Namen und setzte die Zahlen im Kopf zusammen.

   Jetzt ein Raster: Namen links, alles andere als Spalten daneben. Die
   Namensspalte klebt beim Querschieben am Rand, damit die Zeile nicht verrutscht.
   Die Tiefe steckt hinter den Zellen - eine Note antippen öffnet die Eingabe der
   Arbeit, die Mitarbeit ihren Verlauf, die TÜ-Felder nehmen die Punkte direkt. */

function notenTabelle(k){
  const hj = notenHalbjahr();
  const sys = notensystem(k);
  const schueler = kursSchueler(k.id);
  if (!schueler.length) return leer("Dieser Kurs hat noch keine Schüler.", "Schüler hinzufügen", "tab", "kurscfg");

  const arbeiten = S.arbeiten
    .filter(a=>a.kursId===k.id && (!a.datum || imHalbjahr(a.datum, hj)))
    .sort((a,b)=>String(a.datum).localeCompare(String(b.datum)));

  let html = '<div class="nrollen"><table class="nbuch">';

  /* Erste Kopfzeile: die Gruppen. Ohne sie stünden dreizehn Kürzel nebeneinander
     und niemand wüsste, wo die Arbeiten aufhören und die TÜ anfangen. */
  html += '<tr class="ngruppe"><th class="name links"></th>'+
    (arbeiten.length ? '<th colspan="'+arbeiten.length+'">Arbeiten und Tests</th>' : '')+
    '<th colspan="'+(MerkrTue.ANZAHL+2)+'">TÜ</th>'+
    '<th></th><th></th></tr>';

  html += '<tr><th class="name links">Schüler</th>';
  for (const a of arbeiten)
    html += '<th title="'+esc(a.titel+" · "+a.art+" · "+fmtDatum(a.datum))+'">'+esc(spaltenKopf(a))+'</th>';
  for (let i = 1; i <= MerkrTue.ANZAHL; i++)
    html += '<th title="TÜ '+i+', bis '+MerkrTue.MAX_JE+' Punkte">TÜ'+i+'</th>';
  html += '<th title="Rückkaufrechte: streichen die schlechtesten Übungen">Rück</th>'+
    '<th title="Note aus den besten drei Übungen">Note</th>'+
    '<th title="Mitarbeit: Mittel der abgeschlossenen Stunden">Mit.</th>'+
    '<th>Stand</th></tr>';

  for (const s of schueler){
    const punkte = tuePunkteVon(k, hj, s.id);
    const tue = tueStand(k, hj, s.id);
    const rechte = tueRechteVon(k, hj, s.id);
    const m = mitarbeitHalbjahr(s.id, k.id, hj);
    const stand = notenstand(s.id, k.id);

    html += '<tr><td class="name">'+esc(s.name)+', '+esc(s.vorname)+'</td>';

    for (const a of arbeiten){
      const w = a.ergebnisse[s.id];
      const leerZelle = w===undefined || w===null || w==="";
      html += '<td'+(leerZelle?' class="leer"':'')+' data-a="arbeitEingabe" data-id="'+a.id+'" '+
        'style="cursor:pointer" title="'+esc(a.titel)+'">'+(leerZelle ? '–' : w)+'</td>';
    }

    for (let i = 1; i <= MerkrTue.ANZAHL; i++){
      const w = punkte[i-1];
      const raus = tue.gestrichen.indexOf(i) >= 0 || tue.unzulaessig.indexOf(i) >= 0;
      html += '<td'+(raus?' class="gestrichen"':'')+' title="'+
        (tue.unzulaessig.indexOf(i)>=0 ? 'ohne Rückkaufrecht geschrieben - zählt nicht'
          : tue.gestrichen.indexOf(i)>=0 ? 'gestrichen' : 'TÜ '+i)+'">'+
        '<input class="tp" type="number" min="0" max="'+MerkrTue.MAX_JE+'" step="1" '+
        'value="'+(w==null?"":w)+'" data-a-change="tuePunkt" data-id="'+s.id+'" data-nr="'+i+'"></td>';
    }
    html += '<td><button class="klein" data-a="tueRecht" data-id="'+s.id+'"'+
      (rechte ? ' style="background:var(--akzent);color:#fff"' : '')+
      ' title="Antippen zählt weiter: 0, 1, 2">'+rechte+'</button></td>'+
      '<td title="'+(tue.zaehlend.length ? tue.summe+' von '+tue.max+' Punkten' : 'noch nichts geschrieben')+'">'+
      (tue.wert==null ? '<span class="leer">–</span>' : tue.wert + (tue.vollstaendig ? '' : '*'))+'</td>';

    html += '<td data-a="mitarbeitAuf" data-id="'+s.id+'" style="cursor:pointer" title="'+
      (m.anzahl ? m.anzahl+' Stunden, Mittel '+fmtZahl(m.mittel,2) : 'noch keine abgeschlossene Stunde')+'">'+
      (m.wert==null ? '<span class="leer">–</span>' : m.wert)+'</td>';

    html += '<td class="stand">'+(stand.gesamt==null ? '<span class="leer">–</span>' : fmtZahl(stand.gesamt,1))+
      '</td></tr>';
  }
  html += '</table></div>';

  const anteil = 100 - gewSonstige(k);
  html += '<p class="hinweis" style="margin-top:10px">Stand = '+anteil+' Prozent Klassenarbeiten, '+
    gewSonstige(k)+' Prozent sonstige Leistungen'+(sys.typ==="punkte"?' (Punkte 0–15)':' (Noten 1–6)')+
    ', nur aus diesem Halbjahr. Note einer Arbeit antippen öffnet ihre Eingabe, die Mitarbeit ihren Verlauf. '+
    'Durchgestrichene TÜ zählen nicht, ein Stern heißt: noch keine drei geschrieben, die Note zählt erst danach mit.</p>';
  return html;
}

/* ---------- Block 2: das Notenbuch ---------- */

/** Die Spalten des Notenbuchs: jede Arbeit, dann TÜ und Mitarbeit. */
function notenbuchSpalten(k){
  const hj = notenHalbjahr();
  const spalten = S.arbeiten
    .filter(a=>a.kursId===k.id && (!a.datum || imHalbjahr(a.datum, hj)))
    .sort((a,b)=>String(a.datum).localeCompare(String(b.datum)))
    .map(a=>({art:"arbeit", id:a.id, kurz:spaltenKopf(a), titel:a.titel+" · "+esc(a.art)+" · "+fmtDatum(a.datum),
      bereich:bereichNorm(a.bereich||artBereich(a.art)), arbeit:a}));
  spalten.push({art:"tue", kurz:"TÜ", titel:"TÜ-Note aus den besten drei Übungen", bereich:"sonstige"});
  spalten.push({art:"mitarbeit", kurz:"Mit.", titel:"Mitarbeit aus den Stundennoten", bereich:"muendlich"});
  return spalten;
}
/* Der Spaltenkopf muss schmal sein und trotzdem unterscheiden. Die Art sagt,
   worum es geht, das Datum welche - der volle Titel steht im Tooltip. */
const ART_KURZ = {"Klassenarbeit":"KA", "Klausur":"Kl", "LEK":"LEK", "Test":"Test",
  "Referat":"Ref", "Protokoll":"Prot", "Hefter":"Heft"};
function spaltenKopf(a){
  const art = ART_KURZ[a.art] || String(a.art||"").slice(0, 4);
  return art + (a.datum ? " " + fmtDatumKurz(a.datum) : "");
}

function notenBuch(k){
  const schueler = kursSchueler(k.id);
  const sys = notensystem(k);
  if (!schueler.length) return leer("Dieser Kurs hat noch keine Schüler.", "Schüler hinzufügen", "tab", "kurscfg");
  const spalten = notenbuchSpalten(k);

  let html = '<div class="nrollen"><table class="nbuch"><tr><th class="name links">Schüler</th>';
  for (const sp of spalten)
    html += '<th title="'+esc(sp.titel)+'">'+esc(sp.kurz)+'</th>';
  html += '<th>Stand</th></tr>';

  for (const s of schueler){
    const st = notenstand(s.id, k.id);
    html += '<tr><td class="name">'+esc(s.name)+', '+esc(s.vorname)+'</td>';
    for (const sp of spalten){
      if (sp.art === "arbeit"){
        const w = sp.arbeit.ergebnisse[s.id];
        html += '<td'+(w===undefined||w===null||w===""?' class="leer"':'')+
          ' data-a="arbeitEingabe" data-id="'+sp.arbeit.id+'" style="cursor:pointer">'+
          (w===undefined||w===null||w==="" ? '–' : w)+'</td>';
      } else if (sp.art === "tue"){
        const t = tueStand(k, notenHalbjahr(), s.id);
        html += '<td'+(t.wert==null?' class="leer"':'')+'>'+
          (t.wert==null ? '–' : t.wert + (t.vollstaendig ? '' : '<span class="hinweis" title="noch nicht alle drei geschrieben">*</span>'))+'</td>';
      } else {
        const m = mitarbeitHalbjahr(s.id, k.id, notenHalbjahr());
        html += '<td'+(m.wert==null?' class="leer"':'')+'>'+(m.wert==null ? '–' : m.wert)+'</td>';
      }
    }
    html += '<td class="stand">'+(st.gesamt==null ? '<span class="leer">–</span>' : fmtZahl(st.gesamt, 1))+'</td></tr>';
  }
  html += '</table></div>';

  const anteil = 100 - gewSonstige(k);
  html += '<p class="hinweis" style="margin-top:10px">Stand = '+anteil+' Prozent Klassenarbeiten, '+
    gewSonstige(k)+' Prozent sonstige Leistungen'+(sys.typ==="punkte"?' (Punkte 0–15)':' (Noten 1–6)')+
    '. Eine Zelle antippen öffnet die Eingabe der Arbeit. Ein Stern heißt: noch nicht alle drei TÜ geschrieben, die Note zählt erst danach mit.</p>';
  return html;
}

/* ---------- Block 3: die TÜ-Punkte ---------- */

function notenTue(k){
  const hj = notenHalbjahr();
  const schueler = kursSchueler(k.id);
  if (!schueler.length) return leer("Dieser Kurs hat noch keine Schüler.", "Schüler hinzufügen", "tab", "kurscfg");

  let html = '<p class="hinweis" style="margin:0 0 10px">Fünf Übungen zu je zehn Punkten, die besten drei zählen - '+
    'höchstens '+MerkrTue.MAX_GESAMT+' Punkte. TÜ 4 und 5 zählen nur mit Rückkaufrecht: eins streicht die schlechteste, '+
    'zwei streichen die zwei schlechtesten. Das Feld in der Spalte "Rück" durchläuft 0, 1, 2.</p>';

  html += '<div class="nrollen"><table class="nbuch"><tr><th class="name links">Schüler</th>';
  for (let i = 1; i <= MerkrTue.ANZAHL; i++) html += '<th>TÜ '+i+'</th>';
  html += '<th>Rück</th><th>Punkte</th><th>Note</th></tr>';

  for (const s of schueler){
    const punkte = tuePunkteVon(k, hj, s.id);
    const stand = tueStand(k, hj, s.id);
    const rechte = tueRechteVon(k, hj, s.id);
    html += '<tr><td class="name">'+esc(s.name)+', '+esc(s.vorname)+'</td>';
    for (let i = 1; i <= MerkrTue.ANZAHL; i++){
      const w = punkte[i-1];
      const aus = stand.gestrichen.indexOf(i) >= 0 || stand.unzulaessig.indexOf(i) >= 0;
      html += '<td'+(aus?' class="gestrichen"':'')+
        ' title="'+(stand.unzulaessig.indexOf(i)>=0 ? 'ohne Rückkaufrecht geschrieben - zählt nicht'
          : stand.gestrichen.indexOf(i)>=0 ? 'gestrichen' : '')+'">'+
        '<input class="tp" type="number" min="0" max="'+MerkrTue.MAX_JE+'" step="1" '+
        'value="'+(w==null?"":w)+'" data-a-change="tuePunkt" data-id="'+s.id+'" data-nr="'+i+'"></td>';
    }
    html += '<td><button class="klein" data-a="tueRecht" data-id="'+s.id+'"'+
      (rechte ? ' style="background:var(--akzent);color:#fff"' : '')+'>'+rechte+'</button></td>'+
      '<td>'+(stand.zaehlend.length ? stand.summe+' / '+stand.max : '<span class="leer">–</span>')+'</td>'+
      '<td class="stand">'+(stand.wert==null ? '<span class="leer">–</span>'
        : stand.wert + (stand.vollstaendig ? '' : '*'))+'</td></tr>';
  }
  html += '</table></div>'+
    '<p class="hinweis" style="margin-top:10px">Durchgestrichen ist, was nicht zählt. '+
    'Ein Stern heißt Zwischenstand: es sind noch keine drei Übungen geschrieben, '+
    'die Note misst sich solange an dem, was möglich war, und zählt noch nicht in den Stand.</p>';
  return html;
}

/* ---------- Block 4: Was wäre wenn ---------- */

/* Die Frage kommt jedes Halbjahr, von Schülern wie von Eltern: was passiert mit
   der Note, wenn die letzte Arbeit so oder so ausgeht? Sie lässt sich rechnen,
   also soll merkr sie rechnen - und zwar für alle auf einmal, nicht in
   fünfundzwanzig Einzelgesprächen. */

function wennBereich(){ return R.wennBereich || "arbeit"; }
function wennGewicht(){ return R.wennGewicht == null ? 1 : R.wennGewicht; }

document.addEventListener("click", ev=>{
  const b = ev.target.closest('[data-a="wennBereich"]');
  if (b){ R.wennBereich = b.dataset.id; zeichne(); return; }
  const g = ev.target.closest('[data-a="wennGewicht"]');
  if (g){ R.wennGewicht = Number(g.dataset.wert); zeichne(); }
});

function notenWennRechner(k){
  const schueler = kursSchueler(k.id);
  const sys = notensystem(k);
  if (!schueler.length) return leer("Dieser Kurs hat noch keine Schüler.", "Schüler hinzufügen", "tab", "kurscfg");

  const bereich = wennBereich();
  const gewicht = wennGewicht();
  /* Bei Punkten wären sechzehn Spalten zu viel - dort die üblichen Stufen. */
  const kandidaten = sys.typ === "punkte" ? [15, 13, 11, 8, 5, 2, 0] : [1, 2, 3, 4, 5, 6];

  let html = '<div class="zeile" style="margin-bottom:10px">'+
    '<span class="hinweis">Angenommen, es kommt noch dazu:</span>'+
    '<div class="wertknoepfe">'+
    ['arbeit','sonstige','muendlich'].map(b=>
      '<button data-a="wennBereich" data-id="'+b+'"'+
      (bereich===b?' style="background:var(--akzent);color:#fff;border-color:var(--akzent)"':'')+
      '>'+esc(BEREICHE[b].kurz)+'</button>').join('')+
    '</div><span class="hinweis">Gewicht</span><div class="wertknoepfe">'+
    [1,2,3].map(g=>'<button data-a="wennGewicht" data-wert="'+g+'"'+
      (gewicht===g?' style="background:var(--akzent);color:#fff;border-color:var(--akzent)"':'')+
      '>'+g+'</button>').join('')+
    '</div></div>';

  html += '<div class="nrollen"><table class="nbuch">'+
    '<tr><th class="name links"></th><th></th>'+
    '<th colspan="'+kandidaten.length+'" style="border-bottom:none;padding-bottom:0">'+
    (sys.typ==="punkte" ? "angenommene Punkte" : "angenommene Note")+'</th></tr>'+
    '<tr><th class="name links">Schüler</th><th>jetzt</th>';
  for (const w of kandidaten) html += '<th>'+w+'</th>';
  html += '</tr>';

  for (const s of schueler){
    const alle = schuelerNoten(s.id, k.id);
    const jetzt = notenstandAus(alle, k).gesamt;
    html += '<tr><td class="name">'+esc(s.name)+', '+esc(s.vorname)+'</td>'+
      '<td class="stand">'+(jetzt==null ? '<span class="leer">–</span>' : fmtZahl(jetzt,1))+'</td>';
    for (const w of kandidaten){
      const neu = notenstandAus(alle.concat([{wert:w, bereich:bereich, gewicht:gewicht, label:"angenommen"}]), k).gesamt;
      const rund = neu==null ? null : MerkrMitarbeit.runden(neu, sys.typ);
      const schlechter = jetzt!=null && neu!=null &&
        (sys.typ==="punkte" ? neu < jetzt - 0.001 : neu > jetzt + 0.001);
      html += '<td'+(neu==null?' class="leer"':'')+' title="'+(neu==null?'':fmtZahl(neu,2))+'">'+
        (neu==null ? '–' : '<b'+(schlechter?' style="color:var(--sm1)"':'')+'>'+rund+'</b>'+
          '<div class="hinweis" style="font-size:11px">'+fmtZahl(neu,1)+'</div>')+'</td>';
    }
    html += '</tr>';
  }
  html += '</table></div>'+
    '<p class="hinweis" style="margin-top:10px">Fett die Note, die dabei herauskäme, darunter der genaue Stand. '+
    'Gerundet wird zugunsten des Schülers. Die Zeile "jetzt" ist der Stand ohne die angenommene Leistung.</p>';
  return html;
}

/* ---------- Der Reiter selbst ---------- */

viewArbeiten = function(k){
  const hj = notenHalbjahr();
  const sys = notensystem(k);
  const schueler = kursSchueler(k.id);

  let html = '<div class="zeile raum" style="margin-bottom:12px">'+
    '<div><h2 style="margin:0">Noten '+esc(k.name)+'</h2>'+
    '<div class="hinweis">'+schueler.length+' Schüler · '+(sys.typ==="punkte"?"0 bis 15 Punkte":"Noten 1 bis 6")+'</div></div>'+
    '<div class="wertknoepfe">'+
    [1,2].map(nr=>'<button data-a="notenHj" data-hj="'+nr+'"'+
      (hj===nr?' style="background:var(--akzent);color:#fff;border-color:var(--akzent)"':'')+
      '>'+nr+'. Halbjahr</button>').join('')+
    '</div></div>';

  /* Was noch aussteht, gehört über die Tabelle: eine nicht abgeschlossene
     Stunde fehlt in jeder Zahl darunter. */
  const offen = S.stunden.filter(st=>st.kursId===k.id && !st.ausfall && imHalbjahr(st.datum, hj) &&
    st.datum <= todayISO() && !st.mitarbeitBestaetigt);
  if (offen.length)
    html += '<p class="hinweis" style="margin:-4px 0 10px">'+offen.length+
      (offen.length===1 ? ' gehaltene Stunde ist noch nicht abgeschlossen' : ' gehaltene Stunden sind noch nicht abgeschlossen')+
      ' - zuletzt '+fmtDatum(offen[offen.length-1].datum)+'. '+
      '<button class="klein" data-a="stundenTag" data-datum="'+offen[offen.length-1].datum+'">Dorthin</button></p>';

  html += '<div class="karte" style="padding:14px 16px">'+notenTabelle(k)+'</div>';

  html += notenBlock("wenn", "Was wäre, wenn",

    ()=>notenWennRechner(k));

  html += notenBlock("arbeiten", "Arbeiten und Tests",
