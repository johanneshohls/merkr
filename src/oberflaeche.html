zeichne();

/* ================= Was von der Stunde übrig blieb =================
   planr plant den Verlauf, merkr hält fest was war - deshalb standen Ziel und
   Phasen bisher nur drüben. Am Stundenende fehlt aber genau das: welche der
   vorgesehenen Schritte man geschafft hat. Die Antwort darauf ist keine zweite
   Planung, sondern eine Beobachtung, und sie gehört dorthin, wo man nach der
   Stunde ohnehin steht.

   Abgehakt wird im selben Dialog wie die Mitarbeit. Was offen bleibt, geht mit
   dem Zielstand an planr: alles erledigt heißt "ja", nichts "nein", dazwischen
   "teilweise", und die offenen Schritte stehen im Klartext in der Reflexion.
   Ein eigenes Feld je Phase hat planr nicht - dafür wäre drüben ein Schema zu
   ändern, und ein Satz Reflexion beantwortet die Frage beim Planen genauso. */

function stundenPhasen(st){
  return Array.isArray(st && st.phasen) ? st.phasen.filter(x=>x && x.schluessel) : [];
}
function erledigteVon(st){
  return Array.isArray(st && st.erledigt) ? st.erledigt : [];
}

function phasenBlockHtml(st){
  const phasen = stundenPhasen(st);
  const ziel = String(st.ziel||"").trim();

  const fertig = erledigteVon(st);
  let h = '<div class="phasenblock" data-stunde="'+st.id+'" '+
    'style="border:1px solid var(--linie);border-radius:12px;padding:10px 12px;margin:10px 0">';

  if (ziel)
    h += '<div style="margin-bottom:'+(phasen.length?'8px':'0')+'">'+
      '<div class="hinweis" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em">Stundenziel</div>'+
      esc(ziel)+'</div>';

  if (phasen.length){
    h += '<div class="hinweis" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">'+
      'Geschafft?</div>';
    for (const p of phasen){
      const an = fertig.indexOf(p.schluessel) >= 0;
      h += '<label style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-weight:400">'+
        '<input type="checkbox" class="phaseBox" value="'+esc(p.schluessel)+'" '+(an?'checked':'')+
        ' style="width:auto;margin-top:3px">'+
        '<span><b style="font-weight:700">'+esc(p.name||"Phase")+'</b>'+
        (p.dauer ? ' <span class="hinweis">'+p.dauer+' min</span>' : '')+
        (p.inhalt ? '<div class="hinweis" style="font-size:12px">'+esc(p.inhalt)+'</div>' : '')+
        '</span></label>';
    }
    const z = MerkrRueckmeldung.zielstand(phasen, fertig);
    h += '<div class="hinweis" style="font-size:12px;margin-top:4px" id="phasenStand">'+
      (st.zielGemeldet
        ? 'zuletzt gemeldet: '+esc(st.zielGemeldet)
        : (z.zielErreicht==="ja" ? 'alles geschafft'
          : z.offen.length ? 'offen: '+esc(z.offen.join(", "))
          : 'noch nichts abgehakt'))+
      '</div>';
  }
  /* Was sonst auffiel. Die Haken sagen, was geschafft wurde; sie sagen nicht,
     dass die Klasse bei den Sachaufgaben abgerissen ist. Dieser Satz geht als
     Reflexion an planr und kommt beim Planen der nächsten Stunde ungefragt
     zurück (vorstunde.reflexion) - vorher wurde er geschrieben und nie
     gelesen. */
  h += '<div style="margin-top:'+(phasen.length||ziel?'10px':'0')+';padding-top:'+(phasen.length||ziel?'8px':'0')+';'+
    (phasen.length||ziel ? 'border-top:1px solid var(--linie)' : '')+'">'+
    '<div class="hinweis" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">'+
    'Wie lief die Stunde?</div>'+
    '<textarea class="beobachtung" rows="2" '+
    'placeholder="z. B. bei den Sachaufgaben abgerissen - Text in Gleichung ist der Knackpunkt">'+
    esc(String(st.beobachtung||""))+'</textarea>'+
    '<div class="hinweis" style="font-size:12px;margin-top:4px">'+
    'Geht an planr und steht beim Planen der nächsten Stunde oben.</div></div>';

  return h + '</div>';
}

/* Der Satz wird beim Tippen behalten, wie die Haken - der Dialog baut sich bei
   jeder Note neu auf. */
document.addEventListener("input", function(ev){
  const feld = ev.target.closest(".beobachtung");
  if (!feld) return;
  const block = feld.closest(".phasenblock");
  const st = block ? stundeVon(block.dataset.stunde) : null;
  if (!st) return;
  st.beobachtung = feld.value;
  speichern();
});

/* Jeder Haken wird sofort behalten. Das ist wichtiger als es aussieht: der
   Dialog baut sich bei jedem Tipp auf eine Note neu auf, und ein Haken, der
   dabei verschwindet, wird kein zweites Mal gesetzt. */
document.addEventListener("change", ev=>{
  const box = ev.target.closest(".phaseBox");
  if (!box) return;
  const block = box.closest(".phasenblock");
  const st = block ? stundeVon(block.dataset.stunde) : null;
  if (!st) return;
  st.erledigt = Array.from(block.querySelectorAll(".phaseBox"))
    .filter(b=>b.checked).map(b=>b.value);
  speichern();
  const stand = block.querySelector("#phasenStand");
  if (stand){
    const z = MerkrRueckmeldung.zielstand(stundenPhasen(st), st.erledigt);
    stand.textContent = z.zielErreicht==="ja" ? "alles geschafft"
      : z.offen.length ? "offen: "+z.offen.join(", ") : "noch nichts abgehakt";
  }
});

const abschlussOhnePhasen = stundeAbschliessenDialog;
stundeAbschliessenDialog = function(k, st){
  abschlussOhnePhasen(k, st);
  const block = phasenBlockHtml(st);
  if (!block) return;
  /* Der Block gehört zwischen die Einleitung und die Namen: erst die Stunde,
     dann die Kinder. */
  const modal = document.getElementById("modal");
  const kopf = modal.firstElementChild;
  if (!kopf) return;
  kopf.insertAdjacentHTML("afterend", block);
};

/* Beim Bestätigen geht der Zielstand mit an planr. */
document.addEventListener("click", ev=>{
  const el = ev.target.closest('[data-a="abschlussSpeichern"]');
  if (!el) return;
  const st = stundeVon(el.dataset.id);
  const k = st ? kursVon(st.kursId) : null;
  if (!st || !k) return;

  const phasen = stundenPhasen(st);
  const z = MerkrRueckmeldung.zielstand(phasen, erledigteVon(st));

  /* Erst merken, dann senden - wie bei den gewackelten Themen: der Haken soll
     auch stehen, wenn das iPad gerade kein Netz hat. */
  if (z.zielErreicht){
    st.zielGemeldet = z.zielErreicht + (z.offen.length ? " ("+z.offen.join(", ")+")" : "");
    speichern();
  }

  if (!planrGekoppelt()) return;
  /* Beobachtung und offene Phasen gehen als eine Notiz hinaus - drüben ist es
     ein Feld, und zwei Sätze davor zu trennen hieße, eines zu verlieren. Die
     Beobachtung steht vorn: sie ist das, was ein Mensch aufgeschrieben hat. */
  const notiz = [String(st.beobachtung||"").trim(), z.notiz].filter(Boolean).join(" · ");
  const brief = MerkrRueckmeldung.brief(k, st, Array.isArray(st.gewackelt) ? st.gewackelt : [],
    {zielErreicht: z.zielErreicht, notiz: notiz});
  if (brief) sendeAnBridge({typ:"planrRueckmeldung", url: planrBasis(), brief: brief});
});

/* Im Stundendialog steht der Verlauf ebenfalls - dort wird nachgetragen, wenn
   man am Stundenende nicht dazu kam. */
const wackelBlockOhnePhasen = wackelBlockHtml;
wackelBlockHtml = function(st){
  return phasenBlockHtml(st) + wackelBlockOhnePhasen(st);
};

zeichne();

/* ================= Vier Handgriffe an der Bedienung =================
   1. Die Stundenliste beginnt bei dem, was ansteht - nicht beim Juni.
   2. Der Reiter Schüler wandert nach hinten: er wird selten gebraucht.
   3. Und er verliert die Tageszeile, denn ein Schüler gehört keinem Datum.
   4. Die TÜ-Spalten lassen sich zuklappen, es bleibt die Punktzahl. */

/* ---------- 1. Stunden: was ansteht, steht oben ---------- */

/* "Gehalten" heißt: vorbei und dokumentiert - ein Thema steht drin oder sie ist
   als Ausfall vermerkt. Eine vergangene Stunde ohne Thema ist nicht erledigt,
   sondern nachzutragen; sie bleibt deshalb oben stehen, wo man sie sieht. */
function stundeGehalten(st){
  if (!st) return false;
  if (st.datum >= todayISO()) return false;
  return !!st.ausfall || !!String(st.thema||"").trim();
}

function stundenZeileHtml(st){
  const fehl = S.anwesenheit.filter(a=>a.stundeId===st.id && a.status==="fehlt").length;
  const wt = wochentagName(new Date(st.datum+"T12:00:00").getDay());
  const heute = st.datum === todayISO();
  return '<tr'+(heute?' style="background:var(--akzent-hell)"':'')+'>'+
    '<td style="white-space:nowrap">'+(heute?'<b>':'')+wt+', '+fmtDatum(st.datum)+(heute?'</b>':'')+
    (st.ausfall?' <span style="color:var(--rot)">(Ausfall)</span>':'')+'</td>'+
    '<td class="hinweis">'+esc(st.geplant||"–")+'</td>'+
    '<td>'+esc(st.thema||"–")+'</td><td>'+esc(st.hausaufgabe||"–")+'</td>'+
    '<td>'+(fehl||"–")+'</td>'+
    '<td><button class="klein" data-a="stundeBearbeiten" data-id="'+st.id+'">Bearbeiten</button></td></tr>';
}
function stundenTabelleHtml(liste){
  /* Sechs Spalten passen auf dem Handy nicht nebeneinander - schiebbar statt
     abgeschnitten, wie im Notenbuch. */
  let html = '<div class="nrollen"><table class="tab" style="min-width:560px">'+
    '<tr><th>Datum</th><th>Geplant (Soll)</th><th>Thema (Ist)</th>'+
    '<th>Hausaufgabe</th><th>Fehlend</th><th></th></tr>';
  for (const st of liste) html += stundenZeileHtml(st);
  return html + '</table></div>';
}

viewStunden = function(k){
  const alle = S.stunden.filter(x=>x.kursId===k.id);
  let html = '<div class="zeile raum" style="margin-bottom:12px"><h2>Stundendokumentation & Planung</h2>'+
    '<button class="primar klein" data-a="stundeNeuDialog">+ Stunde</button></div>';
  if (!alle.length)
    return html + leer("Noch keine Stunde erfasst. Die geplanten Themen holt merkr aus planr, sobald dort eine Verbindung steht.",
      "Stoffverteilung holen", "planrJetzt");

  const gehalten = alle.filter(stundeGehalten).sort((a,b)=>b.datum.localeCompare(a.datum));
  const offen = alle.filter(x=>!stundeGehalten(x)).sort((a,b)=>a.datum.localeCompare(b.datum));
  const nachzutragen = offen.filter(x=>x.datum < todayISO()).length;

  if (offen.length){
    html += '<div class="karte">'+stundenTabelleHtml(offen)+
      (nachzutragen
        ? '<p class="hinweis" style="margin:10px 0 0">'+nachzutragen+
          (nachzutragen===1 ? ' Stunde liegt zurück und hat noch kein Thema' : ' Stunden liegen zurück und haben noch kein Thema')+
          ' - sie bleiben hier stehen, bis etwas drinsteht.</p>'
        : '')+
      '</div>';
  }

  if (gehalten.length){
    const auf = !!R.stundenAuf;
    html += '<div class="nblock"><div class="nkopf" data-a="stundenKlappen">'+
      '<span class="npfeil">'+(auf?'▾':'▸')+'</span>'+
      '<h2>Gehalten</h2>'+
      '<span class="nsub">'+gehalten.length+(gehalten.length===1?' Stunde':' Stunden')+
      ', zuletzt '+fmtDatum(gehalten[0].datum)+'</span></div>'+
      (auf ? '<div class="ninhalt">'+stundenTabelleHtml(gehalten)+'</div>' : '')+'</div>';
  }
  return html;
};

document.addEventListener("click", ev=>{
  if (!ev.target.closest('[data-a="stundenKlappen"]')) return;
  R.stundenAuf = !R.stundenAuf;
  zeichne();
});

/* ---------- 2. Der Reiter Schüler wandert nach hinten ---------- */

(function schuelerNachHinten(){
  const i = LEISTE_KURS.findIndex(e=>e.id==="schueler");
  if (i < 0) return;
  const [eintrag] = LEISTE_KURS.splice(i, 1);
  LEISTE_KURS.splice(Math.min(i + 3, LEISTE_KURS.length), 0, eintrag);
})();

/* ---------- 3. Der Reiter Schüler kennt kein Datum ---------- */

/* Die Tageszeile stand dort mit Blätterer und Stundenknöpfen, obwohl in der
   Liste nichts vom Tag abhängt: Namen, Kürzel und Notenstand sind dieselben,
   egal welcher Dienstag eingestellt ist. */
const kursOhneListenkopf = viewKurs;
viewKurs = function(){
  const k = kursVon(R.kursId);
  if (!k || R.tab !== "liste") return kursOhneListenkopf();
  const kopfAus = kursKopfzeile;
  kursKopfzeile = function(){ return ""; };
  try { return kursOhneListenkopf(); }
  finally { kursKopfzeile = kopfAus; }
};

/* ================= Der Reiter Regie (27.08.2026) =================
   Was während der Stunde am Lehrertisch liegen muss, steht in planr: mitzubringendes
   Material, in welcher Reihenfolge die Klasse drankommt, woran nach zwanzig Minuten
   zu denken ist. Geschrieben wird das beim Planen, gebraucht wird es im Unterricht -
   und dort liegt nicht der Laptop, sondern das iPad.

   Der Reiter liest nur. Wer hier etwas ändern wollte, hätte zwei Planungen an zwei
   Orten, und die zweite wäre die, die niemand wiederfindet. Über der Regie stehen
   Thema und Ziel der Stunde, darunter der geplante Verlauf zum Mitlesen - abgehakt
   wird er am Stundenende im Abschluss-Dialog, nicht hier. */

/* Die Hausaufgabe am Lehrertisch: was heute fällig war, was heute aufgegeben
   ist. Beides aus dem selbr-Stand, nur Zahlen - die Namen stehen im
   Stundendialog. Ohne Aufgabe an diesem Tag keine Karte. */
function regieHausaufgabeHtml(k, st){
  if (!planrGekoppelt()) return "";
  const stand = S.hausaufgabenStand;
  if (!stand || !Array.isArray(stand.kurse)) return "";
  const kursStand = MerkrHausaufgaben.kursStandVon(stand, k);
  const faellig = MerkrHausaufgaben.fuerStunde(kursStand, st.datum, kursSchueler(k.id));
  const gestellt = MerkrHausaufgaben.gestellteFuerStunde(kursStand, st.datum);
  if (!faellig.length && !gestellt.length) return "";

  let html = '<div class="karte"><h2 style="font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:0 0 8px">Hausaufgabe</h2>';
  for (const h of faellig){
    const gesamt = h.erledigt.length + h.offen.length;
    html += '<p style="margin:0 0 6px"><b>Fällig heute:</b> '+esc(h.titel)+
      ' <span class="hinweis">· '+h.erledigt.length+' von '+gesamt+' fertig ('+h.ziel+' Aufgaben)</span></p>';
  }
  for (const g of gestellt){
    html += '<p style="margin:0 0 6px"><b>Aufgegeben:</b> '+esc(g.titel)+
      ' <span class="hinweis">· '+g.ziel+' Aufgaben in selbr, bis '+esc(fmtDatum(g.faelligAm))+
      (g.hinweis ? ' · '+esc(g.hinweis) : '')+'</span></p>';
  }
  html += '<p class="hinweis" style="margin:0">Wer was hat, steht im Stundendialog. Stand '+
    fmtStandAlter(stand.geholtAm)+' <button class="klein" data-a="planrJetzt">neu holen</button></p></div>';
  return html;
}

/* Die Lösungen zur TÜ der Stunde: die erste Phase heißt "TÜ + Vergleichen",
   und dafür müssen die Lösungen am Pult liegen, nicht in drillr auf einem
   zweiten Gerät. Sie kommen als Klartext aus planr (dort aus drillr geholt);
   ohne TÜ an der Stunde keine Karte. */
function regieTueLoesungenHtml(st){
  const l = st && st.tuLoesungen;
  if (!l || !Array.isArray(l.aufgaben) || !l.aufgaben.length) return "";
  let html = '<div class="karte"><h2 style="font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:0 0 8px">TÜ-Lösungen</h2>'+
    '<div class="hinweis" style="margin-bottom:8px">'+esc(l.name || "TÜ")+'</div>'+
    '<table class="tab">';
  for (const a of l.aufgaben){
    html += '<tr><td style="width:28px;white-space:nowrap;vertical-align:top"><b>'+esc(String(a.nr))+')</b></td>'+
      '<td style="vertical-align:top">'+
        (a.aufgabe ? '<div class="hinweis" style="white-space:pre-wrap;margin-bottom:2px">'+esc(a.aufgabe)+'</div>' : '')+
        '<div style="white-space:pre-wrap;font-weight:600">'+esc(a.loesung || "–")+'</div>'+
      '</td></tr>';
  }
  html += '</table></div>';
  return html;
}

function viewRegie(k){
  const st = S.stunden.find(x=>x.kursId===k.id && x.datum===R.datum);
  if (!st)
    return tagKopf(k) + leer("An diesem Tag hat der Kurs keine Stunde.", null);

  const thema = String(st.thema || st.geplant || "").trim();
  const ziel = String(st.ziel || "").trim();
  const regie = String(st.regie || "").trim();
  const phasen = Array.isArray(st.phasen) ? st.phasen : [];

  let html = tagKopf(k);

  if (st.ausfall) html += '<div class="karte"><b style="color:var(--rot)">Diese Stunde ist ausgefallen.</b></div>';

  html += '<div class="karte">'+
    '<div class="hinweis">'+(st.reihe ? esc(st.reihe)+' · ' : '')+esc(fmtDatum(st.datum))+'</div>'+
    '<h2 style="margin:2px 0 0">'+esc(thema || "Ohne Thema")+'</h2>'+
    (ziel ? '<p style="margin:8px 0 0">'+esc(ziel)+'</p>' : '')+
    '</div>';

  if (regie){
    html += '<div class="karte"><h2 style="font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:0 0 8px">Regie</h2>'+
      '<div style="white-space:pre-wrap;line-height:1.5">'+esc(regie)+'</div></div>';
  } else {
    html += '<div class="karte"><h2 style="font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:0 0 8px">Regie</h2>'+
      '<p class="hinweis" style="margin:0">Für diese Stunde steht in planr keine Regie. Geschrieben wird sie dort im Feld Regie; hier steht sie, sobald die Stoffverteilung wieder geholt wurde.</p>'+
      '<div class="abstand"></div><button class="klein" data-a="planrJetzt">Stoffverteilung holen</button></div>';
  }

  html += regieTueLoesungenHtml(st);
  html += regieHausaufgabeHtml(k, st);

  if (phasen.length){
    html += '<div class="karte"><h2 style="font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:0 0 8px">Verlauf</h2>'+
      '<table class="tab">';
    for (const ph of phasen)
      html += '<tr><td style="width:64px;white-space:nowrap"><b>'+esc(ph.name || "")+'</b></td>'+
        '<td>'+esc(ph.inhalt || "")+'</td>'+
        '<td style="width:66px;white-space:nowrap;text-align:right;color:var(--text2)">'+(ph.dauer ? esc(ph.dauer)+' min' : '')+'</td></tr>';
    html += '</table></div>';
  }

  return html;
}

/* ---------- 4. Die TÜ-Spalten lassen sich zuklappen ---------- */

function tueZu(){ return R.tueZu === true; }
document.addEventListener("click", ev=>{
  if (!ev.target.closest('[data-a="tueKlappen"]')) return;
  R.tueZu = !tueZu();
  zeichne();
});

const tabelleOhneTueKlappen = notenTabelle;
notenTabelle = function(k){
  /* Aufgeklappt: dieselbe Tabelle wie bisher, nur trägt der Gruppenkopf jetzt
     den Griff zum Zuklappen. */
  if (!tueZu())
    return tabelleOhneTueKlappen(k).replace(
      '<th colspan="'+(MerkrTue.ANZAHL+2)+'">TÜ</th>',
      '<th colspan="'+(MerkrTue.ANZAHL+2)+'" data-a="tueKlappen" style="cursor:pointer" '+
      'title="TÜ-Spalten zuklappen">▾ TÜ</th>');

  /* Zugeklappt bleibt eine Spalte: wie viele Punkte stehen, von wie vielen
     möglichen. Alles Weitere - welche Übung gestrichen ist, welche Note daraus
     wird - steht einen Klick entfernt. */
  const hj = notenHalbjahr();
  const sys = notensystem(k);
  const schueler = kursSchueler(k.id);
  if (!schueler.length) return tabelleOhneTueKlappen(k);

  const arbeiten = S.arbeiten
    .filter(a=>a.kursId===k.id && (!a.datum || imHalbjahr(a.datum, hj)))
    .sort((a,b)=>String(a.datum).localeCompare(String(b.datum)));

  let html = '<div class="nrollen"><table class="nbuch">';
  html += '<tr class="ngruppe"><th class="name links"></th>'+
    (arbeiten.length ? '<th colspan="'+arbeiten.length+'">Arbeiten und Tests</th>' : '')+
    '<th data-a="tueKlappen" style="cursor:pointer" title="TÜ-Spalten aufklappen">▸ TÜ</th>'+
    '<th></th><th></th></tr>';

  html += '<tr><th class="name links">Schüler</th>';
  for (const a of arbeiten)
    html += '<th title="'+esc(a.titel+" · "+a.art+" · "+fmtDatum(a.datum))+'">'+esc(spaltenKopf(a))+'</th>';
  html += '<th data-a="tueKlappen" style="cursor:pointer" title="Punkte aus den besten drei Übungen">Punkte</th>'+
    '<th title="Mitarbeit: Mittel der abgeschlossenen Stunden">Mit.</th><th>Stand</th></tr>';

  for (const s of schueler){
    const tue = tueStand(k, hj, s.id);
    const m = mitarbeitHalbjahr(s.id, k.id, hj);
    const stand = notenstand(s.id, k.id);

    html += '<tr><td class="name">'+esc(s.name)+', '+esc(s.vorname)+'</td>';
    for (const a of arbeiten){
      const w = a.ergebnisse[s.id];
      const leerZelle = w===undefined || w===null || w==="";
      html += '<td'+(leerZelle?' class="leer"':'')+' data-a="arbeitEingabe" data-id="'+a.id+'" '+
        'style="cursor:pointer" title="'+esc(a.titel)+'">'+(leerZelle ? '–' : w)+'</td>';
    }
    html += '<td data-a="tueKlappen" style="cursor:pointer" title="'+
      (tue.wert==null ? 'noch nichts geschrieben' : 'Note '+tue.wert+(tue.vollstaendig?'':' (Zwischenstand)'))+'">'+
      (tue.zaehlend.length ? tue.summe+' / '+MerkrTue.MAX_GESAMT : '<span class="leer">–</span>')+'</td>';
    html += '<td data-a="mitarbeitAuf" data-id="'+s.id+'" style="cursor:pointer" title="'+
      (m.anzahl ? m.anzahl+' Stunden, Mittel '+fmtZahl(m.mittel,2) : 'noch keine abgeschlossene Stunde')+'">'+
      (m.wert==null ? '<span class="leer">–</span>' : m.wert)+'</td>';
    html += '<td class="stand">'+(stand.gesamt==null ? '<span class="leer">–</span>' : fmtZahl(stand.gesamt,1))+
      '</td></tr>';
  }
  html += '</table></div>';

  const anteil = 100 - gewSonstige(k);
  html += '<p class="hinweis" style="margin-top:10px">Stand = '+anteil+' Prozent Klassenarbeiten, '+
    gewSonstige(k)+' Prozent sonstige Leistungen'+(sys.typ==="punkte"?' (Punkte 0–15)':' (Noten 1–6)')+
    ', nur aus diesem Halbjahr. Die TÜ stehen zugeklappt als Punktzahl - '+
    '<button class="klein" data-a="tueKlappen">wieder aufklappen</button></p>';
  return html;
};

zeichne();

/* ================= Die Auswertung wird aufgelöst =================
   Sie führte vier Dinge, von denen zwei nur noch doppelten: eine zweite
   Notentabelle neben dem Notenbuch und darin eine Spalte "Vorschlag mdl.", die
   noch nach dem alten Modell aus den Notizen rechnete - während daneben die
   Mitarbeit aus den bestätigten Stundennoten stand. Zwei mündliche Zahlen aus
   zwei Modellen nebeneinander, ohne dass die Tabelle sagte, welche gilt.

   Die drei Teile, die etwas wert sind, ziehen dorthin, wo ihr Inhalt steht:
   der Verlauf der Arbeiten ins Profil (dort ist er die Antwort auf "hat er sich
   gefangen?"), die Beteiligungslücke neben die Mitarbeitsnote, und jedes PDF an
   den Ort, den es abbildet - die Notenliste zum Notenbuch, die Stundendoku zu
   den Stunden. Der Reiter selbst entfällt. */

/* ---------- 1. Der Verlauf der Arbeiten steht im Profil ---------- */

/* Zwei Linien: die eigenen Ergebnisse und das Klassenmittel. Die eigene Linie
   allein sagt wenig - eine Drei in einer Arbeit, in der die Klasse bei 4,2
   stand, ist etwas anderes als eine Drei bei 2,1. */
function schuelerVerlaufSvg(reihen, sys){
  const sk = skala(sys), B = 640, H = 200, L = 40, unten = 150;
  const n = reihen.length;
  /* Innenabstand an beiden Seiten: sonst klebt der erste Punkt samt Zahl auf der
     Achsenbeschriftung und der letzte Titel läuft aus dem Bild. */
  const rand = 46;
  const x = i => L + rand + (n===1 ? (B-L-2*rand)/2 : i*(B-L-2*rand-10)/(n-1));
  const y = v => 20 + (sys.typ==="punkte" ? (sk.max-v)/(sk.max-sk.min) : (v-sk.min)/(sk.max-sk.min))*(unten-30);

  let s = '<svg viewBox="0 0 '+B+' '+H+'" style="width:100%;max-width:640px;display:block">';
  for (const t of sk.ticks)
    s += '<line x1="'+L+'" y1="'+y(t)+'" x2="'+(B-24)+'" y2="'+y(t)+'" stroke="var(--linie)" stroke-width="0.5"/>'+
      '<text x="'+(L-8)+'" y="'+(y(t)+4)+'" font-size="11" fill="currentColor" text-anchor="end">'+t+'</text>';

  let pfadK = "", pfadS = "";
  reihen.forEach((e,i)=>{
    pfadK += (i?"L":"M")+x(i).toFixed(1)+" "+y(e.mittel).toFixed(1)+" ";
    pfadS += (i?"L":"M")+x(i).toFixed(1)+" "+y(e.wert).toFixed(1)+" ";
  });
  s += '<path d="'+pfadK+'" fill="none" stroke="var(--linie)" stroke-width="2" stroke-dasharray="5 4"/>';
  s += '<path d="'+pfadS+'" fill="none" stroke="var(--akzent)" stroke-width="2.5"/>';

  reihen.forEach((e,i)=>{
    s += '<circle cx="'+x(i)+'" cy="'+y(e.mittel)+'" r="3.5" fill="var(--linie)"/>'+
      '<circle cx="'+x(i)+'" cy="'+y(e.wert)+'" r="5.5" fill="var(--akzent)"/>'+
      '<text x="'+x(i)+'" y="'+(y(e.wert)-11)+'" font-size="12" font-weight="700" fill="currentColor" '+
      'text-anchor="middle">'+fmtZahl(e.wert,1)+'</text>'+
      '<text x="'+x(i)+'" y="'+(unten+18)+'" font-size="10" fill="currentColor" text-anchor="middle">'+
      esc(String(e.titel).slice(0,16))+'</text>'+
      '<text x="'+x(i)+'" y="'+(unten+31)+'" font-size="9" fill="currentColor" text-anchor="middle" opacity=".7">'+
      fmtDatumKurz(e.datum)+'</text>';
  });
  return s + '</svg>';
}

/** Die Arbeiten dieses Kurses, an denen der Schüler teilgenommen hat. */
function schuelerArbeitsreihe(s, k){
  const reihen = [];
  for (const a of S.arbeiten.filter(x=>x.kursId===k.id).sort((x,y)=>String(x.datum).localeCompare(String(y.datum)))){
    const w = a.ergebnisse[s.id];
    if (w===undefined || w===null || w==="") continue;
    const stat = arbeitStatistik(a, k);
    if (!stat.n) continue;
    reihen.push({titel:a.titel, datum:a.datum, wert:Number(w), mittel:stat.mittel, art:a.art});
  }
  return reihen;
}

const profilOhneArbeitsverlauf = viewProfil;
viewProfil = function(){
  const html = profilOhneArbeitsverlauf();
  const s = schuelerVon(R.schuelerId), k = kursVon(R.kursId);
  if (!s || !k) return html;

  const reihen = schuelerArbeitsreihe(s, k);
  if (reihen.length < 2) return html;

  const sys = notensystem(k);
  const erste = reihen[0], letzte = reihen[reihen.length-1];
  const besser = sys.typ==="punkte" ? letzte.wert - erste.wert : erste.wert - letzte.wert;
  const abstand = reihen.reduce((sum,e)=>sum + (sys.typ==="punkte" ? e.wert-e.mittel : e.mittel-e.wert), 0) / reihen.length;

  const karte = '<div class="karte"><div class="zeile raum">'+
    '<div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Arbeiten im Verlauf</div>'+
    '<div class="hinweis">'+(Math.abs(besser) < 0.15 ? "gleichbleibend"
      : besser > 0 ? "um "+fmtZahl(Math.abs(besser),1)+" verbessert"
                   : "um "+fmtZahl(Math.abs(besser),1)+" abgefallen")+'</div></div>'+
    '<div style="margin:12px 0 2px;color:var(--text2)">'+schuelerVerlaufSvg(reihen, sys)+'</div>'+
    '<p class="hinweis" style="margin:2px 0 0">Kräftig die eigenen Ergebnisse, gestrichelt das Klassenmittel. '+
    (Math.abs(abstand) < 0.1 ? 'Liegt im Schnitt auf dem Klassenmittel.'
      : abstand > 0 ? 'Liegt im Schnitt '+fmtZahl(Math.abs(abstand),1)+' über dem Klassenmittel.'
                    : 'Liegt im Schnitt '+fmtZahl(Math.abs(abstand),1)+' unter dem Klassenmittel.')+'</p></div>';

  /* Hinter den Verlauf der Mitarbeit, vor die Kategorien: erst die Bewegung,
     dann die Einzelteile. */
  const marke = '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Mitarbeit nach Kategorie</div>';
  return html.includes(marke) ? html.replace(marke, karte + marke) : html + karte;
};

/* ---------- 2. Die Beteiligungslücke steht bei den Noten ---------- */

const notenOhneBeteiligung = viewArbeiten;
viewArbeiten = function(k){
  const html = notenOhneBeteiligung(k);
  const block = notenBlock("beteiligung", "Wer war lange nicht dran",
    "die Lücke, die keine Note zeigt", ()=>viewMuendlich(k));
  /* Vor "Was wäre, wenn": beides sind Fragen an den Kurs, aber diese stellt
     sich mitten im Halbjahr, jene am Ende. */
  const marke = '<div class="nblock"><div class="nkopf" data-a="notenKlappen" data-id="wenn">';
  return html.includes(marke) ? html.replace(marke, block + marke) : html + block;
};

/* ---------- 3. Jedes PDF an den Ort, den es abbildet ---------- */

const notenOhnePdf = viewArbeiten;
viewArbeiten = function(k){
  const html = notenOhnePdf(k);
  const marke = '</div></div>';   // Ende der Kopfzeile mit dem Halbjahres-Umschalter
  const stelle = html.indexOf(marke);
  if (stelle < 0) return html;
  const knopf = '<button class="klein" data-a="notenlistePdf">Notenliste als PDF</button>';
  return html.slice(0, stelle) + '</div>' + knopf + '</div>' + html.slice(stelle + marke.length);
};

const stundenOhnePdf = viewStunden;
viewStunden = function(k){
  const html = stundenOhnePdf(k);
  const marke = '<button class="primar klein" data-a="stundeNeuDialog">+ Stunde</button>';
  const knopf = '<button class="klein" data-a="stundenlistePdf">Doku als PDF</button>';
  return html.includes(marke) ? html.replace(marke, knopf + marke) : html;
};

/* ---------- 4. Der Reiter selbst ----------
   Er steht nicht mehr in LEISTE_KURS; die Funktionen dahinter sind mit ihm
   gegangen. Eine Umleitung braucht es nicht: R lebt nur zur Laufzeit, gespeichert
   wird allein S - ein alter Reiterzustand kann also nicht zurückkommen. */

zeichne();
