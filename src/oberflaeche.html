<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>merkr</title>
<style>
/*__SCHRIFT__*/
:root{
  /* Pflaume auf Papier. Eigene Marke im lehrr-Verbund: selbr hat Smaragd,
     planr Indigo, drillr Blau, prüfr Amber, checkr Rot. */
  --akzent:#6b3f6e; --akzent-hell:#f4ecf5; --bg:#efe6f0; --karte:#ffffff;
  --text:#3b1f3e; --text2:#6f5872; --linie:#e4d7e5; --rot:#c02f2f;
  /* Die fünf Stufen sind die einzige Stelle, an der Farbe etwas bedeutet.
     Deshalb hält sich der Rest der Oberfläche zurück. */
  --s2:#12715a; --s1:#64a35e; --s0:#d8a417; --sm1:#cf7a2e; --sm2:#8e3b3b;
  --radius:16px; --schatten:0 1px 3px rgba(59,31,62,.07);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Nunito',-apple-system,"Avenir Next","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
input,textarea,select{ -webkit-user-select:text; user-select:text; font-family:inherit; font-size:16px;
  border:1px solid var(--linie); border-radius:8px; padding:9px 10px; background:#fff; color:var(--text); max-width:100%;}
textarea{width:100%; min-height:90px;}
button{font-family:inherit; font-size:16px; border:none; border-radius:10px; padding:10px 14px;
  background:var(--akzent-hell); color:var(--akzent); cursor:pointer; min-height:44px;}
button.primar{background:var(--akzent); color:#fff;}
button.gefahr{background:#fdecea; color:var(--rot);}
button.klein{min-height:34px; padding:5px 10px; font-size:14px; border-radius:8px;}
h1{font-size:22px;margin:0;} h2{font-size:19px;margin:0 0 10px;} h3{font-size:16px;margin:0 0 8px;}
.hinweis{color:var(--text2); font-size:14px;}

#topbar{position:sticky; top:0; z-index:40; background:var(--bg); display:flex; align-items:center;
  gap:10px; padding:12px 16px; border-bottom:1px solid var(--linie);}
#topbar .titel{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#topbar .wochenbadge{background:var(--akzent); color:#fff; border-radius:8px; padding:3px 9px; font-size:14px; font-weight:600;}
#app{padding:16px; max-width:1100px; margin:0 auto;}

/* Seitenleiste nach dem Entwurf: 92 px, Marke oben, sechs Ziele als Kacheln.
   Sie liegt fest am Rand, statt die Seitenstruktur umzubauen - topbar und app
   rücken einfach nach. */
#seitenleiste{position:fixed; left:0; top:0; bottom:0; width:92px; background:#f2e9f3;
  display:flex; flex-direction:column; align-items:stretch; padding:14px 8px; gap:4px; z-index:50;}
#seitenleiste .marke{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0 12px;}
#seitenleiste .marke b{font-size:17px; font-weight:900; letter-spacing:-.3px; color:var(--akzent);}
#seitenleiste .marke span{font-size:10px; font-weight:700; color:#96809a;}
#seitenleiste button{display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 2px 9px;
  border-radius:16px; background:transparent; color:var(--akzent); min-height:auto; font-size:11px; font-weight:800; line-height:1;}
#seitenleiste button.aktiv{background:var(--akzent); color:#fff;}
#seitenleiste button.aus{opacity:.35;}
#seitenleiste button svg{display:block;}
body.mitleiste #topbar{padding-left:108px;}
body.mitleiste #app{padding-left:108px;}

/* Schmal: die Leiste legt sich unten quer. Auf einem iPhone oder im geteilten
   Bildschirm bleiben 92 px am Rand sonst der halbe Platz. */
@media (max-width:700px){
  #seitenleiste{top:auto; right:0; width:auto; height:auto; flex-direction:row; justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom)); border-top:1px solid var(--linie);}
  #seitenleiste .marke{display:none;}
  #seitenleiste button{flex:1; border-radius:12px; padding:8px 2px 6px;}
  body.mitleiste #topbar, body.mitleiste #app{padding-left:16px;}
  body.mitleiste #app{padding-bottom:86px;}
}
#testbanner{background:#fff3cd; color:#7a5c00; padding:8px 16px; font-size:14px; text-align:center;}

.karte{background:var(--karte); border-radius:var(--radius); box-shadow:var(--schatten); padding:16px; margin-bottom:14px;}
.zeile{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.zeile.raum{justify-content:space-between;}
.feld{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
.feld label{font-size:13px; color:var(--text2);}

.kurskachel{display:flex; align-items:center; gap:12px; padding:14px; border-radius:var(--radius);
  background:var(--karte); box-shadow:var(--schatten); margin-bottom:10px; cursor:pointer;}
.kursfarbe{width:16px; height:44px; border-radius:6px; flex-shrink:0;}
.kurskachel .info{flex:1;} .kurskachel .info .sub{font-size:13px; color:var(--text2);}

.tabs{display:flex; gap:6px; margin:0 0 14px; overflow-x:auto; padding-bottom:2px;}
.tabs button{white-space:nowrap; background:#fff; color:var(--text2); border:1px solid var(--linie);}
.tabs button.aktiv{background:var(--akzent); color:#fff; border-color:var(--akzent);}

/* Sitzplan */
#sitzflaeche{position:relative; background:
  repeating-linear-gradient(0deg,transparent,transparent 27px,#eef1ec 27px,#eef1ec 28px),
  repeating-linear-gradient(90deg,transparent,transparent 27px,#eef1ec 27px,#eef1ec 28px),
  #fbfcfa;
  border:1px solid var(--linie); border-radius:var(--radius); height:600px; overflow:hidden; touch-action:none;}
.stile{position:absolute; width:112px; min-height:72px; border-radius:14px; background:var(--karte);
  box-shadow:0 1px 3px rgba(59,31,62,.09); border:1px solid var(--linie); padding:9px 10px 8px;
  cursor:pointer; touch-action:none;}
.stile .sname{font-size:14px; font-weight:800; line-height:1.15; pointer-events:none; color:var(--text);}
.stile .sname span{display:block; font-weight:600; color:var(--text2);}
/* Vier Felder, eine je Kategorie: Qualität und Menge, mündlich und schriftlich.
   Ein leeres Feld heißt "heute noch nichts" - man sieht auf einen Blick, wo
   eine Notiz fehlt, und nicht nur, was zuletzt passiert ist. */
.stile .spunkte{display:flex; gap:4px; margin-top:7px; pointer-events:none;}
.stile .spunkte i{width:22px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;font-style:normal;color:#fff;background:var(--akzent-hell);}
.stile .spunkte i.ohne{color:var(--linie);}
.stufenlegende{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:12px;font-size:12px;color:var(--text2);}
.stufenlegende b{display:inline-flex;width:22px;height:20px;border-radius:6px;align-items:center;justify-content:center;
  font-size:10px;color:#fff;margin-right:5px;vertical-align:-5px;}
.stile.fehlt{opacity:.45; border-top-color:var(--rot);}
.stile.fehlt::after{content:"fehlt"; position:absolute; top:4px; right:6px; font-size:11px; color:var(--rot); font-weight:700;}

/* Schülerliste */
.slzeile{display:flex; align-items:center; gap:10px; padding:10px 12px; background:#fff;
  border-radius:10px; margin-bottom:6px; box-shadow:var(--schatten); cursor:pointer;}
.slzeile .sname{flex:1; font-weight:600;}
.slzeile .spunkte{display:flex; gap:3px;} .slzeile .spunkte i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.slzeile.fehlt{opacity:.5;} .slzeile.fehlt .sname::after{content:"  – fehlt"; color:var(--rot); font-weight:400; font-size:14px;}

/* Popover / Modal */
#overlay{position:fixed; inset:0; background:rgba(20,30,18,.35); z-index:60; display:none;}
#overlay.offen{display:block;}
#popover{position:fixed; z-index:70; background:#fff; border-radius:16px; box-shadow:0 6px 30px rgba(0,0,0,.25);
  width:400px; max-width:calc(100vw - 24px); max-height:82vh; overflow-y:auto; padding:16px; display:none;}
#popover.offen{display:block;}
.pkopf{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.pkopf .pname{font-size:18px; font-weight:700;}
.katzeile{display:flex; align-items:center; gap:8px; margin-bottom:8px; width:100%;}
.katzeile .katlabel{width:112px; font-size:13px; color:var(--text2); line-height:1.2;}
.stufen{display:flex; gap:6px; flex:1;}
.stufe{flex:1; height:44px; border-radius:9px; border:none; color:#fff; font-weight:700; font-size:15px; cursor:pointer; min-height:44px; padding:0;}
.chipreihe{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
.chip{background:var(--akzent-hell); color:var(--akzent); border-radius:20px; padding:9px 14px; font-size:14px; border:none; min-height:40px;}
.chip.aktivrot{background:#fdecea; color:var(--rot);}

.modalbox{position:fixed; z-index:70; left:50%; top:50%; transform:translate(-50%,-50%);
  background:#fff; border-radius:16px; box-shadow:0 6px 30px rgba(0,0,0,.25);
  width:560px; max-width:calc(100vw - 24px); max-height:86vh; overflow-y:auto; padding:20px; display:none;}
.modalbox.offen{display:block;}

/* Tabellen */
table.tab{width:100%; border-collapse:collapse; font-size:15px;}
table.tab th{color:var(--text2); font-size:13px; text-align:left; font-weight:600; padding:6px 8px; border-bottom:1px solid var(--linie);}
table.tab td{padding:8px; border-bottom:1px solid var(--linie); vertical-align:middle;}
table.tab tr:last-child td{border-bottom:none;}
.stufenpunkt{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:middle;}

/* Noteneingabe */
.wertknoepfe{display:flex; gap:5px; flex-wrap:wrap;}
.wertknoepfe button{min-width:44px; min-height:40px; padding:4px 6px; background:#fff; border:1px solid var(--linie); color:var(--text); border-radius:8px;}
.wertknoepfe button.gewaehlt{background:var(--akzent); color:#fff; border-color:var(--akzent);}

/* Statistik */
.statzeile{display:flex; gap:18px; flex-wrap:wrap; margin:10px 0;}
.statwert{background:var(--akzent-hell); border-radius:10px; padding:8px 14px;}
.statwert .gross{font-size:22px; font-weight:700; color:var(--akzent);}
.statwert .klein2{font-size:12px; color:var(--text2);}
svg text{font-family:inherit;}

#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:80;
  background:#22301f; color:#fff; border-radius:12px; padding:12px 16px; display:none; align-items:center; gap:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.3); max-width:90vw;}
#toast.offen{display:flex;}
#toast button{background:transparent; color:#9fd6ac; font-weight:700; padding:4px 8px; min-height:auto;}
.leer{color:var(--text2); text-align:center; padding:30px 10px; font-size:15px;}
.abstand{height:8px;}
.gewslider{display:flex; align-items:center; gap:10px;}
.gewslider input[type=range]{flex:1;}
.fehlstatus button{margin-right:6px;}

/* ==== Design „Tafel" (dunkel) – von Herrn Leußner gewählt ==== */
/* Das dunkle Thema ist am 19.08.2026 entfallen. merkr wird im hellen
   Klassenzimmer benutzt, oft mit Sonne auf dem Bildschirm - dort gewinnt
   dunkle Schrift auf hellem Grund. Die Palette oben ist die einzige. */

<script>
/* Früher Fehlerfänger: zeigt Startfehler sichtbar an, statt weiß zu bleiben */
window.__KB_startFehlerText = "";
window.onerror = function(msg, quelle, zeile){
  try{
    window.__KB_startFehlerText = msg + " (Zeile " + zeile + ")";
    var d = document.getElementById("fehleranzeige");
    if (!d){
      d = document.createElement("div");
      d.id = "fehleranzeige";
      d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#7a1f1f;color:#fff;padding:12px 16px;font:14px -apple-system,sans-serif;";
      (document.body || document.documentElement).appendChild(d);
    }
    d.textContent = "merkr-Startfehler: " + window.__KB_startFehlerText;
    var la = document.getElementById("ladeanzeige");
    if (la) la.innerHTML = "<b>merkr konnte nicht starten.</b><br><br>" +
      String(window.__KB_startFehlerText).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  }catch(e){}
};
window.__KB_startOk = false;
</script>

<b>merkr startet …</b><br><br>Bleibt dieser Text stehen, bricht das Skript ab.
</div>

<script>
"use strict";
/* ============ Injektion durch Scriptable ============ */
/*__KERN__*/
const KB_MODE = /*__KURSBUCH_MODE__*/"standalone";
/* Ob im Keychain ein API-Schlüssel liegt. Der Schlüssel selbst kommt nie in die
   Seite: er lag früher in S.einstellungen.apiKey und wanderte damit in jeden
   unverschlüsselten Export - zusammen mit den Schülerdaten. */
/* Ob ein planr-Wort im Schlüsselbund liegt. */
let planrDa = /*__KURSBUCH_PLANR__*/false;
/* Ob ein checkr-Wort im Schlüsselbund liegt. */
let checkrDa = /*__KURSBUCH_CHECKR__*/false;
/* Rückfall für den Browser, der keinen Keychain hat: nur im Arbeitsspeicher, nie gespeichert. */
let browserSchluessel = "";
const KB_INJECTED = /*__KURSBUCH_DATA__*/null;
/* ============ Konstanten ============ */
const MITARBEIT_KATEGORIEN = [
  {id:"qual_m",  name:"Qualität mündliche Beteiligung",  kurz:"Qual. mündl."},
  {id:"quant_m", name:"Quantität mündliche Beteiligung", kurz:"Quant. mündl."},
  {id:"qual_s",  name:"Qualität schriftl. Ergebnisse (Arbeitsphasen)",  kurz:"Qual. schriftl."},
  {id:"quant_s", name:"Quantität schriftl. Ergebnisse (Arbeitsphasen)", kurz:"Quant. schriftl."}
];
/* Die fünf Stufen. Ihre Farben sind die einzigen, die in merkr etwas bedeuten -
   deshalb stehen sie hier und im CSS unter denselben Werten. Das kräftige Rot
   bleibt für "Lücke" reserviert, "sehr schwach" trägt ein gedecktes Dunkelrot. */
const STUFEN = [
  {v: 2, label:"++",   farbe:"var(--s2)",  hex:"#12715a"},
  {v: 1, label:"+",    farbe:"var(--s1)",  hex:"#64a35e"},
  {v: 0, label:"o",    farbe:"var(--s0)",  hex:"#d8a417"},
  {v:-1, label:"−",    farbe:"var(--sm1)", hex:"#cf7a2e"},
  {v:-2, label:"−−",   farbe:"var(--sm2)", hex:"#8e3b3b"}
];
const EINFACH_EREIGNISSE = [
  {id:"ha_vergessen", name:"Hausaufgaben vergessen", symbol:"HA"},
  {id:"material",     name:"Material vergessen",     symbol:"M"},
  {id:"stoerung",     name:"Störung",                symbol:"!"},
  {id:"positiv",      name:"Positives Sozialverhalten", symbol:"☺"}
];
const KURSFARBEN = ["#3d7a4e","#3465a4","#a04578","#b3831a","#7d4fa0","#20807d","#b04a30","#5a6b3b"];
const ARBEIT_ARTEN = [
  {name:"Klassenarbeit", bereich:"arbeit"},
  {name:"Klausur",       bereich:"arbeit"},
  {name:"LEK",           bereich:"sonstige"},
  {name:"Test",          bereich:"sonstige"},
  {name:"Referat",       bereich:"sonstige"},
  {name:"Protokoll",     bereich:"sonstige"},
  {name:"Hefter",        bereich:"sonstige"}
];
/* Leistungsbewertung nach LBVO/APVO MV: zwei Bereiche –
   Klassenarbeiten/Klausuren einerseits, sonstige Leistungen andererseits.
   Zu den sonstigen Leistungen gehoeren die muendliche Note, LEKs, Referate usw. */
const BEREICHE = {
  arbeit:    {kurz:"Klassenarb.", lang:"Klassenarbeit / Klausur"},
  muendlich: {kurz:"mündlich",    lang:"mündliche Note"},
  sonstige:  {kurz:"sonstige",    lang:"sonstige Leistung"}
};
function artBereich(artName){
  const a = ARBEIT_ARTEN.find(x=>x.name===artName);
  return a ? a.bereich : "arbeit";
}
function bereichNorm(b){
  if (b==="schriftlich") return "arbeit";           /* Altdaten */
  return (b==="muendlich" || b==="sonstige" || b==="arbeit") ? b : "arbeit";
}
function bereichKurz(b){ return BEREICHE[bereichNorm(b)].kurz; }
/* Gewicht 0 = Zwischenstand: wird notiert, zaehlt aber nicht in die Note. */
function gew(x){ return (x==null || x==="") ? 1 : Number(x); }
function gewText(x){ return gew(x)===0 ? "Zwischenstand" : String(gew(x)); }
function bereichLang(b){ return BEREICHE[bereichNorm(b)].lang; }
function gewSonstige(k){ return k.gewichtSonstige==null ? (k.gewichtMuendlich==null?50:k.gewichtMuendlich) : k.gewichtSonstige; }
function gewMdlAnteil(k){ return k.gewichtMuendlichAnteil==null ? 50 : Math.round(Number(k.gewichtMuendlichAnteil)); }
/* Zwei Wege, die muendliche Note innerhalb der sonstigen Leistungen zu wichten:
   "gewicht" – sie zaehlt wie jede andere sonstige Leistung, gesteuert ueber ihr Gewicht
   "anteil"  – sie bekommt einen festen Prozentsatz der sonstigen Leistungen */
function mdlModus(k){ return k && k.mdlModus==="anteil" ? "anteil" : "gewicht"; }
function gewichtungsText(k){
  const ws = gewSonstige(k);
  return "Klassenarbeiten "+(100-ws)+" % · sonstige Leistungen "+ws+" % — "+
    (mdlModus(k)==="anteil"
      ? "mündliche Note fest "+gewMdlAnteil(k)+" % der sonstigen"
      : "mündliche Note zählt als eine sonstige Leistung (über ihr Gewicht)");
}

/* ============ Hilfsfunktionen ============ */
/**
 * Ein leerer Zustand: was fehlt, und der Weg dorthin.
 *
 * Vorher gab es für dieselbe Lage drei Formulierungen und keinen Knopf -
 * "Dieser Kurs hat noch keine Schüler", "Keine Schüler im Kurs" und einen
 * Verweis auf einen Tab, den man selbst suchen musste.
 */
function leer(satz, knopf, aktion, id){
  return '<div class="leer">'+satz+
    (knopf ? '<div class="abstand"></div><button class="primar" data-a="'+aktion+'"'+(id?' data-id="'+id+'"':'')+'>'+knopf+'</button>' : '')+
    '</div>';
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
let uidZaehler = 0;
function uid(){ uidZaehler++; return Date.now().toString(36)+"-"+uidZaehler+"-"+Math.floor(Math.random()*1e6).toString(36); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDatum(iso){ if(!iso) return "–"; const [j,m,t]=iso.split("-"); return t+"."+m+"."+j; }
function fmtDatumKurz(iso){ if(!iso) return "–"; const [j,m,t]=iso.split("-"); return t+"."+m+"."; }
function fmtZahl(x, stellen){ if(x==null||isNaN(x)) return "–"; return x.toFixed(stellen==null?1:stellen).replace(".", ","); }
function stufeInfo(v){ return STUFEN.find(s=>s.v===v) || STUFEN[2]; }
function wochentagName(d){ return ["So","Mo","Di","Mi","Do","Fr","Sa"][d]; }

/* ============ Zustand ============ */
function leererZustand(){
  return {
    version: 1,
    einstellungen: { aktivesSchuljahrId: null, eigeneEreignisse: [], letztesBackup: null },
    schuljahre: [], kurse: [], schueler: [], stunden: [], ereignisse: [], noten: [], arbeiten: [], anwesenheit: []
  };
}
function migriereBereiche(){
  for (const k of S.kurse){
    if (k.gewichtSonstige == null) k.gewichtSonstige = (k.gewichtMuendlich==null?50:k.gewichtMuendlich);
    if (k.gewichtMuendlichAnteil == null) k.gewichtMuendlichAnteil = 50;
    if (k.mdlModus !== "anteil" && k.mdlModus !== "gewicht") k.mdlModus = "gewicht";
  }
  for (const n of S.noten) n.bereich = bereichNorm(n.bereich);
  for (const a of S.arbeiten) if (!a.bereich) a.bereich = artBereich(a.art);
}
let S = leererZustand();
if (KB_INJECTED && typeof KB_INJECTED === "object") {
  S = Object.assign(leererZustand(), KB_INJECTED);
  S.einstellungen = Object.assign(leererZustand().einstellungen, KB_INJECTED.einstellungen||{});
}
/* Altdatenreparatur: fehlende Felder ergaenzen, bevor gezeichnet wird.
   Jede kuenftige Feldaenderung MUSS hier mit Vorbelegung ergaenzt werden. */
(function reparieren(){
  var leer = leererZustand();
  for (var f in leer) if (Array.isArray(leer[f]) && !Array.isArray(S[f])) S[f] = [];
  if (!S.einstellungen || typeof S.einstellungen !== "object") S.einstellungen = leer.einstellungen;
  if (!Array.isArray(S.einstellungen.eigeneEreignisse)) S.einstellungen.eigeneEreignisse = [];

  S.schueler.forEach(function(x){
    if (!x || typeof x !== "object") return;

function aktivesSchuljahr(){ return S.schuljahre.find(x=>x.id===S.einstellungen.aktivesSchuljahrId) || S.schuljahre[0] || null; }
function kursVon(id){ return S.kurse.find(k=>k.id===id); }
function schuelerVon(id){ return S.schueler.find(x=>x.id===id); }
function kursSchueler(kursId){
  return S.schueler.filter(x=>x.kursIds.includes(kursId))
    .sort((a,b)=> (a.name+a.vorname).localeCompare(b.name+b.vorname,"de"));
}
function notensystem(kurs){
  if (kurs.jahrgang >= 11) return {typ:"punkte", werte:Array.from({length:16},(_,i)=>15-i), einheit:"Punkte", best:15, schlechtest:0};
  return {typ:"noten", werte:[1,2,3,4,5,6], einheit:"Note", best:1, schlechtest:6};
}
function mondayOf(iso){
  const d = new Date(iso+"T12:00:00");
  const tag = (d.getDay()+6)%7; d.setDate(d.getDate()-tag);
  return d;
}
function wochenBuchstabe(sj, iso){
  if (!sj || !sj.aWocheAnker) return null;
  const a = mondayOf(sj.aWocheAnker), b = mondayOf(iso);
  const diff = Math.round((b-a)/(7*24*3600*1000));
  return ((diff % 2)+2) % 2 === 0 ? "A" : "B";
}
function ensureStunde(kursId, iso){
  let st = S.stunden.find(x=>x.kursId===kursId && x.datum===iso);
  if(!st){ st = {id:uid(), kursId, datum:iso, thema:"", hausaufgabe:"", geplant:"", ausfall:false}; S.stunden.push(st); speichern(); }
  return st;
}

function addEreignis(schuelerId, kursId, typ, stufe, text){

}

function setzeAnwesenheit(schuelerId, stundeId, status, minuten){

/* Notenberechnung */
function schuelerNoten(schuelerId, kursId){
  const einzel = S.noten.filter(n=>n.schuelerId===schuelerId && n.kursId===kursId);
  const arbeitsNoten = [];
  for (const a of S.arbeiten.filter(a=>a.kursId===kursId)){
    const w = a.ergebnisse[schuelerId];
    if (w!==undefined && w!==null && w!=="")
      arbeitsNoten.push({wert:Number(w), bereich:bereichNorm(a.bereich||artBereich(a.art)), label:a.titel, gewicht:gew(a.gewicht), datum:a.datum, ausArbeit:true});
  }
  return einzel.map(n=>({wert:Number(n.wert), bereich:bereichNorm(n.bereich), label:n.label||"", gewicht:gew(n.gewicht), datum:n.datum, id:n.id})).concat(arbeitsNoten);
}
function gewMittel(liste){
  let sum=0, g=0;
  for (const n of liste){ sum += n.wert*gew(n.gewicht); g += gew(n.gewicht); }
  return g>0 ? sum/g : null;
}
function mischen(a, b, gewichtA){
  if (a!=null && b!=null) return (a*gewichtA + b*(100-gewichtA))/100;
  return a!=null ? a : (b!=null ? b : null);
}
/* Zwei Bereiche: Klassenarbeiten (arb) und sonstige Leistungen (son).
   Die sonstigen setzen sich aus der muendlichen Note (m) und den
   weiteren sonstigen Leistungen (wso) zusammen. */
function notenstandAus(alle, kurs){
  const arb = gewMittel(alle.filter(n=>bereichNorm(n.bereich)==="arbeit"));
  const m   = gewMittel(alle.filter(n=>bereichNorm(n.bereich)==="muendlich"));
  const wso = gewMittel(alle.filter(n=>bereichNorm(n.bereich)==="sonstige"));
  const son = mdlModus(kurs)==="anteil"
    ? mischen(m, wso, gewMdlAnteil(kurs))
    : gewMittel(alle.filter(n=>{ const b = bereichNorm(n.bereich); return b==="muendlich" || b==="sonstige"; }));
  const gesamt = mischen(son, arb, gewSonstige(kurs));
  return {arb, m, wso, son, s:arb, gesamt, anzahl: alle.length};
}
function notenstand(schuelerId, kursId){
  return notenstandAus(schuelerNoten(schuelerId, kursId), kursVon(kursId));
}

/* Statistik einer Arbeit */
function median(sortiert){
  const n = sortiert.length; if(!n) return null;
  return n%2 ? sortiert[(n-1)/2] : (sortiert[n/2-1]+sortiert[n/2])/2;
}
function arbeitStatistik(arbeit, kurs){
  const werte = Object.values(arbeit.ergebnisse).filter(w=>w!==null && w!=="" && w!==undefined).map(Number).sort((a,b)=>a-b);
  const n = werte.length;
  if (!n) return {n:0};
  const mw = werte.reduce((a,b)=>a+b,0)/n;
  const med = median(werte);
  const untere = werte.slice(0, Math.floor(n/2));
  const obere  = werte.slice(Math.ceil(n/2));
  let q1 = median(untere), q3 = median(obere);
  if (q1==null) q1 = med;  // bei n=1 fallen Quartile mit dem Median zusammen
  if (q3==null) q3 = med;
  const sys = notensystem(kurs);
  const dist = {};
  for (const w of sys.werte) dist[w]=0;
  for (const w of werte) dist[w] = (dist[w]||0)+1;
  return {n, mittel:mw, median:med, q1, q3, min:werte[0], max:werte[n-1], dist, werte};
}

/* Mitarbeit zusammenfassen */
function mitarbeitZusammenfassung(schuelerId, kursId){
  const erg = {};
  for (const kat of MITARBEIT_KATEGORIEN){
    const evs = S.ereignisse.filter(e=>e.schuelerId===schuelerId && e.kursId===kursId && e.typ===kat.id);
    const counts = {}; for (const s of STUFEN) counts[s.v]=0;
    let sum=0;
    for (const e of evs){ counts[e.stufe]=(counts[e.stufe]||0)+1; sum+=e.stufe; }
    erg[kat.id] = {anzahl:evs.length, schnitt: evs.length? sum/evs.length : null, counts};
  }
  return erg;
}
function fehlzeiten(schuelerId, kursId){
  const liste = S.anwesenheit.filter(a=>a.schuelerId===schuelerId).map(a=>({a, st:stundeVon(a.stundeId)}))
    .filter(x=>x.st && (!kursId || x.st.kursId===kursId))
    .sort((x,y)=> (y.st.datum||"").localeCompare(x.st.datum||""));
  const fehl = liste.filter(x=>x.a.status==="fehlt");
  return {
    liste,
    fehltGesamt: fehl.length,
    unentschuldigt: fehl.filter(x=>x.a.entschuldigt===false).length,
    offen: fehl.filter(x=>x.a.entschuldigt===null).length,
    verspaetungen: liste.filter(x=>x.a.status==="verspaetet").length,
    minuten: liste.filter(x=>x.a.status==="verspaetet").reduce((s,x)=>s+(x.a.minuten||0),0)
  };
}
function heutigeEreignisse(schuelerId, kursId){
  const st = S.stunden.find(x=>x.kursId===kursId && x.datum===R.datum);
  if (!st) return [];
  return S.ereignisse.filter(e=>e.schuelerId===schuelerId && e.stundeId===st.id);

/* ============ Drag & Drop im Sitzplan ============ */
function initSitzplanDrag(){
  const flaeche = document.getElementById("sitzflaeche");
  if (!flaeche) return;
  let aktiv=null, startX=0, startY=0, ox=0, oy=0, bewegt=false;
  flaeche.addEventListener("pointerdown", ev=>{
    const kachel = ev.target.closest(".stile"); if(!kachel) return;
    aktiv = kachel; bewegt = false;
    startX = ev.clientX; startY = ev.clientY;
    ox = kachel.offsetLeft; oy = kachel.offsetTop;
    try { kachel.setPointerCapture(ev.pointerId); } catch(e) { /* synthetische Ereignisse */ }
  });
  flaeche.addEventListener("pointermove", ev=>{
    if (!aktiv) return;
    const dx = ev.clientX-startX, dy = ev.clientY-startY;
    if (!bewegt && Math.hypot(dx,dy) < 8) return;
    bewegt = true;
    const RAS = 28;
    let nx = Math.round((ox+dx)/RAS)*RAS, ny = Math.round((oy+dy)/RAS)*RAS;
    nx = Math.max(0, Math.min(nx, flaeche.clientWidth - aktiv.offsetWidth));
    ny = Math.max(0, Math.min(ny, flaeche.clientHeight - aktiv.offsetHeight));
    aktiv.style.left = nx+"px"; aktiv.style.top = ny+"px";
  });
  flaeche.addEventListener("pointerup", ev=>{
    if (!aktiv) return;
    const kachel = aktiv; aktiv = null;
    if (bewegt){
      const s = schuelerVon(kachel.dataset.sid);
      if (s){ if(!s.sitz) s.sitz={}; s.sitz[R.kursId] = {x:kachel.offsetLeft, y:kachel.offsetTop}; speichern(); }
    } else {
      oeffnePopupSchueler(kachel.dataset.sid, kachel.getBoundingClientRect());
    }
  });
  flaeche.addEventListener("pointercancel", ()=>{ aktiv=null; });
}

function zeigePopover(html, ankerRect){
  const pop = document.getElementById("popover");
  pop.innerHTML = html;
  document.getElementById("overlay").classList.add("offen");
  pop.classList.add("offen");
  let x = 20, y = 80;
  if (ankerRect){
    x = Math.min(Math.max(10, ankerRect.left), window.innerWidth - 420);
    y = ankerRect.bottom + 8;
    if (y + Math.min(pop.offsetHeight, window.innerHeight*0.82) > window.innerHeight - 10)
      y = Math.max(10, window.innerHeight - pop.offsetHeight - 16);
  } else { x = (window.innerWidth - pop.offsetWidth)/2; }
  pop.style.left = Math.max(10,x)+"px"; pop.style.top = Math.max(10,y)+"px";
}
function schliessePopover(){
  document.getElementById("popover").classList.remove("offen");
  document.getElementById("modal").classList.remove("offen");

}

function toast(text, undoFn){

  document.getElementById("toasttext").textContent = text;

}

/* ============ Diagramme (SVG) ============ */
function skala(sys){
  return sys.typ==="punkte" ? {min:0, max:15, ticks:[0,3,6,9,12,15]} : {min:1, max:6, ticks:[1,2,3,4,5,6]};
}
function svgBoxplot(stat, sys){
  const sk = skala(sys), B=640, H=110, L=40, Rr=20;
  const x = v => L + (v-sk.min)/(sk.max-sk.min)*(B-L-Rr);
  const yM = 44;
  let s = '<svg viewBox="0 0 '+B+' '+H+'" style="width:100%;max-width:640px;display:block">';
  s += '<line x1="'+L+'" y1="86" x2="'+(B-Rr)+'" y2="86" stroke="#c8d0c5"/>';
  for (const t of sk.ticks)
    s += '<line x1="'+x(t)+'" y1="82" x2="'+x(t)+'" y2="90" stroke="#c8d0c5"/>'+
         '<text x="'+x(t)+'" y="104" font-size="12" fill="#6b7a68" text-anchor="middle">'+t+'</text>';
  s += '<line x1="'+x(stat.min)+'" y1="'+yM+'" x2="'+x(stat.q1)+'" y2="'+yM+'" stroke="#3d7a4e" stroke-width="2"/>';
  s += '<line x1="'+x(stat.q3)+'" y1="'+yM+'" x2="'+x(stat.max)+'" y2="'+yM+'" stroke="#3d7a4e" stroke-width="2"/>';
  s += '<line x1="'+x(stat.min)+'" y1="'+(yM-12)+'" x2="'+x(stat.min)+'" y2="'+(yM+12)+'" stroke="#3d7a4e" stroke-width="2"/>';
  s += '<line x1="'+x(stat.max)+'" y1="'+(yM-12)+'" x2="'+x(stat.max)+'" y2="'+(yM+12)+'" stroke="#3d7a4e" stroke-width="2"/>';
  const bx = Math.min(x(stat.q1), x(stat.q3)), bw = Math.max(2, Math.abs(x(stat.q3)-x(stat.q1)));
  s += '<rect x="'+bx+'" y="'+(yM-20)+'" width="'+bw+'" height="40" fill="#e8f2ea" stroke="#3d7a4e" stroke-width="2" rx="4"/>';
  s += '<line x1="'+x(stat.median)+'" y1="'+(yM-20)+'" x2="'+x(stat.median)+'" y2="'+(yM+20)+'" stroke="#1b5e20" stroke-width="3"/>';
  s += '<circle cx="'+x(stat.mittel)+'" cy="'+yM+'" r="5" fill="#f57c00"/>'+
       '<text x="'+x(stat.mittel)+'" y="'+(yM-26)+'" font-size="12" fill="#f57c00" text-anchor="middle">Mittelwert</text>';
  return s + '</svg>';
}
function svgVerteilung(stat, sys){
  const sk = skala(sys);
  const werte = sys.werte.slice().sort((a,b)=>a-b);
  const maxN = Math.max(1, ...Object.values(stat.dist));
  const B=640, H=150, L=40, unten=124;
  const bw = (B-L-20)/werte.length;
  let s = '<svg viewBox="0 0 '+B+' '+H+'" style="width:100%;max-width:640px;display:block;margin-top:6px">';
  s += '<line x1="'+L+'" y1="'+unten+'" x2="'+(B-14)+'" y2="'+unten+'" stroke="#c8d0c5"/>';
  werte.forEach((w,i)=>{
    const n = stat.dist[w]||0;
    const h = n/maxN*88;
    const xx = L + i*bw + bw*0.15;
    if (n) s += '<rect x="'+xx+'" y="'+(unten-h)+'" width="'+(bw*0.7)+'" height="'+h+'" fill="#3d7a4e" rx="3"/>'+
      '<text x="'+(xx+bw*0.35)+'" y="'+(unten-h-5)+'" font-size="12" fill="#3d7a4e" text-anchor="middle">'+n+'</text>';
    s += '<text x="'+(xx+bw*0.35)+'" y="'+(unten+16)+'" font-size="12" fill="#6b7a68" text-anchor="middle">'+w+'</text>';
  });
  return s + '<text x="'+L+'" y="14" font-size="12" fill="#6b7a68">Verteilung ('+(sys.typ==="punkte"?"Punkte":"Noten")+')</text></svg>';
}

  const fz = fehlzeiten(s.id, k.id);
  const evs = S.ereignisse.filter(e=>e.schuelerId===s.id && e.kursId===k.id)

  let html = '<div class="karte"><div class="zeile raum"><h2>'+esc(k.name)+'</h2>'+

    '<div class="statwert"><div class="gross">'+fmtZahl(ns.gesamt)+'</div><div class="klein2">Stand gesamt</div></div>'+
    '<div class="statwert"><div class="gross">'+fmtZahl(ns.arb)+'</div><div class="klein2">Klassenarbeiten</div></div>'+

      const n = z.counts[stu.v]||0;
      balken += '<span style="display:inline-flex;align-items:center;margin-right:8px">'+
        '<span class="stufenpunkt" style="background:'+stu.hex+'"></span>&nbsp;'+n+'</span>';
    }

    html += '<tr><td style="min-width:140px">'+esc(kat.kurz)+'</td><td>'+balken+'</td>'+

      (z.schnitt==null?"–":("Ø "+fmtZahl(z.schnitt,1)))+'</td></tr>';

  html += '</table></div>';

  html += '<div class="karte"><h3>Noten & Arbeiten</h3>';
  if (!noten.length) html += '<p class="hinweis">Noch keine Noten.</p>';
  else {
    html += '<table class="tab"><tr><th>Datum</th><th>Art</th><th>Bereich</th><th>Wert</th><th>Gewicht</th><th></th></tr>';
    for (const n of noten)

        '<td>'+bereichKurz(n.bereich)+'</td><td><b>'+n.wert+'</b></td><td>'+gewText(n.gewicht)+'</td>'+
        '<td>'+(n.id?'<button class="klein gefahr" data-a="noteLoeschen" data-id="'+n.id+'">×</button>':'<span class="hinweis">aus Arbeit</span>')+'</td></tr>';
    html += '</table>';
  }
  html += '</div>';

  html += '<div class="karte"><h3>Fehlzeiten</h3>'+
    '<p>'+fz.fehltGesamt+'× gefehlt ('+fz.unentschuldigt+' unentschuldigt, '+fz.offen+' offen) · '+
    fz.verspaetungen+'× verspätet ('+fz.minuten+' Min.)</p>';
  if (fz.liste.length){
    html += '<table class="tab"><tr><th>Datum</th><th>Status</th><th>Entschuldigt?</th></tr>';
    for (const x of fz.liste.slice(0,25)){
      html += '<tr><td>'+fmtDatum(x.st.datum)+'</td><td>'+

          '<button class="klein" style="'+(x.a.entschuldigt===false?'background:var(--rot);color:#fff':'')+'" data-a="entschuldigen" data-id="'+x.a.id+'" data-wert="false">unentsch.</button>';
      else html += "–";
      html += '</td></tr>';
    }
    html += '</table>';
  }
  html += '</div>';

  html += '<div class="karte"><h3>Ereignisse (mit Datum und Stundenthema)</h3>';
  if (!evs.length) html += '<p class="hinweis">Noch keine Ereignisse.</p>';
  else {
    html += '<table class="tab"><tr><th>Datum</th><th>Thema der Stunde</th><th>Ereignis</th><th>Stufe</th></tr>';

        '<td style="white-space:nowrap">'+stufe+'</td></tr>';

    html += '</table>';
  }
  html += '</div>';
  if (s.notizen) html += '<div class="karte"><h3>Notizen zum Schüler</h3><p>'+esc(s.notizen)+'</p></div>';
  return html;
}

function nameParsen(zeile){
  zeile = zeile.trim(); if(!zeile) return null;
  if (zeile.includes(",")){
    const [n, v] = zeile.split(",").map(x=>x.trim());
    return {vorname:v||"", name:n||""};
  }
  const teile = zeile.split(/\s+/);
  if (teile.length===1) return {vorname:teile[0], name:""};
  return {vorname:teile.slice(0,-1).join(" "), name:teile[teile.length-1]};
}

/* ============ Export / Import ============ */
function exportieren(){
  S.einstellungen.letztesBackup = new Date().toISOString();
  if (KB_MODE==="scriptable"){
    speichern();
    sendeAnBridge({typ:"export"});
    toast("Export wird geöffnet …");
  } else {
    const blob = new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kursbuch-sicherung-"+todayISO()+".json";
    a.click();
    toast("Sicherung heruntergeladen");
  }
  zeichne();
}
function importieren(){
  if (KB_MODE==="scriptable"){ sendeAnBridge({typ:"import"}); return; }
  const inp = document.getElementById("importDatei");
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=> window.__KB_importData(String(r.result));
    r.readAsText(f);
  };
  inp.click();
}

/* ============ Aktions-Delegation ============ */
document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-a]");
  if (!el) {
    if (ev.target.id==="overlay") schliessePopover();
    return;
  }
  const a = el.dataset.a, id = el.dataset.id;
  const k = R.kursId ? kursVon(R.kursId) : null;

  if (a==="go"){ R.view = el.dataset.view; if(R.view==="kurs"&&!R.kursId) R.view="home"; schliessePopover(); zeichne(); }
  else if (a==="kursOeffnen"){ R.view="kurs"; R.kursId=id; R.tab="sitzplan"; R.datum=todayISO(); zeichne(); }
  else if (a==="tab"){ R.tab=id; zeichne(); }
  else if (a==="modalZu"){ schliessePopover(); zeichne(); }
  else if (a==="modalZuArbeiten"){ schliessePopover(); R.tab="arbeiten"; zeichne(); }
  else if (a==="undo"){ if(letzteAktion){ letzteAktion.undo(); letzteAktion=null; document.getElementById("toast").classList.remove("offen"); speichern(); zeichne(); } }

  /* Kurse */
  else if (a==="kursNeuDialog") kursNeuDialog();
  else if (a==="kursAnlegen"){
    const name = document.getElementById("nkName").value.trim();
    if (!name) return alertBox("Bitte einen Kursnamen angeben.");
    const kurs = {id:uid(), schuljahrId: el.dataset.sj || (aktivesSchuljahr()||{}).id, name,
      fach: document.getElementById("nkFach").value.trim(),
      jahrgang: Number(document.getElementById("nkJahrgang").value),
      farbe: KURSFARBEN[S.kurse.length % KURSFARBEN.length], gewichtSonstige: 50, gewichtMuendlichAnteil: 50, mdlModus: "gewicht"};
    S.kurse.push(kurs); speichern(); schliessePopover();
    R.view="kurs"; R.kursId=kurs.id; R.tab="kurscfg"; zeichne();
    toast("Kurs angelegt – jetzt Schüler hinzufügen");
  }
  else if (a==="kursSpeichern"){
    k.name = document.getElementById("kName").value.trim() || k.name;
    k.fach = document.getElementById("kFach").value.trim();
    k.jahrgang = Number(document.getElementById("kJahrgang").value);
    k.farbe = document.getElementById("kFarbe").value;
    k.gewichtSonstige = 100 - Number(document.getElementById("kGewicht").value);
    const mm = document.getElementById("kMdlModus");
    if (mm) k.mdlModus = mm.value;
    const g2 = document.getElementById("kGewicht2");
    if (g2) k.gewichtMuendlichAnteil = Number(g2.value);
    speichern(); zeichne(); toast("Kurs gespeichert");
  }
  else if (a==="kursLoeschen"){
    zeigeModal('<h2>Kurs löschen?</h2><p>„'+esc(k.name)+'" mit allen Stunden, Ereignissen, Noten und Arbeiten löschen? Schüler bleiben erhalten, wenn sie noch anderen Kursen zugeordnet sind.</p>'+
      '<div class="zeile"><button class="gefahr" data-a="kursLoeschenJa" data-id="'+k.id+'">Endgültig löschen</button><button class="primar" data-a="modalZu">Abbrechen</button></div>');
  }
  else if (a==="kursLoeschenJa"){
    const stundenIds = new Set(S.stunden.filter(x=>x.kursId===id).map(x=>x.id));
    S.stunden = S.stunden.filter(x=>x.kursId!==id);
    S.ereignisse = S.ereignisse.filter(x=>x.kursId!==id);
    S.noten = S.noten.filter(x=>x.kursId!==id);
    S.arbeiten = S.arbeiten.filter(x=>x.kursId!==id);
    S.anwesenheit = S.anwesenheit.filter(x=>!stundenIds.has(x.stundeId));
    for (const s of S.schueler) s.kursIds = s.kursIds.filter(x=>x!==id);
    S.schueler = S.schueler.filter(s=>s.kursIds.length>0);
    S.kurse = S.kurse.filter(x=>x.id!==id);
    speichern(); schliessePopover(); R.view="home"; R.kursId=null; zeichne(); toast("Kurs gelöscht");
  }

  /* Schüler */
  else if (a==="schuelerHinzufuegen"){
    const text = document.getElementById("schuelerImport").value;
    let anzahl = 0;
    for (const zeile of text.split("\n")){
      const p = nameParsen(zeile); if(!p || (!p.vorname && !p.name)) continue;
      S.schueler.push({id:uid(), vorname:p.vorname, name:p.name, kuerzel:"", notizen:"", kursIds:[id], sitz:{}});
      anzahl++;
    }
    if (anzahl){ speichern(); zeichne(); toast(anzahl+" Schüler hinzugefügt"); }
  }
  else if (a==="schuelerEntfernen"){
    const s = schuelerVon(id);
    zeigeModal('<h2>Schüler entfernen?</h2><p>'+esc(s.vorname)+' '+esc(s.name)+' aus diesem Kurs entfernen? Ereignisse, Noten und Fehlzeiten dieses Kurses werden mit entfernt.</p>'+
      '<div class="zeile"><button class="gefahr" data-a="schuelerEntfernenJa" data-id="'+id+'">Entfernen</button><button class="primar" data-a="modalZu">Abbrechen</button></div>');
  }
  else if (a==="schuelerEntfernenJa"){
    const s = schuelerVon(id);
    const stundenIds = new Set(S.stunden.filter(x=>x.kursId===R.kursId).map(x=>x.id));
    s.kursIds = s.kursIds.filter(x=>x!==R.kursId);
    S.ereignisse = S.ereignisse.filter(e=>!(e.schuelerId===id && e.kursId===R.kursId));
    S.noten = S.noten.filter(n=>!(n.schuelerId===id && n.kursId===R.kursId));
    for (const arb of S.arbeiten.filter(x=>x.kursId===R.kursId)) delete arb.ergebnisse[id];
    S.anwesenheit = S.anwesenheit.filter(x=>!(x.schuelerId===id && stundenIds.has(x.stundeId)));
    if (!s.kursIds.length) S.schueler = S.schueler.filter(x=>x.id!==id);
    speichern(); schliessePopover(); zeichne(); toast("Schüler entfernt");
  }
  else if (a==="schuelerUmbenennen"){
    const s = schuelerVon(id);
    zeigeModal('<h2>Schüler bearbeiten</h2>'+
      '<div class="zeile"><div class="feld"><label>Vorname</label><input id="suVor" value="'+esc(s.vorname)+'"></div>'+
      '<div class="feld"><label>Nachname</label><input id="suNach" value="'+esc(s.name)+'"></div></div>'+
      '<div class="feld"><label>Notizen (z. B. Nachteilsausgleich)</label><textarea id="suNotiz">'+esc(s.notizen||"")+'</textarea></div>'+
      '<div class="zeile"><button class="primar" data-a="schuelerUmbenennenJa" data-id="'+id+'">Speichern</button><button data-a="modalZu">Abbrechen</button></div>');
  }
  else if (a==="schuelerUmbenennenJa"){
    const s = schuelerVon(id);
    s.vorname = document.getElementById("suVor").value.trim();
    s.name = document.getElementById("suNach").value.trim();
    s.notizen = document.getElementById("suNotiz").value.trim();
    speichern(); schliessePopover(); zeichne();
  }
  else if (a==="popupSchueler"){ oeffnePopupSchueler(id, el.getBoundingClientRect()); }
  else if (a==="profilOeffnen"){ schliessePopover(); R.view="profil"; R.schuelerId=id; zeichne(); }

  /* Ereignisse */
  else if (a==="ereignisStufe"){
    const stufe = Number(el.dataset.stufe);
    const e = addEreignis(id, R.kursId, el.dataset.kat, stufe);

/* ---------- SHA-256 (eigenständig, für PIN – unabhängig von WebCrypto) ---------- */
function sha256Hex(ascii){
  function rr(v,c){ return (v>>>c)|(v<<(32-c)); }
  const mathPow=Math.pow, maxWord=mathPow(2,32);
  let result="", words=[], asciiBitLength=ascii.length*8;
  let hash=sha256Hex.h=sha256Hex.h||[], k=sha256Hex.k=sha256Hex.k||[];
  let primeCounter=k.length; const isComposite={};
  for (let candidate=2; primeCounter<64; candidate++){
    if (!isComposite[candidate]){
      for (let i=0;i<313;i+=candidate) isComposite[i]=candidate;
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+="\x80";
  while (ascii.length%64-56) ascii+="\x00";
  for (let i=0;i<ascii.length;i++){
    const j=ascii.charCodeAt(i); if (j>>8) return null;
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for (let j=0;j<words.length;){
    const w=words.slice(j,j+=16), oldHash=hash.slice(0,8);
    for (let i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2];
      const a=hash[0], e=hash[4];
      const temp1=hash[7]
        +(rr(e,6)^rr(e,11)^rr(e,25))
        +((e&hash[5])^((~e)&hash[6]))
        +k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const temp2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for (let i=0;i<8;i++) hash[i]=(hash[i]+oldHash[i])|0;
  }
  for (let i=0;i<8;i++)
    for (let j=3;j+1;j--){
      const b=(hash[i]>>(j*8))&255;
      result+=((b<16)?0:"")+b.toString(16);
    }
  return result;
}
function pinHash(pin, salt){
  let h = salt + ":" + pin;
  for (let i=0;i<5000;i++) h = sha256Hex(h);
  return h;
}

/* ---------- Heute-Ansicht & Stundenplan-Slots ---------- */
function heutigeKurse(){
  const sj = aktivesSchuljahr(); if(!sj) return [];
  const heute = todayISO();
  const wt = new Date(heute+"T12:00:00").getDay(); // 1=Mo..5=Fr
  const wb = wochenBuchstabe(sj, heute);
  const liste = [];
  for (const k of S.kurse.filter(k=>k.schuljahrId===sj.id)){
    for (const slot of (k.slots||[])){
      if (slot.tag===wt && (slot.woche==="AB" || slot.woche===wb))
        liste.push({kurs:k, stunde:slot.stunde});
    }
  }
  return liste.sort((a,b)=>a.stunde-b.stunde);
}

/* ---------- Notenvorschlag aus Mitarbeit ---------- */
/* Vorschlag für die mündliche Note. Rechnet in MerkrNoten (src/kern/noten.js),
   damit die Kurve und die Zeitgewichtung ohne Gerät prüfbar bleiben.

   Zwei Regeln stecken darin: die Halbjahresgrenze ist hart, und innerhalb des
   Halbjahres wiegen frische Notizen schwerer. Vorher war es das arithmetische
   Mittel über das ganze Jahr - wer im September stumm war und seit Februar
   trägt, schleppte den September voll mit. */
function notenvorschlag(schuelerId, kursId){
  const evs = S.ereignisse.filter(e=>e.schuelerId===schuelerId && e.kursId===kursId &&
    (MITARBEIT_KATEGORIEN.some(k=>k.id===e.typ) || (S.einstellungen.eigeneEreignisse.some(x=>x.id===e.typ && x.mitStufen))) && e.stufe!=null);
  if (!evs.length) return null;
  const kurs = kursVon(kursId), sys = notensystem(kurs);
  const erg = MerkrNoten.vorschlag(evs, {
    typ: sys.typ,
    ab: MerkrNoten.halbjahrBeginn(aktivesSchuljahr(), todayISO())
  });
  if (!erg) return null;
  return {wert: erg.wert, genau: erg.genau, avg: erg.mittel, anzahl: erg.anzahl, frisch: erg.anzahlFrisch};
}

/* ---------- Plandatei-Import (KI-Workflow Stufe 1) ---------- */
function planImportieren(text){
  let plan;
  try { plan = JSON.parse(text); } catch(e){ return {fehler:"Datei ist kein gültiges JSON."}; }
  if (!plan || plan.formatVersion!=="kursbuch-plan-1") return {fehler:"Format nicht erkannt – erwartet wird formatVersion \"kursbuch-plan-1\"."};
  const sj = aktivesSchuljahr(); if (!sj) return {fehler:"Kein aktives Schuljahr."};
  let ferienNeu=0, themen=0; const unbekannt=[];
  if (Array.isArray(plan.ferien)){
    sj.ferien = sj.ferien||[];
    for (const f of plan.ferien){
      if (f && f.von && f.bis && !sj.ferien.some(x=>x.von===f.von && x.bis===f.bis)){
        sj.ferien.push({name:String(f.name||"Ferien"), von:f.von, bis:f.bis}); ferienNeu++;
      }
    }
  }
  if (Array.isArray(plan.plaene)){
    for (const p of plan.plaene){
      const kurs = S.kurse.find(k=>k.schuljahrId===sj.id && k.name.trim().toLowerCase()===String(p.kurs||"").trim().toLowerCase());
      if (!kurs){ unbekannt.push(String(p.kurs||"?")); continue; }
      for (const t of (p.themen||[])){
        if (!t || !t.datum || !/^\d{4}-\d{2}-\d{2}$/.test(t.datum)) continue;
        const st = ensureStunde(kurs.id, t.datum);
        st.geplant = String(t.thema||"");
        themen++;
      }
    }
  }
  speichern();
  return {ferienNeu, themen, unbekannt};
}

/* ---------- Verschlüsseltes Backup (WebCrypto, AES-GCM) ---------- */
function b64(buf){ let s=""; const b=new Uint8Array(buf); for (let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(s){ const bin=atob(s); const b=new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
function cryptoVerfuegbar(){ return typeof crypto!=="undefined" && crypto.subtle && typeof crypto.subtle.deriveKey==="function"; }
async function schluesselAbleiten(passwort, salt, iter){
  const enc = new TextEncoder();
  const basis = await crypto.subtle.importKey("raw", enc.encode(passwort), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, basis,
    {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function backupVerschluesseln(passwort){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const iter = 150000;
  const key = await schluesselAbleiten(passwort, salt, iter);
  const daten = new TextEncoder().encode(JSON.stringify(S));
  const chiffre = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, daten);
  return JSON.stringify({kb:"kursbuch-backup-enc1", iter, salt:b64(salt), iv:b64(iv), daten:b64(chiffre)});
}
async function backupEntschluesseln(obj, passwort){
  const key = await schluesselAbleiten(passwort, unb64(obj.salt), obj.iter||150000);
  const klar = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(obj.iv)}, key, unb64(obj.daten));
  return new TextDecoder().decode(klar);
}

/* ---------- Datei-Export (Bridge oder Browser) ---------- */
function dateiNameSicher(name){
  return String(name)
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss")
    .replace(/[^\x20-\x7E]/g,"_").replace(/[\\\/:*?"<>|]/g,"_");
}
function dateiExportieren(name, inhaltBase64, mime){
  name = dateiNameSicher(name);
  if (KB_MODE==="scriptable"){
    sendeAnBridge({typ:"exportdatei", name, base64: inhaltBase64});
  } else {
    const bin = unb64(inhaltBase64);
    const blob = new Blob([bin], {type: mime||"application/octet-stream"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
}
function textExportieren(name, text, mime){
  const b = new TextEncoder().encode(text);
  let s=""; for (let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
  dateiExportieren(name, btoa(s), mime||"application/json");
}

/* ---------- Mini-PDF-Generator (A4, Helvetica, Latin-1) ---------- */
const PDF_B = 595.28, PDF_H = 841.89;
function pdfNeu(){ return {seiten:[]}; }
function pdfSeite(doc){ const s={ops:[]}; doc.seiten.push(s); return s; }
function pdfLatin1(s){
  let r="";
  for (const ch of String(s)){
    const c = ch.codePointAt(0);
    if (c===8722) r += "-";                    // − Minuszeichen
    else if (c===8211 || c===8212) r += "-";   // – —
    else if (c===8222 || c===8220 || c===8221) r += '"';
    else if (c===8216 || c===8217) r += "'";
    else if (c===8230) r += "...";
    else if (c===8594) r += ">";
    else if (c>255) r += "?";
    else r += ch;
  }
  return r.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
}
function pdfFarbe(hex){
  const n = parseInt(hex.replace("#",""),16);
  return ((n>>16)&255)/255+" "+((n>>8)&255)/255+" "+(n&255)/255;
}
function pdfText(s, x, yTop, txt, groesse, fett, farbeHex){
  s.ops.push((farbeHex?pdfFarbe(farbeHex):"0 0 0")+" rg BT /"+(fett?"F2":"F1")+" "+(groesse||10)+
    " Tf 1 0 0 1 "+x.toFixed(1)+" "+(PDF_H-yTop).toFixed(1)+" Tm ("+pdfLatin1(txt)+") Tj ET");
}
function pdfTextBreite(txt, groesse){ return String(txt).length * (groesse||10) * 0.5; } // grobe Näherung Helvetica
function pdfLinie(s, x1, y1, x2, y2, farbeHex, staerke){
  s.ops.push((farbeHex?pdfFarbe(farbeHex):"0.7 0.7 0.7")+" RG "+(staerke||0.6)+" w "+
    x1.toFixed(1)+" "+(PDF_H-y1).toFixed(1)+" m "+x2.toFixed(1)+" "+(PDF_H-y2).toFixed(1)+" l S");
}
function pdfRechteck(s, x, yTop, b, h, farbeHex){
  s.ops.push(pdfFarbe(farbeHex||"#eeeeee")+" rg "+x.toFixed(1)+" "+(PDF_H-yTop-h).toFixed(1)+" "+b.toFixed(1)+" "+h.toFixed(1)+" re f");
}
function pdfKreis(s, cx, cyTop, r, farbeHex){
  const cy = PDF_H-cyTop, k = 0.5523*r;
  s.ops.push(pdfFarbe(farbeHex)+" rg "+
    (cx-r).toFixed(1)+" "+cy.toFixed(1)+" m "+
    (cx-r).toFixed(1)+" "+(cy+k).toFixed(1)+" "+(cx-k).toFixed(1)+" "+(cy+r).toFixed(1)+" "+cx.toFixed(1)+" "+(cy+r).toFixed(1)+" c "+
    (cx+k).toFixed(1)+" "+(cy+r).toFixed(1)+" "+(cx+r).toFixed(1)+" "+(cy+k).toFixed(1)+" "+(cx+r).toFixed(1)+" "+cy.toFixed(1)+" c "+
    (cx+r).toFixed(1)+" "+(cy-k).toFixed(1)+" "+(cx+k).toFixed(1)+" "+(cy-r).toFixed(1)+" "+cx.toFixed(1)+" "+(cy-r).toFixed(1)+" c "+
    (cx-k).toFixed(1)+" "+(cy-r).toFixed(1)+" "+(cx-r).toFixed(1)+" "+(cy-k).toFixed(1)+" "+(cx-r).toFixed(1)+" "+cy.toFixed(1)+" c f");
}
function pdfFertig(doc){
  const objekte = [];
  const nSeiten = doc.seiten.length;
  // Objekt 1: Catalog, 2: Pages, 3: F1, 4: F2, dann je Seite: Page + Inhalt
  objekte[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  const kids = [];
  for (let i=0;i<nSeiten;i++) kids.push((5+i*2)+" 0 R");
  objekte[2] = "<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+nSeiten+" >>";
  objekte[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objekte[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  doc.seiten.forEach((seite,i)=>{
    const inhalt = seite.ops.join("\n");
    objekte[5+i*2] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PDF_B+" "+PDF_H+"] "+
      "/Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(6+i*2)+" 0 R >>";
    objekte[6+i*2] = "<< /Length "+inhalt.length+" >>\nstream\n"+inhalt+"\nendstream";
  });
  let pdf = "%PDF-1.4\n";
  const offsets = [0];
  for (let i=1;i<objekte.length;i++){
    offsets[i] = pdf.length;
    pdf += i+" 0 obj\n"+objekte[i]+"\nendobj\n";
  }
  const xref = pdf.length;
  pdf += "xref\n0 "+objekte.length+"\n0000000000 65535 f \n";
  for (let i=1;i<objekte.length;i++) pdf += String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  pdf += "trailer\n<< /Size "+objekte.length+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  return btoa(pdf);
}

/* ---------- Schülerprofil als DIN-A4-PDF (genau eine Seite) ---------- */
function profilPdfErzeugen(schuelerId, kursId){
  const s0 = schuelerVon(schuelerId), kurs = kursVon(kursId), sj = aktivesSchuljahr();
  const sys = notensystem(kurs);
  const ns = notenstand(schuelerId, kursId);
  const mz = mitarbeitZusammenfassung(schuelerId, kursId);
  const fz = fehlzeiten(schuelerId, kursId);
  const vs = notenvorschlag(schuelerId, kursId);
  const noten = schuelerNoten(schuelerId, kursId).sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  const evs = S.ereignisse.filter(e=>e.schuelerId===schuelerId && e.kursId===kursId).sort((a,b)=>b.ts.localeCompare(a.ts));
  const doc = pdfNeu(), p = pdfSeite(doc);
  const L=48, Rr=547;
  let y = 56;

  pdfText(p, L, y, s0.vorname+" "+s0.name, 20, true, "#14210f");
  pdfText(p, Rr-pdfTextBreite("merkr · erstellt am "+fmtDatum(todayISO()),9), y, "merkr · erstellt am "+fmtDatum(todayISO()), 9, false, "#777777");
  y += 18;
  pdfText(p, L, y, kurs.name+" ("+(kurs.fach||"")+", Jahrgang "+kurs.jahrgang+") · Schuljahr "+(sj?sj.name:"–"), 11);
  y += 22; pdfLinie(p, L, y, Rr, y, "#3d7a4e", 1.2); y += 24;

  /* Notenstand */
  pdfText(p, L, y, "Leistungsstand", 13, true, "#3d5a2e");
  y += 18;
  const einheit = sys.typ==="punkte" ? " P." : "";
  pdfText(p, L, y, "Gesamt: "+(ns.gesamt==null?"–":fmtZahl(ns.gesamt))+einheit, 11, true);
  pdfText(p, L+150, y, "Klassenarbeiten: "+(ns.arb==null?"–":fmtZahl(ns.arb))+einheit+"  ("+(100-gewSonstige(kurs))+" %)", 10);
  pdfText(p, L+330, y, "sonstige Leistungen: "+(ns.son==null?"–":fmtZahl(ns.son))+einheit+"  ("+gewSonstige(kurs)+" %)", 10);
  y += 14;
  pdfText(p, L, y, "davon mündliche Note: "+(ns.m==null?"–":fmtZahl(ns.m))+einheit+
    (mdlModus(kurs)==="anteil" ? " (fest "+gewMdlAnteil(kurs)+" %)" : " (zählt als eine sonstige Leistung)")+
    " · übrige sonstige: "+(ns.wso==null?"–":fmtZahl(ns.wso))+einheit, 9, false, "#555555");
  y += 14;
  if (vs) pdfText(p, L, y, "Vorschlag mündliche Note aus Mitarbeit: "+vs.wert+einheit+" (aus "+vs.anzahl+(vs.anzahl===1?" Eintrag":" Einträgen")+", Ø-Stufe "+fmtZahl(vs.avg,1)+")", 9, false, "#777777");
  y += 22;

  /* Mitarbeit */
  pdfText(p, L, y, "Mitarbeit nach Kategorien", 13, true, "#3d5a2e");
  y += 18;
  for (const kat of MITARBEIT_KATEGORIEN){
    const z = mz[kat.id];
    pdfText(p, L, y, kat.kurz, 10);
    let x = L+150;
    for (const stu of STUFEN){
      pdfKreis(p, x, y-3, 4.5, stu.hex);
      pdfText(p, x+8, y, String(z.counts[stu.v]||0), 10);
      x += 44;
    }
    pdfText(p, x+8, y, z.schnitt==null ? "kein Eintrag" : ("Ø "+fmtZahl(z.schnitt,1)+"  ("+z.anzahl+(z.anzahl===1?" Eintrag":" Einträge")+")"), 10, false, "#555555");
    y += 17;
  }
  y += 10;

  /* Noten */
  pdfText(p, L, y, "Noten und Arbeiten", 13, true, "#3d5a2e"); y += 16;
  if (!noten.length){ pdfText(p, L, y, "Noch keine Noten.", 10, false, "#777777"); y += 16; }
  else {
    pdfText(p, L, y, "Datum", 9, true, "#777777"); pdfText(p, L+80, y, "Art", 9, true, "#777777");
    pdfText(p, L+300, y, "Bereich", 9, true, "#777777"); pdfText(p, L+380, y, "Wert", 9, true, "#777777");
    pdfText(p, L+440, y, "Gewicht", 9, true, "#777777");
    y += 5; pdfLinie(p, L, y, Rr, y); y += 13;
    const maxNoten = 8;
    for (const n of noten.slice(0, maxNoten)){
      pdfText(p, L, y, fmtDatum(n.datum), 10);
      pdfText(p, L+80, y, (n.label||(n.ausArbeit?"Arbeit":"Note")).slice(0,42), 10);
      pdfText(p, L+300, y, bereichKurz(n.bereich), 10);
      pdfText(p, L+380, y, String(n.wert), 10, true);
      pdfText(p, L+440, y, gewText(n.gewicht), 10);
      y += 15;
    }
    if (noten.length>maxNoten){ pdfText(p, L, y, "… "+(noten.length-maxNoten)+" weitere in der App", 9, false, "#777777"); y += 15; }
  }
  y += 8;

  /* Fehlzeiten */
  pdfText(p, L, y, "Fehlzeiten", 13, true, "#3d5a2e"); y += 16;
  pdfText(p, L, y, fz.fehltGesamt+"× gefehlt ("+fz.unentschuldigt+" unentschuldigt, "+fz.offen+" offen)  ·  "+
    fz.verspaetungen+"× verspätet ("+fz.minuten+" Min.)", 10);
  y += 24;

  /* Ereignisse – füllt den Rest der Seite, bricht nie um */
  pdfText(p, L, y, "Ereignisse (Datum · Thema der Stunde · Ereignis · Stufe)", 13, true, "#3d5a2e"); y += 16;
  pdfText(p, L, y, "Datum", 9, true, "#777777"); pdfText(p, L+62, y, "Thema der Stunde", 9, true, "#777777");
  pdfText(p, L+330, y, "Ereignis", 9, true, "#777777"); pdfText(p, L+480, y, "Stufe", 9, true, "#777777");
  y += 5; pdfLinie(p, L, y, Rr, y); y += 13;
  const yMax = 800;
  let gezeigt = 0;
  for (const e of evs){
    if (y > yMax - 15) break;
    const st = stundeVon(e.stundeId);
    pdfText(p, L, y, st?fmtDatum(st.datum):"–", 9);
    pdfText(p, L+62, y, ((st&&st.thema)?st.thema:"–").slice(0,52), 9);
    pdfText(p, L+330, y, (ereignisName(e)+(e.text?": "+e.text:"")).slice(0,30), 9);
    if (e.stufe!=null){
      pdfKreis(p, L+486, y-3, 4, stufeInfo(e.stufe).hex);
      pdfText(p, L+494, y, stufeInfo(e.stufe).label, 9);
    } else pdfText(p, L+486, y, "–", 9);
    y += 14; gezeigt++;
  }
  if (evs.length>gezeigt) pdfText(p, L, y, "… "+(evs.length-gezeigt)+" weitere Ereignisse in der App", 9, false, "#777777");
  pdfLinie(p, L, 812, Rr, 812);
  pdfText(p, L, 824, "merkr – persönliche Unterrichtsdokumentation. Nur für den dienstlichen Gebrauch.", 8, false, "#999999");
  return pdfFertig(doc);
}

document.addEventListener("click", async ev=>{

      const p = S.einstellungen.pin;

      pinEingabe = "";

      return;

    const p = (document.getElementById("pinNeu").value||"").trim();
    if (!/^\d{4,6}$/.test(p)) return alertBox("Bitte 4 bis 6 Ziffern eingeben.");
    const salt = Math.random().toString(36).slice(2,12);
    S.einstellungen.pin = {salt, hash: pinHash(p, salt)};
    speichern(); zeichne(); toast("PIN aktiviert");
  }
  else if (a==="pinEntfernen"){
    S.einstellungen.pin = null; speichern(); zeichne(); toast("PIN entfernt");
  }

  /* Stundenplan-Slots */
  else if (a==="slotNeu"){
    const kurs = kursVon(id);

      stunde:Number(document.getElementById("slotStunde").value),
      woche:document.getElementById("slotWoche").value});
    speichern(); zeichne();
  }
  else if (a==="slotLoeschen"){
    const kurs = kursVon(id);
    kurs.slots.splice(Number(el.dataset.idx),1);
    speichern(); zeichne();
  }

  /* Planung */
  else if (a==="geplantUebernehmen"){
    const st = stundeVon(id);
    const inp = document.getElementById("stThema");
    if (inp && st) inp.value = st.geplant;
  }
  else if (a==="planImportWaehlen"){
    if (KB_MODE==="scriptable"){ sendeAnBridge({typ:"planimport"}); return; }
    const inp = document.getElementById("planDatei");
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=> window.__KB_planImport(String(r.result));
      r.readAsText(f);
    };
    inp.click();
  }

  /* Backup */
  else if (a==="backupDialog"){
    if (!cryptoVerfuegbar()){
      S.einstellungen.letztesBackup = new Date().toISOString();
      textExportieren("kursbuch-sicherung-"+todayISO()+".json", JSON.stringify(S,null,1));
      speichern(); zeichne(); toast("Unverschlüsselte Sicherung exportiert"); return;
    }
    zeigeModal('<h2>Sicherung exportieren</h2>'+
      '<p class="hinweis">Mit Passwort wird die Datei verschlüsselt (AES-256). Ohne Passwort wird unverschlüsselt exportiert – dann bitte sicher aufbewahren.</p>'+
      '<div class="feld"><label>Passwort (empfohlen)</label><input type="password" id="bkPw1" autocomplete="new-password"></div>'+
      '<div class="feld"><label>Passwort wiederholen</label><input type="password" id="bkPw2" autocomplete="new-password"></div>'+
      '<div class="zeile"><button class="primar" data-a="backupExport">Exportieren</button><button data-a="modalZu">Abbrechen</button></div>');
  }
  else if (a==="backupExport"){
    const p1 = document.getElementById("bkPw1").value, p2 = document.getElementById("bkPw2").value;
    if (p1 !== p2) return alertBox("Die Passwörter stimmen nicht überein.");
    S.einstellungen.letztesBackup = new Date().toISOString();
    try{
      if (p1){
        const chiffre = await backupVerschluesseln(p1);
        textExportieren("kursbuch-sicherung-"+todayISO()+".kbx.json", chiffre);
        toast("Verschlüsselte Sicherung exportiert");
      } else {
        textExportieren("kursbuch-sicherung-"+todayISO()+".json", JSON.stringify(S,null,1));
        toast("Unverschlüsselte Sicherung exportiert");
      }
      speichern(); schliessePopover(); zeichne();
    }catch(e){ alertBox("Export fehlgeschlagen: "+e.message); }
  }
  else if (a==="backupEntsperren"){
    const pw = document.getElementById("bkPwImport").value;
    try{
      const klar = await backupEntschluesseln(window.__KB_pendingImport, pw);
      window.__KB_pendingImport = null;
      schliessePopover();
      window.__KB_importData(klar);
    }catch(e){ alertBox("Entschlüsselung fehlgeschlagen – falsches Passwort?"); }
  }

  /* Profil-PDF */
  else if (a==="profilPdf"){
    try{
      const s = schuelerVon(id);
      const pdfB64 = profilPdfErzeugen(id, R.kursId);

      toast("PDF wird exportiert …");
    }catch(e){ alertBox("PDF-Erstellung fehlgeschlagen: "+e.message); }
  }
});

/* ---------- Mehrseitige PDF-Tabellen (Notenliste, Stundenliste) ---------- */
function pdfTabellenDokument(titel, untertitel, spalten, zeilen, fussnote){
  const doc = pdfNeu();
  const L=48, Rr=547, yStart=110, yMax=790;
  let p = null, y = 0;
  const kopf = ()=>{
    p = pdfSeite(doc);
    pdfText(p, L, 56, titel, 16, true, "#14210f");
    pdfText(p, Rr-pdfTextBreite("merkr · "+fmtDatum(todayISO()),9), 56, "merkr · "+fmtDatum(todayISO()), 9, false, "#777777");
    pdfText(p, L, 74, untertitel, 10, false, "#555555");
    pdfLinie(p, L, 84, Rr, 84, "#3d7a4e", 1.2);
    let x=L;
    for (const sp of spalten){ pdfText(p, x, 100, sp.titel, 9, true, "#777777"); x += sp.breite; }
    pdfLinie(p, L, 105, Rr, 105);
    y = yStart + 8;
  };
  kopf();
  for (const zeile of zeilen){
    if (y > yMax){ kopf(); }
    let x=L;
    zeile.forEach((zelle,i)=>{
      const sp = spalten[i];
      const txt = String(zelle==null?"–":zelle).slice(0, sp.maxZeichen||40);
      pdfText(p, x, y, txt, 9.5, !!sp.fett);
      x += sp.breite;
    });
    y += 15;
  }
  if (fussnote){
    if (y > yMax) kopf();
    pdfText(p, L, y+8, fussnote, 8, false, "#999999");
  }
  return pdfFertig(doc);
}
function notenlistePdf(kursId){
  const kurs = kursVon(kursId), sys = notensystem(kurs);
  const zeilen = kursSchueler(kursId).map(s=>{
    const ns = notenstand(s.id, kursId), fz = fehlzeiten(s.id, kursId), vs = notenvorschlag(s.id, kursId);
    return [s.name+", "+s.vorname, fmtZahl(ns.arb), fmtZahl(ns.son), fmtZahl(ns.m), fmtZahl(ns.gesamt), vs?String(vs.wert):"–",
      fz.fehltGesamt+" ("+fz.unentschuldigt+" u.)"];
  });
  return pdfTabellenDokument(
    "Notenliste "+kurs.name,
    (kurs.fach||"")+" · Jahrgang "+kurs.jahrgang+" · "+(sys.typ==="punkte"?"Punkte 0–15":"Noten 1–6")+
      " · "+gewichtungsText(kurs),
    [{titel:"Schüler", breite:138, fett:true, maxZeichen:28},{titel:"Klassenarb.", breite:66},{titel:"sonstige", breite:60},
     {titel:"davon mdl.", breite:62},{titel:"Gesamt", breite:58, fett:true},{titel:"Vorschl. mdl.", breite:62},{titel:"Fehlz.", breite:52}],
    zeilen,
    "Gewichtete Mittel; Vorschlag aus Mitarbeits-Stufen. Nur für den dienstlichen Gebrauch.");
}
function stundenlistePdf(kursId){
  const kurs = kursVon(kursId);
  const stunden = S.stunden.filter(x=>x.kursId===kursId).sort((a,b)=>a.datum.localeCompare(b.datum));
  const zeilen = stunden.map(st=>{
    const fehl = S.anwesenheit.filter(a=>a.stundeId===st.id && a.status==="fehlt").length;
    return [fmtDatum(st.datum)+(st.ausfall?" (Ausfall)":""), st.geplant||"–", st.thema||"–", st.hausaufgabe||"–", fehl||"–"];
  });
  return pdfTabellenDokument(
    "Stundendokumentation "+kurs.name,
    (kurs.fach||"")+" · "+stunden.length+" Stunden",
    [{titel:"Datum", breite:80},{titel:"Geplant (Soll)", breite:130, maxZeichen:26},{titel:"Thema (Ist)", breite:150, maxZeichen:30},
     {titel:"Hausaufgabe", breite:90, maxZeichen:18},{titel:"Fehlend", breite:50}],
    zeilen,
    "Nachweis der Unterrichtsinhalte. Nur für den dienstlichen Gebrauch.");

/* Ersetzt den Phase-2-Platzhalter */
profilZusatzKarten = function(s, k, ns){
  const sys = notensystem(k);

function viewAuswertung(k){
  const schueler = kursSchueler(k.id);
  if (!schueler.length) return leer("Noch keine Schüler in diesem Kurs.", "Schüler hinzufügen", "tab", "kurscfg");
  const sys = notensystem(k);
  let html = '<div class="karte"><div class="zeile raum"><h2>Notenspiegel & Mitarbeit</h2>'+
    '<div class="zeile"><button class="klein" data-a="notenlistePdf">Notenliste als PDF</button>'+
    '<button class="klein" data-a="stundenlistePdf">Stundendoku als PDF</button></div></div>'+
    '<p class="hinweis">Gewichtung: '+gewichtungsText(k)+' – änderbar im Tab „Kurs".</p>'+
    '<table class="tab"><tr><th>Schüler</th><th>Klassenarb.</th><th>sonstige</th><th>davon mdl.</th><th>Stand</th><th>Vorschlag mdl.</th><th>Mitarbeit</th><th>Fehlz.</th><th></th></tr>';
  for (const s of schueler){
    const ns = notenstand(s.id, k.id);
    const vs = notenvorschlag(s.id, k.id);
    const mz = mitarbeitZusammenfassung(s.id, k.id);
    const fz = fehlzeiten(s.id, k.id);
    let chips = "";
    for (const kat of MITARBEIT_KATEGORIEN){
      const z = mz[kat.id];
      const farbe = z.schnitt==null ? "#555" : stufeInfo(Math.round(z.schnitt)).hex;
      chips += '<span class="stufenpunkt" title="'+esc(kat.kurz)+'" style="background:'+farbe+';margin-right:4px"></span>';
    }
    html += '<tr><td><b>'+esc(s.name)+', '+esc(s.vorname)+'</b></td>'+
      '<td>'+fmtZahl(ns.arb)+'</td><td>'+fmtZahl(ns.son)+'</td><td>'+fmtZahl(ns.m)+'</td>'+
      '<td><b>'+fmtZahl(ns.gesamt)+'</b></td>'+
      '<td>'+(vs?vs.wert:"–")+'</td>'+
      '<td>'+chips+'</td>'+
      '<td>'+fz.fehltGesamt+(fz.offen?' <span style="color:var(--rot)">('+fz.offen+' offen)</span>':'')+'</td>'+
      '<td><button class="klein" data-a="profilOeffnen" data-id="'+s.id+'">Profil</button></td></tr>';
  }
  html += '</table><p class="hinweis">Stand = gewichtetes Mittel'+(sys.typ==="punkte"?" (Punkte 0–15)":" (Noten 1–6)")+'; Vorschlag aus Mitarbeits-Stufen (nur Anhaltspunkt).</p></div>';

  /* Verlauf der Arbeiten */
  const arbeiten = S.arbeiten.filter(a=>a.kursId===k.id)
    .map(a=>({a, stat: arbeitStatistik(a, k)}))
    .filter(x=>x.stat.n>0)
    .sort((x,y)=>x.a.datum.localeCompare(y.a.datum));
  if (arbeiten.length>=2){
    html += '<div class="karte"><h3>Arbeiten im Verlauf (Mittelwerte)</h3>'+verlaufSvg(arbeiten, sys)+'</div>';
  }
  return html;
}
function verlaufSvg(arbeiten, sys){
  const sk = skala(sys), B=640, H=190, L=40, unten=150;
  const n = arbeiten.length;
  const x = i => L + (n===1 ? 0 : i*(B-L-30)/(n-1));
  const yv = v => 20 + (sys.typ==="punkte" ? (sk.max-v)/(sk.max-sk.min) : (v-sk.min)/(sk.max-sk.min))*(unten-30);
  let s = '<svg viewBox="0 0 '+B+' '+H+'" style="width:100%;max-width:640px;display:block">';
  for (const t of sk.ticks){
    s += '<line x1="'+L+'" y1="'+yv(t)+'" x2="'+(B-24)+'" y2="'+yv(t)+'" stroke="#39443a" stroke-width="0.5"/>'+
         '<text x="'+(L-8)+'" y="'+(yv(t)+4)+'" font-size="11" text-anchor="end">'+t+'</text>';
  }
  let pfad = "";
  arbeiten.forEach((e,i)=>{ pfad += (i?"L":"M")+x(i).toFixed(1)+" "+yv(e.stat.mittel).toFixed(1)+" "; });
  s += '<path d="'+pfad+'" fill="none" stroke="#8fbf6f" stroke-width="2.5"/>';
  arbeiten.forEach((e,i)=>{
    s += '<circle cx="'+x(i)+'" cy="'+yv(e.stat.mittel)+'" r="5" fill="#8fbf6f"/>'+
      '<text x="'+x(i)+'" y="'+(yv(e.stat.mittel)-10)+'" font-size="11" text-anchor="middle">'+fmtZahl(e.stat.mittel,1)+'</text>'+
      '<text x="'+x(i)+'" y="'+(unten+18)+'" font-size="10" text-anchor="middle">'+esc(e.a.titel.slice(0,14))+'</text>'+
      '<text x="'+x(i)+'" y="'+(unten+31)+'" font-size="9" text-anchor="middle">'+fmtDatumKurz(e.a.datum)+'</text>';
  });
  return s+'</svg><p class="hinweis">Höher im Diagramm = besser ('+(sys.typ==="punkte"?"oben 15 Punkte":"oben Note 1")+').</p>';
}

/* ================= Stoffverteilung aus planr =================
   planr plant, merkr hält fest, was war. Hierher kommt nur das Soll: Datum,
   Thema, Einheit. Es landet in st.geplant und lässt st.thema unberührt - was
   im Unterricht wirklich lief, schreibt niemand von außen.

   Diese Fassung von planImportieren ersetzt die frühere; sie ordnet zusätzlich
   über das Feld planrKlasse zu und übernimmt die Halbjahresgrenze. */

function planrBasis(){ return String(S.einstellungen.planrUrl || "").trim(); }

function planrKarte(k){
  return '<div class="karte"><h2>Verbindung zu planr</h2>'+

    'Eigenes Feld, weil Kursnamen hier und dort auseinanderlaufen dürfen.</p>'+
    '<div class="zeile"><div class="feld" style="flex:1"><label>planr-Kurs</label>'+
    '<input id="planrKlasse" value="'+esc(k.planrKlasse||"")+'" placeholder="'+esc((k.fach?k.fach+" ":"")+k.name)+'"></div>'+
    '<button class="primar" data-a="planrKlasseSpeichern" data-id="'+k.id+'">Speichern</button></div></div>';
}

function planImportieren(text){
  let plan;
  try { plan = JSON.parse(text); }
  catch(e){ return {fehler:"Diese Datei lässt sich nicht lesen."}; }

  const fv = plan && plan.formatVersion;
  if (fv!=="kursbuch-plan-1" && fv!=="kursbuch-plan-2")
    return {fehler:"Das ist keine Stoffverteilung aus planr. Erwartet wird die Datei, die planr unter Freigaben ausgibt."};

  const sj = aktivesSchuljahr();
  if (!sj) return {fehler:"Es ist kein Schuljahr angelegt - ohne das gibt es keinen Kalender, in den die Stunden passen."};

  let ferienNeu=0, themen=0, mitReihe=0, grenzeNeu=false;
  const unbekannt=[];

  /* planr führt den Beginn des zweiten Halbjahres ohnehin. Ihn hier zu
     übernehmen erspart das Nachtragen von Hand - und ohne ihn greift die harte
     Grenze im Notenvorschlag nie. */
  if (plan.schuljahr && plan.schuljahr.halbjahrGrenze && sj.halbjahrGrenze !== plan.schuljahr.halbjahrGrenze){
    sj.halbjahrGrenze = String(plan.schuljahr.halbjahrGrenze);
    grenzeNeu = true;
  }

  if (Array.isArray(plan.ferien)){
    sj.ferien = sj.ferien || [];
    for (const f of plan.ferien){
      if (f && f.von && f.bis && !sj.ferien.some(x=>x.von===f.von && x.bis===f.bis)){
        sj.ferien.push({name:String(f.name||"Ferien"), von:f.von, bis:f.bis});
        ferienNeu++;
      }
    }
  }

  if (Array.isArray(plan.plaene)){
    for (const p of plan.plaene){
      const kurs = MerkrPlanr.kursFuer(S.kurse, p, sj.id);
      if (!kurs){ unbekannt.push(String(p.kurs||"?")); continue; }
      if (!kurs.reihenFarben || typeof kurs.reihenFarben!=="object") kurs.reihenFarben = {};

      for (const th of p.themen||[]){
        if (!th || !th.datum || !/^\d{4}-\d{2}-\d{2}$/.test(th.datum)) continue;
        const st = ensureStunde(kurs.id, th.datum);
        st.geplant = String(th.thema||"");
        if (th.reihe!=null && String(th.reihe).trim()){
          st.reihe = String(th.reihe).trim();
          jahrFarbe(kurs, st.reihe);
          mitReihe++;
        } else if (st.reihe==null) st.reihe = "";
        themen++;
      }
    }
  }

  speichern();
  return {ferienNeu, themen, unbekannt, mitReihe, grenzeNeu};
}

/* Abruf anstoßen. Das Wort liegt im Schlüsselbund, der Rahmen holt die Daten. */
function planrHolen(still){
  if (KB_MODE!=="scriptable") return alertBox("Der Abruf läuft nur in Scriptable.");
  if (!planrDa) { if (!still) alertBox("Bitte zuerst das planr-Wort in den Schlüsselbund legen."); return; }
  if (!planrBasis()) { if (!still) alertBox("Bitte zuerst die planr-Adresse eintragen."); return; }
  planrStill = !!still;
  if (!still) toast("Stoffverteilung wird geholt …");
  sendeAnBridge({typ:"planrAbruf", url: planrBasis()});
}
let planrStill = false;

window.__KB_planrAntwort = function(text){
  let plan = null;
  try { plan = JSON.parse(text); } catch(e){ plan = null; }
  if (plan && plan.fehler){
    if (!planrStill) alertBox("Abruf aus planr fehlgeschlagen: "+plan.fehler);
    return "fehler";
  }
  const erg = planImportieren(text);
  if (erg.fehler){
    if (!planrStill) alertBox("Abruf aus planr fehlgeschlagen: "+erg.fehler);
    return "fehler";
  }
  S.einstellungen.planrZuletzt = new Date().toISOString();
  speichern(); zeichne();
  const teile = [erg.themen+" Stunden"];
  if (erg.ferienNeu) teile.push(erg.ferienNeu+" Ferienzeiträume");
  if (erg.grenzeNeu) teile.push("Halbjahresgrenze");
  if (erg.unbekannt.length) teile.push("ohne Zuordnung: "+erg.unbekannt.join(", "));
  toast("Aus planr: "+teile.join(" · "));
  return "ok";
};

/* Automatik: beim Start holen, höchstens einmal in zwölf Stunden. Still - wer
   das Klassenbuch aufschlägt, will keine Meldung über einen Abruf, der ohnehin
   nichts geändert hat. Ohne Netz passiert nichts und der Zeitstempel bleibt
   stehen, der nächste Start versucht es wieder. */
(function planrAutomatik(){
  if (KB_MODE!=="scriptable" || !planrDa || !planrBasis()) return;
  const zuletzt = S.einstellungen.planrZuletzt;
  if (zuletzt){
    const stunden = (Date.now() - new Date(zuletzt).getTime()) / 3600000;
    if (!(stunden >= 12)) return;
  }
  planrHolen(true);
})();

/* ================= Ergebnisse aus checkr =================
   checkr korrigiert und kennt nur den Code vom Deckblatt. Hier wird er wieder
   zum Menschen - das ist die einzige Stelle, an der beides zusammenkommt.
   Gerechnet und zugeordnet wird in kern/ergebnisse.js. */

function checkrBasis(){ return String(S.einstellungen.checkrUrl || "").trim(); }

/* Eingefügt werden darf die ganze Adresse aus dem Browser. Eine Kennung von Hand
   abzutippen ist eine Fehlerquelle, die man sich sparen kann. */
function checkrKennung(eingabe){
  const text = String(eingabe||"").trim();
  if (!text) return "";
  const treffer = text.match(/[?&]job=([A-Za-z0-9_-]{6,64})/);
  if (treffer) return treffer[1];
  if (/^[A-Za-z0-9_-]{6,64}$/.test(text)) return text;
  const letzter = text.split("/").filter(Boolean).pop() || "";
  return /^[A-Za-z0-9_-]{6,64}$/.test(letzter) ? letzter : "";
}

  return html;
}
