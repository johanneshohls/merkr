/* ================= Stoffverteilung aus planr =================
   planr plant, merkr hält fest, was war. Hierher kommt nur das Soll: Datum,
   Thema, Einheit. Es landet in st.geplant und lässt st.thema unberührt - was
   im Unterricht wirklich lief, schreibt niemand von außen.

   Diese Fassung von planImportieren ersetzt die frühere; sie ordnet zusätzlich
   über das Feld planrKlasse zu und übernimmt die Halbjahresgrenze. */

function planrBasis(){ return String(S.einstellungen.planrUrl || "").trim(); }
/* Steht die Verbindung, ist planr die Quelle des Solls - dann ist das Feld im
   Stundendialog nur noch zum Ansehen da. */
function planrGekoppelt(){ return KB_MODE==="scriptable" && planrDa && !!planrBasis(); }

function planrKarte(k){

    'Eigenes Feld, weil Kursnamen hier und dort auseinanderlaufen dürfen.</p>'+
    '<div class="zeile"><div class="feld" style="flex:1"><label>planr-Kurs</label>'+
    '<input id="planrKlasse" value="'+esc(k.planrKlasse||"")+'" placeholder="'+esc((k.fach?k.fach+" ":"")+k.name)+'"></div>'+
    '<button class="primar" data-a="planrKlasseSpeichern" data-id="'+k.id+'">Speichern</button></div></div>';

function planImportieren(text){
  let plan;
  try { plan = JSON.parse(text); }
  catch(e){ return {fehler:"Diese Datei lässt sich nicht lesen."}; }

  const fv = plan && plan.formatVersion;
  if (fv!=="kursbuch-plan-1" && fv!=="kursbuch-plan-2")
    return {fehler:"Das ist keine Stoffverteilung aus planr. Erwartet wird die Datei, die planr unter Freigaben ausgibt."};

  const sj = aktivesSchuljahr();
  if (!sj) return {fehler:"Es ist kein Schuljahr angelegt - ohne das gibt es keinen Kalender, in den die Stunden passen."};

  let ferienNeu=0, themen=0, mitReihe=0, grenzeNeu=false;
  /* Wie viel sich wirklich bewegt hat. Der stille Abruf beim Start soll nur
     dann die Ansicht neu bauen und melden, wenn planr etwas anderes sagt als
     beim letzten Mal - sonst zuckt die Oberfläche mehrmals täglich ohne Grund. */
  let geaendert=0;
  const unbekannt=[];

  /* planr führt den Beginn des zweiten Halbjahres ohnehin. Ihn hier zu
     übernehmen erspart das Nachtragen von Hand - und ohne ihn greift die harte
     Grenze im Notenvorschlag nie. */
  if (plan.schuljahr && plan.schuljahr.halbjahrGrenze && sj.halbjahrGrenze !== plan.schuljahr.halbjahrGrenze){
    sj.halbjahrGrenze = String(plan.schuljahr.halbjahrGrenze);
    grenzeNeu = true; geaendert++;
  }

  if (Array.isArray(plan.ferien)){
    sj.ferien = sj.ferien || [];
    for (const f of plan.ferien){
      if (f && f.von && f.bis && !sj.ferien.some(x=>x.von===f.von && x.bis===f.bis)){
        sj.ferien.push({name:String(f.name||"Ferien"), von:f.von, bis:f.bis});
        ferienNeu++; geaendert++;
      }
    }
  }

  /* Der Schultag, wie er wirklich liegt. Er ersetzt merkrs Wochenraster nur an
     den Tagen, über die der Vertretungsplan der Schule etwas sagt - drei, vier.
     Kommt er nicht mit (ältere planr-Fassung), bleibt der letzte Stand stehen,
     bis seine Tage vorbei sind; er verfällt von selbst. */
  if (plan.tagesplan && Array.isArray(plan.tagesplan.tage)){
    const alt = S.tagesplan ? JSON.stringify(S.tagesplan.tage_stunden||{}) : "";
    S.tagesplan = {
      tage: plan.tagesplan.tage.map(x=>String(x)),
      geholtAm: plan.tagesplan.geholtAm || null,
      tage_stunden: plan.tagesplan.tage_stunden || {}
    };
    if (JSON.stringify(S.tagesplan.tage_stunden) !== alt) geaendert++;
  }

  if (Array.isArray(plan.plaene)){
    for (const p of plan.plaene){
      const kurs = MerkrPlanr.kursFuer(S.kurse, p, sj.id);
      if (!kurs){ unbekannt.push(String(p.kurs||"?")); continue; }
      if (!kurs.reihenFarben || typeof kurs.reihenFarben!=="object") kurs.reihenFarben = {};

      for (const th of p.themen||[]){
        if (!th || !th.datum || !/^\d{4}-\d{2}-\d{2}$/.test(th.datum)) continue;
        const vorher = S.stunden.length;
        const st = ensureStunde(kurs.id, th.datum);
        if (S.stunden.length !== vorher) geaendert++;

        const neuesThema = String(th.thema||"");
        if (st.geplant !== neuesThema){ st.geplant = neuesThema; geaendert++; }

        if (th.reihe!=null && String(th.reihe).trim()){
          const neueReihe = String(th.reihe).trim();
          if (st.reihe !== neueReihe){ st.reihe = neueReihe; geaendert++; }
          jahrFarbe(kurs, st.reihe);
          mitReihe++;
        } else if (st.reihe==null) st.reihe = "";

        /* Woraus die TÜ gebaut ist - Grundlage der Rückmeldung, was gewackelt
           hat. Fehlt das Feld, bleibt die alte Liste stehen: ein Abruf ohne
           TÜ-Angabe soll die Auswahl nach der Stunde nicht löschen.

           Diese Übernahme war beim Umbau des Importers verlorengegangen. Der
           Rückweg stand seither vollständig da und bekam nie etwas zu zeigen -
           ein Fehler, den man nicht sieht, weil der leere Block einfach fehlt. */
        if (Array.isArray(th.tuThemen)){
          const neuTu = th.tuThemen.map(x=>String(x));
          if (String(st.tuThemen||"") !== String(neuTu)){ st.tuThemen = neuTu; geaendert++; }
        }

        /* Stundenziel und Verlauf. Sie stehen hier nicht zum Planen - geplant
           wird drüben -, sondern zum Abhaken: am Stundenende sieht man, was
           liegen blieb, und meldet es zurück. */
        if (th.ziel != null){
          const neuZiel = String(th.ziel).trim();
          if (st.ziel !== neuZiel){ st.ziel = neuZiel; geaendert++; }
        }
        if (Array.isArray(th.phasen)){
          const neuPh = th.phasen.filter(x=>x).map((x,i)=>({
            schluessel: String(x.schluessel || x.seq || (i+1)),
            name: String(x.phase || x.name || "").trim(),
            inhalt: String(x.inhalt || "").trim(),
            dauer: Number(x.dauerMin || x.dauer) || null
          })).filter(x=>x.name || x.inhalt);
          if (JSON.stringify(st.phasen||[]) !== JSON.stringify(neuPh)){ st.phasen = neuPh; geaendert++; }
        }
        themen++;
      }
    }
  }

  speichern();
  return {ferienNeu, themen, unbekannt, mitReihe, grenzeNeu, geaendert};
}

/* Abruf anstoßen. Das Wort liegt im Schlüsselbund, der Rahmen holt die Daten. */
function planrHolen(still){
  if (KB_MODE!=="scriptable") return alertBox("Der Abruf läuft nur in Scriptable.");
  if (!planrDa) { if (!still) alertBox("Bitte zuerst das planr-Wort in den Schlüsselbund legen."); return; }
  if (!planrBasis()) { if (!still) alertBox("Bitte zuerst die planr-Adresse eintragen."); return; }
  planrStill = !!still;
  if (!still) toast("Stoffverteilung wird geholt …");
  sendeAnBridge({typ:"planrAbruf", url: planrBasis()});
}
let planrStill = false;

window.__KB_planrAntwort = function(text){
  let plan = null;
  try { plan = JSON.parse(text); } catch(e){ plan = null; }
  if (plan && plan.fehler){
    if (!planrStill) alertBox("Abruf aus planr fehlgeschlagen: "+plan.fehler);
    return "fehler";
  }
  const erg = planImportieren(text);
  if (erg.fehler){
    if (!planrStill) alertBox("Abruf aus planr fehlgeschlagen: "+erg.fehler);
    return "fehler";
  }
  S.einstellungen.planrZuletzt = new Date().toISOString();
  speichern();

  /* Hat sich nichts bewegt, bleibt der stille Abruf auch still: kein
     Neuzeichnen, keine Meldung. Wer selbst auf "Jetzt holen" getippt hat,
     bekommt trotzdem eine Antwort - sonst wirkt der Knopf kaputt. */
  if (!erg.geaendert){
    if (planrStill) return "ok";
    toast("Aus planr: nichts Neues");
    return "ok";
  }

  zeichneWennFrei();
  const teile = [erg.themen+" Stunden"];
  if (erg.ferienNeu) teile.push(erg.ferienNeu+" Ferienzeiträume");
  if (erg.grenzeNeu) teile.push("Halbjahresgrenze");
  if (erg.unbekannt.length) teile.push("ohne Zuordnung: "+erg.unbekannt.join(", "));
  toast("Aus planr: "+teile.join(" · "));
  return "ok";
};

  }
  else if (a==="planrUrlSpeichern"){

    if (!feld) return;
    S.einstellungen.planrUrl = feld.value.trim().replace(/\/+$/,"");

  }
  else if (a==="planrWortSetzen"){

    const urlFeld = document.getElementById("planrUrl");

    sendeAnBridge({typ:"schluesselSetzen", name:"planr", key});

  }

    if (feld){ S.einstellungen.planrUrl = feld.value.trim().replace(/\/+$/,""); speichern(); }
    planrHolen(false);
  }
});

/* Automatik: beim Start holen, höchstens alle dreißig Minuten. Zwölf Stunden
   waren zu lang - in planr wird auch am Unterrichtstag noch umgestellt, und
   dann stand hier bis zum Abend das Soll von gestern. Dreißig Minuten heißt:
   jedes Aufschlagen nach einer Pause holt frisch, mehrfaches Öffnen in
   derselben Freistunde nicht. Still - wer das Klassenbuch aufschlägt, will
   keine Meldung über einen Abruf, der nichts geändert hat. Ohne Netz passiert
   nichts und der Zeitstempel bleibt stehen, der nächste Start versucht es
   wieder. */
const PLANR_PAUSE_MINUTEN = 30;
(function planrAutomatik(){
  if (KB_MODE!=="scriptable" || !planrDa || !planrBasis()) return;
  const zuletzt = S.einstellungen.planrZuletzt;
  if (zuletzt){
    const minuten = (Date.now() - new Date(zuletzt).getTime()) / 60000;
    if (!(minuten >= PLANR_PAUSE_MINUTEN)) return;
  }
  planrHolen(true);
})();

/* ================= Ergebnisse aus checkr =================
   checkr korrigiert und kennt nur den Code vom Deckblatt. Hier wird er wieder
   zum Menschen - das ist die einzige Stelle, an der beides zusammenkommt.
   Gerechnet und zugeordnet wird in kern/ergebnisse.js. */

function checkrBasis(){ return String(S.einstellungen.checkrUrl || "").trim(); }

/* Eingefügt werden darf die ganze Adresse aus dem Browser. Eine Kennung von Hand
   abzutippen ist eine Fehlerquelle, die man sich sparen kann. */
function checkrKennung(eingabe){
  const text = String(eingabe||"").trim();
  if (!text) return "";
  const treffer = text.match(/[?&]job=([A-Za-z0-9_-]{6,64})/);
  if (treffer) return treffer[1];
  if (/^[A-Za-z0-9_-]{6,64}$/.test(text)) return text;
  const letzter = text.split("/").filter(Boolean).pop() || "";
  return /^[A-Za-z0-9_-]{6,64}$/.test(letzter) ? letzter : "";
}

function checkrVorschauHtml(k){
  const b = checkrBericht;
  if (!b) return checkrDialogHtml();
  const sys = notensystem(k);
  const erg = MerkrErgebnisse.zuordnen(kursSchueler(k.id), b.schueler, sys.typ);
  checkrBericht.zuordnung = erg;

  let html = '<h2>'+esc(b.titel || (b.fach ? b.fach+" "+fmtDatum(b.datum) : "Arbeit aus checkr"))+'</h2>'+
    '<p class="hinweis">'+esc(b.klasse||"")+' · '+fmtDatum(b.datum)+' · '+erg.treffer.length+
    ' von '+b.schueler.length+' Zeilen zugeordnet</p>';

  if (erg.ohneSchueler.length)
    html += '<p class="hinweis" style="color:var(--rot)"><b>Kein Schüler zu: '+esc(erg.ohneSchueler.join(", "))+'.</b> '+
      'Diese Zeilen bleiben liegen - geraten wird nicht.</p>';
  if (erg.doppelt.length)
    html += '<p class="hinweis" style="color:var(--rot)">Doppelt in checkr: '+esc(erg.doppelt.join(", "))+'. Nur die erste Zeile zählt.</p>';
  if (erg.ohneArbeit.length)
    html += '<p class="hinweis">Ohne Ergebnis: '+esc(erg.ohneArbeit.join(", "))+'.</p>';

  html += '<table class="tab"><tr><th>Schüler</th><th>Kürzel</th><th>Punkte</th><th>%</th><th>'+(sys.typ==="punkte"?"Punkte":"Note")+'</th></tr>';
  for (const t of erg.treffer){
    const s = schuelerVon(t.schuelerId);
    html += '<tr><td><b>'+esc(s ? s.name+", "+s.vorname : "?")+'</b></td>'+
      '<td class="hinweis">'+esc(t.code)+'</td>'+
      '<td>'+fmtZahl(t.erreicht,1)+' / '+fmtZahl(t.maximal,1)+'</td>'+
      '<td>'+t.prozent+'</td><td><b>'+t.wert+'</b></td></tr>';
  }
  html += '</table><p class="hinweis">Umgerechnet nach dem Notenschlüssel Sek I M-V (96/80/60/40/20 %). '+
    'Was schon eingetragen ist, bleibt stehen.</p>'+
    '<div class="zeile"><button class="primar" data-a="checkrUebernehmen">'+
    (erg.treffer.length===1 ? "Ein Ergebnis übernehmen" : erg.treffer.length+" Ergebnisse übernehmen")+'</button>'+
    '<button data-a="modalZu">Abbrechen</button></div>';
  return html;
}

window.__KB_checkrAntwort = function(text){
  const status = document.getElementById("checkrStatus");
  let daten = null;
  try { daten = JSON.parse(text); } catch(e){ daten = null; }
  if (!daten || daten.fehler || !Array.isArray(daten.schueler)){
    const grund = daten && daten.fehler ? daten.fehler : "Antwort nicht lesbar.";
    if (status) status.textContent = "Fehlgeschlagen: "+grund;
    else alertBox("Abruf aus checkr fehlgeschlagen: "+grund);
    return "fehler";
  }
  checkrBericht = daten;
  const k = kursVon(R.kursId);
  if (k) zeigeModal(checkrVorschauHtml(k));
  return "ok";
};

document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;

  if (a==="checkrDialog"){
    checkrBericht = null;
    zeigeModal(checkrDialogHtml());
  }
  else if (a==="checkrHolen"){
    if (KB_MODE!=="scriptable") return alertBox("Der Abruf läuft nur in Scriptable.");
    if (!checkrDa) return alertBox("Bitte zuerst das checkr-Wort in den Schlüsselbund legen (Einstellungen).");
    if (!checkrBasis()) return alertBox("Bitte zuerst die checkr-Adresse eintragen (Einstellungen).");
    const feld = document.getElementById("checkrJob");
    const job = checkrKennung(feld ? feld.value : "");
    if (!job) return alertBox("Daraus wird keine Kennung. Bitte die Adresse aus dem Browser einfügen.");
    const status = document.getElementById("checkrStatus");
    if (status) status.textContent = "wird geholt …";
    sendeAnBridge({typ:"checkrAbruf", url: checkrBasis(), job});
  }
  else if (a==="checkrUebernehmen"){
    const k = kursVon(R.kursId);
    const b = checkrBericht;
    if (!k || !b || !b.zuordnung) return;

    /* Dieselbe Arbeit zweimal zu holen darf keine zweite Zeile anlegen - sonst
       zählt sie doppelt in den Notenstand. */
    let arb = S.arbeiten.find(x=>x.kursId===k.id && x.checkrJob===b.job_id);
    if (!arb){
      arb = {id:uid(), kursId:k.id, titel: b.titel || ((b.fach||"Arbeit")+" "+fmtDatum(b.datum)),
        art:"Klassenarbeit", bereich:"arbeit", datum: b.datum || todayISO(), gewicht:1,
        ergebnisse:{}, checkrJob: b.job_id};
      S.arbeiten.push(arb);
    }
    const zus = MerkrErgebnisse.zusammenfuehren(arb.ergebnisse, b.zuordnung.treffer);
    arb.ergebnisse = zus.ergebnisse;
    speichern(); schliessePopover(); zeichne();
    toast(zus.neu+(zus.neu===1?" Ergebnis übernommen":" Ergebnisse übernommen")+
      (zus.behalten ? ", "+zus.behalten+" vorhandene behalten" : ""));
    checkrBericht = null;
  }
  else if (a==="checkrWortSetzen"){
    const feld = document.getElementById("checkrKey");
    const key = feld ? feld.value.trim() : "";
    if (!key) return alertBox("Bitte das Wort eintragen.");
    const urlFeld = document.getElementById("checkrUrl");
    if (urlFeld) S.einstellungen.checkrUrl = urlFeld.value.trim().replace(/\/+$/,"");
    sendeAnBridge({typ:"schluesselSetzen", name:"checkr", key});
    checkrDa = true;
    speichern(); zeichne(); toast("Wort im Schlüsselbund abgelegt");
  }
  else if (a==="checkrWortEntfernen"){
    sendeAnBridge({typ:"schluesselEntfernen", name:"checkr"});
    checkrDa = false;
    zeichne(); toast("Wort entfernt");
  }
  else if (a==="checkrUrlSpeichern"){
    const feld = document.getElementById("checkrUrl");
    if (!feld) return;
    S.einstellungen.checkrUrl = feld.value.trim().replace(/\/+$/,"");
    speichern(); zeichne(); toast("Adresse gespeichert");
  }
});

/* ================= Einrichten =================
   Vorher verteilte sich das Startsetup auf Willkommensseite, Kurs-Tab,
   Kürzel-Karte, planr-Karte und checkr-Karte - fünf Orte, und keiner zeigte,
   was noch fehlt. Diese Karte steht ganz oben in den Einstellungen und
   verschwindet zu einer Zeile, sobald alles steht. */

function einrichtenSchritte(){
  const sj = aktivesSchuljahr();
  const kurse = sj ? S.kurse.filter(k=>k.schuljahrId===sj.id) : [];
  const sus = S.schueler.filter(s=>kurse.some(k=>(s.kursIds||[]).includes(k.id)));
  const ohneKuerzel = sus.filter(s=>!MerkrKuerzel.normalisiert(s.kuerzel)).length;
  const ohneSlots = kurse.filter(k=>!(k.slots||[]).length).length;
  const stunden = S.stunden.length;

  return [
    { fertig: !!sj, titel: "Schuljahr anlegen",
      offen: "Ohne Schuljahr gibt es keinen Kalender.",
      steht: sj ? sj.name + (sj.ferien && sj.ferien.length
        ? " · " + sj.ferien.length + (sj.ferien.length === 1 ? " Ferienzeitraum" : " Ferienzeiträume")
        : " · noch keine Ferien") : "",
      knopf: null },
    { fertig: kurse.length > 0, titel: "Kurse anlegen",
      offen: "Für jede Lerngruppe einen Kurs.",
      steht: kurse.length + (kurse.length === 1 ? " Kurs" : " Kurse"),
      knopf: ["Kurs anlegen", "kursNeuDialog", null] },
    { fertig: kurse.length > 0 && ohneSlots === 0, titel: "Stundenplan je Kurs",
      offen: kurse.length === 0 ? "Erst mit Kursen." :
        ohneSlots + (ohneSlots === 1 ? " Kurs ohne Stunden im Wochenraster." : " Kurse ohne Stunden im Wochenraster.") + " Ohne ihn bleibt die Heute-Ansicht leer.",
      steht: "alle Kurse im Wochenraster", knopf: null },
    { fertig: sus.length > 0, titel: "Schüler eintragen",
      offen: "Namen zeilenweise einfügen, aus der Klassenliste.",
      steht: sus.length + (sus.length === 1 ? " Schüler" : " Schüler"), knopf: null },
    { fertig: sus.length > 0 && ohneKuerzel === 0, titel: "Kürzel vergeben",
      offen: ohneKuerzel > 0 ? ohneKuerzel + " ohne Kürzel. Ohne sie findet checkr die Arbeiten nicht wieder." : "Erst mit Schülern.",
      steht: "alle vergeben", knopf: null },
    { fertig: planrDa && !!planrBasis(), titel: "planr verbinden",
      offen: "Dann holt merkr die Stoffverteilung von selbst.",
      steht: stunden > 0 ? stunden + " Stunden geholt" : "verbunden", knopf: ["Jetzt holen", "planrJetzt", null] },
    { fertig: checkrDa && !!checkrBasis(), titel: "checkr verbinden",
      offen: "Für die Punkte einer Arbeit unter dem Kürzel.",
      steht: "verbunden", knopf: null },
  ];
}

function einrichtenKarte(){
  const schritte = einrichtenSchritte();
  const offen = schritte.filter(s=>!s.fertig);

  if (!offen.length)
    return '<div class="karte"><div class="zeile raum"><div><b>Einrichtung steht.</b> '+
      '<span class="hinweis">'+esc(schritte[5].steht)+'</span></div></div></div>';

  let html = '<div class="karte"><h2>Einrichten</h2>'+
    '<p class="hinweis">'+(schritte.length - offen.length)+' von '+schritte.length+' erledigt. '+
    'Die Reihenfolge zählt: ohne Schuljahr keine Kurse, ohne Schüler keine Kürzel.</p><table class="tab">';

  for (const s of schritte){
    html += '<tr><td style="width:22px">'+(s.fertig ? "●" : "○")+'</td>'+
      '<td><b>'+esc(s.titel)+'</b><div class="hinweis">'+esc(s.fertig ? s.steht : s.offen)+'</div></td>'+
      '<td style="text-align:right">'+
      (!s.fertig && s.knopf ? '<button class="klein primar" data-a="'+s.knopf[1]+'"'+(s.knopf[2]?' data-id="'+s.knopf[2]+'"':'')+'>'+s.knopf[0]+'</button>' : '')+
      '</td></tr>';
  }
  return html + '</table></div>';
}

/* ================= Heute, im neuen Design =================

   dann der Stundenplan des Tages mit einer Marke je Stunde, die sagt, ob dort
   schon etwas notiert ist. Zuletzt die offenen Punkte - aber nur echte. */

function heuteMarke(text, art){
  const farben = {
    gut:   ["#eaf3ee", "var(--s2)"],
    offen: ["var(--akzent-hell)", "var(--text2)"],
    fehlt: ["#fdf3e6", "#a3611a"],

}


/* ================= Anwesenheit, Profil und Arbeiten im neuen Design =================
   Nach dem Entwurf von Claude Design. Die Datenschicht bleibt unverändert, nur
   die Darstellung ist neu - jede Aktion trägt dieselbe data-a wie vorher. */

/* --- Anwesenheit: alle sind da, angetippt wird die Abweichung --- */
anwesenheitDialogHtml = function(k, alsTab){
  const st = ensureStunde(k.id, R.datum);
  const schueler = kursSchueler(k.id).slice()
    .sort((a,b)=>((a.name||"")+" "+(a.vorname||"")).localeCompare((b.name||"")+" "+(b.vorname||""),"de"));

  const zustaende = [["fehlt","fehlt","var(--rot)"],["verspaetet","verspätet","var(--sm1)"],["beurlaubt","beurlaubt","var(--text2)"]];
  let html = '<h2>Anwesenheit</h2>'+
    '<p class="hinweis">'+fmtDatum(R.datum)+' · '+esc(k.name)+' · alle sind da, angetippt wird die Abweichung.</p>';

  if (!schueler.length) return html + leer("Noch keine Schüler in diesem Kurs.", "Schüler hinzufügen", "tab", "kurscfg");

  const zaehler = {fehlt:0, verspaetet:0, beurlaubt:0};
  for (const s of schueler){
    const a = anwesenheitVon(s.id, st.id);
    if (a && zaehler[a.status]!=null) zaehler[a.status]++;
  }
  html += '<div class="karte" style="padding:10px 14px;margin-bottom:12px;display:flex;gap:22px">'+
    '<div><b style="font-size:20px">'+(schueler.length - zaehler.fehlt - zaehler.beurlaubt)+'</b> <span class="hinweis">da</span></div>'+
    '<div><b style="font-size:20px;color:var(--rot)">'+zaehler.fehlt+'</b> <span class="hinweis">fehlt</span></div>'+
    '<div><b style="font-size:20px;color:var(--sm1)">'+zaehler.verspaetet+'</b> <span class="hinweis">verspätet</span></div>'+
    '<div><b style="font-size:20px">'+zaehler.beurlaubt+'</b> <span class="hinweis">beurlaubt</span></div></div>';

  for (const s of schueler){
    const a = anwesenheitVon(s.id, st.id);
    const stat = a ? a.status : "anwesend";
    html += '<div class="karte" style="display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:7px">'+
      '<div style="flex:1"><b>'+esc(s.name)+', '+esc(s.vorname)+'</b>'+
      /* Nur die Minuten sind eine Zusatzangabe. "fehlt" unter einem Knopf, der
         schon "fehlt" heißt und hervorgehoben ist, sagt nichts Neues. */
      (stat==="verspaetet" ? '<div class="hinweis">'+(a.minuten||5)+' Minuten</div>' : '')+'</div>';
    for (const [wert, label, farbe] of zustaende){
      const an = stat===wert;
      html += '<button class="klein" style="border-radius:999px;padding:7px 14px;font-weight:800;'+
        (an ? 'background:'+farbe+';color:#fff' : '')+'" data-a="anwSetzen" data-id="'+s.id+'" data-stunde="'+st.id+
        '" data-status="'+(an?"anwesend":wert)+'">'+label+'</button>';
    }
    if (stat==="verspaetet")
      html += '<button class="klein" data-a="anwMinuten" data-id="'+s.id+'" data-stunde="'+st.id+'">+5 min</button>';
    html += '</div>';
  }
  /* Als Tab braucht es keinen Schlussknopf - man bleibt einfach. */
  return html + (alsTab ? '' : '<div class="abstand"></div><button class="primar" data-a="modalZu">Fertig</button>');
};

/* --- Schülerprofil: die Zahl und woher sie kommt --- */
const profilVorher = viewProfil;
viewProfil = function(){
  const s = schuelerVon(R.schuelerId); if(!s){ R.view="home"; return viewHome(); }
  const k = kursVon(R.kursId); if(!k){ R.view="home"; return viewHome(); }
  const sys = notensystem(k);
  const ns = notenstand(s.id, k.id);
  const vs = notenvorschlag(s.id, k.id);
  const mz = mitarbeitZusammenfassung(s.id, k.id);
  const fz = fehlzeiten(s.id, k.id);
  const evs = S.ereignisse.filter(e=>e.schuelerId===s.id && e.kursId===k.id).sort((a,b)=>b.ts.localeCompare(a.ts));
  const initialen = ((s.vorname||"?")[0]+(s.name||"?")[0]).toUpperCase();

  let html = '<div style="display:flex;align-items:center;gap:16px;margin-bottom:18px">'+
    '<div style="width:56px;height:56px;border-radius:16px;background:var(--akzent);color:#fff;'+
    'display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900">'+esc(initialen)+'</div>'+
    '<div style="flex:1"><h1 style="font-size:26px;font-weight:900;margin:0">'+esc(s.vorname)+' '+esc(s.name)+'</h1>'+
    '<div class="hinweis">'+esc(k.name)+' · '+(vs?vs.anzahl:0)+((vs?vs.anzahl:0)===1?" Notiz":" Notizen")+
    ' in diesem Halbjahr</div></div>'+
    '<button data-a="profilPdf" data-id="'+s.id+'">Als PDF</button>'+
    '<button class="primar" data-a="tab" data-id="sitzplan">Zurück zum Sitzplan</button></div>';

  /* Der Vorschlag - groß, mit seiner Grundlage darunter. */
  html += '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">'+
    'Notenvorschlag Halbjahr</div>';
  if (vs){
    html += '<div style="display:flex;align-items:baseline;gap:12px;margin:6px 0 4px">'+
      '<div style="font-size:46px;font-weight:900;line-height:1">'+fmtZahl(vs.genau,1)+'</div>'+
      '<div class="hinweis" style="font-size:15px">Vorschlag — du entscheidest</div></div>'+
      herkunftHtml(vs)+
      '<p class="hinweis">Eingetragen würde '+(sys.typ==="punkte"? vs.wert+" Punkte" : "eine "+vs.wert)+
      '. Frische Notizen wiegen schwerer: nach acht Wochen zählt eine halb.</p>'+
      '<div class="zeile"><button class="primar" data-a="noteDialog" data-id="'+s.id+'">Als Halbjahresnote übernehmen</button>'+
      '<button data-a="noteDialog" data-id="'+s.id+'">Abweichen und begründen</button></div>';
  } else {
    html += '<p class="hinweis" style="margin-top:8px">In diesem Halbjahr hat noch keine Stunde stattgefunden. '+
      'Der Vorschlag entsteht aus dem Verhältnis von Notizen zu gehaltenen Stunden - ohne Stunden gibt es keins.</p>';
  }
  html += '</div>';

  /* Der Verlauf steht direkt unter der Zahl. Eine Halbjahresnote ist ein
     Standbild; ob jemand sich gefangen hat oder abgerutscht ist, sieht man erst
     an der Bewegung - und genau danach wird im Elterngespräch gefragt. */
  const vl = notenverlauf(s.id, k.id);
  if (vl && vl.length > 1){
    const erste = vl[0], letzte = vl[vl.length-1];
    const diff = Math.round((erste.note - letzte.note) * 10) / 10;
    html += '<div class="karte"><div class="zeile raum">'+
      '<div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Verlauf über das Schuljahr</div>'+
      '<div class="hinweis">'+(Math.abs(diff) < 0.15 ? "gleichbleibend"
        : diff > 0 ? "um "+fmtZahl(Math.abs(diff),1)+" verbessert"
                   : "um "+fmtZahl(Math.abs(diff),1)+" abgefallen")+'</div></div>'+
      '<div style="margin:14px 0 2px;color:var(--text2)">'+mitarbeitVerlaufSvg(vl)+'</div>'+
      '<p class="hinweis" style="margin:2px 0 0">Die Linie ist der Stand nach jeder Stunde, '+
      'die Balken sind der Beitrag der einzelnen Stunde. Berechnet wie der Vorschlag oben, '+
      'nur bis zum jeweiligen Tag.</p></div>';
  }

  /* Notenstand und Mitarbeit nebeneinander */
  html += '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Mitarbeit nach Kategorie</div>';
  for (const kat of MITARBEIT_KATEGORIEN){
    const z = mz[kat.id];
    html += '<div style="margin-top:12px"><div class="zeile raum"><b>'+esc(kat.name)+'</b>'+
      '<span class="hinweis">'+z.anzahl+(z.anzahl===1?" Notiz":" Notizen")+'</span></div>'+
      '<div style="display:flex;gap:3px;margin-top:5px">';
    for (const stufe of STUFEN){
      const n = z.counts[stufe.v] || 0;
      const breite = z.anzahl ? Math.round(n / z.anzahl * 100) : 0;
      if (n) html += '<div style="flex:'+n+';height:14px;border-radius:5px;background:'+stufe.hex+'" title="'+
        n+"x "+stufe.label+' ('+breite+' %)"></div>';
    }
    if (!z.anzahl) html += '<div style="flex:1;height:14px;border-radius:5px;background:var(--akzent-hell)"></div>';
    html += '</div></div>';
  }
  /* Verweigerungen stehen sonst nirgends. Ohne sie zählt die Kopfzeile Notizen,
     die in dieser Karte fehlen - und der Vorschlag sähe aus, als käme er aus
     dem Nichts. */
  const ohneLeistung = MerkrMitarbeit.VERWEIGERT.concat(MerkrMitarbeit.UNERLEDIGT)
    .map(function(typ){
      return {typ: typ, n: S.ereignisse.filter(function(e){
        return e.schuelerId===s.id && e.kursId===k.id && e.typ===typ; }).length};
    }).filter(function(x){ return x.n; });
  if (ohneLeistung.length){
    html += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--linie)">';
    for (const x of ohneLeistung)
      html += '<div class="zeile raum" style="padding:2px 0"><span>'+esc(ereignisNameVonTyp(x.typ))+'</span>'+
        '<b>'+x.n+'</b></div>';
    html += '<p class="hinweis" style="margin:6px 0 0">Zählt als fehlende Leistung der Stunde, nicht als Abzug daneben.</p></div>';
  }
  html += '</div>';

  /* Fehlzeiten */
  html += '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Fehlzeiten</div>'+
    '<div style="display:flex;gap:26px;margin-top:10px">'+
    '<div><div style="font-size:26px;font-weight:900">'+(fz.fehltGesamt - fz.unentschuldigt - fz.offen)+'</div><div class="hinweis">entschuldigt</div></div>'+
    '<div><div style="font-size:26px;font-weight:900;color:'+(fz.unentschuldigt?'var(--rot)':'inherit')+'">'+fz.unentschuldigt+'</div><div class="hinweis">unentschuldigt</div></div>'+
    '<div><div style="font-size:26px;font-weight:900;color:'+(fz.offen?'var(--rot)':'inherit')+'">'+fz.offen+'</div><div class="hinweis">offen</div></div>'+
    '<div><div style="font-size:26px;font-weight:900">'+fz.verspaetungen+'</div><div class="hinweis">verspätet, '+fz.minuten+' min</div></div></div>';
  if (fz.offen) html += '<div class="abstand"></div><button data-a="tab" data-id="liste">'+fz.offen+
    (fz.offen===1?' offene Fehlzeit klären':' offene Fehlzeiten klären')+'</button>';
  html += '</div>';

  /* Notenstand */
  html += '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Stand</div>'+
    '<div style="display:flex;gap:26px;margin-top:10px">'+
    '<div><div style="font-size:26px;font-weight:900">'+fmtZahl(ns.gesamt)+'</div><div class="hinweis">gesamt</div></div>'+
    '<div><div style="font-size:22px;font-weight:800">'+fmtZahl(ns.arb)+'</div><div class="hinweis">Klassenarbeiten</div></div>'+
    '<div><div style="font-size:22px;font-weight:800">'+fmtZahl(ns.son)+'</div><div class="hinweis">sonstige</div></div>'+
    '<div><div style="font-size:22px;font-weight:800">'+fmtZahl(ns.m)+'</div><div class="hinweis">davon mündlich</div></div></div>'+
    '<p class="hinweis" style="margin-top:10px">'+esc(gewichtungsText(k))+'</p></div>';

  /* Die Notizen, aus denen die Zahlen kommen */
  html += '<div class="karte"><div class="zeile raum">'+
    '<div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Letzte Notizen</div>'+
    '<span class="hinweis">jede Zahl oben stammt aus dieser Liste</span></div>';
  if (!evs.length) html += '<p class="hinweis" style="margin-top:8px">Noch keine Notiz.</p>';
  else {
    for (const e of evs.slice(0,12)){
      const st = stundeVon(e.stundeId);
      const si = e.stufe==null ? null : stufeInfo(e.stufe);
      html += '<div style="display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--linie)">'+
        (si ? '<span style="width:26px;height:22px;border-radius:6px;background:'+si.hex+';color:#fff;display:flex;'+
          'align-items:center;justify-content:center;font-size:11px;font-weight:900">'+si.label+'</span>'
            : '<span style="width:26px"></span>')+
        '<b style="min-width:150px">'+esc(ereignisName(e))+'</b>'+
        '<span style="flex:1" class="hinweis">'+esc(e.text || (st && st.thema ? st.thema : ""))+'</span>'+
        '<span class="hinweis">'+(st?fmtDatumKurz(st.datum):"")+'</span></div>';
    }
    if (evs.length>12) html += '<p class="hinweis" style="margin-top:8px">'+(evs.length-12)+' weitere.</p>';
  }
  html += '</div>';

  if (s.notizen) html += '<div class="karte"><div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px">Notiz zum Schüler</div><p>'+esc(s.notizen)+'</p></div>';
  return html;
};

/* ================= Einrichten, nach dem Entwurf =================
   Sieben nummerierte Schritte, darunter die Entscheidungen, die merkr getroffen
   hat. Steht alles, schrumpft der Bereich auf eine Zeile.

   Abweichung vom Entwurf, mit Absicht: dort trägt jede Entscheidung einen
   Knopf. Hier bekommt nur die einen, die sich wirklich ändern lässt. Ein Knopf,
   der nichts tut, ist schlimmer als eine Zahl ohne Knopf. */

function einrichtenAufgeklappt(){
  /* localStorage steht in Scriptable nicht sicher zur Verfügung, deshalb am
     Zustand: eine Sitzung lang gemerkt reicht für diesen Schalter. */
  return R.einrichtenOffen !== false;
}

function einrichtenEntscheidungen(){
  const sj = aktivesSchuljahr();
  const kurse = sj ? S.kurse.filter(k=>k.schuljahrId===sj.id) : [];
  const anteile = [...new Set(kurse.map(k=>100 - gewSonstige(k)))];
  const anteil = !kurse.length ? "noch kein Kurs"
    : anteile.length === 1 ? anteile[0]+" %" : "je Kurs verschieden";

  return [
    { frage: "Wie viel zählen Klassenarbeiten?",
      hinweis: "Der Rest sind die sonstigen Leistungen, darin die mündliche Note",
      wert: anteil,
      knopf: kurse.length ? ["Im Kurs ändern", "kursOeffnen", kurse[0].id] : null },
    { frage: "Wie lange wiegt eine Mitarbeitsnotiz voll?",
      hinweis: "Nach "+MerkrNoten.HALBWERTSZEIT_WOCHEN+" Wochen zählt sie halb, sie verschwindet aber nie ganz",
      wert: MerkrNoten.HALBWERTSZEIT_WOCHEN+" Wochen", knopf: null },
    { frage: "Notenschlüssel",
      hinweis: "Vorgabe des Landes, gilt für jede Arbeit: 96 / 80 / 60 / 40 / 20 Prozent",
      wert: "MV", knopf: null },
    { frage: "Ab wann erinnert merkr an die Sicherung?",
      hinweis: "Die laufende Ablage liegt in iCloud, der Export ist die zweite Sicherung",
      wert: "nach 7 Tagen", knopf: null },
  ];
}

function viewEinrichten(){

      (!s.fertig && s.knopf
        ? '<button class="klein primar" data-a="'+s.knopf[1]+'"'+(s.knopf[2]?' data-id="'+s.knopf[2]+'"':'')+'>'+s.knopf[0]+'</button>'
        : '')+

  html += '</div>';

  /* Die Entscheidungen */
  html += '<h2 style="font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);margin:24px 0 8px">Entscheidungen</h2>'+
    '<div class="karte" style="padding:6px 16px">';
  const ents = einrichtenEntscheidungen();
  ents.forEach((e, i)=>{

    'das Datum ist heute, der Kurs kommt aus dem Stundenplan, gerundet wird nach dem Landesschlüssel.</p>';

  return html;
}

/* ================= Wochenplan auf der Startseite =================
   Die Startseite zeigt die laufende Woche, nicht mehr die Kursliste. Die Kurse
   stehen jetzt hinter einem eigenen Ziel in der Seitenleiste - auf der
   Startseite beantwortet merkr die Frage "was ist wann", nicht "was habe ich". */

function kurseAmTag(iso){
  const sj = aktivesSchuljahr(); if(!sj) return [];
  const wt = new Date(iso+"T12:00:00").getDay();
  const wb = wochenBuchstabe(sj, iso);
  const liste = [];
  for (const k of S.kurse.filter(x=>x.schuljahrId===sj.id))
    for (const slot of (k.slots||[]))
      if (slot.tag===wt && (slot.woche==="AB" || slot.woche===wb))
        liste.push({kurs:k, stunde:slot.stunde, woche:slot.woche});
  return liste.sort((a,b)=>a.stunde-b.stunde);
}

function wochenTage(iso){
  const mo = mondayOf(iso);
  const tage = [];
  for (let i=0; i<5; i++){
    const d = new Date(mo.getTime() + i*86400000);
    tage.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
  }
  return tage;
}

function stundenKarte(e, iso, istHeute){
  const st = S.stunden.find(x=>x.kursId===e.kurs.id && x.datum===iso);
  const thema = st && st.thema ? st.thema : (st && st.geplant ? st.geplant : "");
  const notizen = st ? S.ereignisse.filter(x=>x.stundeId===st.id && x.stufe!=null).length : 0;
  const gehalten = st && st.thema;

  return '<div class="karte" data-a="stundeOeffnen" data-id="'+e.kurs.id+'" data-datum="'+iso+'" '+
    /* Feste Breite statt Dehnen: eine einzelne Stunde soll nicht die ganze Zeile
       füllen, sonst steht daneben ein leeres Feld ohne Bedeutung. */
    'style="cursor:pointer;padding:11px 13px;margin:0;flex:0 1 250px;min-width:210px;'+
    (istHeute?'border:1px solid var(--akzent)':'')+'">'+
    '<div class="zeile raum" style="align-items:flex-start">'+
    '<div style="min-width:0"><b>'+e.stunde+'. · '+esc(e.kurs.name)+'</b>'+
    '<div class="hinweis" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">'+
    (thema ? esc(thema) : "kein Thema") + '</div></div>'+
    '<span style="width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:5px;background:'+
    (notizen ? "var(--s2)" : gehalten ? "var(--s0)" : "var(--linie)")+'" title="'+
    (notizen ? notizen+" Notizen" : gehalten ? "gehalten, nichts notiert" : "steht noch aus")+'"></span>'+
    '</div></div>';
}


/* --- Die Kurse, jetzt an eigener Stelle --- */
function viewKurse(){
  const sj = aktivesSchuljahr();
  if (!sj) return viewSchuljahrAnlegen();
  const kurse = S.kurse.filter(k=>k.schuljahrId===sj.id);

  let html = '<h1 style="font-size:26px;font-weight:900;margin:0 0 4px">Kurse</h1>'+
    '<p class="hinweis" style="margin:0 0 18px">'+esc(sj.name)+' · '+kurse.length+
    (kurse.length===1?" Lerngruppe":" Lerngruppen")+'</p>';

  if (!kurse.length) return html + leer("Noch kein Kurs angelegt.", "Kurs anlegen", "kursNeuDialog");

  for (const k of kurse){
    const anz = kursSchueler(k.id).length, sys = notensystem(k);
    const slots = (k.slots||[]).slice().sort((a,b)=>a.tag-b.tag||a.stunde-b.stunde)
      .map(s=>["","Mo","Di","Mi","Do","Fr"][s.tag]+" "+s.stunde+"."+(s.woche==="AB"?"":" ("+s.woche+")")).join(" · ");
    html += '<div class="karte" style="display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:9px;cursor:pointer" '+
      'data-a="kursOeffnen" data-id="'+k.id+'">'+
      '<div style="width:8px;height:40px;border-radius:99px;background:'+esc(k.farbe||"var(--akzent)")+'"></div>'+
      '<div style="flex:1;min-width:0"><b style="font-size:17px">'+esc(k.name)+'</b>'+
      '<div class="hinweis">'+esc(k.fach||"")+' · Jahrgang '+k.jahrgang+' · '+anz+' Schüler · '+
      (sys.typ==="punkte"?"0–15 Punkte":"Noten 1–6")+'</div>'+
      (slots ? '<div class="hinweis" style="margin-top:2px">'+esc(slots)+'</div>'
             : '<div class="hinweis" style="margin-top:2px;color:var(--sm1)">kein Stundenplan hinterlegt</div>')+
      '</div><div style="color:var(--text2);font-size:20px">›</div></div>';
  }
  return html + '<div class="abstand"></div><button class="primar" data-a="kursNeuDialog">Kurs anlegen</button>';
}

/* ================= Stundenzeiten =================
   merkr braucht sie für den Schnellzugriff: welche Stunde läuft gerade. planr
   führt nur Blocknummern, also stehen sie hier. Die Vorgabe ist ein übliches
   Raster und ausdrücklich zu prüfen - eine falsche Uhrzeit zeigt die falsche
   Klasse. Zu ändern in den Einstellungen. */

/* Das EBG unterrichtet in Doppelstunden: vier Blöcke zu je 90 Minuten, Beginn
   7:40, 9:40, 11:40 und 13:40. Deshalb steht hier der Block und nicht die
   Einzelstunde - sonst gälte eine Stunde als "läuft" und die zweite Hälfte
   desselben Blocks als Pause. */
const BLOCKZEITEN_VORGABE = [
  {block:1, stunden:[1,2], von:"07:40", bis:"09:10"},
  {block:2, stunden:[3,4], von:"09:40", bis:"11:10"},
  {block:3, stunden:[5,6], von:"11:40", bis:"13:10"},
  {block:4, stunden:[7,8], von:"13:40", bis:"15:10"},
];

function stundenzeiten(){
  const eigene = S.einstellungen.blockzeiten;
  return Array.isArray(eigene) && eigene.length ? eigene : BLOCKZEITEN_VORGABE;
}
/** Der Block, in dem diese Stundennummer liegt. */
function zeitVon(nr){ return stundenzeiten().find(z=>(z.stunden||[]).includes(Number(nr))) || null; }
/** Wie der Block heißt: "1./2." statt "1." */
function blockLabel(nr){
  const z = zeitVon(nr);
  return z ? z.stunden.join("./")+"." : nr+".";
}
function jetztHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

/**
 * Was läuft gerade, und was kommt als Nächstes?
 *
 * "läuft" gilt zwischen Beginn und Ende der Stunde, "gleich" bis 20 Minuten
 * davor - in der Pause will man schon sehen, wohin man gleich geht.
 */
function aktuelleStunde(){
  const heute = todayISO();
  const jetzt = jetztHHMM();
  const liste = kurseAmTag(heute);
  let laeuft = null, naechste = null;
  for (const e of liste){
    if (e.art === "ausfall") continue;
    const z = zeitVon(e.stunde);
    if (!z) continue;
    if (jetzt >= z.von && jetzt < z.bis){ if (!laeuft) laeuft = {e, z}; }
    else if (jetzt < z.von && !naechste) naechste = {e, z};
  }
  if (laeuft) return {art:"laeuft", ...laeuft};
  if (naechste){
    const minuten = (Number(naechste.z.von.slice(0,2))*60 + Number(naechste.z.von.slice(3,5)))
      - (Number(jetzt.slice(0,2))*60 + Number(jetzt.slice(3,5)));
    return {art: minuten <= 20 ? "gleich" : "spaeter", minuten, ...naechste};
  }
  return null;
}

function schnellzugriff(){
  const a = aktuelleStunde();
  if (!a) return "";
  const kurs = a.e.kurs;
  const st = kurs ? S.stunden.find(x=>x.kursId===kurs.id && x.datum===todayISO()) : null;
  const thema = st && st.thema ? st.thema : (st && st.geplant ? st.geplant : "");
  const kopf = a.art==="laeuft" ? "Läuft gerade"
    : a.art==="gleich" ? "Gleich, in "+a.minuten+" Minuten" : "Als Nächstes heute";

  return '<div class="karte" style="display:flex;align-items:center;gap:16px;padding:16px 18px;margin-bottom:20px;'+
    'border:1px solid var(--akzent)">'+
    '<div style="background:var(--akzent);color:#fff;border-radius:14px;padding:10px 14px;text-align:center;min-width:74px">'+
    '<div style="font-size:19px;font-weight:900;line-height:1">'+esc(blockLabel(a.e.stunde))+'</div>'+
    '<div style="font-size:11px;font-weight:700;opacity:.85">'+esc(a.z.von)+'</div></div>'+
    '<div style="flex:1;min-width:0">'+
    '<div class="hinweis" style="text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800">'+kopf+'</div>'+
    '<div><b style="font-size:19px">'+esc(a.e.name || (kurs ? kurs.name : "?"))+'</b></div>'+
    '<div class="hinweis" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
    esc(a.e.hinweis || (a.e.raum ? "Raum "+a.e.raum : "") || thema || "kein Thema")+'</div></div>'+
    (kurs ? '<button class="primar" data-a="stundeOeffnen" data-id="'+kurs.id+'" data-datum="'+todayISO()+'">Sitzplan</button>' : '')+
    '</div>';
}

/* ================= Wochenplan als Raster =================
   Wochentage in den Spalten, Stunden in den Zeilen - so hängt jeder
   Stundenplan an jeder Schule. */

function viewWochenraster(){
  const sj = aktivesSchuljahr();
  const heute = todayISO();
  const anker = R.wochenAnker || heute;
  const tage = wochenTage(anker);
  const belegung = tage.map(iso=>({iso, liste: kurseAmTag(iso)}));

  const benutzte = [...new Set(belegung.flatMap(t=>t.liste.map(e=>e.stunde)))].sort((a,b)=>a-b);
  if (!benutzte.length)
    return leer("In dieser Woche steht kein Unterricht im Stundenplan.", "Kurse ansehen", "go", "kurse");

  /* Lücken dazwischen bleiben stehen, sonst rutscht die 7. neben die 3. und der
     Plan sieht dichter aus, als der Tag ist. */
  const zeilen = [];
  const gesehen = new Set();
  for (let n = benutzte[0]; n <= benutzte[benutzte.length-1]; n++){
    const z = zeitVon(n);
    const schluessel = z ? "b"+z.block : "s"+n;
    if (gesehen.has(schluessel)) continue;
    gesehen.add(schluessel);
    zeilen.push(n);
  }

  /* Feste Spaltenbreiten: sonst bekommt der Tag mit dem längsten Thema die
     halbe Woche und der Plan sieht schief aus. */
  let html = '<div style="overflow-x:auto"><table style="width:100%;table-layout:fixed;border-collapse:separate;'+
    'border-spacing:6px;min-width:640px"><colgroup><col style="width:54px">'+
    '<col style="width:19.2%"><col style="width:19.2%"><col style="width:19.2%"><col style="width:19.2%"><col style="width:19.2%">'+
    '</colgroup><tr><td></td>';
  for (const t of belegung){
    const istHeute = t.iso === heute;
    const wt = ["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(t.iso+"T12:00:00").getDay()];
    html += '<td style="text-align:center;padding-bottom:2px">'+
      '<div style="font-weight:800;font-size:13px;'+(istHeute?'color:var(--akzent)':'color:var(--text2)')+'">'+wt+'</div>'+
      '<div class="hinweis" style="font-size:11px">'+Number(t.iso.slice(8,10))+'.'+Number(t.iso.slice(5,7))+'.</div></td>';
  }
  html += '</tr>';

  for (const nr of zeilen){
    const z = zeitVon(nr);
    html += '<tr><td style="text-align:right;vertical-align:middle">'+
      '<div style="font-weight:800;font-size:13px">'+esc(blockLabel(nr))+'</div>'+
      (z?'<div class="hinweis" style="font-size:10px">'+esc(z.von)+'</div>':'')+'</td>';

    for (const t of belegung){
      const z2 = zeitVon(nr);
      const treffer = t.liste.filter(e=>z2 ? (z2.stunden||[]).includes(Number(e.stunde)) : e.stunde===nr);
      const istHeute = t.iso === heute;
      if (!treffer.length){
        html += '<td><div style="min-height:52px;border-radius:12px;background:'+
          (istHeute?'var(--akzent-hell)':'transparent')+'"></div></td>';
        continue;
      }
      html += '<td>';
      for (const e of treffer){
        const st = e.kurs ? S.stunden.find(x=>x.kursId===e.kurs.id && x.datum===t.iso) : null;
        const thema = st && st.thema ? st.thema : (st && st.geplant ? st.geplant : "");
        const notizen = st ? S.ereignisse.filter(x=>x.stundeId===st.id && x.stufe!=null).length : 0;
        const gehalten = st && st.thema;
        /* Was heute anders ist als im Plan - kommt aus planr, dort steht der
           Vertretungsplan der Schule. Ohne diese Zeilen sähe eine ausgefallene
           Stunde aus wie jede andere. */
        const ausfall = e.art === "ausfall";
        const anders = e.art && e.art !== "regulaer" ? e.art : "";
        const klickbar = e.kurs && !ausfall;
        const zusatz = [];
        if (anders === "verlegt") zusatz.push("verlegt");
        if (anders === "zusatz") zusatz.push("Vertretung");
        if (anders === "aufsicht") zusatz.push("Aufsicht");
        /* Der Raum steht nur da, wo er die Nachricht ist. Im Regelfall gehört
           die Zeile dem Thema - den Raum weiß man. */
        if (anders && e.raum) zusatz.push("Raum "+e.raum);
        const unterzeile = ausfall ? (e.hinweis || "fällt aus")
          : (zusatz.length ? zusatz.join(" · ") : thema);
        html += '<div '+(klickbar ? 'data-a="stundeOeffnen" data-id="'+e.kurs.id+'" data-datum="'+t.iso+'" ' : '')+
          'style="'+(klickbar?'cursor:pointer;':'')+'min-height:52px;border-radius:12px;padding:7px 9px;background:var(--karte);'+
          (ausfall?'opacity:.55;':'')+
          'border-left:5px solid '+esc((e.kurs && e.kurs.farbe) || (anders ? "var(--s2)" : "var(--akzent)"))+';'+
          (istHeute?'box-shadow:0 0 0 1px var(--akzent)':'box-shadow:var(--schatten)')+'">'+
          '<div class="zeile raum" style="gap:6px;align-items:flex-start">'+
          '<b style="font-size:13px;line-height:1.2'+(ausfall?';text-decoration:line-through':'')+'">'+
          esc(e.name || (e.kurs ? e.kurs.name : "?"))+'</b>'+
          (e.kurs ? '<span style="width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:3px;background:'+
            (notizen ? "var(--s2)" : gehalten ? "var(--s0)" : "var(--linie)")+'"></span>' : '')+'</div>'+
          (unterzeile ? '<div class="hinweis" style="font-size:11px;line-height:1.25;overflow:hidden;'+
            'display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(unterzeile)+'</div>' : '')+
          '</div>';
      }
      html += '</td>';
    }
    html += '</tr>';
  }
  return html + '</table></div>';
}

/* Die Startseite: Schnellzugriff, dann das Raster, dann die offenen Punkte. */

viewHome = function(){
  const sj = aktivesSchuljahr();

  const heute = todayISO();
  const anker = R.wochenAnker || heute;
  const tage = wochenTage(anker);
  const wb = wochenBuchstabe(sj, tage[0]);
  const imZweiten = sj.halbjahrGrenze && heute >= sj.halbjahrGrenze;
  const dieseWoche = wochenTage(heute)[0] === tage[0];
  const monat = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][Number(tage[0].slice(5,7))-1];

  let html = dieseWoche ? schnellzugriff() : "";

  html += '<div class="zeile raum" style="align-items:flex-end;margin-bottom:14px">'+
    '<div><h1 style="font-size:26px;font-weight:900;letter-spacing:-.4px;margin:0">'+

    '<p class="hinweis" style="margin:4px 0 0">'+

    '<div class="zeile"><button data-a="wocheZurueck">‹</button>'+
    (dieseWoche ? '' : '<button data-a="wocheHeute">Diese Woche</button>')+
    '<button data-a="wocheVor">›</button></div></div>';

  html += viewWochenraster();

  /* Offene Punkte wie gehabt */
  const of = offeneFehlzeiten(), bt = backupAlterTage();
  const gibtEsDaten = S.schueler.length > 0 || S.noten.length > 0 || S.ereignisse.length > 0;
  const punkte = [];
  if (of) punkte.push(["rot", of+(of===1?" Fehlzeit":" Fehlzeiten")+" ohne Entscheidung",
    "entschuldigt oder unentschuldigt ist noch offen", "Klären", "tab", "liste"]);
  if (gibtEsDaten && bt===null) punkte.push(["gelb", "Noch keine Sicherung exportiert",
    "die Daten liegen bisher nur in iCloud", "Jetzt sichern", "backupDialog", null]);
  else if (bt!==null && bt>7) punkte.push(["gelb", "Sicherung überfällig",
    "letzte Sicherung vor "+bt+" Tagen", "Jetzt sichern", "backupDialog", null]);

  if (punkte.length){
    html += '<h2 style="font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);margin:24px 0 8px">Offene Punkte</h2>';
    for (const [art, titel, unter, knopf, aktion, id] of punkte)
      html += '<div class="karte" style="display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:10px">'+

        '<div style="flex:1"><b>'+esc(titel)+'</b><div class="hinweis">'+esc(unter)+'</div></div>'+
        '<button data-a="'+aktion+'"'+(id?' data-id="'+id+'"':'')+'>'+knopf+'</button></div>';
  }
  return html;
};

/* ================= Unterrichtsfreie Tage =================
   Der Wochenplan rechnete allein aus dem Stundenraster: Wochentag stimmt,
   A/B-Woche stimmt, also Unterricht. Damit zeigte merkr auch in den
   Sommerferien und vor dem ersten Schultag einen vollen Plan.

   Das Raster weiß nichts über das Kalenderjahr - dafür sind Beginn, Ende und
   die Ferien des Schuljahres da, und die kommen aus planr. */

function unterrichtsfrei(iso){
  const sj = aktivesSchuljahr();
  if (!sj) return null;
  if (sj.beginn && iso < sj.beginn) return "vor Schuljahresbeginn";
  if (sj.ende && iso > sj.ende) return "nach Schuljahresende";
  for (const f of (sj.ferien || []))
    if (f && f.von && f.bis && iso >= f.von && iso <= f.bis) return f.name || "Ferien";
  return null;
}

/* Der Tag aus planr, in die Form gebracht, die der Wochenplan erwartet. */
function tagesplanAmTag(iso){
  const sj = aktivesSchuljahr(); if (!sj) return [];
  return MerkrTagesplan.amTag(S.tagesplan, iso, function(e){
    return MerkrPlanr.kursFuer(S.kurse, e, sj.id);
  });
}

const kurseAmTagRoh = kurseAmTag;
kurseAmTag = function(iso){
  /* Sagt planr über diesen Tag etwas, gilt das. merkrs eigenes Raster rechnet
     aus Wochentag und A/B-Woche und kann von einem Ausfall oder einer
     Vertretung nichts wissen - und der Vertretungsplan der Schule ist an dem
     Tag, an dem er gilt, die genauere Auskunft, auch über Ferien und Beginn. */
  if (MerkrTagesplan.gilt(S.tagesplan, iso)) return tagesplanAmTag(iso);
  if (unterrichtsfrei(iso)) return [];
  return kurseAmTagRoh(iso);
};

const rasterOhneFreie = viewWochenraster;
viewWochenraster = function(){
  const anker = R.wochenAnker || todayISO();
  const tage = wochenTage(anker);
  const gruende = tage.map(unterrichtsfrei);

  if (gruende.every(Boolean)){
    const namen = [...new Set(gruende)];
    return '<div class="karte" style="text-align:center;padding:34px 18px">'+
      '<div style="font-size:19px;font-weight:900">'+esc(namen.join(" · "))+'</div>'+
      '<p class="hinweis" style="margin:6px 0 0">In dieser Woche ist kein Unterricht.</p></div>';
  }

  let html = rasterOhneFreie();

  if (gruende.some(Boolean)){
    const namen = tage.map((iso,i)=>gruende[i]
      ? ["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(iso+"T12:00:00").getDay()]+": "+gruende[i] : null)
      .filter(Boolean);
    html += '<p class="hinweis" style="margin-top:8px">'+esc(namen.join(" · "))+'</p>';
  }
  return html;
};

/* ================= Kursleiste oben =================
   Die Seitenleiste bleibt schmal und global. Alles, was zu einem Kurs gehört,
   steht oben im Kurs selbst - mit einer Auswahl links, die den Kurs wechselt,
   ohne den Umweg über die Liste. */

zeichneSeitenleiste = function(){

/* ================= Anwesenheit hängt am Stundenplan =================
   Die Anwesenheit hing schon immer an einer Stunde, nicht an einem Tag - aber
   die Stunde entstand aus dem freien Datumsfeld. Damit ließ sich sonntags,
   in den Ferien und an Tagen ohne diesen Kurs eine Anwesenheit erfassen, und
   ensureStunde legte dafür eine Stunde an, die es im Plan nie gab.

   Jetzt kommt der Tag aus dem Plan: hat der Kurs an diesem Datum Unterricht?
   Wenn nicht, wird nichts angelegt, sondern der Weg zur nächsten oder letzten
   Stunde angeboten. */

function hatUnterricht(kursId, iso){
  /* Ein Ausfall bleibt in der Liste, damit der Wochenplan ihn zeigen kann - als
     Unterricht zählt er nicht: an einer Stunde, die nicht war, hängt nichts. */
  return kurseAmTag(iso).some(e=>e.kurs && e.kurs.id===kursId && e.art!=="ausfall");
}

/** Der nächste Unterrichtstag dieses Kurses ab iso, in Richtung schritt. */
function naechsterUnterrichtstag(kursId, iso, schritt){
  const sj = aktivesSchuljahr();
  if (!sj) return null;
  const d = new Date(iso+"T12:00:00");
  for (let i=0; i<200; i++){
    d.setDate(d.getDate() + schritt);
    const tag = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if (sj.beginn && tag < sj.beginn) return null;
    if (sj.ende && tag > sj.ende) return null;
    if (hatUnterricht(kursId, tag)) return tag;
  }
  return null;
}

function tagKopf(k){
  const zurueck = naechsterUnterrichtstag(k.id, R.datum, -1);

    '<b>'+wt+', '+esc(fmtDatum(R.datum))+'</b>'+
    (vor ? '<button class="klein" data-a="anwTag" data-datum="'+vor+'">›</button>'
         : '<button class="klein" disabled style="opacity:.35">›</button>')+
    (R.datum !== todayISO() && hatUnterricht(k.id, todayISO())
      ? '<button class="klein" data-a="anwTag" data-datum="'+todayISO()+'">Heute</button>' : '')+
    '</div>';
}

/* ================= Der Raum: 15 Zweiertische =================
   Drei nebeneinander, fünf Reihen hintereinander, vorne die Tafel. Die Plätze
   ergeben sich daraus - Platz 1 und 2 sitzen am ersten Tisch, 3 und 4 am
   zweiten. Wer umsetzt, zieht die Kachel trotzdem frei; gespeichert wird die
   Position wie bisher am Schüler. */

const RAUM = {
  spalten: 3, reihen: 5,
  tischBreite: 250, tischHoehe: 82,
  luecke: 26, reihenLuecke: 22,
  randOben: 62, randLinks: 24,
};

function platzPosition(nr){
  const tisch = Math.floor(nr / 2);
  const seite = nr % 2;
  const spalte = tisch % RAUM.spalten;
  const reihe = Math.floor(tisch / RAUM.spalten);
  return {
    x: RAUM.randLinks + spalte * (RAUM.tischBreite + RAUM.luecke) + seite * (RAUM.tischBreite / 2) + 6,
    y: RAUM.randOben + reihe * (RAUM.tischHoehe + RAUM.reihenLuecke) + 5,
  };
}

function raumHintergrund(){ return ""; }   /* ersetzt - die geltende Fassung steht weiter unten */

const sitzplanOhneRaum = viewSitzplan;
viewSitzplan = function(k){
  const html = sitzplanOhneRaum(k);
  const marke = '<div id="sitzflaeche">';
  if (!html.includes(marke)) return html;

  /* Die Kacheln ohne eigene Position auf die Plätze setzen. */
  const schueler = kursSchueler(k.id);
  let nr = 0;
  for (const s of schueler){
    if (s.sitz && s.sitz[k.id]) continue;
    const pos = platzPosition(nr++);
    if (!s.sitz || typeof s.sitz !== "object") s.sitz = {};
    s.sitz[k.id] = pos;
  }
  /* Erst nach dem Setzen neu bauen, sonst stehen die alten Koordinaten drin. */
  const neu = sitzplanOhneRaum(k);
  return neu.replace(marke, marke + raumHintergrund());
};

  const a = el.dataset.a;

  if (a==="aufrufen" || a==="aufrufNaechster"){
    const k = kursVon(a==="aufrufen" ? el.dataset.id : el.dataset.id);
    if (k) aufrufZiehen(k);
  }
  else if (a==="aufrufKategorie"){
    R.aufrufKategorie = el.dataset.id;
    const k = kursVon(R.kursId);
    /* Nicht neu ziehen - es ist derselbe Schüler, nur eine andere Frage an ihn. */
    if (k && R.aufrufAktuell) zeigeModal(aufrufDialog(k, R.aufrufAktuell, false));
  }
  else if (a==="aufrufKeineAntwort"){
    const k = kursVon(R.kursId);
    if (!k) return;
    addEreignis(el.dataset.id, k.id, "keine_antwort", null, "");
    const s = schuelerVon(el.dataset.id);
    toast((s?s.vorname+": ":"")+"keine Antwort notiert");
    aufrufZiehen(k);
  }
  else if (a==="aufrufStufe"){
    const k = kursVon(R.kursId);
    if (!k) return;
    addEreignis(el.dataset.id, k.id, el.dataset.kat || "qual_m", Number(el.dataset.stufe), "");
    const s = schuelerVon(el.dataset.id);
    toast((s?s.vorname+": ":"")+stufeInfo(Number(el.dataset.stufe)).label+" notiert");
    aufrufZiehen(k);
  }
  else if (a==="aufrufZuruecksetzen"){
    const k = kursVon(el.dataset.id);
    if (!k) return;
    k.aufrufTopf = []; k.aufrufZuletzt = null;
    speichern(); zeichne(); toast("Runde zurückgesetzt");
  }
});

/* Der Knopf über dem Sitzplan. */

      : 'niemand anwesend')+

/* ================= Sitzplan auch ohne Unterricht =================
   Die Bindung an den Stundenplan war zu streng: an Tagen ohne Unterricht
   verschwand der ganze Sitzplan. Zum Notieren ist das richtig, zum Einrichten
   der Sitzordnung nicht - in den Ferien und vor dem ersten Schultag will man
   die Plätze sortieren, ohne dass merkr behauptet, es sei nichts zu tun.

   Jetzt: sehen immer, notieren nur an Unterrichtstagen. */

const sitzplanStreng = viewSitzplan;
viewSitzplan = function(k){
  if (hatUnterricht(k.id, R.datum)) return sitzplanStreng(k);

  /* Ohne Unterricht: dieselben Kacheln, aber ein Band darüber und kein Aufruf. */
  const grund = unterrichtsfrei(R.datum);
  const vor = naechsterUnterrichtstag(k.id, R.datum, +1);
  const band = '<div class="karte" style="display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:10px">'+
    '<span style="width:9px;height:9px;border-radius:50%;background:var(--s0);flex:0 0 9px"></span>'+
    '<div style="flex:1"><b>'+esc(fmtDatum(R.datum))+' · kein Unterricht</b>'+
    '<div class="hinweis">'+(grund ? esc(grund)+" - " : "")+
    'Plätze lassen sich einrichten. Notieren geht auch - die Notiz legt dann eine Stunde an diesem Tag an.</div></div>'+
    (vor ? '<button data-a="anwTag" data-datum="'+vor+'">Zur nächsten Stunde</button>' : '')+
    '</div>';

  /* sitzplanOhnePlan ist die Fassung VOR der Stundenplan-Bindung - sie zeichnet
     die Kacheln ohne zu fragen, ob heute Unterricht ist. sitzplanOhneRaum wäre
     falsch: die prüft selbst schon und gäbe wieder nur den Hinweis zurück. */
  const schueler = kursSchueler(k.id);
  if (!schueler.length)
    return band + leer("Noch keine Schüler in diesem Kurs.", "Schüler hinzufügen", "tab", "kurscfg");

  let nr = 0;
  for (const s of schueler){
    if (s.sitz && s.sitz[k.id]) continue;
    if (!s.sitz || typeof s.sitz !== "object") s.sitz = {};
    s.sitz[k.id] = platzPosition(nr++);
  }
  const marke = '<div id="sitzflaeche">';
  const roh = sitzplanOhnePlan(k);
  return band + (roh.includes(marke) ? roh.replace(marke, marke + raumHintergrund()) : roh);
};

/* An Tagen ohne Unterricht führt ein Tippen aufs Profil statt in die Erfassung -
   notiert wird dort ohnehin nichts. */
const popupStreng = oeffnePopupSchueler;
/* Im Sitzplan führt der Klick immer in die Erfassung - dafür ist er da: man hat
   den Platz vor Augen und will notieren, nicht lesen. Eine frühere Fassung leitete
   an Tagen ohne Unterricht ins Profil um; das war als Schutz vor dem Anlegen von
   Ferienstunden gedacht, machte den Sitzplan aber in der Woche vor Schuljahresbeginn
   unbrauchbar. Jetzt steht der Hinweis im Popup, und die Entscheidung bleibt beim
   Menschen. Zum Datensatz führt der Knopf "Profil ›" im Popup und die Namensliste. */
oeffnePopupSchueler = function(schuelerId, ankerRect){
  return popupStreng(schuelerId, ankerRect);
};

/* ================= Liste führt ins Profil =================
   Aus einer Namensliste heraus will man den Menschen sehen, nicht die
   Schnellerfassung: dafür ist der Sitzplan da, wo man den Platz vor Augen hat. */

const listeMitPopup = viewListe;
viewListe = function(k){
  return listeMitPopup(k).replace(/data-a="popupSchueler"/g, 'data-a="profilOeffnen"');
};

/* ================= Tafel unten, Kacheln rasten auf Plätze =================
   Die Tafel steht jetzt unten - Gewohnheitssache, und der Raum liest sich für
   den, der ihn benutzt, nicht für den, der ihn zeichnet.

   Und das Einrasten: es lief auf ein 28-Pixel-Raster, das mit den Tischen
   nichts zu tun hatte. Deshalb landete jede Kachel "leicht daneben". Jetzt
   rastet sie auf einen der dreißig Plätze; ist der besetzt, tauschen die
   beiden. */

RAUM.randOben = 20;
RAUM.tafelOben = RAUM.randOben + RAUM.reihen * (RAUM.tischHoehe + RAUM.reihenLuecke) + 6;

raumHintergrund = function(){
  let html = "";
  for (let r = 0; r < RAUM.reihen; r++)
    for (let s = 0; s < RAUM.spalten; s++)
      html += '<div class="tisch" style="left:'+
        (RAUM.randLinks + s * (RAUM.tischBreite + RAUM.luecke))+'px;top:'+
        (RAUM.randOben + r * (RAUM.tischHoehe + RAUM.reihenLuecke))+'px;width:'+
        RAUM.tischBreite+'px;height:'+RAUM.tischHoehe+'px"></div>';
  html += '<div class="tafel" style="left:'+RAUM.randLinks+'px;top:'+RAUM.tafelOben+'px;width:'+
    (RAUM.spalten * RAUM.tischBreite + (RAUM.spalten-1) * RAUM.luecke)+'px;height:30px">TAFEL</div>';
  return html;
};

/** Der Platz, dessen Mitte einem Punkt am nächsten liegt. */
function naechsterPlatz(x, y){
  let beste = 0, abstand = Infinity;
  for (let i = 0; i < RAUM.spalten * RAUM.reihen * 2; i++){
    const p = platzPosition(i);
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < abstand){ abstand = d; beste = i; }
  }
  return beste;
}

/** Wer sitzt auf diesem Platz - verglichen wird über die Position. */
function werSitztAuf(kursId, index, ausser){
  const ziel = platzPosition(index);
  return kursSchueler(kursId).find(s=>{
    if (s.id === ausser) return false;
    const pos = s.sitz && s.sitz[kursId];
    return pos && Math.abs(pos.x - ziel.x) < 6 && Math.abs(pos.y - ziel.y) < 6;
  }) || null;
}

initSitzplanDrag = function(){
  const flaeche = document.getElementById("sitzflaeche");
  if (!flaeche) return;
  let aktiv = null, startX = 0, startY = 0, ox = 0, oy = 0, bewegt = false;

  flaeche.addEventListener("pointerdown", ev=>{
    const kachel = ev.target.closest(".stile"); if (!kachel) return;
    aktiv = kachel; bewegt = false;
    startX = ev.clientX; startY = ev.clientY;
    ox = kachel.offsetLeft; oy = kachel.offsetTop;
    try { kachel.setPointerCapture(ev.pointerId); } catch(e) { /* synthetische Ereignisse */ }
  });

  flaeche.addEventListener("pointermove", ev=>{
    if (!aktiv) return;
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!bewegt && Math.hypot(dx, dy) < 8) return;
    bewegt = true;
    /* Beim Ziehen folgt die Kachel frei - eingerastet wird erst beim Loslassen,
       sonst springt sie unter dem Finger. */
    const nx = Math.max(0, Math.min(ox + dx, flaeche.clientWidth - aktiv.offsetWidth));
    const ny = Math.max(0, Math.min(oy + dy, flaeche.clientHeight - aktiv.offsetHeight));
    aktiv.style.left = nx + "px"; aktiv.style.top = ny + "px";
    aktiv.style.opacity = ".85";
  });

  flaeche.addEventListener("pointerup", ()=>{
    if (!aktiv) return;
    const kachel = aktiv; aktiv = null;
    kachel.style.opacity = "";
    if (!bewegt){ oeffnePopupSchueler(kachel.dataset.sid, kachel.getBoundingClientRect()); return; }

    const s = schuelerVon(kachel.dataset.sid);
    const k = kursVon(R.kursId);
    if (!s || !k) return;
    if (!s.sitz || typeof s.sitz !== "object") s.sitz = {};

    const index = naechsterPlatz(kachel.offsetLeft, kachel.offsetTop);
    const ziel = platzPosition(index);
    const nachbar = werSitztAuf(k.id, index, s.id);
    if (nachbar){
      /* Platztausch: der andere bekommt den, den dieser gerade verlässt. */
      const vorher = s.sitz[k.id] || ziel;
      if (!nachbar.sitz || typeof nachbar.sitz !== "object") nachbar.sitz = {};
      nachbar.sitz[k.id] = {x: vorher.x, y: vorher.y};
    }
    s.sitz[k.id] = ziel;
    speichern(); zeichne();
  });

  flaeche.addEventListener("pointercancel", ()=>{
    if (aktiv) aktiv.style.opacity = "";
    aktiv = null;
  });
};

/* ================= Wer gerät aus dem Blick =================
   Drei Stellen, eine Rechnung (kern/beteiligung.js): der Sitzplan zeigt es, das
   Aufrufen berücksichtigt es, die Auswertung führt es auf.

   Der Gedanke dahinter: erfasst wird weiter nur, was auffällt. merkr sorgt
   dafür, dass am Ende niemand ohne Grundlage dasteht. */

function beteiligungVon(k){
  const sj = aktivesSchuljahr();
  const ab = sj ? MerkrNoten.halbjahrBeginn(sj, todayISO()) : null;
  const stunden = S.stunden.filter(x=>x.kursId===k.id);
  const ereignisse = S.ereignisse.filter(e=>e.kursId===k.id);
  const bis = todayISO();
  const liste = MerkrBeteiligung.uebersicht(kursSchueler(k.id), stunden, ereignisse, {ab, bis});
  const nach = new Map(liste.map(x=>[x.id, x]));
  return {liste, nach, stunden: stunden.filter(x=>!x.ausfall && (!ab || x.datum >= ab) && x.datum <= bis).length};
}

/* --- 1. Der Sitzplan zeigt es --- */
const sitzplanOhneBlick = viewSitzplan;
viewSitzplan = function(k){
  const html = sitzplanOhneBlick(k);
  if (!html.includes('class="stile')) return html;

  const b = beteiligungVon(k);
  /* Ab wann "lange nicht dran"? Drei Stunden sind gut zwei Wochen bei zwei
     Wochenstunden - lange genug, dass es auffällt, kurz genug, um zu handeln. */
  const schwelle = 3;
  let markiert = 0;
  let neu = html;
  for (const [id, e] of b.nach){
    if (e.stundenOhne < schwelle || !b.stunden) continue;
    markiert++;
    neu = neu.replace('data-sid="'+id+'"', 'data-sid="'+id+'" class-blick="1"');
  }
  /* Der Rand wird über ein Attribut gesetzt, damit die Kachel-Erzeugung
     unangetastet bleibt. */
  neu = neu.replace(/class="stile([^"]*)"([^>]*?)class-blick="1"/g,
    'class="stile$1 lange-nicht"$2');

  if (markiert)
    neu = '<p class="hinweis" style="margin:0 0 8px">'+
      markiert+(markiert===1?' Schüler hat':' Schüler haben')+' seit mindestens '+schwelle+
      ' Stunden keine Notiz - im Plan gestrichelt umrandet.</p>' + neu;
  return neu;
};

/* --- 2. Das Aufrufen bevorzugt sie --- */
aufrufZiehen = function(k){
  const kandidaten = aufrufbare(k).map(s=>s.id);
  const topf = aufrufTopf(k);
  const b = beteiligungVon(k);
  const gewichte = {};
  for (const id of kandidaten)
    gewichte[id] = MerkrBeteiligung.gewicht(b.nach.get(id) ? b.nach.get(id).stundenOhne : 0);

  /* Erst die Runde regeln (wer ist noch dran?), dann innerhalb der Runde
     gewichten - so bleibt jeder einmal an der Reihe. */
  const e = MerkrAufrufen.ziehen(kandidaten, topf, k.aufrufZuletzt || null,
    () => 0); // gleich ersetzt: wir ziehen selbst
  if (!e){ zeigeModal(aufrufDialog(k, null)); return; }

  const rest = e.neueRunde
    ? kandidaten.filter(id => kandidaten.length === 1 || id !== (k.aufrufZuletzt || null))
    : MerkrAufrufen.topfPruefen(topf, kandidaten);
  const gezogen = MerkrBeteiligung.zieheGewichtet(rest, gewichte) || e.gezogen;

  k.aufrufTopf = (e.neueRunde ? kandidaten : rest).filter(id => id !== gezogen);
  k.aufrufZuletzt = gezogen;
  R.aufrufAktuell = gezogen;
  speichern();
  zeigeModal(aufrufDialog(k, gezogen, e.neueRunde));
};

/* --- 3. Die Auswertung führt es auf --- */
function viewMuendlich(k){
  const b = beteiligungVon(k);

    '<div style="display:flex;gap:26px;margin-bottom:14px">'+
    '<div><div style="font-size:24px;font-weight:900">'+gesamt+'</div><div class="hinweis">Notizen</div></div>'+
    '<div><div style="font-size:24px;font-weight:900'+(mit<schueler.length?';color:var(--sm1)':'')+'">'+
    mit+' / '+schueler.length+'</div><div class="hinweis">mit mindestens einer</div></div>'+
    '<div><div style="font-size:24px;font-weight:900">'+
    (b.stunden ? fmtZahl(gesamt / b.stunden, 1) : "–")+'</div><div class="hinweis">je Stunde</div></div></div>';

  html += '<table class="tab"><tr><th>Schüler</th><th>Notizen</th><th>Ø Stufe</th><th>zuletzt</th><th></th></tr>';
  for (const e of sortiert){
    const s = schuelerVon(e.id);
    if (!s) continue;
    const lang = b.stunden && e.stundenOhne >= 3;
    html += '<tr><td><b>'+esc(s.name)+', '+esc(s.vorname)+'</b></td>'+
      '<td>'+(e.anzahl || '<span class="hinweis">keine</span>')+'</td>'+
      '<td>'+(e.mittel==null ? '–' :
        '<span class="stufenpunkt" style="background:'+stufeInfo(Math.round(e.mittel)).hex+'"></span> '+fmtZahl(e.mittel,1))+'</td>'+
      '<td'+(lang?' style="color:var(--sm1);font-weight:800"':'')+'>'+
      (!b.stunden ? '–' : e.anzahl===0 ? 'noch nie' :
        e.stundenOhne===0 ? 'letzte Stunde' :
        e.stundenOhne===1 ? 'vorletzte Stunde' : 'vor '+e.stundenOhne+' Stunden')+'</td>'+
      '<td><button class="klein" data-a="profilOeffnen" data-id="'+s.id+'">Profil</button></td></tr>';
  }
  html += '</table><p class="hinweis">Sortiert nach dem längsten Abstand. '+
    'Gezählt werden nur mündliche Notizen dieses Halbjahres, ausgefallene Stunden bleiben außen vor.</p></div>';
  return html;
}

/* ================= Die Stunden als Reihe unter den Reitern =================
   Mitarbeit und Anwesenheit hängen an einer Unterrichtsstunde, nicht am
   Kalendertag - der Blätterer ‹ › sagte das zwar, zeigte aber immer nur einen
   Tag. Wer die Notiz von vorletzter Woche nachtragen wollte, klickte sechsmal
   und wusste bis zum Loslassen nicht, wo er landet.

   Jetzt stehen die Termine des Kurses als Reihe unter den Reitern: welcher Tag
   gerade offen ist, wo heute liegt, und was an den anderen schon steht. Die
   Pfeile entfallen dort, wo die Reihe steht - zweimal derselbe Weg war schon
   einmal der Befund. */

const STUNDENREIHE_TABS = ["sitzplan", "anwesenheit"];
const MONATSKURZ = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

/** Alle Unterrichtstage dieses Kurses im laufenden Schuljahr, aufsteigend. */
function unterrichtstage(k){
  const sj = aktivesSchuljahr();
  if (!sj || !sj.beginn || !sj.ende) return [];
  const tage = [];
  const d = new Date(sj.beginn+"T12:00:00");
  const ende = new Date(sj.ende+"T12:00:00");
  for (let i = 0; i < 400 && d <= ende; i++){
    const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if (hatUnterricht(k.id, iso)) tage.push(iso);
    d.setDate(d.getDate()+1);
  }
  return tage;
}

/** Was an einem Termin schon steht - dieselben Zeichen wie im Wochenplan. */
function stundenStand(k, iso){
  const st = S.stunden.find(x=>x.kursId===k.id && x.datum===iso);
  if (st && st.ausfall) return {farbe:"var(--rot)", wort:"Ausfall", ausfall:true};
  const notizen = st ? S.ereignisse.filter(x=>x.stundeId===st.id && x.stufe!=null).length : 0;
  if (notizen) return {farbe:"var(--s2)", wort:notizen+(notizen===1?" Notiz":" Notizen")};
  if (st && String(st.thema||"").trim()) return {farbe:"var(--s0)", wort:"gehalten, nichts notiert"};
  return {farbe:"var(--linie)", wort:(st && String(st.geplant||"").trim()) ? String(st.geplant) : "steht noch aus"};
}

function stundenReihe(k){
  const tage = unterrichtstage(k);
  if (!tage.length) return "";
  const heute = todayISO();
  let html = '<div class="stundenreihe" id="stundenreihe">';
  let letzterMonat = "";
  for (const iso of tage){
    const monat = iso.slice(0,7);
    if (monat !== letzterMonat){
      letzterMonat = monat;
      html += '<span class="smonat">'+MONATSKURZ[Number(iso.slice(5,7))-1]+'</span>';
    }
    const stand = stundenStand(k, iso);
    const klassen = "stag"+(iso===R.datum?" aktiv":"")+(iso===heute?" heute":"")+(stand.ausfall?" ausfall":"");
    html += '<button class="'+klassen+'" data-a="stundenTag" data-datum="'+iso+'" '+
      'title="'+esc(fmtDatum(iso)+" · "+stand.wort)+'">'+
      '<span class="swt">'+wochentagName(new Date(iso+"T12:00:00").getDay())+'</span>'+
      '<span class="sdat">'+iso.slice(8,10)+'.'+iso.slice(5,7)+'.</span>'+
      '<i style="background:'+stand.farbe+'"></i></button>';
  }
  return html + '</div>';
}

/* Unter die Reiter, aber nur dort, wo der Tag etwas bedeutet. */
const kursLeisteOhneStunden = kursLeiste;
kursLeiste = function(k){
  const html = kursLeisteOhneStunden(k);
  if (STUNDENREIHE_TABS.indexOf(R.tab) < 0) return html;
  return html + stundenReihe(k);
};

/* Wo die Reihe steht, braucht es die Pfeile nicht mehr. */

/* Nach dem Zeichnen den offenen Tag in die Mitte schieben. Ohne das steht die
   Reihe im August, während man im Februar notiert. */
const zeichneOhneStundenreihe = zeichne;
zeichne = function(){
  zeichneOhneStundenreihe();
  const reihe = document.getElementById("stundenreihe");
  if (!reihe) return;
  let ziel = reihe.querySelector(".stag.aktiv");
  if (!ziel){
    /* Der offene Tag ist keine Unterrichtsstunde: dann zum nächsten Termin. */
    const alle = reihe.querySelectorAll(".stag");
    for (const b of alle){ if (b.dataset.datum >= R.datum){ ziel = b; break; } }
    if (!ziel && alle.length) ziel = alle[alle.length-1];
  }
  if (!ziel) return;
  reihe.scrollLeft = ziel.offsetLeft - reihe.clientWidth/2 + ziel.offsetWidth/2;
};

/* ================= Die Stunde abschließen =================
   Vier Kategorien mal fünfundzwanzig Kinder sind hundert Felder je Stunde. Das
   füllt niemand, und was niemand füllt, ist keine Grundlage für eine Note.

   Deshalb der umgekehrte Weg: merkr schlägt am Stundenende für jeden eine Note
   vor - aus den Notizen, die während der Stunde entstanden sind, und für alle
   anderen die Drei. Eine Runde drüber, korrigieren was nicht stimmt,
   bestätigen. Die Notizen bleiben das, was sie sein sollten: die Begründung für
   die Ausschläge, nicht die Pflichtübung für den Normalfall.

   Gespeichert wird an der Stunde (st.mitarbeit), nicht am Schüler: eine Note
   gehört zu dem Tag, an dem sie entstanden ist. */

function halbjahrNr(iso){
  const sj = aktivesSchuljahr();
  if (!sj || !sj.halbjahrGrenze) return 1;
  return iso >= sj.halbjahrGrenze ? 2 : 1;
}
function halbjahrSpanne(nr){
  const sj = aktivesSchuljahr();
  if (!sj) return {nr:1, ab:null, bis:null};
  const g = sj.halbjahrGrenze || null;
  if (!g) return {nr:1, ab:sj.beginn||null, bis:sj.ende||null};
  return nr === 2 ? {nr:2, ab:g, bis:sj.ende||null} : {nr:1, ab:sj.beginn||null, bis:g};
}
function aktuellesHalbjahr(){ return halbjahrNr(todayISO()); }
function imHalbjahr(iso, nr){
  const s = halbjahrSpanne(nr);
  if (s.ab && iso < s.ab) return false;
  if (nr === 1 && s.bis && iso >= s.bis) return false;
  if (nr === 2 && s.bis && iso > s.bis) return false;
  return true;
}

function notizenDerStunde(schuelerId, stundeId){
  return S.ereignisse.filter(e=>e.schuelerId===schuelerId && e.stundeId===stundeId);
}

/** Was merkr für diese Stunde vorschlägt - ohne Notiz die Basis. */
function stundennoteVorschlag(schuelerId, st, k){
  return MerkrMitarbeit.stundennote(notizenDerStunde(schuelerId, st.id), {typ: notensystem(k).typ});
}
/** Die bestätigte Note dieser Stunde, oder undefined. */
function stundennoteVon(st, schuelerId){
  return st && st.mitarbeit ? st.mitarbeit[schuelerId] : undefined;
}
/** Alle bestätigten Stundennoten eines Schülers im Halbjahr, neueste zuerst. */
function stundennotenListe(schuelerId, kursId, hjNr){
  const liste = [];
  for (const st of S.stunden){
    if (st.kursId !== kursId || st.ausfall) continue;
    if (hjNr && !imHalbjahr(st.datum, hjNr)) continue;
    const w = stundennoteVon(st, schuelerId);
    if (w === undefined || w === null || w === "") continue;
    liste.push({datum: st.datum, wert: Number(w), stundeId: st.id, thema: st.thema || st.geplant || ""});
  }
  return liste.sort((a,b)=>b.datum.localeCompare(a.datum));
}
/** Die Mitarbeitsnote des Halbjahres: das Mittel der bestätigten Stunden. */
function mitarbeitHalbjahr(schuelerId, kursId, hjNr){
  const liste = stundennotenListe(schuelerId, kursId, hjNr);
  const k = kursVon(kursId);
  const r = MerkrMitarbeit.halbjahresnote(liste.map(x=>x.wert), k ? notensystem(k).typ : "noten");
  r.liste = liste;
  return r;
}

/** Wie viele Stunden des Halbjahres schon abgeschlossen sind. */
function abgeschlosseneStunden(kursId, hjNr){
  return S.stunden.filter(st=>st.kursId===kursId && !st.ausfall &&
    (!hjNr || imHalbjahr(st.datum, hjNr)) && st.mitarbeitBestaetigt).length;
}

function abschlussWerte(k, st){
  if (!R.abschluss || R.abschluss.stundeId !== st.id){
    const werte = {};
    for (const s of kursSchueler(k.id)){
      const gesetzt = stundennoteVon(st, s.id);
      werte[s.id] = gesetzt !== undefined && gesetzt !== null && gesetzt !== ""
        ? Number(gesetzt)
        : stundennoteVorschlag(s.id, st, k).wert;
    }
    R.abschluss = {stundeId: st.id, werte: werte};
  }
  return R.abschluss.werte;
}

  /* Der Regelfall ist "passt so". Deshalb steht der Knopf oben und wandert
     mit - wer nichts ändern will, soll nicht an fünfundzwanzig Zeilen

    'ohne Notiz '+(sys.typ==="punkte" ? "acht Punkte" : "eine Drei")+'. Ändern, wo es nicht stimmt.</p></div>';

  for (const s of schueler){
    const anw = anwesenheitVon(s.id, st.id);
    const fehlt = anw && anw.status === "fehlt";
    const notizen = notizenDerStunde(s.id, st.id).filter(e=>e.stufe!=null || EINFACH_EREIGNISSE.some(x=>x.id===e.typ));
    const vs = stundennoteVorschlag(s.id, st, k);

    h += '<div class="zeile raum" style="padding:7px 0;border-bottom:1px solid var(--linie);gap:8px'+(fehlt?';opacity:.5':'')+'">'+
      '<div style="min-width:120px;flex:1"><b>'+esc(s.name)+', '+esc(s.vorname)+'</b>'+
      '<div class="hinweis" style="font-size:12px">'+
      (fehlt ? 'fehlt heute'
        : notizen.length
          ? notizen.map(e=>esc(ereignisNameVonTyp(e.typ))+(e.stufe!=null?' '+stufeInfo(e.stufe).label:'')).join(' · ')
          : 'ohne Notiz')+
      '</div></div>';

    if (fehlt){
      h += '<span class="hinweis">keine Note</span>';
    } else {
      h += '<div class="wertknoepfe" style="flex:0 0 auto">';
      for (const w of sys.werte)
        h += '<button data-a="abschlussWert" data-id="'+s.id+'" data-wert="'+w+'"'+
          (Number(werte[s.id])===w ? ' style="background:var(--akzent);color:#fff;border-color:var(--akzent);font-weight:800"' : '')+
          '>'+w+'</button>';

        ' title="Diese Stunde für '+esc(s.vorname)+' nicht bewerten">–</button>';
      h += '</div>';
    }
    h += '</div>';
  }

  const gezaehlt = Object.keys(werte).filter(id=>werte[id]!=null).length;
  h += '<div class="zeile raum" style="margin-top:14px">'+
    '<span class="hinweis">'+gezaehlt+' von '+schueler.length+' bekommen eine Note</span>'+
    '<button class="primar" data-a="abschlussSpeichern" data-id="'+st.id+'">'+
    (st.mitarbeitBestaetigt ? 'Erneut bestätigen' : 'Bestätigen')+'</button></div>';

  zeigeModal(h);
