:root{
  /* Pflaume auf Papier. Eigene Marke im lehrr-Verbund: selbr hat Smaragd,
     planr Indigo, drillr Blau, prüfr Amber, checkr Rot. */
  --akzent:#6b3f6e; --akzent-hell:#f4ecf5; --bg:#efe6f0; --karte:#ffffff;
  --text:#3b1f3e; --text2:#6f5872; --linie:#e4d7e5; --rot:#c02f2f;
  /* Die fünf Stufen sind die einzige Stelle, an der Farbe etwas bedeutet.
     Deshalb hält sich der Rest der Oberfläche zurück. */
  --s2:#12715a; --s1:#64a35e; --s0:#d8a417; --sm1:#cf7a2e; --sm2:#8e3b3b;
  --radius:16px; --schatten:0 1px 3px rgba(59,31,62,.07);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Nunito',-apple-system,"Avenir Next","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
input,textarea,select{ -webkit-user-select:text; user-select:text; font-family:inherit; font-size:16px;
  border:1px solid var(--linie); border-radius:8px; padding:9px 10px; background:#fff; color:var(--text); max-width:100%;}
textarea{width:100%; min-height:90px;}
button{font-family:inherit; font-size:16px; border:none; border-radius:10px; padding:10px 14px;
  background:var(--akzent-hell); color:var(--akzent); cursor:pointer; min-height:44px;}
button.primar{background:var(--akzent); color:#fff;}
button.gefahr{background:#fdecea; color:var(--rot);}
button.klein{min-height:34px; padding:5px 10px; font-size:14px; border-radius:8px;}
h1{font-size:22px;margin:0;} h2{font-size:19px;margin:0 0 10px;} h3{font-size:16px;margin:0 0 8px;}
.hinweis{color:var(--text2); font-size:14px;}

#topbar{position:sticky; top:0; z-index:40; background:var(--bg); display:flex; align-items:center;
  gap:10px; padding:12px 16px; border-bottom:1px solid var(--linie);}
#topbar .titel{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#topbar .wochenbadge{background:var(--akzent); color:#fff; border-radius:8px; padding:3px 9px; font-size:14px; font-weight:600;}
#app{padding:16px; max-width:1100px; margin:0 auto;}

/* Seitenleiste nach dem Entwurf: 92 px, Marke oben, sechs Ziele als Kacheln.
   Sie liegt fest am Rand, statt die Seitenstruktur umzubauen - topbar und app
   rücken einfach nach. */
#seitenleiste{position:fixed; left:0; top:0; bottom:0; width:92px; background:#f2e9f3;
  display:flex; flex-direction:column; align-items:stretch; padding:14px 8px; gap:4px; z-index:50;}
/* Oben bleibt Platz frei: dort schwebt in Scriptable der eigene
   Schliessen-Knopf über der Seite. 72 px, am Gerät nachgemessen - ohne die
   sichere Fläche obendrauf: die Statusleiste liegt über der Seite, und der
   Knopf liegt darunter. Wer beides addiert, schiebt die Leiste zu tief. */
#seitenleiste{padding-top:72px;}
/* Kursleiste: die Auswahl links, die Ansichten daneben. */
.kurswahl{font-size:16px; font-weight:800; color:var(--akzent); background:var(--karte);
  border:1px solid var(--linie); border-radius:12px; padding:8px 10px; min-height:40px; max-width:190px;}

/* Eine Reihe, seitlich zu schieben. Mit Umbruch fielen die acht Reiter auf dem
   Handy in ein 2x4-Raster und nahmen den halben Bildschirm. */
.kurstabs{display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; margin-bottom:14px;
  scrollbar-width:none; -ms-overflow-style:none; padding-bottom:2px;}
.kurstabs::-webkit-scrollbar{display:none;}
.kurstabs button{background:transparent; color:var(--text2); border-radius:999px; padding:8px 14px;
  font-weight:800; font-size:14px; min-height:40px; white-space:nowrap; flex:0 0 auto;}
.kurstabs button.aktiv{background:var(--akzent); color:#fff;}
#seitenleiste .leistetrenner{margin:10px 2px 4px; padding-top:9px; border-top:1px solid var(--linie);
  text-align:center; font-size:10px; font-weight:800; color:var(--text2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#seitenleiste .marke{display:none;}
#seitenleiste .marke b{font-size:17px; font-weight:900; letter-spacing:-.3px; color:var(--akzent);}
#seitenleiste .marke span{font-size:10px; font-weight:700; color:#96809a;}
#seitenleiste button{display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 2px 9px;
  border-radius:16px; background:transparent; color:var(--akzent); min-height:auto; font-size:11px; font-weight:800; line-height:1;}
#seitenleiste button.aktiv{background:var(--akzent); color:#fff;}
#seitenleiste button.aus{opacity:.35;}
#seitenleiste button svg{display:block;}
body.mitleiste #topbar{padding-left:108px;}
body.mitleiste #app{padding-left:108px;}

/* Schmal: die Leiste legt sich unten quer. Auf einem iPhone oder im geteilten
   Bildschirm bleiben 92 px am Rand sonst der halbe Platz. */
@media (max-width:700px){
  #seitenleiste{top:auto; right:0; width:auto; height:auto; flex-direction:row; justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom)); border-top:1px solid var(--linie);}
  /* Unten gibt es keinen Schliessen-Knopf, der Freiraum von oben entfaellt. */
  #seitenleiste{padding-top:6px;}
  #seitenleiste .marke, #seitenleiste .leistetrenner{display:none;}
  #seitenleiste{overflow-x:auto;}
  #seitenleiste button{flex:1; border-radius:12px; padding:8px 2px 6px;}
  body.mitleiste #topbar, body.mitleiste #app{padding-left:16px;}
  body.mitleiste #app{padding-bottom:86px;}
}
#testbanner{background:#fff3cd; color:#7a5c00; padding:8px 16px; font-size:14px; text-align:center;}

.karte{background:var(--karte); border-radius:var(--radius); box-shadow:var(--schatten); padding:16px; margin-bottom:14px;}
.zeile{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.zeile.raum{justify-content:space-between;}
.feld{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
.feld label{font-size:13px; color:var(--text2);}

.kurskachel{display:flex; align-items:center; gap:12px; padding:14px; border-radius:var(--radius);
  background:var(--karte); box-shadow:var(--schatten); margin-bottom:10px; cursor:pointer;}
.kursfarbe{width:16px; height:44px; border-radius:6px; flex-shrink:0;}
.kurskachel .info{flex:1;} .kurskachel .info .sub{font-size:13px; color:var(--text2);}

.tabs{display:flex; gap:6px; margin:0 0 14px; overflow-x:auto; padding-bottom:2px;}
.tabs button{white-space:nowrap; background:#fff; color:var(--text2); border:1px solid var(--linie);}
.tabs button.aktiv{background:var(--akzent); color:#fff; border-color:var(--akzent);}

/* Sitzplan */
/* Der Raum, nicht ein Karopapier: drei Zweiertische nebeneinander, fünf Reihen
   hintereinander. Das Karo hat nichts abgebildet - dieser Grundriss schon, und
   Kacheln lassen sich weiter frei darauf schieben. */
#sitzflaeche{position:relative; background:var(--karte);
  border:1px solid var(--linie); border-radius:var(--radius); height:620px; overflow:hidden; touch-action:none;}
#sitzflaeche .tisch{position:absolute; border-radius:10px; background:#f6f1f7;
  border:1px solid var(--linie); pointer-events:none;}
#sitzflaeche .tisch::after{content:""; position:absolute; top:8px; bottom:8px; left:50%;
  border-left:1px dashed var(--linie);}
#sitzflaeche .tafel{position:absolute; border-radius:8px; background:var(--akzent-hell);
  border:1px solid var(--linie); pointer-events:none; display:flex; align-items:center;
  justify-content:center; font-size:11px; font-weight:800; color:var(--text2); letter-spacing:.1em;}
.stile{position:absolute; width:112px; min-height:72px; border-radius:14px; background:var(--karte);
  box-shadow:0 1px 3px rgba(59,31,62,.09); border:1px solid var(--linie); padding:9px 10px 8px;
  cursor:pointer; touch-action:none;}
.stile .sname{font-size:14px; font-weight:800; line-height:1.15; pointer-events:none; color:var(--text);}
.stile .sname span{display:block; font-weight:600; color:var(--text2);}
/* Vier Felder, eine je Kategorie: Qualität und Menge, mündlich und schriftlich.
   Ein leeres Feld heißt "heute noch nichts" - man sieht auf einen Blick, wo
   eine Notiz fehlt, und nicht nur, was zuletzt passiert ist. */
.stile .spunkte{display:flex; gap:4px; margin-top:7px; pointer-events:none;}
.stile .spunkte i{width:22px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;font-style:normal;color:#fff;background:var(--akzent-hell);}
.stile .spunkte i.ohne{color:var(--linie);}
.stufenlegende{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:12px;font-size:12px;color:var(--text2);}
.stufenlegende b{display:inline-flex;width:22px;height:20px;border-radius:6px;align-items:center;justify-content:center;
  font-size:10px;color:#fff;margin-right:5px;vertical-align:-5px;}
.stile.lange-nicht{border:2px dashed var(--sm1);}
.stile.fehlt{opacity:.45; border-top-color:var(--rot);}
.stile.fehlt::after{content:"fehlt"; position:absolute; top:4px; right:6px; font-size:11px; color:var(--rot); font-weight:700;}

/* Schülerliste */
.slzeile{display:flex; align-items:center; gap:10px; padding:10px 12px; background:#fff;
  border-radius:10px; margin-bottom:6px; box-shadow:var(--schatten); cursor:pointer;}
.slzeile .sname{flex:1; font-weight:600;}
.slzeile .spunkte{display:flex; gap:3px;} .slzeile .spunkte i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.slzeile.fehlt{opacity:.5;} .slzeile.fehlt .sname::after{content:"  – fehlt"; color:var(--rot); font-weight:400; font-size:14px;}

/* Popover / Modal */
#overlay{position:fixed; inset:0; background:rgba(20,30,18,.35); z-index:60; display:none;}
#overlay.offen{display:block;}
#popover{position:fixed; z-index:70; background:#fff; border-radius:16px; box-shadow:0 6px 30px rgba(0,0,0,.25);
  width:400px; max-width:calc(100vw - 24px); max-height:82vh; overflow-y:auto; padding:16px; display:none;}
#popover.offen{display:block;}
.pkopf{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.pkopf .pname{font-size:18px; font-weight:700;}
.phinweis{font-size:12.5px; opacity:.7; margin:-4px 0 10px; line-height:1.35;}
.katzeile{display:flex; align-items:center; gap:8px; margin-bottom:8px; width:100%;}
.katzeile .katlabel{width:112px; font-size:13px; color:var(--text2); line-height:1.2;}
.stufen{display:flex; gap:6px; flex:1;}
.stufe{flex:1; height:44px; border-radius:9px; border:none; color:#fff; font-weight:700; font-size:15px; cursor:pointer; min-height:44px; padding:0;}
.chipreihe{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
.chip{background:var(--akzent-hell); color:var(--akzent); border-radius:20px; padding:9px 14px; font-size:14px; border:none; min-height:40px;}
.chip.aktivrot{background:#fdecea; color:var(--rot);}

.modalbox{position:fixed; z-index:70; left:50%; top:50%; transform:translate(-50%,-50%);
  background:#fff; border-radius:16px; box-shadow:0 6px 30px rgba(0,0,0,.25);
  width:560px; max-width:calc(100vw - 24px); max-height:86vh; overflow-y:auto; padding:20px; display:none;}
.modalbox.offen{display:block;}

/* Tabellen */
table.tab{width:100%; border-collapse:collapse; font-size:15px;}
table.tab th{color:var(--text2); font-size:13px; text-align:left; font-weight:600; padding:6px 8px; border-bottom:1px solid var(--linie);}
table.tab td{padding:8px; border-bottom:1px solid var(--linie); vertical-align:middle;}
table.tab tr:last-child td{border-bottom:none;}
.stufenpunkt{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:middle;}

/* Noteneingabe */
.wertknoepfe{display:flex; gap:5px; flex-wrap:wrap;}
.wertknoepfe button{min-width:44px; min-height:40px; padding:4px 6px; background:#fff; border:1px solid var(--linie); color:var(--text); border-radius:8px;}
.wertknoepfe button.gewaehlt{background:var(--akzent); color:#fff; border-color:var(--akzent);}

/* Statistik */
.statzeile{display:flex; gap:18px; flex-wrap:wrap; margin:10px 0;}
.statwert{background:var(--akzent-hell); border-radius:10px; padding:8px 14px;}
.statwert .gross{font-size:22px; font-weight:700; color:var(--akzent);}
.statwert .klein2{font-size:12px; color:var(--text2);}
svg text{font-family:inherit;}

#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:80;
  background:#22301f; color:#fff; border-radius:12px; padding:12px 16px; display:none; align-items:center; gap:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.3); max-width:90vw;}
#toast.offen{display:flex;}
#toast button{background:transparent; color:#9fd6ac; font-weight:700; padding:4px 8px; min-height:auto;}
.leer{color:var(--text2); text-align:center; padding:30px 10px; font-size:15px;}
.abstand{height:8px;}
.gewslider{display:flex; align-items:center; gap:10px;}
.gewslider input[type=range]{flex:1;}
.fehlstatus button{margin-right:6px;}

<script>
"use strict";
/* ============ Injektion durch Scriptable ============ */
/* --- kern/aufrufen.js --- */
/**
 * Aufrufen ohne Zurücklegen.
 *
 * Zufällig, aber gerecht: erst wenn alle einmal dran waren, beginnt eine neue
 * Runde. Ein reiner Zufallsgriff würde manche in einer Stunde dreimal treffen
 * und andere wochenlang nie - und die Klasse merkt das sofort.
 *
 * Der Topf hält die Ids der noch nicht Gezogenen. Ist er leer, wird neu
 * gefüllt; wer zuletzt dran war, wird dabei nicht sofort wieder Erster.
 */
const MerkrAufrufen = (function () {

  /**
   * Wer ist noch im Topf? Räumt dabei auf: wer den Kurs verlassen hat, fliegt
   * raus, wer neu dazukam, kommt in die laufende Runde.
   */
  function topfPruefen(topf, ids) {
    const gueltig = new Set(ids);
    const bereinigt = (topf || []).filter((id) => gueltig.has(id));
    return bereinigt;
  }

  /**
   * Den Nächsten ziehen.
   *
   * @param ids alle, die in Frage kommen (Abwesende vorher herausfiltern)
   * @param topf die noch nicht Gezogenen dieser Runde
   * @param zuletzt wer als Letztes dran war - er wird nicht sofort wieder Erster
   * @param wuerfel Zufallsfunktion, für die Prüfung austauschbar
   * @returns {gezogen, topf, neueRunde} oder null, wenn niemand in Frage kommt
   */
  function ziehen(ids, topf, zuletzt, wuerfel) {
    const w = wuerfel || Math.random;
    const alle = (ids || []).filter(Boolean);
    if (!alle.length) return null;

    let rest = topfPruefen(topf, alle);
    let neueRunde = false;

    if (!rest.length) {
      neueRunde = true;
      rest = alle.slice();
      // Nach einer vollen Runde nicht mit demselben weitermachen - das fällt auf.
      if (rest.length > 1 && zuletzt) {
        const ohne = rest.filter((id) => id !== zuletzt);
        if (ohne.length) {
          const gezogen = ohne[Math.floor(w() * ohne.length)];
          return { gezogen, topf: rest.filter((id) => id !== gezogen), neueRunde };
        }
      }
    }

    const gezogen = rest[Math.floor(w() * rest.length)];
    return { gezogen, topf: rest.filter((id) => id !== gezogen), neueRunde };
  }

  /** Wie viele sind in dieser Runde noch nicht dran gewesen? */
  function offen(topf, ids) {
    return topfPruefen(topf, ids || []).length;
  }

  return { ziehen: ziehen, offen: offen, topfPruefen: topfPruefen };
})();

if (typeof module !== "undefined" && module.exports) module.exports = MerkrAufrufen;

/* --- kern/beteiligung.js --- */
/**
 * Wer gerät aus dem Blick?
 *
 * Wenn nur Auffälliges notiert wird - und anders ist es bei 25 Schülern in 90
 * Minuten nicht zu machen -, sind die Stillen genau die, über die am Ende
 * nichts dasteht. Sie brauchen die Note trotzdem.
 *
 * Diese Rechnung beantwortet drei Fragen: wie viele Notizen hat jemand, wie
 * lange ist die letzte her (in Unterrichtsstunden, nicht in Tagen), und wie
 * dringend sollte er drankommen.
 */
const MerkrBeteiligung = (function () {

  /** Nur die Kategorien, die mündliche Beteiligung meinen. */
  const MUENDLICH = ["qual_m", "quant_m"];

  /**
   * Übersicht je Schüler.
   *
   * @param schueler [{id, vorname, name}]
   * @param stunden  Stunden des Kurses, aufsteigend nach Datum
   * @param ereignisse alle Ereignisse des Kurses
   * @param opt {ab, bis} - Zeitraum. `ab` ist die Halbjahresgrenze, `bis` das
   *        letzte zählende Datum, üblicherweise heute. Ohne `bis` zählen die aus
   *        planr importierten Termine der kommenden Wochen mit, und dann steht
   *        bei jedem Schüler ein Abstand, der noch gar nicht vergangen ist.
   * @returns je Schüler {id, anzahl, letzte, stundenOhne, mittel}
   */
  function uebersicht(schueler, stunden, ereignisse, opt) {
    const o = opt || {};
    const relevant = (stunden || [])
      .filter((st) => !o.ab || st.datum >= o.ab)
      .filter((st) => !o.bis || st.datum <= o.bis)
      .filter((st) => !st.ausfall)
      .slice()
      .sort((a, b) => String(a.datum).localeCompare(String(b.datum)));

    // Für "wie viele Stunden ist es her" zählt die Position in der Stundenfolge.
    const platzVon = new Map(relevant.map((st, i) => [st.id, i]));

    return (schueler || []).map((s) => {
      const seine = (ereignisse || []).filter(
        (e) => e.schuelerId === s.id && e.stufe != null && MUENDLICH.includes(e.typ) && platzVon.has(e.stundeId),
      );
      let letzte = null, letzterPlatz = -1, summe = 0;
      for (const e of seine) {
        summe += Number(e.stufe);
        const platz = platzVon.get(e.stundeId);
        if (platz > letzterPlatz) { letzterPlatz = platz; letzte = e; }
      }
      return {
        id: s.id,
        anzahl: seine.length,
        letzte: letzte,
        // Wie viele Stunden liegen seit der letzten Notiz? Ohne Notiz: alle.
        stundenOhne: letzterPlatz < 0 ? relevant.length : relevant.length - 1 - letzterPlatz,
        mittel: seine.length ? summe / seine.length : null,
      };
    });
  }

  /**
   * Wie dringend gehört jemand drangenommen?
   *
   * Eins ist die Grundlast, dazu kommt je verstrichener Stunde ein Punkt. Nach
   * oben gedeckelt, damit ein einzelner Langzeit-Fall nicht die ganze Runde an
   * sich zieht.
   */
  function gewicht(stundenOhne, deckel) {
    const d = deckel == null ? 8 : deckel;
    return 1 + Math.min(d, Math.max(0, Number(stundenOhne) || 0));
  }

  /**
   * Aus einem Topf ziehen, aber die Vernachlässigten bevorzugt.
   *
   * Die Runde bleibt vollständig - es ändert sich nur die Reihenfolge
   * innerhalb der Runde. Wer lange nicht dran war, kommt eher früh.
   */
  function zieheGewichtet(topf, gewichte, wuerfel) {
    const w = wuerfel || Math.random;
    const liste = (topf || []).filter(Boolean);
    if (!liste.length) return null;
    const summe = liste.reduce((acc, id) => acc + (gewichte[id] || 1), 0);
    let punkt = w() * summe;
    for (const id of liste) {
      punkt -= gewichte[id] || 1;
      if (punkt <= 0) return id;
    }
    return liste[liste.length - 1];
  }

  return { MUENDLICH: MUENDLICH, uebersicht: uebersicht, gewicht: gewicht, zieheGewichtet: zieheGewichtet };
})();

if (typeof module !== "undefined" && module.exports) module.exports = MerkrBeteiligung;

/* --- kern/ergebnisse.js --- */
/**
 * Ergebnisse einer Arbeit aus checkr übernehmen.
 *
 * checkr liefert je Schüler den Code vom Deckblatt und die Punkte. Die
 * Auflösung Code zu Mensch passiert hier - checkr kennt keine Namen.
 *
 * Zwei Regeln stecken darin, beide aus dem gleichen Grund: eine Arbeit, deren
 * Punkte beim falschen Kind landen, merkt man erst im Elterngespräch.
 *   1. Nicht raten. Ein Code ohne passenden Schüler wird gemeldet, nicht verteilt.
 *   2. Nichts überschreiben. Was schon eingetragen ist, bleibt stehen.
 */
const MerkrErgebnisse = (function () {

  /**
   * Notenschlüssel Sek I M-V. Die Prozentgrenzen sind vorgegeben, nicht
   * verhandelbar - dieselben, die auch planr fürs Korrekturformular führt.
   */
  const SCHLUESSEL = [
    { note: 1, abProzent: 96 },
    { note: 2, abProzent: 80 },
    { note: 3, abProzent: 60 },
    { note: 4, abProzent: 40 },
    { note: 5, abProzent: 20 },
    { note: 6, abProzent: 0 },
  ];

  function norm(x) {
    return String(x == null ? "" : x).trim().toLowerCase();
  }

  function noteAusProzent(prozent) {
    const p = Number(prozent);
    if (!isFinite(p)) return null;
    for (const stufe of SCHLUESSEL) if (p >= stufe.abProzent) return stufe.note;
    return 6;
  }

  /**
   * Punkte der Oberstufe aus dem Prozentsatz.
   *
   * Anders als der Notenschlüssel ist diese Staffel NICHT amtlich vorgegeben -
   * sie bildet nur die übliche Zuordnung ab (15 Punkte ab 95 %, 5 Punkte an der
   * Vier-Grenze). Wer sie anders braucht, ändert sie hier an einer Stelle.
   */
  function punkteAusProzent(prozent) {
    const p = Number(prozent);
    if (!isFinite(p)) return null;
    const staffel = [95, 90, 85, 80, 75, 70, 65, 60, 55, 50, 45, 40, 33, 27, 20];
    for (let i = 0; i < staffel.length; i++) if (p >= staffel[i]) return 15 - i;
    return 0;
  }

  function wertAusProzent(prozent, typ) {
    return typ === "punkte" ? punkteAusProzent(prozent) : noteAusProzent(prozent);
  }

  /**
   * Die Zeilen aus checkr den Schülern zuordnen.
   *
   * @param schueler [{id, name, vorname, kuerzel}]
   * @param zeilen [{code, erreicht, maximal, prozent}]
   * @param typ "noten" | "punkte"
   * @returns {treffer, ohneSchueler, ohneArbeit, doppelt}
   *   treffer      - was eingetragen werden kann
   *   ohneSchueler - Codes aus checkr, zu denen hier niemand passt
   *   ohneArbeit   - Schüler ohne Zeile in checkr (nicht mitgeschrieben)
   *   doppelt      - Codes, die checkr mehrfach liefert
   */
  function zuordnen(schueler, zeilen, typ) {
    const nachKuerzel = new Map();
    for (const s of schueler || []) {
      const k = norm(s.kuerzel);
      if (k) nachKuerzel.set(k, s);
    }

    const treffer = [];
    const ohneSchueler = [];
    const doppelt = [];
    const gesehen = new Set();
    const getroffen = new Set();

    for (const z of zeilen || []) {
      const code = String(z && z.code != null ? z.code : "").trim();
      const key = norm(code);
      if (!key) continue;
      if (gesehen.has(key)) { doppelt.push(code); continue; }
      gesehen.add(key);

      const s = nachKuerzel.get(key);
      if (!s) { ohneSchueler.push(code); continue; }

      // Wer nicht mitgeschrieben hat, steht in checkr bei 0 von 0. Daraus eine
      // Sechs zu machen wäre eine Note für nichts.
      if (!(Number(z.maximal) > 0)) continue;

      getroffen.add(s.id);
      treffer.push({
        schuelerId: s.id,
        code: code,
        erreicht: Number(z.erreicht) || 0,
        maximal: Number(z.maximal) || 0,
        prozent: Number(z.prozent) || 0,
        wert: wertAusProzent(z.prozent, typ),
      });
    }

    const ohneArbeit = (schueler || [])
      .filter((s) => !getroffen.has(s.id))
      .map((s) => (s.name ? s.name + ", " + s.vorname : s.vorname) || String(s.id));

    return { treffer, ohneSchueler, ohneArbeit, doppelt };
  }

  /**
   * Treffer in die Ergebnisse einer Arbeit schreiben, ohne Vorhandenes zu
   * überschreiben. Von Hand nachgetragene Werte gewinnen gegen den Abruf - wer
   * etwas eingetragen hat, hatte einen Grund.
   */
  function zusammenfuehren(vorhanden, treffer) {
    const ergebnisse = Object.assign({}, vorhanden || {});
    let neu = 0, behalten = 0;
    for (const t of treffer || []) {
      const alt = ergebnisse[t.schuelerId];
      if (alt !== undefined && alt !== null && alt !== "") { behalten++; continue; }
      ergebnisse[t.schuelerId] = t.wert;
      neu++;
    }
    return { ergebnisse, neu, behalten };
  }

  return {
    SCHLUESSEL: SCHLUESSEL,
    noteAusProzent: noteAusProzent,
    punkteAusProzent: punkteAusProzent,
    wertAusProzent: wertAusProzent,
    zuordnen: zuordnen,
    zusammenfuehren: zusammenfuehren,
  };
})();

if (typeof module !== "undefined" && module.exports) module.exports = MerkrErgebnisse;

/* --- kern/kuerzel.js --- */
/**
 * Kürzel: der Schlüssel zwischen merkr und checkr.
 *
 * checkr speichert nie Klarnamen - beim Job-Start wird der Name durch den Code
 * ersetzt, die Auflösung findet ausdrücklich außerhalb statt. merkr ist dieses
 * Außerhalb. Hinaus geht das Kürzel, der Name bleibt hier.
 *
 * Warum der Code und nicht eine UUID: checkrs Notenbuch ordnet die Schüler einer
 * Arbeit dem Klassen-Roster über den normalisierten Namen zu, nicht über die Id.
 * Wer denselben Code auf beiden Seiten führt, trifft genau diesen Weg, ohne dass
 * in checkr eine Zeile geändert werden muss.
 */
const MerkrKuerzel = (function () {

  /** Wie checkr vergleicht: klein, getrimmt, Mehrfach-Leerzeichen zusammengezogen. */
  function normalisiert(x) {
    return String(x == null ? "" : x).toLowerCase().split(/\s+/).filter(Boolean).join(" ");
  }

  function sortierschluessel(s) {
    return ((s.name || "") + " " + (s.vorname || "")).toLowerCase();
  }

  /**
   * Fehlende Kürzel vergeben, vorhandene unangetastet lassen - ein Kürzel, das
   * schon auf einer Arbeit steht, darf sich nie ändern.
   *
   * @param schueler [{id, name, vorname, kuerzel}] - die des Kurses

/**
 * Zuordnung zwischen planr-Kursen und merkr-Kursen.
 *
 * Die Stelle, an der es schiefgeht: planr führt "9a" zweimal, einmal Mathematik
 * und einmal Physik, und in merkr heißt derselbe Kurs vielleicht "Mathe 9a".
 * Deshalb ein eigenes Feld `planrKlasse` am Kurs statt eines Namensvergleichs -
 * dasselbe Muster, das planr für `selbrKlasse` nutzt, und aus demselben Grund:
 * Namen wandern, Kopplungen sollen es nicht.

  function norm(x) {
    return String(x == null ? "" : x).trim().toLowerCase();

   * Welcher merkr-Kurs gehört zu diesem planr-Eintrag?
   *
   * Reihenfolge: gepflegte Zuordnung schlägt alles. Ist keine gepflegt, gilt der
   * Kursname - so funktioniert der Abruf ohne Einrichtung, solange die Namen
   * zufällig passen.

   * @param kurse [{id, name, planrKlasse, schuljahrId}]

    const gesucht = norm(eintrag && eintrag.kurs);
    const kennung = eintrag && eintrag.klasseId != null ? String(eintrag.klasseId) : "";

    for (const k of kurse || []) {
      if (schuljahrId != null && k.schuljahrId !== schuljahrId) continue;
      const zuordnung = norm(k.planrKlasse);
      if (!zuordnung) continue;
      if (zuordnung === gesucht || (kennung && zuordnung === kennung)) return k;

    for (const k of kurse || []) {
      if (schuljahrId != null && k.schuljahrId !== schuljahrId) continue;
      if (norm(k.planrKlasse)) continue;
      if (norm(k.name) === gesucht) return k;
    }

/**
 * Die Rückmeldung an planr: was in der Stunde gewackelt hat.
 *
 * planr sagt vor der Stunde, woraus die TÜ gebaut ist (`tuThemen` je Termin in
 * der Stoffverteilung). Nach der Stunde tippt die Lehrkraft an, welches dieser
 * Themen Probleme gemacht hat; planr zieht es in der nächsten TÜ vor.
 *

 * Der Versand steht im Rahmen, die Bedienung in der Oberfläche.

 * nichts. Das ist die Regel des Hauses, und sie fällt hier leicht: planr hat für
 * Schülerdaten ohnehin keine Felder.

  /** Was kann man für diese Stunde ankreuzen? Leer, wenn keine TÜ dran hing. */

    const roh = (stunde && stunde.tuThemen) || [];
    const raus = [];
    for (const t of roh) {
      const s = String(t == null ? "" : t).trim();
      if (s && raus.indexOf(s) < 0) raus.push(s);
    }
    return raus;
  }

  /**
   * Der Brief an POST /api/rueckmeldung.
   *
   * `klasse` und `fach` kommen aus dem, was planr beim Abruf über sich gesagt hat
   * (`planrName`, `planrFach`), nicht aus merkrs eigenem Kursnamen: drüben heißt
   * der Kurs "9a" mit Fach "Mathematik", hier vielleicht "Mathe 9a". Fehlt die
   * Angabe, ist der Kurs nie aus planr gekommen - dann gibt es nichts zu melden.
   *

   * prüfen, sondern nur auf null achten.

    if (!kurs || !stunde || !stunde.datum) return null;
    const klasse = String((kurs.planrName || "")).trim();
    if (!klasse) return null;

    const erlaubt = wackelThemen(stunde);
    const wackelt = [];
    for (const a of auswahl || []) {
      const s = String(a == null ? "" : a).trim();
      // Nur, was auch auf dem Blatt stand: ein freier Text wäre drüben ein
      // Thema, das keine Aufgabe trifft, und stünde für immer offen.
      if (s && erlaubt.indexOf(s) >= 0 && wackelt.indexOf(s) < 0) wackelt.push(s);
    }

    const z = zusatz || {};

    const notizText = String(z.notiz == null ? "" : z.notiz).trim();

    // Ein Brief ohne Inhalt bleibt zu Hause.
    if (!wackelt.length && !zielErreicht && !notizText) return null;

    const b = {
      klasse: klasse,
      datum: stunde.datum,
      gehalten: true,
    };
    if (wackelt.length) b.wackelt = wackelt;
    if (zielErreicht) b.zielErreicht = zielErreicht;
    if (notizText) b.notiz = notizText;
    const fach = String((kurs.planrFach || "")).trim();
    if (fach) b.fach = fach;

  /**
   * Was aus den abgehakten Phasen für planr wird.
   *
   * planr kennt drei Zustände - ja, teilweise, nein. Die Haken sagen genauer, was
   * liegen blieb; das geht als Notiz mit, weil eine Phase drüben kein eigenes
   * Feld hat. Der Text ist knapp gehalten: er landet in der Reflexion und wird
   * beim Planen der nächsten Stunde gelesen, nicht archiviert.

   * @param erledigt [schluessel] - was abgehakt wurde

    const alle = (phasen || []).filter(function (p) { return p && p.schluessel; });
    if (!alle.length) return { zielErreicht: null, notiz: "", offen: [] };
    const fertig = new Set(erledigt || []);
    const offen = alle.filter(function (p) { return !fertig.has(p.schluessel); });

    return {
      zielErreicht: offen.length === 0 ? "ja" : offen.length === alle.length ? "nein" : "teilweise",
      offen: offen.map(function (p) { return p.name; }),
      notiz: offen.length ? "Offen geblieben: " + offen.map(function (p) { return p.name; }).join(", ") : ""
    };
  }

  /** Kurzfassung fürs Protokoll am Kurs: "25.08.: Lösungsformel, Faktorisierung". */
  function notiz(brief) {
    if (!brief) return "";
    return brief.datum + ": " + brief.wackelt.join(", ");
  }

  return { wackelThemen: wackelThemen, brief: brief, notiz: notiz,
    zielstand: zielstand, ZIELSTAND: ZIELSTAND };
})();

/**
 * Der Schultag, wie er wirklich liegt - aus planr.
 *
 * merkr rechnet seinen Wochenplan sonst aus Wochentag und A/B-Woche. Das stimmt
 * für die Regel und weiß nichts von dem Dienstag, an dem die 9d ausfällt und
 * dafür eine Vertretung in der 7b liegt. planr liest den Vertretungsplan der
 * Schule ohnehin und liefert mit der Stoffverteilung den fertig gerechneten Tag.
 *
 * Der Plan reicht nur so weit wie der Vertretungsplan der Schule - drei, vier
 * Tage. Für alles danach gilt weiter merkrs Raster, deshalb `gilt`: nur für die
 * genannten Tage darf der Tagesplan das Raster ersetzen. Ein Tag, über den er
 * nichts sagt, ist kein Tag ohne Unterricht.

  /** Sagt der Plan über diesen Tag etwas? */

    return !!(tp && Array.isArray(tp.tage) && tp.tage.indexOf(iso) >= 0);
  }

  /**
   * Der Tag als Liste, in der Form, die merkrs Wochenplan erwartet.
   *
   * @param tp        was planr geliefert hat
   * @param iso       der Tag
   * @param zuordnen  (eintrag) => merkr-Kurs oder null; kommt von MerkrPlanr
   * @returns [{kurs, stunde, block, art, hinweis, raum, fremd, name}]
   *          `kurs` ist null, wo merkr die Lerngruppe nicht führt - eine
   *          Vertretung in einer fremden Klasse oder eine Aufsicht. Sie
   *          gehören auf den Vormittag, auch wenn nichts an ihnen hängt.
   */

    if (!gilt(tp, iso)) return [];
    const roh = (tp.tage_stunden && tp.tage_stunden[iso]) || [];
    const out = [];
    for (const e of roh) {
      if (!e) continue;
      const kennbar = !!e.kurs || e.classId != null;
      const kurs = (kennbar && zuordnen) ? zuordnen({ kurs: e.kurs, klasseId: e.classId }) : null;
      const stunden = Array.isArray(e.stunden) && e.stunden.length
        ? e.stunden
        : [Number(e.block) * 2 - 1, Number(e.block) * 2];
      out.push({
        kurs: kurs || null,
        stunde: Number(stunden[0]),
        stunden: stunden.map(Number),
        block: Number(e.block),
        art: String(e.art || "regulaer"),
        raum: e.raum || null,
        hinweis: e.hinweis || null,
        fremd: !kurs,
        name: kurs ? kurs.name : (e.kurs || e.klasse || (e.art === "aufsicht" ? "Aufsicht" : "Vertretung"))
      });
    }
    return out.sort(function (a, b) { return a.stunde - b.stunde; });
  }

  /**
   * Findet an diesem Tag Unterricht dieses Kurses statt?
   *
   * Ein Ausfall zählt nicht: an einer Stunde, die nicht war, hängt keine Notiz.
   * Er bleibt trotzdem in der Liste, damit der Wochenplan ihn durchgestrichen
   * zeigen kann - eine Kachel, die grundlos fehlt, sieht aus wie ein Fehler.
   */
  function hatUnterricht(liste, kursId) {
    return liste.some(function (e) {
      return e.kurs && e.kurs.id === kursId && e.art !== "ausfall";
    });
  }

  return { gilt: gilt, amTag: amTag, hatUnterricht: hatUnterricht };
})();

/**
 * Die TÜ-Punkte eines Halbjahres zu einer Note.
 *
 * Fünf Übungen zu je zehn Punkten, drei davon zählen. TÜ 1 bis 3 schreibt
 * jeder. TÜ 4 und 5 schreibt nur, wer sich ein Rückkaufrecht erspielt hat -
 * damit darf die schlechteste Übung gestrichen werden, mit zwei Rechten die
 * zwei schlechtesten. Am Ende zählen immer die besten drei.
 *
 * Daraus folgt eine Regel, die kürzer ist als ihre Erklärung: mit r Rechten
 * kommen die Übungen 1 bis 3+r in den Topf, und aus dem Topf zählen die drei
 * besten. Wer ein Recht hat, es aber nicht nutzt, verliert nichts; wer TÜ 4
 * ohne Recht geschrieben hat, gewinnt nichts.
 *
 * Die Note macht diese Datei nicht - sie liefert Punkte und Prozent, den
 * Schlüssel führt MerkrErgebnisse. Ein zweiter Notenschlüssel im Haus wäre
 * einer zu viel.
 *
 * Reine Funktionen ohne DOM und ohne Zustand, prüfbar in `node --test`.
 */
const MerkrTue = (function () {
  /** So viele Übungen zählen in die Note. */
  const ZAEHLEN = 3;
  /** Punkte je Übung. */
  const MAX_JE = 10;
  /** So viele Übungen gibt es im Halbjahr. */
  const ANZAHL = 5;

  function alsZahl(x) {
    if (x === null || x === undefined || x === "") return null;
    const n = Number(x);
    return isFinite(n) ? n : null;
  }

  /**
   * @param punkte    [p1..p5] - null oder "" für nicht geschrieben
   * @param rueckkauf 0, 1 oder 2 - so viele Rechte hat der Schüler
   * @returns {zaehlend, gestrichen, unzulaessig, summe, max, prozent, vollstaendig}
   *          zaehlend/gestrichen/unzulaessig sind Nummern (1-basiert).
   */
  function auswertung(punkte, rueckkauf) {
    const r = Math.max(0, Math.min(ANZAHL - ZAEHLEN, Number(rueckkauf) || 0));
    const bisNr = ZAEHLEN + r;

    const geschrieben = [];
    const unzulaessig = [];
    for (let i = 0; i < ANZAHL; i++) {
      const p = alsZahl((punkte || [])[i]);
      if (p === null) continue;
      const eintrag = { nr: i + 1, punkte: Math.max(0, Math.min(MAX_JE, p)) };
      /* Ohne Recht geschrieben: wird gezeigt, zählt aber nicht mit. Stillschweigend
         mitrechnen wäre schlimmer als der Hinweis - es wäre ein zweites Regelwerk. */
      if (eintrag.nr > bisNr) unzulaessig.push(eintrag.nr);
      else geschrieben.push(eintrag);
    }

    const sortiert = geschrieben.slice().sort(function (a, b) {
      return b.punkte - a.punkte || a.nr - b.nr;
    });
    const zaehlend = sortiert.slice(0, ZAEHLEN);
    const gestrichen = sortiert.slice(ZAEHLEN);

    const summe = zaehlend.reduce(function (s, x) { return s + x.punkte; }, 0);
    /* Solange nicht alle drei geschrieben sind, ist es ein Zwischenstand: dann
       misst sich die Summe an dem, was bisher möglich war. */
    const max = Math.max(1, zaehlend.length * MAX_JE);

    return {
      zaehlend: zaehlend.map(function (x) { return x.nr; }),
      gestrichen: gestrichen.map(function (x) { return x.nr; }).sort(function (a, b) { return a - b; }),
      unzulaessig: unzulaessig,
      summe: summe,
      max: max,
      prozent: Math.round((summe / max) * 1000) / 10,
      vollstaendig: zaehlend.length === ZAEHLEN,
      rechte: r,
      offenBis: bisNr
    };
  }

  return {
    ZAEHLEN: ZAEHLEN,
    MAX_JE: MAX_JE,
    ANZAHL: ANZAHL,
    MAX_GESAMT: ZAEHLEN * MAX_JE,

function mondayOf(iso){
  const d = new Date(iso+"T12:00:00");
  const tag = (d.getDay()+6)%7; d.setDate(d.getDate()-tag);
  return d;
}
function wochenBuchstabe(sj, iso){
  if (!sj || !sj.aWocheAnker) return null;
  const a = mondayOf(sj.aWocheAnker), b = mondayOf(iso);
  const diff = Math.round((b-a)/(7*24*3600*1000));
  return ((diff % 2)+2) % 2 === 0 ? "A" : "B";
}

/* Notenberechnung */
function schuelerNoten(schuelerId, kursId){
  const einzel = S.noten.filter(n=>n.schuelerId===schuelerId && n.kursId===kursId);
  const arbeitsNoten = [];
  for (const a of S.arbeiten.filter(a=>a.kursId===kursId)){
    const w = a.ergebnisse[schuelerId];
    if (w!==undefined && w!==null && w!=="")
      arbeitsNoten.push({wert:Number(w), bereich:bereichNorm(a.bereich||artBereich(a.art)), label:a.titel, gewicht:gew(a.gewicht), datum:a.datum, ausArbeit:true});
  }
  return einzel.map(n=>({wert:Number(n.wert), bereich:bereichNorm(n.bereich), label:n.label||"", gewicht:gew(n.gewicht), datum:n.datum, id:n.id})).concat(arbeitsNoten);
}
function gewMittel(liste){
  let sum=0, g=0;
  for (const n of liste){ sum += n.wert*gew(n.gewicht); g += gew(n.gewicht); }
  return g>0 ? sum/g : null;
}
function mischen(a, b, gewichtA){
  if (a!=null && b!=null) return (a*gewichtA + b*(100-gewichtA))/100;
  return a!=null ? a : (b!=null ? b : null);
}
/* Zwei Bereiche: Klassenarbeiten (arb) und sonstige Leistungen (son).
   Die sonstigen setzen sich aus der muendlichen Note (m) und den
   weiteren sonstigen Leistungen (wso) zusammen. */
function notenstandAus(alle, kurs){
  const arb = gewMittel(alle.filter(n=>bereichNorm(n.bereich)==="arbeit"));
  const m   = gewMittel(alle.filter(n=>bereichNorm(n.bereich)==="muendlich"));
  const wso = gewMittel(alle.filter(n=>bereichNorm(n.bereich)==="sonstige"));
  const son = mdlModus(kurs)==="anteil"
    ? mischen(m, wso, gewMdlAnteil(kurs))
    : gewMittel(alle.filter(n=>{ const b = bereichNorm(n.bereich); return b==="muendlich" || b==="sonstige"; }));
  const gesamt = mischen(son, arb, gewSonstige(kurs));
  return {arb, m, wso, son, s:arb, gesamt, anzahl: alle.length};
}
function notenstand(schuelerId, kursId){
  return notenstandAus(schuelerNoten(schuelerId, kursId), kursVon(kursId));
}

/* Statistik einer Arbeit */
function median(sortiert){
  const n = sortiert.length; if(!n) return null;
  return n%2 ? sortiert[(n-1)/2] : (sortiert[n/2-1]+sortiert[n/2])/2;
}
function arbeitStatistik(arbeit, kurs){
  const werte = Object.values(arbeit.ergebnisse).filter(w=>w!==null && w!=="" && w!==undefined).map(Number).sort((a,b)=>a-b);
  const n = werte.length;
  if (!n) return {n:0};
  const mw = werte.reduce((a,b)=>a+b,0)/n;
  const med = median(werte);
  const untere = werte.slice(0, Math.floor(n/2));
  const obere  = werte.slice(Math.ceil(n/2));
  let q1 = median(untere), q3 = median(obere);
  if (q1==null) q1 = med;  // bei n=1 fallen Quartile mit dem Median zusammen
  if (q3==null) q3 = med;
  const sys = notensystem(kurs);
  const dist = {};
  for (const w of sys.werte) dist[w]=0;
  for (const w of werte) dist[w] = (dist[w]||0)+1;
  return {n, mittel:mw, median:med, q1, q3, min:werte[0], max:werte[n-1], dist, werte};
}

/* Mitarbeit zusammenfassen */
function mitarbeitZusammenfassung(schuelerId, kursId){
  const erg = {};
  for (const kat of MITARBEIT_KATEGORIEN){
    const evs = S.ereignisse.filter(e=>e.schuelerId===schuelerId && e.kursId===kursId && e.typ===kat.id);
    const counts = {}; for (const s of STUFEN) counts[s.v]=0;
    let sum=0;
    for (const e of evs){ counts[e.stufe]=(counts[e.stufe]||0)+1; sum+=e.stufe; }
    erg[kat.id] = {anzahl:evs.length, schnitt: evs.length? sum/evs.length : null, counts};
  }
  return erg;
}

    offen: fehl.filter(x=>x.a.entschuldigt===null).length,

    minuten: liste.filter(x=>x.a.status==="verspaetet").reduce((s,x)=>s+(x.a.minuten||0),0)

/* Ein Neuzeichnen, das wartet, bis der Mensch fertig ist.
   Der stille Abruf aus planr kann jederzeit hereinkommen - auch mitten in einer
   Notiz oder bei offenem Dialog. zeichne() baut die Seite komplett neu, damit
   wäre die halb getippte Zeile weg. Also erst schauen, ob gerade jemand
   arbeitet, und sonst alle zwei Sekunden nachfragen. */
function oberflaecheBeschaeftigt(){
  const m = document.getElementById("modal");
  if (m && m.classList.contains("offen")) return true;
  /* Das Schüler-Popup bleibt jetzt beim Notieren offen - ein Neuzeichnen
     mittendrin nähme dem Menschen das Fenster unter der Hand weg. */
  const p = document.getElementById("popover");
  if (p && p.classList.contains("offen")) return true;
  const f = document.activeElement;
  if (!f) return false;
  return f.tagName==="INPUT" || f.tagName==="TEXTAREA" || f.tagName==="SELECT" || f.isContentEditable===true;
}
let zeichnenWartet = null;
function zeichneWennFrei(){
  if (!oberflaecheBeschaeftigt()){
    if (zeichnenWartet){ clearInterval(zeichnenWartet); zeichnenWartet = null; }
    zeichne();
    return;
  }
  if (zeichnenWartet) return;
  zeichnenWartet = setInterval(function(){
    if (oberflaecheBeschaeftigt()) return;
    clearInterval(zeichnenWartet); zeichnenWartet = null;
    zeichne();
  }, 2000);
}

/* Denselben Inhalt neu bauen, ohne das Fenster zu bewegen. Neu zu positionieren
   hiesse, dass es unter dem Finger wegspringt, sobald eine Zeile dazukommt. */
function popupAktualisieren(){
  if (!popupOffenFuer) return;
  const pop = document.getElementById("popover");
  if (!pop || !pop.classList.contains("offen")) return;
  const html = popupSchuelerHtml(popupOffenFuer);
  if (!html){ schliessePopover(); return; }
  pop.innerHTML = html;
}
function zeigePopover(html, ankerRect){
  const pop = document.getElementById("popover");
  pop.innerHTML = html;
  document.getElementById("overlay").classList.add("offen");
  pop.classList.add("offen");
  let x = 20, y = 80;
  if (ankerRect){
    x = Math.min(Math.max(10, ankerRect.left), window.innerWidth - 420);
    y = ankerRect.bottom + 8;
    if (y + Math.min(pop.offsetHeight, window.innerHeight*0.82) > window.innerHeight - 10)
      y = Math.max(10, window.innerHeight - pop.offsetHeight - 16);
  } else { x = (window.innerWidth - pop.offsetWidth)/2; }
  pop.style.left = Math.max(10,x)+"px"; pop.style.top = Math.max(10,y)+"px";
}
function schliessePopover(){
  popupOffenFuer = null;
  document.getElementById("popover").classList.remove("offen");
  document.getElementById("modal").classList.remove("offen");
  document.getElementById("overlay").classList.remove("offen");
}
function zeigeModal(html){
  schliessePopover();

  document.getElementById("overlay").classList.add("offen");

/* ============ Diagramme (SVG) ============ */
function skala(sys){
  return sys.typ==="punkte" ? {min:0, max:15, ticks:[0,3,6,9,12,15]} : {min:1, max:6, ticks:[1,2,3,4,5,6]};
}
function svgBoxplot(stat, sys){
  const sk = skala(sys), B=640, H=110, L=40, Rr=20;
  const x = v => L + (v-sk.min)/(sk.max-sk.min)*(B-L-Rr);
  const yM = 44;
  let s = '<svg viewBox="0 0 '+B+' '+H+'" style="width:100%;max-width:640px;display:block">';
  s += '<line x1="'+L+'" y1="86" x2="'+(B-Rr)+'" y2="86" stroke="#c8d0c5"/>';
  for (const t of sk.ticks)
    s += '<line x1="'+x(t)+'" y1="82" x2="'+x(t)+'" y2="90" stroke="#c8d0c5"/>'+
         '<text x="'+x(t)+'" y="104" font-size="12" fill="#6b7a68" text-anchor="middle">'+t+'</text>';
  s += '<line x1="'+x(stat.min)+'" y1="'+yM+'" x2="'+x(stat.q1)+'" y2="'+yM+'" stroke="#3d7a4e" stroke-width="2"/>';
  s += '<line x1="'+x(stat.q3)+'" y1="'+yM+'" x2="'+x(stat.max)+'" y2="'+yM+'" stroke="#3d7a4e" stroke-width="2"/>';
  s += '<line x1="'+x(stat.min)+'" y1="'+(yM-12)+'" x2="'+x(stat.min)+'" y2="'+(yM+12)+'" stroke="#3d7a4e" stroke-width="2"/>';
  s += '<line x1="'+x(stat.max)+'" y1="'+(yM-12)+'" x2="'+x(stat.max)+'" y2="'+(yM+12)+'" stroke="#3d7a4e" stroke-width="2"/>';
  const bx = Math.min(x(stat.q1), x(stat.q3)), bw = Math.max(2, Math.abs(x(stat.q3)-x(stat.q1)));
  s += '<rect x="'+bx+'" y="'+(yM-20)+'" width="'+bw+'" height="40" fill="#e8f2ea" stroke="#3d7a4e" stroke-width="2" rx="4"/>';
  s += '<line x1="'+x(stat.median)+'" y1="'+(yM-20)+'" x2="'+x(stat.median)+'" y2="'+(yM+20)+'" stroke="#1b5e20" stroke-width="3"/>';
  s += '<circle cx="'+x(stat.mittel)+'" cy="'+yM+'" r="5" fill="#f57c00"/>'+
       '<text x="'+x(stat.mittel)+'" y="'+(yM-26)+'" font-size="12" fill="#f57c00" text-anchor="middle">Mittelwert</text>';
  return s + '</svg>';
}
function svgVerteilung(stat, sys){
  const sk = skala(sys);
  const werte = sys.werte.slice().sort((a,b)=>a-b);
  const maxN = Math.max(1, ...Object.values(stat.dist));
  const B=640, H=150, L=40, unten=124;
  const bw = (B-L-20)/werte.length;
  let s = '<svg viewBox="0 0 '+B+' '+H+'" style="width:100%;max-width:640px;display:block;margin-top:6px">';
  s += '<line x1="'+L+'" y1="'+unten+'" x2="'+(B-14)+'" y2="'+unten+'" stroke="#c8d0c5"/>';
  werte.forEach((w,i)=>{
    const n = stat.dist[w]||0;
    const h = n/maxN*88;
    const xx = L + i*bw + bw*0.15;
    if (n) s += '<rect x="'+xx+'" y="'+(unten-h)+'" width="'+(bw*0.7)+'" height="'+h+'" fill="#3d7a4e" rx="3"/>'+
      '<text x="'+(xx+bw*0.35)+'" y="'+(unten-h-5)+'" font-size="12" fill="#3d7a4e" text-anchor="middle">'+n+'</text>';
    s += '<text x="'+(xx+bw*0.35)+'" y="'+(unten+16)+'" font-size="12" fill="#6b7a68" text-anchor="middle">'+w+'</text>';
  });
  return s + '<text x="'+L+'" y="14" font-size="12" fill="#6b7a68">Verteilung ('+(sys.typ==="punkte"?"Punkte":"Noten")+')</text></svg>';
}

function nameParsen(zeile){
  zeile = zeile.trim(); if(!zeile) return null;
  if (zeile.includes(",")){
    const [n, v] = zeile.split(",").map(x=>x.trim());
    return {vorname:v||"", name:n||""};
  }
  const teile = zeile.split(/\s+/);
  if (teile.length===1) return {vorname:teile[0], name:""};
  return {vorname:teile.slice(0,-1).join(" "), name:teile[teile.length-1]};
}

/* ---------- SHA-256 (eigenständig, für PIN – unabhängig von WebCrypto) ---------- */
function sha256Hex(ascii){
  function rr(v,c){ return (v>>>c)|(v<<(32-c)); }
  const mathPow=Math.pow, maxWord=mathPow(2,32);
  let result="", words=[], asciiBitLength=ascii.length*8;
  let hash=sha256Hex.h=sha256Hex.h||[], k=sha256Hex.k=sha256Hex.k||[];
  let primeCounter=k.length; const isComposite={};
  for (let candidate=2; primeCounter<64; candidate++){
    if (!isComposite[candidate]){
      for (let i=0;i<313;i+=candidate) isComposite[i]=candidate;
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+="\x80";
  while (ascii.length%64-56) ascii+="\x00";
  for (let i=0;i<ascii.length;i++){
    const j=ascii.charCodeAt(i); if (j>>8) return null;
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for (let j=0;j<words.length;){
    const w=words.slice(j,j+=16), oldHash=hash.slice(0,8);
    for (let i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2];
      const a=hash[0], e=hash[4];
      const temp1=hash[7]
        +(rr(e,6)^rr(e,11)^rr(e,25))
        +((e&hash[5])^((~e)&hash[6]))
        +k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const temp2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for (let i=0;i<8;i++) hash[i]=(hash[i]+oldHash[i])|0;
  }
  for (let i=0;i<8;i++)
    for (let j=3;j+1;j--){
      const b=(hash[i]>>(j*8))&255;
      result+=((b<16)?0:"")+b.toString(16);
    }
  return result;
}
function pinHash(pin, salt){
  let h = salt + ":" + pin;
  for (let i=0;i<5000;i++) h = sha256Hex(h);
  return h;
}

/* ---------- Heute-Ansicht & Stundenplan-Slots ---------- */
function heutigeKurse(){
  const sj = aktivesSchuljahr(); if(!sj) return [];
  const heute = todayISO();
  const wt = new Date(heute+"T12:00:00").getDay(); // 1=Mo..5=Fr
  const wb = wochenBuchstabe(sj, heute);
  const liste = [];
  for (const k of S.kurse.filter(k=>k.schuljahrId===sj.id)){
    for (const slot of (k.slots||[])){
      if (slot.tag===wt && (slot.woche==="AB" || slot.woche===wb))
        liste.push({kurs:k, stunde:slot.stunde});
    }
  }
  return liste.sort((a,b)=>a.stunde-b.stunde);
}
function offeneFehlzeiten(){
  return S.anwesenheit.filter(a=>a.status==="fehlt" && a.entschuldigt===null).length;
}
function backupAlterTage(){
  if (!S.einstellungen.letztesBackup) return null;
  return Math.floor((Date.now() - new Date(S.einstellungen.letztesBackup).getTime())/(24*3600*1000));
}

/* ---------- Notenvorschlag aus Mitarbeit ---------- */
/* Vorschlag für die Mitarbeitsnote. Rechnet in MerkrMitarbeit
   (src/kern/mitarbeit.js), damit die Kurve ohne Gerät prüfbar bleibt.

   Das Modell ist Basis und zwei Ausschläge: wer nicht auffällt, steht bei 3,5,
   Beteiligung zieht nach oben, Stören nach unten. Vorher war es das Mittel der
   Stufen - darin kürzt sich die Anzahl heraus, und eine einzige Notiz "++" wog
   so schwer wie zwanzig. Damit ließ sich Quantität nicht bewerten.

   Ohne gehaltene Stunde gibt es weiter keinen Vorschlag. Die Basis ist eine
   Aussage über einen stillen Schüler, keine über ein leeres Halbjahr. */
function notenvorschlag(schuelerId, kursId){
  const kurs = kursVon(kursId), sys = notensystem(kurs);
  const heute = todayISO();
  const evs = S.ereignisse.filter(e=>e.schuelerId===schuelerId && e.kursId===kursId);
  const erg = MerkrMitarbeit.vorschlag(
    S.stunden.filter(x=>x.kursId===kursId),
    evs,
    Object.assign({
      typ: sys.typ,
      jetzt: new Date(),
      ab: MerkrNoten.halbjahrBeginn(aktivesSchuljahr(), heute),
      bis: heute
    }, S.einstellungen.mitarbeitKurve || {})
  );
  if (!erg || !erg.stunden) return null;
  return {
    wert: erg.wert, genau: erg.genau, note: erg.note,
    avg: erg.achsen.m.mittel, anzahl: erg.anzahl, frisch: erg.achsen.m.anzahl,
    basis: erg.basis, muendlich: erg.muendlich, schriftlich: erg.schriftlich,
    gedeckelt: erg.gedeckelt, stunden: erg.stunden,
    wertM: erg.achsen.m.wert, wertS: erg.achsen.s.wert,
    jeStundeM: erg.achsen.m.jeStunde, jeStundeS: erg.achsen.s.jeStunde,
    anzahlM: erg.achsen.m.anzahl, anzahlS: erg.achsen.s.anzahl
  };
}

/* Die Herkunft einer Vorschlagszahl in einem Satz. Ohne sie ist der Vorschlag im
   Elterngespräch wertlos - "3,1" beantwortet keine Frage, "aus 12 Beteiligungen
   in 20 Stunden, dazu 3 Störungen" schon. */
function vorschlagHerkunft(vs){
  if (!vs) return "";
  const teile = ["Basis "+fmtZahl(vs.basis)];
  if (Math.abs(vs.muendlich) > 0.005)
    teile.push("mündlich "+(vs.muendlich>0?"−":"+")+fmtZahl(Math.abs(vs.muendlich))+
      " ("+fmtZahl(vs.jeStundeM,1)+" Notizen je Stunde)");
  if (Math.abs(vs.schriftlich) > 0.005)
    teile.push("schriftlich "+(vs.schriftlich>0?"−":"+")+fmtZahl(Math.abs(vs.schriftlich)));
  return teile.join(" · ")+" · aus "+vs.stunden+" Stunden";
}

/* Dieselbe Herkunft als Aufstellung. Jede Zeile ist ein Summand der Rechnung,
   damit im Gespräch nicht die Zahl verteidigt werden muss, sondern die Teile
   besprochen werden können. */
function herkunftHtml(vs){
  if (!vs) return "";
  const zeile = (was, wert, dazu) =>
    '<div style="display:flex;justify-content:space-between;gap:12px;padding:3px 0">'+
    '<span>'+esc(was)+(dazu?' <span class="hinweis" style="font-size:12.5px;opacity:.75">'+esc(dazu)+'</span>':'')+'</span>'+
    '<b style="font-variant-numeric:tabular-nums">'+wert+'</b></div>';
  /* Der Stundenwert ist die eigentliche Aussage: was ein Schüler im Schnitt zu
     einer Stunde beiträgt. Positiv nach oben, negativ nach unten - deshalb steht
     das Vorzeichen der Note umgekehrt zum Vorzeichen des Beitrags. */
  const achse = (was, teil, wert, anzahl, dazu) => {
    if (Math.abs(teil) < 0.005 && !anzahl) return "";
    return zeile(was, (teil > 0 ? "−" : "+") + fmtZahl(Math.abs(teil)),
      (dazu ? dazu + ", " : "") + fmtZahl(wert, 2) + " je Stunde");
  };
  let h = '<div style="margin:10px 0;font-size:14px">';
  h += zeile("Basis", fmtZahl(vs.basis), "eine Stunde ohne Auffälligkeit");
  h += achse("Mündliche Mitarbeit", vs.muendlich, vs.wertM, vs.anzahlM,
    vs.anzahlM + (vs.anzahlM===1?" Notiz":" Notizen"));
  h += achse("Praktische Leistung", vs.schriftlich, vs.wertS, vs.anzahlS,
    vs.anzahlS + (vs.anzahlS===1?" Notiz":" Notizen"));
  h += '<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0 0;margin-top:4px;border-top:1px solid var(--linie)">'+
    '<span>aus '+vs.stunden+' gehaltenen Stunden</span>'+
    '<b style="font-variant-numeric:tabular-nums">'+fmtZahl(vs.note,1)+'</b></div>';
  return h + '</div>';
}

/* ---------- Notenverlauf als Diagramm ---------- */
/* Inline-SVG statt Bibliothek: im Klassenraum ist das Netz manchmal weg, und in
   Scriptable gibt es ohnehin kein npm. Gezeichnet wird in einem festen
   Koordinatensystem und über viewBox skaliert - so passt es aufs Telefon wie
   aufs iPad, ohne dass eine Messung nötig wäre. */
function notenverlauf(schuelerId, kursId){
  const kurs = kursVon(kursId), sj = aktivesSchuljahr();
  if (!kurs || !sj) return null;
  const heute = todayISO();
  const evs = S.ereignisse.filter(e=>e.schuelerId===schuelerId && e.kursId===kursId);
  const punkte = MerkrMitarbeit.verlauf(
    S.stunden.filter(x=>x.kursId===kursId),
    evs,
    Object.assign({
      typ: "noten", jetzt: new Date(), bis: heute,
      halbjahrAb: function(d){ return MerkrNoten.halbjahrBeginn(sj, d); }
    }, S.einstellungen.mitarbeitKurve || {})
  );
  return punkte.length ? punkte : null;
}

function mitarbeitVerlaufSvg(punkte, opt){
  const o = opt || {};
  const B = 640, H = 200, L = 28, RA = 8, T = 10, U = 22;
  const iX = B - L - RA, iY = H - T - U;
  const y = n => T + (n - 1) / 5 * iY;              // Note 1 oben, 6 unten
  const x = i => punkte.length < 2 ? L + iX/2 : L + i / (punkte.length - 1) * iX;

  let g = '';
  /* Notenlinien. Die Drei bekommt mehr Kontrast: an ihr wird abgelesen, ob
     jemand über oder unter dem Mittel liegt. */
  for (const n of [1,2,3,4,5,6]){
    const stark = n === 3;
    g += '<line x1="'+L+'" y1="'+y(n).toFixed(1)+'" x2="'+(B-RA)+'" y2="'+y(n).toFixed(1)+
      '" stroke="var(--linie)" stroke-width="'+(stark?1.4:0.8)+'" opacity="'+(stark?0.9:0.45)+'"/>'+
      '<text x="'+(L-6)+'" y="'+(y(n)+3.5).toFixed(1)+'" text-anchor="end" font-size="10" '+
      'fill="currentColor" opacity="'+(stark?0.75:0.45)+'">'+n+'</text>';
  }

  /* Balken für den Beitrag der einzelnen Stunde, an der Grundlinie gespiegelt.
     Sie beantworten eine andere Frage als die Kurve: nicht "wie steht er",
     sondern "was war an dem Tag". */
  const maxB = Math.max(1, ...punkte.map(p=>Math.abs(p.beitrag)));
  for (let i=0;i<punkte.length;i++){
    const p = punkte[i];
    if (!p.beitrag) continue;
    const hoehe = Math.abs(p.beitrag) / maxB * (iY * 0.16);
    const basis = H - U;
    g += '<rect x="'+(x(i)-1.6).toFixed(1)+'" y="'+(p.beitrag>0 ? basis-hoehe : basis).toFixed(1)+
      '" width="3.2" height="'+hoehe.toFixed(1)+'" rx="1.4" fill="'+
      (p.beitrag>0 ? "var(--akzent)" : "var(--rot)")+'" opacity="0.5"/>';
  }

  /* Die Kurve bricht am Halbjahreswechsel ab, statt hinüberzuziehen - dort wird
     neu gezählt, eine durchgehende Linie behauptete einen Zusammenhang, den es
     nicht gibt. */
  let d = "", vorher = null;
  for (let i=0;i<punkte.length;i++){
    const p = punkte[i];
    d += (vorher === p.halbjahr ? " L" : " M") + x(i).toFixed(1) + " " + y(p.note).toFixed(1);
    vorher = p.halbjahr;
  }
  g += '<path d="'+d.trim()+'" fill="none" stroke="var(--akzent)" stroke-width="2.4" '+
    'stroke-linejoin="round" stroke-linecap="round"/>';

  const letzte = punkte[punkte.length-1];
  g += '<circle cx="'+x(punkte.length-1).toFixed(1)+'" cy="'+y(letzte.note).toFixed(1)+
    '" r="4.5" fill="var(--akzent)"/>';

  /* Monatsmarken. Angeschnittene fallen weg, sonst überschreiben sie sich am
     Rand - dasselbe Problem wie in planrs Zeitschiene. */
  const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  let letzterMonat = "", letzteX = -99;
  for (let i=0;i<punkte.length;i++){
    const m = punkte[i].datum.slice(0,7);
    if (m === letzterMonat) continue;
    letzterMonat = m;
    if (x(i) - letzteX < 34) continue;
    letzteX = x(i);
    g += '<text x="'+x(i).toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle" font-size="10" '+
      'fill="currentColor" opacity="0.5">'+MON[Number(m.slice(5,7))-1]+'</text>';
  }

  /* Der Halbjahreswechsel als senkrechte Marke. */
  for (let i=1;i<punkte.length;i++){
    if (punkte[i].halbjahr === punkte[i-1].halbjahr) continue;
    const xm = (x(i) + x(i-1)) / 2;
    g += '<line x1="'+xm.toFixed(1)+'" y1="'+T+'" x2="'+xm.toFixed(1)+'" y2="'+(H-U)+
      '" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>'+
      '<text x="'+(xm+4).toFixed(1)+'" y="'+(T+10)+'" font-size="9.5" fill="currentColor" '+
      'opacity="0.55">2. Halbjahr</text>';
  }

  return '<svg viewBox="0 0 '+B+' '+H+'" width="100%" height="'+(o.hoehe||200)+'" '+
    'style="display:block;overflow:visible" role="img" aria-label="Notenverlauf">'+g+'</svg>';
}

/* ---------- Plandatei-Import (KI-Workflow Stufe 1) ---------- */
function planImportieren(text){
  let plan;
  try { plan = JSON.parse(text); } catch(e){ return {fehler:"Datei ist kein gültiges JSON."}; }
  if (!plan || plan.formatVersion!=="kursbuch-plan-1") return {fehler:"Format nicht erkannt – erwartet wird formatVersion \"kursbuch-plan-1\"."};
  const sj = aktivesSchuljahr(); if (!sj) return {fehler:"Kein aktives Schuljahr."};
  let ferienNeu=0, themen=0; const unbekannt=[];
  if (Array.isArray(plan.ferien)){
    sj.ferien = sj.ferien||[];
    for (const f of plan.ferien){
      if (f && f.von && f.bis && !sj.ferien.some(x=>x.von===f.von && x.bis===f.bis)){
        sj.ferien.push({name:String(f.name||"Ferien"), von:f.von, bis:f.bis}); ferienNeu++;
      }
    }
  }
  if (Array.isArray(plan.plaene)){
    for (const p of plan.plaene){
      const kurs = S.kurse.find(k=>k.schuljahrId===sj.id && k.name.trim().toLowerCase()===String(p.kurs||"").trim().toLowerCase());
      if (!kurs){ unbekannt.push(String(p.kurs||"?")); continue; }
      for (const t of (p.themen||[])){
        if (!t || !t.datum || !/^\d{4}-\d{2}-\d{2}$/.test(t.datum)) continue;
        const st = ensureStunde(kurs.id, t.datum);
        st.geplant = String(t.thema||"");
        themen++;
      }
    }
  }
  speichern();
  return {ferienNeu, themen, unbekannt};
}

/* ---------- Verschlüsseltes Backup (WebCrypto, AES-GCM) ---------- */
function b64(buf){ let s=""; const b=new Uint8Array(buf); for (let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(s){ const bin=atob(s); const b=new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
function cryptoVerfuegbar(){ return typeof crypto!=="undefined" && crypto.subtle && typeof crypto.subtle.deriveKey==="function"; }
async function schluesselAbleiten(passwort, salt, iter){
  const enc = new TextEncoder();
  const basis = await crypto.subtle.importKey("raw", enc.encode(passwort), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, basis,
    {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function backupVerschluesseln(passwort){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const iter = 150000;
  const key = await schluesselAbleiten(passwort, salt, iter);
  const daten = new TextEncoder().encode(JSON.stringify(S));
  const chiffre = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, daten);
  return JSON.stringify({kb:"kursbuch-backup-enc1", iter, salt:b64(salt), iv:b64(iv), daten:b64(chiffre)});
}
async function backupEntschluesseln(obj, passwort){
  const key = await schluesselAbleiten(passwort, unb64(obj.salt), obj.iter||150000);
  const klar = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(obj.iv)}, key, unb64(obj.daten));
  return new TextDecoder().decode(klar);
}

/* ---------- Datei-Export (Bridge oder Browser) ---------- */
function dateiNameSicher(name){
  return String(name)
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss")
    .replace(/[^\x20-\x7E]/g,"_").replace(/[\\\/:*?"<>|]/g,"_");
}
function dateiExportieren(name, inhaltBase64, mime){
  name = dateiNameSicher(name);
  if (KB_MODE==="scriptable"){
    sendeAnBridge({typ:"exportdatei", name, base64: inhaltBase64});
  } else {
    const bin = unb64(inhaltBase64);
    const blob = new Blob([bin], {type: mime||"application/octet-stream"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
}
function textExportieren(name, text, mime){
  const b = new TextEncoder().encode(text);
  let s=""; for (let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
  dateiExportieren(name, btoa(s), mime||"application/json");
}

/* ---------- Mini-PDF-Generator (A4, Helvetica, Latin-1) ---------- */
const PDF_B = 595.28, PDF_H = 841.89;
function pdfNeu(){ return {seiten:[]}; }
function pdfSeite(doc){ const s={ops:[]}; doc.seiten.push(s); return s; }
function pdfLatin1(s){
  let r="";
  for (const ch of String(s)){
    const c = ch.codePointAt(0);
    if (c===8722) r += "-";                    // − Minuszeichen
    else if (c===8211 || c===8212) r += "-";   // – —
    else if (c===8222 || c===8220 || c===8221) r += '"';
    else if (c===8216 || c===8217) r += "'";
    else if (c===8230) r += "...";
    else if (c===8594) r += ">";
    else if (c>255) r += "?";
    else r += ch;
  }
  return r.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
}
function pdfFarbe(hex){
  const n = parseInt(hex.replace("#",""),16);
  return ((n>>16)&255)/255+" "+((n>>8)&255)/255+" "+(n&255)/255;
}
function pdfText(s, x, yTop, txt, groesse, fett, farbeHex){
  s.ops.push((farbeHex?pdfFarbe(farbeHex):"0 0 0")+" rg BT /"+(fett?"F2":"F1")+" "+(groesse||10)+
    " Tf 1 0 0 1 "+x.toFixed(1)+" "+(PDF_H-yTop).toFixed(1)+" Tm ("+pdfLatin1(txt)+") Tj ET");
}
function pdfTextBreite(txt, groesse){ return String(txt).length * (groesse||10) * 0.5; } // grobe Näherung Helvetica
function pdfLinie(s, x1, y1, x2, y2, farbeHex, staerke){
  s.ops.push((farbeHex?pdfFarbe(farbeHex):"0.7 0.7 0.7")+" RG "+(staerke||0.6)+" w "+
    x1.toFixed(1)+" "+(PDF_H-y1).toFixed(1)+" m "+x2.toFixed(1)+" "+(PDF_H-y2).toFixed(1)+" l S");
}
function pdfRechteck(s, x, yTop, b, h, farbeHex){
  s.ops.push(pdfFarbe(farbeHex||"#eeeeee")+" rg "+x.toFixed(1)+" "+(PDF_H-yTop-h).toFixed(1)+" "+b.toFixed(1)+" "+h.toFixed(1)+" re f");
}
function pdfKreis(s, cx, cyTop, r, farbeHex){
  const cy = PDF_H-cyTop, k = 0.5523*r;
  s.ops.push(pdfFarbe(farbeHex)+" rg "+
    (cx-r).toFixed(1)+" "+cy.toFixed(1)+" m "+
    (cx-r).toFixed(1)+" "+(cy+k).toFixed(1)+" "+(cx-k).toFixed(1)+" "+(cy+r).toFixed(1)+" "+cx.toFixed(1)+" "+(cy+r).toFixed(1)+" c "+
    (cx+k).toFixed(1)+" "+(cy+r).toFixed(1)+" "+(cx+r).toFixed(1)+" "+(cy+k).toFixed(1)+" "+(cx+r).toFixed(1)+" "+cy.toFixed(1)+" c "+
    (cx+r).toFixed(1)+" "+(cy-k).toFixed(1)+" "+(cx+k).toFixed(1)+" "+(cy-r).toFixed(1)+" "+cx.toFixed(1)+" "+(cy-r).toFixed(1)+" c "+
    (cx-k).toFixed(1)+" "+(cy-r).toFixed(1)+" "+(cx-r).toFixed(1)+" "+(cy-k).toFixed(1)+" "+(cx-r).toFixed(1)+" "+cy.toFixed(1)+" c f");
}
function pdfFertig(doc){
  const objekte = [];
  const nSeiten = doc.seiten.length;
  // Objekt 1: Catalog, 2: Pages, 3: F1, 4: F2, dann je Seite: Page + Inhalt
  objekte[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  const kids = [];
  for (let i=0;i<nSeiten;i++) kids.push((5+i*2)+" 0 R");
  objekte[2] = "<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+nSeiten+" >>";
  objekte[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objekte[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  doc.seiten.forEach((seite,i)=>{
    const inhalt = seite.ops.join("\n");
    objekte[5+i*2] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PDF_B+" "+PDF_H+"] "+
      "/Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(6+i*2)+" 0 R >>";
    objekte[6+i*2] = "<< /Length "+inhalt.length+" >>\nstream\n"+inhalt+"\nendstream";
  });
  let pdf = "%PDF-1.4\n";
  const offsets = [0];
  for (let i=1;i<objekte.length;i++){
    offsets[i] = pdf.length;
    pdf += i+" 0 obj\n"+objekte[i]+"\nendobj\n";
  }
  const xref = pdf.length;
  pdf += "xref\n0 "+objekte.length+"\n0000000000 65535 f \n";
  for (let i=1;i<objekte.length;i++) pdf += String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  pdf += "trailer\n<< /Size "+objekte.length+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  return btoa(pdf);
}

/* ---------- Schülerprofil als DIN-A4-PDF (genau eine Seite) ---------- */
function profilPdfErzeugen(schuelerId, kursId){
  const s0 = schuelerVon(schuelerId), kurs = kursVon(kursId), sj = aktivesSchuljahr();
  const sys = notensystem(kurs);
  const ns = notenstand(schuelerId, kursId);
  const mz = mitarbeitZusammenfassung(schuelerId, kursId);
  const fz = fehlzeiten(schuelerId, kursId);
  const vs = notenvorschlag(schuelerId, kursId);
  const noten = schuelerNoten(schuelerId, kursId).sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  const evs = S.ereignisse.filter(e=>e.schuelerId===schuelerId && e.kursId===kursId).sort((a,b)=>b.ts.localeCompare(a.ts));
  const doc = pdfNeu(), p = pdfSeite(doc);
  const L=48, Rr=547;
  let y = 56;

  pdfText(p, L, y, s0.vorname+" "+s0.name, 20, true, "#14210f");
  pdfText(p, Rr-pdfTextBreite("merkr · erstellt am "+fmtDatum(todayISO()),9), y, "merkr · erstellt am "+fmtDatum(todayISO()), 9, false, "#777777");
  y += 18;
  pdfText(p, L, y, kurs.name+" ("+(kurs.fach||"")+", Jahrgang "+kurs.jahrgang+") · Schuljahr "+(sj?sj.name:"–"), 11);
  y += 22; pdfLinie(p, L, y, Rr, y, "#3d7a4e", 1.2); y += 24;

  /* Notenstand */
  pdfText(p, L, y, "Leistungsstand", 13, true, "#3d5a2e");
  y += 18;
  const einheit = sys.typ==="punkte" ? " P." : "";
  pdfText(p, L, y, "Gesamt: "+(ns.gesamt==null?"–":fmtZahl(ns.gesamt))+einheit, 11, true);
  pdfText(p, L+150, y, "Klassenarbeiten: "+(ns.arb==null?"–":fmtZahl(ns.arb))+einheit+"  ("+(100-gewSonstige(kurs))+" %)", 10);
  pdfText(p, L+330, y, "sonstige Leistungen: "+(ns.son==null?"–":fmtZahl(ns.son))+einheit+"  ("+gewSonstige(kurs)+" %)", 10);
  y += 14;
  pdfText(p, L, y, "davon mündliche Note: "+(ns.m==null?"–":fmtZahl(ns.m))+einheit+
    (mdlModus(kurs)==="anteil" ? " (fest "+gewMdlAnteil(kurs)+" %)" : " (zählt als eine sonstige Leistung)")+
    " · übrige sonstige: "+(ns.wso==null?"–":fmtZahl(ns.wso))+einheit, 9, false, "#555555");
  y += 14;
  if (vs) pdfText(p, L, y, "Vorschlag Mitarbeitsnote: "+vs.wert+einheit+" ("+vorschlagHerkunft(vs)+")", 10, false, "#333333");
  y += 22;

  /* Mitarbeit */
  pdfText(p, L, y, "Mitarbeit nach Kategorien", 13, true, "#3d5a2e");
  y += 18;
  for (const kat of MITARBEIT_KATEGORIEN){
    const z = mz[kat.id];
    pdfText(p, L, y, kat.kurz, 10);
    let x = L+150;
    for (const stu of STUFEN){
      pdfKreis(p, x, y-3, 4.5, stu.hex);
      pdfText(p, x+8, y, String(z.counts[stu.v]||0), 10);
      x += 44;
    }
    pdfText(p, x+8, y, z.schnitt==null ? "kein Eintrag" : ("Ø "+fmtZahl(z.schnitt,1)+"  ("+z.anzahl+(z.anzahl===1?" Eintrag":" Einträge")+")"), 10, false, "#555555");
    y += 17;
  }
  y += 10;

  /* Noten */
  pdfText(p, L, y, "Noten und Arbeiten", 13, true, "#3d5a2e"); y += 16;
  if (!noten.length){ pdfText(p, L, y, "Noch keine Noten.", 10, false, "#777777"); y += 16; }
  else {
    pdfText(p, L, y, "Datum", 9, true, "#777777"); pdfText(p, L+80, y, "Art", 9, true, "#777777");
    pdfText(p, L+300, y, "Bereich", 9, true, "#777777"); pdfText(p, L+380, y, "Wert", 9, true, "#777777");
    pdfText(p, L+440, y, "Gewicht", 9, true, "#777777");
    y += 5; pdfLinie(p, L, y, Rr, y); y += 13;
    const maxNoten = 8;
    for (const n of noten.slice(0, maxNoten)){
      pdfText(p, L, y, fmtDatum(n.datum), 10);
      pdfText(p, L+80, y, (n.label||(n.ausArbeit?"Arbeit":"Note")).slice(0,42), 10);
      pdfText(p, L+300, y, bereichKurz(n.bereich), 10);
      pdfText(p, L+380, y, String(n.wert), 10, true);
      pdfText(p, L+440, y, gewText(n.gewicht), 10);
      y += 15;
    }
    if (noten.length>maxNoten){ pdfText(p, L, y, "… "+(noten.length-maxNoten)+" weitere in der App", 9, false, "#777777"); y += 15; }
  }
  y += 8;

  /* Fehlzeiten */
  pdfText(p, L, y, "Fehlzeiten", 13, true, "#3d5a2e"); y += 16;
  pdfText(p, L, y, fz.fehltGesamt+"× gefehlt ("+fz.unentschuldigt+" unentschuldigt, "+fz.offen+" offen)  ·  "+
    fz.verspaetungen+"× verspätet ("+fz.minuten+" Min.)", 10);
  y += 24;

  /* Ereignisse – füllt den Rest der Seite, bricht nie um */
  pdfText(p, L, y, "Ereignisse (Datum · Thema der Stunde · Ereignis · Stufe)", 13, true, "#3d5a2e"); y += 16;
  pdfText(p, L, y, "Datum", 9, true, "#777777"); pdfText(p, L+62, y, "Thema der Stunde", 9, true, "#777777");
  pdfText(p, L+330, y, "Ereignis", 9, true, "#777777"); pdfText(p, L+480, y, "Stufe", 9, true, "#777777");
  y += 5; pdfLinie(p, L, y, Rr, y); y += 13;
  const yMax = 800;
  let gezeigt = 0;
  for (const e of evs){
    if (y > yMax - 15) break;
    const st = stundeVon(e.stundeId);
    pdfText(p, L, y, st?fmtDatum(st.datum):"–", 9);
    pdfText(p, L+62, y, ((st&&st.thema)?st.thema:"–").slice(0,52), 9);
    pdfText(p, L+330, y, (ereignisName(e)+(e.text?": "+e.text:"")).slice(0,30), 9);
    if (e.stufe!=null){
      pdfKreis(p, L+486, y-3, 4, stufeInfo(e.stufe).hex);
      pdfText(p, L+494, y, stufeInfo(e.stufe).label, 9);
    } else pdfText(p, L+486, y, "–", 9);
    y += 14; gezeigt++;
  }
  if (evs.length>gezeigt) pdfText(p, L, y, "… "+(evs.length-gezeigt)+" weitere Ereignisse in der App", 9, false, "#777777");
  pdfLinie(p, L, 812, Rr, 812);
  pdfText(p, L, 824, "merkr – persönliche Unterrichtsdokumentation. Nur für den dienstlichen Gebrauch.", 8, false, "#999999");
  return pdfFertig(doc);
}

/* ---------- Was hat gewackelt? Rückmeldung an planr ---------- */
//
// Nach der Stunde ankreuzen, welches Thema der TÜ Probleme gemacht hat; planr
// zieht es in der nächsten TÜ vor. Die Liste kommt aus dem, was planr beim
// letzten Abruf über diese Stunde gesagt hat - freien Text gibt es hier bewusst
// nicht: ein Thema, das drüben keine Aufgabe trifft, stünde für immer offen.
function wackelBlockHtml(st){
  if (!planrGekoppelt()) return "";
  const themen = MerkrRueckmeldung.wackelThemen(st);
  if (!themen.length) return "";
  const gemeldet = Array.isArray(st.gewackelt) ? st.gewackelt : [];
  let html = '<div class="feld"><label>Hat gewackelt (geht an planr)</label>';
  for (let i = 0; i < themen.length; i++){
    const an = gemeldet.indexOf(themen[i]) >= 0;
    html += '<label style="display:block;font-weight:400;margin:2px 0">'+
      '<input type="checkbox" class="wackelBox" value="'+esc(themen[i])+'" '+(an?"checked":"")+
      ' style="width:auto;margin-right:6px">'+esc(themen[i])+'</label>';
  }
  html += '<div class="zeile" style="margin-top:6px">'+
    '<button class="klein" data-a="wackeltMelden" data-id="'+st.id+'">An planr melden</button>'+
    '<span class="hinweis" id="wackelStand">'+
      (gemeldet.length ? "zuletzt gemeldet: "+esc(gemeldet.join(", ")) : "Themen der TÜ dieser Stunde")+
    '</span></div></div>';
  return html;
}

/* Eigener Listener statt eines Eintrags im großen Handler - dasselbe Muster wie
   die Jahresübersicht, und der Dialog entsteht bei jedem Öffnen neu. */
document.addEventListener("click", function(ev){
  const el = ev.target.closest("[data-a]");
  if (!el || el.dataset.a !== "wackeltMelden") return;
  const st = stundeVon(el.dataset.id);
  const k = st ? kursVon(st.kursId) : null;
  const auswahl = Array.from(document.querySelectorAll(".wackelBox"))
    .filter(function(b){ return b.checked; })
    .map(function(b){ return b.value; });

  const stand = document.getElementById("wackelStand");
  const brief = MerkrRueckmeldung.brief(k, st, auswahl);
  if (!brief){
    if (stand) stand.textContent = auswahl.length
      ? "Dieser Kurs kommt nicht aus planr."
      : "Nichts angekreuzt.";
    return;
  }
  if (stand) stand.textContent = "wird gemeldet ...";
  // Erst merken, dann senden: der Haken soll auch stehen, wenn das iPad gerade
  // kein Netz hat. Dasselbe Thema zweimal zu melden legt drüben nichts doppelt an.
  st.gewackelt = brief.wackelt;
  speichern();
  sendeAnBridge({typ:"planrRueckmeldung", url: planrBasis(), brief: brief});
});

/* Antwort des Rahmens auf die Rückmeldung. */
window.__KB_planrRueckAntwort = function(antwort){
  const stand = document.getElementById("wackelStand");
  if (!stand) return;
  if (!antwort || antwort.fehler){
    stand.textContent = "nicht gemeldet: " + ((antwort && antwort.fehler) || "unbekannter Fehler");
    return;
  }
  stand.textContent = antwort.signale === 0 ? "war drüben schon offen" : "gemeldet";
};

  else if (a==="pinSetzen"){
    const p = (document.getElementById("pinNeu").value||"").trim();
    if (!/^\d{4,6}$/.test(p)) return alertBox("Bitte 4 bis 6 Ziffern eingeben.");

    zeigeModal('<h2>Sicherung exportieren</h2>'+

      '<div class="feld"><label>Passwort wiederholen</label><input type="password" id="bkPw2" autocomplete="new-password"></div>'+
      '<div class="zeile"><button class="primar" data-a="backupExport">Exportieren</button><button data-a="modalZu">Abbrechen</button></div>');
  }
  else if (a==="backupExport"){
    const p1 = document.getElementById("bkPw1").value, p2 = document.getElementById("bkPw2").value;
    if (p1 !== p2) return alertBox("Die Passwörter stimmen nicht überein.");
    S.einstellungen.letztesBackup = new Date().toISOString();
    try{
      if (p1){

/* ---------- Mehrseitige PDF-Tabellen (Notenliste, Stundenliste) ---------- */
function pdfTabellenDokument(titel, untertitel, spalten, zeilen, fussnote){
  const doc = pdfNeu();
  const L=48, Rr=547, yStart=110, yMax=790;
  let p = null, y = 0;
  const kopf = ()=>{
    p = pdfSeite(doc);
    pdfText(p, L, 56, titel, 16, true, "#14210f");
    pdfText(p, Rr-pdfTextBreite("merkr · "+fmtDatum(todayISO()),9), 56, "merkr · "+fmtDatum(todayISO()), 9, false, "#777777");
    pdfText(p, L, 74, untertitel, 10, false, "#555555");
    pdfLinie(p, L, 84, Rr, 84, "#3d7a4e", 1.2);
    let x=L;
    for (const sp of spalten){ pdfText(p, x, 100, sp.titel, 9, true, "#777777"); x += sp.breite; }
    pdfLinie(p, L, 105, Rr, 105);
    y = yStart + 8;
  };
  kopf();
  for (const zeile of zeilen){
    if (y > yMax){ kopf(); }
    let x=L;
    zeile.forEach((zelle,i)=>{
      const sp = spalten[i];
      const txt = String(zelle==null?"–":zelle).slice(0, sp.maxZeichen||40);
      pdfText(p, x, y, txt, 9.5, !!sp.fett);
      x += sp.breite;
    });
    y += 15;
  }
  if (fussnote){
    if (y > yMax) kopf();
    pdfText(p, L, y+8, fussnote, 8, false, "#999999");
  }
  return pdfFertig(doc);
}

  }
});

    .sort((a,b)=>((a.name||"")+" "+(a.vorname||"")).localeCompare((b.name||"")+" "+(b.vorname||""),"de"));
  const doppelt = MerkrKuerzel.doppelte(schueler);
  const ohne = schueler.filter(s=>!MerkrKuerzel.normalisiert(s.kuerzel)).length;

  let html = '<div class="karte"><h2>Kürzel für checkr</h2>'+
    '<p class="hinweis">Der Code, unter dem dieser Kurs in checkr geführt wird. Er steht auf dem '+
    'Deckblatt der Arbeit; checkr sieht nur ihn und nie den Namen.</p>';

  if (!schueler.length) return html + '<p class="hinweis">Noch keine Schüler in diesem Kurs.</p></div>';

  if (doppelt.length)
    html += '<p class="hinweis" style="color:var(--rot)"><b>Doppelt vergeben: '+esc(doppelt.join(", "))+'.</b> '+
      'Zwei gleiche Codes sind in checkr ein einziger Schüler - die Arbeit des einen landet beim anderen.</p>';

  html += '<table class="tab">';
  for (const s of schueler)
    html += '<tr><td><b>'+esc(s.name)+', '+esc(s.vorname)+'</b></td>'+
      '<td style="width:130px"><input id="ku-'+s.id+'" value="'+esc(s.kuerzel||"")+'" placeholder="'+esc(k.name)+'-01"></td></tr>';
  html += '</table><div class="abstand"></div>'+
    '<div class="zeile"><button class="primar" data-a="kuerzelSpeichern" data-id="'+k.id+'">Kürzel speichern</button>'+
    '<button data-a="kuerzelVergeben" data-id="'+k.id+'">Fehlende vergeben'+(ohne?' ('+ohne+')':'')+'</button>'+
    '<button data-a="kuerzelExport" data-id="'+k.id+'">Für checkr ausgeben</button>'+
    '<button data-a="kuerzelPdf" data-id="'+k.id+'">Kürzelliste als PDF</button></div>'+
    '<p class="hinweis">In checkr: Klasse öffnen, Schülerliste ersetzen, Datei einspielen. '+
    'Die Zuordnung läuft dort über den Code, deshalb muss er auf beiden Seiten gleich geschrieben sein.</p></div>';
  return html;
}

/* Zum Ausschneiden oder Aufkleben - ohne diesen Zettel kommt kein Code auf eine Arbeit. */
function kuerzellistePdf(kursId){
  const kurs = kursVon(kursId);
  const zeilen = kursSchueler(kursId).slice()
    .sort((a,b)=>((a.name||"")+" "+(a.vorname||"")).localeCompare((b.name||"")+" "+(b.vorname||""),"de"))
    .map(s=>[s.name+", "+s.vorname, s.kuerzel||"–"]);
  return pdfTabellenDokument(
    "Kürzel "+kurs.name,
    (kurs.fach||"")+" · Jahrgang "+kurs.jahrgang+" · Code für checkr",
    [{titel:"Schüler", breite:300, fett:true, maxZeichen:44},{titel:"Kürzel", breite:150, fett:true}],
    zeilen,
    "Der Code gehört auf das Deckblatt der Arbeit. Nur für den dienstlichen Gebrauch.");
}

document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a!=="kuerzelSpeichern" && a!=="kuerzelVergeben" && a!=="kuerzelExport" && a!=="kuerzelPdf") return;

  const kurs = kursVon(id);
  if (!kurs) return;
  const schueler = kursSchueler(kurs.id);

  if (a==="kuerzelSpeichern"){
    for (const s of schueler){
      const feld = document.getElementById("ku-"+s.id);
      if (feld) s.kuerzel = feld.value.trim();
    }
    speichern(); zeichne();
    const doppelt = MerkrKuerzel.doppelte(schueler);
    toast(doppelt.length ? "Gespeichert, aber doppelt: "+doppelt.join(", ") : "Kürzel gespeichert");
  }
  else if (a==="kuerzelVergeben"){
    /* Belegt sind auch die Kürzel aller anderen Kurse: ein Code darf im ganzen
       Bestand nur einmal vorkommen, sonst trifft der Rückweg den Falschen. */
    const fremd = S.schueler.filter(x=>!schueler.some(s=>s.id===x.id)).map(x=>x.kuerzel);
    const neu = MerkrKuerzel.vergeben(schueler, kurs.name, fremd);
    if (!neu.length) return toast("Alle haben schon ein Kürzel");
    for (const n of neu){
      const s = schuelerVon(n.id);
      if (s) s.kuerzel = n.kuerzel;
    }
    speichern(); zeichne(); toast(neu.length===1 ? "Ein Kürzel vergeben" : neu.length+" Kürzel vergeben");
  }
  else if (a==="kuerzelExport"){
    const liste = MerkrKuerzel.checkrListe(schueler);
    if (!liste.length) return alertBox("Noch kein Kürzel vergeben.");
    textExportieren("checkr-"+kurs.name.replace(/\s+/g,"-")+"-"+todayISO()+".json",
      JSON.stringify({students: liste}, null, 2), "application/json");
    toast(liste.length+" Kürzel werden ausgegeben");
  }
  else if (a==="kuerzelPdf"){
    try{
      dateiExportieren("Kuerzel-"+kurs.name.replace(/\s+/g,"-")+"-"+todayISO()+".pdf",
        kuerzellistePdf(kurs.id), "application/pdf");
      toast("Kürzelliste wird exportiert …");
    }catch(e){ alertBox("PDF fehlgeschlagen: "+e.message); }
  }
});
